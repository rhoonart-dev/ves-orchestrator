<style>
  :root{
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222221;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --ring:rgba(255,255,255,.10);
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --info:#3987e5;
    --accent:#e2a63d; --accent-ink:#231b0b;   /* 목업: 포인트 컬러 — 웜그레이 팔레트에 맞춘 앰버(구 대시보드 골드 계승) */
  }
  /* v3.2: 화이트 테마 — 같은 변수만 갈아끼운다(컴포넌트 CSS 무변경) */
  :root[data-theme="light"]{
    color-scheme:light;
    /* 목업: 라이트 쿨톤 시안 — 웜그레이에서 블루그레이로 살짝 이동 (원래 값: #f4f4f2/#f0efec/#44433f/#807e78/#dcdbd6) */
    --page:#f2f4f6; --surface:#ffffff; --surface-2:#edf0f3;
    --ink:#17181a; --ink-2:#3f434a; --muted:#79808a;
    --line:#d6dbe1; --ring:rgba(20,40,70,.10);
    --good:#0ca30c; --warn:#b07500; --serious:#c05a2e; --crit:#c22525;
    --info:#1f6fd0;
    --accent:#e2a63d; --accent-ink:#231b0b;   /* 목업: 다크와 동일한 밝은 앰버 */
  }
  :root[data-theme="light"] .st-good{color:#0b8a0b}
  :root[data-theme="light"] .st-crit{color:#c22525}
  :root[data-theme="light"] .st-info{color:#1f6fd0}
  :root[data-theme="light"] nav.tabs button.on{color:var(--ink)}
  :root[data-theme="light"] nav.tabs .badge{background:#fab219;color:#3d2c04}  /* 검수함 배지: 밝은 노랑 고정 */
  :root[data-theme="light"] .chdot{background:#c6c5be}       /* 없음: 라이트에선 연회색 */
  :root[data-theme="light"] .chdot.none{background:#c6c5be}
  :root[data-theme="light"] .chdot.rej{background:transparent}  /* 도넛 가운데는 투명 */
  :root[data-theme="light"] .chdot.ok{background:#0ca30c}
  :root[data-theme="light"] .chdot.wait{background:#fab219}
  :root[data-theme="light"] .chdot.bad{background:#d03b3b}
  :root[data-theme="light"] .chdot.run{background:#3987e5}
  :root[data-theme="light"] .chcal .d.up{background:#0ca30c}
  :root[data-theme="light"] .fp-pub{color:#0b8a0b}
  :root[data-theme="light"] .fp-rej{color:#c22525}
  :root[data-theme="light"] .fp-run{color:#1f6fd0}
  :root[data-theme="light"] .judgebox .q{color:var(--ink)}
  :root[data-theme="light"] .now .what .st{color:#1f6fd0}
  :root[data-theme="light"] .gauge{background:#dcdbd6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
  h2{font-size:13px;margin:0 0 8px;color:var(--ink-2);font-weight:600;
     text-transform:uppercase;letter-spacing:.6px}
  main{max-width:1220px;margin:0 auto;padding:14px 16px}
  .topwrap{position:sticky;top:0;z-index:5;background:var(--page)}  /* 목업: 헤더+탭 한 덩어리 고정 — 틈 제거 */
  header.top{background:var(--page);
    display:flex;align-items:center;gap:10px;padding:10px 16px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  header.top .sp{flex:1}
  nav.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);
    background:var(--page);overflow-x:auto}
  nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;
    border-radius:0;color:var(--ink-2);padding:9px 13px;white-space:nowrap;font-weight:600}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--good)}  /* 목업: 탭 인디케이터 = 로고 초록 */
  nav.tabs .badge{background:var(--warn);color:#3d2c04;border-radius:999px;
    font-size:11px;padding:0 6px;margin-left:5px;font-weight:700}
  nav.tabs .badge.crit{background:var(--crit);color:#fff}   /* 합격 후 발행 실패 */
  .pill{font-size:12px;color:var(--ink-2);border:1px solid var(--line);
        border-radius:999px;padding:3px 10px;background:var(--surface)}
  button{font:inherit;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--muted)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.pri{background:var(--good);border-color:var(--good);color:#fff;font-weight:600}
  button.danger:hover{background:var(--crit);border-color:var(--crit);color:#fff}
  /* 목업: 결정 버튼 C안(미니멀) — 테두리 + 색은 글자에만, 호버 시 채움 */
  button.pri.act{background:transparent;border-color:var(--line);color:#2f9e5f;font-weight:700}
  button.pri.act:hover{background:#2f9e5f;border-color:#2f9e5f;color:#fff}
  button.danger.act{background:transparent;border-color:var(--line);color:#d05a52}
  button.danger.act:hover{background:#c73f36;border-color:#c73f36;color:#fff}
  button.act{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:600}
  button.danger{border-color:var(--crit);color:var(--crit);background:transparent}
  button.mini{padding:2px 8px;font-size:12px;border-radius:6px}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  section.card{background:var(--surface);border:1px solid var(--ring);
    border-radius:12px;padding:14px;margin:14px 0}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
  .tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;
        padding:10px 12px}
  .tile .v{font-size:26px;font-weight:700;line-height:1.1}
  .tile .k{font-size:12px;color:var(--muted);margin-top:2px}
  /* 상태 칩 — 아이콘+라벨 동반(색 단독 금지) */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;
    border-radius:999px;padding:2px 9px;border:1px solid var(--line);
    background:var(--surface-2);white-space:nowrap}
  .chip .d{width:8px;height:8px;border-radius:50%;flex:none}
  .st-good .d{background:var(--good)}      .st-good{color:#7ddc7d}
  .st-warn .d{background:var(--warn)}      .st-warn{color:var(--warn)}
  .st-serious .d{background:var(--serious)}.st-serious{color:var(--serious)}
  .st-crit .d{background:var(--crit)}      .st-crit{color:#ff9b9b}
  .st-info .d{background:var(--info)}      .st-info{color:#9cc4f2}
  .st-mut .d{background:var(--muted)}      .st-mut{color:var(--ink-2)}
  /* 신호등 (구 대시보드 §4 규칙 계승 — 오늘 KST 기준, 색은 두 열에서 같은 뜻) */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .bch{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;
    background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;
       padding:9px 9px;cursor:pointer}
  .bch .nm{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;gap:6px;
           align-items:center;justify-content:space-between}
  .dots{display:flex;gap:16px;font-size:11.5px;color:var(--muted)}
  .bch .dots{border-left:1px solid var(--line);padding-left:10px;align-self:stretch;align-items:center;gap:8px}
  .dcol{display:flex;flex-direction:column;gap:3px;align-items:center;width:52px;flex:none}
  .dcol.dim{opacity:.4}
  .bch:hover{border-color:var(--muted)}
  .bchL{flex:1;min-width:0}
  .bchName{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;min-width:0}
  .bchName>span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:keep-all;line-height:1.3}
  .bchWork{font-size:11.5px;color:var(--muted);margin-top:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dcap{font-size:10px;color:var(--muted);letter-spacing:.4px}
  .dlab{font-size:10.5px;color:var(--ink-2);text-align:center;line-height:1.25;word-break:keep-all}
  .chdot{width:14px;height:14px;border-radius:50%;background:#3a3a38}
  .chdot.ok{background:var(--good)} .chdot.wait{background:var(--warn)}
  .chdot.bad{background:var(--crit)} .chdot.none{background:#3a3a38}
  .chdot.rej{background:transparent;border:4px solid var(--crit);width:14px;height:14px;box-sizing:border-box}
  .chdot.run{background:var(--info)}
  .bdetail{grid-column:1/-1;background:var(--surface-2);border:1px solid var(--ring);
    border-radius:10px;padding:10px 12px}
  .lg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);
      margin-right:11px}
  .lg .chdot{width:10px;height:10px}
  /* 피드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .fcard{background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;
         overflow:hidden}
  .fcard .th{aspect-ratio:9/14;background:#000;display:flex;align-items:center;
    justify-content:center;color:var(--muted);font-size:12px;cursor:pointer;
    background-size:cover;background-position:center}
  .fcard .bd{padding:8px 10px}
  .fcard .t{font-size:12.5px;font-weight:600;line-height:1.3;margin-bottom:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fcard .m{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;
    align-items:center}
  .fcard video{width:100%;display:block}
  .fpill{font-size:10.5px;border-radius:999px;padding:1px 7px;border:1px solid var(--line)}
  .fp-pub{color:#7ddc7d;border-color:var(--good)} .fp-wait{color:var(--warn);border-color:var(--warn)}
  .fp-rej{color:#ff9b9b;border-color:var(--crit)} .fp-run{color:#9cc4f2;border-color:var(--info)}
  .fp-mut{color:var(--ink-2)}
  /* 검수함 */
  .review{background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;
          padding:12px;margin-bottom:10px}
  .review .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .review video{width:100%;max-width:320px;border-radius:8px;margin-top:8px;
                background:#000;aspect-ratio:9/16}
  .review .form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .judgebox{font-size:12px;color:var(--ink-2);background:var(--surface);
    border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;
    line-height:1.7}
  .judgebox .q{font-weight:700;color:var(--ink)}
  .judgebox details summary{cursor:pointer;color:var(--muted);font-size:11.5px}
  .hallu{color:var(--crit);font-size:12px;font-weight:600;margin-top:6px}
  .notehint{color:var(--warn);font-size:12px;margin:6px 0 0}
  /* 사유·메모: 한 줄 input 은 길게 쓰면 앞이 안 보였다(운영 결정 8/13 — 여러 줄) */
  .reason{width:100%;margin-top:8px;min-height:68px;resize:vertical;font:inherit;line-height:1.5}
  /* 반려 패널 — 평소엔 안 보이고, 반려를 누를 때만 카드 안에서 펼쳐진다 */
  .rjpanel{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;
    background:var(--chip,rgba(127,127,127,.06))}
  .rjpanel .rjhd{display:flex;align-items:center;justify-content:space-between;
    font-size:12.5px;font-weight:600;margin-bottom:8px}
  .rjopt{display:flex;width:100%;align-items:baseline;gap:8px;text-align:left;
    padding:7px 10px;margin-top:5px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font-size:13px;cursor:pointer}
  .rjopt:hover{border-color:var(--crit);color:var(--crit)}
  .rjopt b{flex:none;min-width:76px;font-weight:600}
  .rjopt .why{color:var(--muted);font-size:12px;flex:1}
  .rjopt .eta{flex:none;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .rjfoot{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    font-size:11.5px;color:var(--muted)}
  /* 수정 재렌더 패널(0038) — 일본어 텍스트를 카드에서 직접 고쳐 반려-재렌더 */
  .edpanel{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;
    background:var(--chip,rgba(127,127,127,.06))}
  .edpanel .edhd{display:flex;align-items:center;gap:8px;font-size:12.5px;
    font-weight:600;margin-bottom:6px}
  .edpanel .edhd .sub{flex:1;font-weight:400}
  .edpanel .edcap{font-size:11px;color:var(--muted);font-weight:600;margin:8px 0 3px}
  .edpanel .edwrap{max-height:240px;overflow:auto}
  .edpanel .edrow{display:flex;gap:8px;align-items:center;margin:2px 0}
  .edpanel .edrow .ko{flex:1 1 42%;min-width:0;color:var(--muted);font-size:12px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .edpanel input[type=text],.edpanel textarea{flex:1 1 58%;width:100%;min-width:0;
    box-sizing:border-box;background:var(--bg);border:1px solid var(--line);
    border-radius:6px;color:var(--ink);font:inherit;font-size:12.5px;padding:4px 6px}
  .edpanel textarea{resize:vertical}
  .edpanel .edfoot{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    font-size:11.5px;color:var(--muted)}
  /* 편집실(0042) — 원본 타임라인 */
  .edhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:15px}
  .edhead .right{margin-left:auto}
  .edgrid{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px}
  .edprev video{width:100%;max-height:420px;background:#000;border-radius:10px}
  .edcap{font-size:11px;color:var(--muted);font-weight:600;margin:8px 0 3px}
  .edval{font-size:14px;line-height:1.5;white-space:pre-wrap}
  .edsubs{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}

  .warnbar.fold{align-items:flex-start}
  /* basis 를 작게 둬야 접힘 상태에서 오른쪽 조치 버튼이 같은 줄에 남는다
     (auto 면 요약문 길이가 그대로 basis 가 되어 버튼이 아래로 밀린다) */
  .warnbar.fold>details{flex:1 1 240px;min-width:0}

  .warnbar.fold>details>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;

<script>
"use strict";
const SB_URL = "https://fdidiqdhcyctdbogxkdu.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkaWRpcWRoY3ljdGRib2d4a2R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mzc4NDAsImV4cCI6MjA5NzExMzg0MH0.78tkMDmruPKGzkmtOwCYpHyeaRYNG3myELr0Gj2VPs8"; // 공개값(anon) — RLS 가 지킨다

const memStore = (() => { const m = new Map(); return {
  getItem: k => m.has(k) ? m.get(k) : null,
  setItem: (k,v) => m.set(k,v), removeItem: k => m.delete(k) }; })();
let storage = memStore;
try { localStorage.setItem("_t","1"); localStorage.removeItem("_t"); storage = localStorage; } catch(e){}

// v3.2: 화이트/블랙 테마 — 저장해서 재방문에도 유지
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  storage.setItem("ves_theme", t);
  const b = document.getElementById("btnTheme");
  if (b) b.textContent = t === "light" ? "☀️" : "🌙";
}
applyTheme(storage.getItem("ves_theme") === "light" ? "light" : "dark");
const sb = supabase.createClient(SB_URL, SB_ANON, {
  auth: { storage, persistSession: storage === localStorage, autoRefreshToken: true } });

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg, isErr){
  const t = $("#toast");
  t.textContent = (isErr ? "⚠ " : "✓ ") + msg;   // 목업: 성공/실패를 아이콘으로도 구분
  t.className = isErr ? "err" : "ok"; t.style.display = "block";
  clearTimeout(toast._h); toast._h = setTimeout(() => t.style.display="none", isErr?6000:4000);
}
function ago(ts){
  if (!ts) return "—";
  const s = Math.max(0,(Date.now()-new Date(ts).getTime())/1000);
  if (s<60) return `${s|0}초 전`;
  if (s<3600) return `${s/60|0}분 전`;
  if (s<86400) return `${s/3600|0}시간 ${((s%3600)/60)|0}분 전`;
  return `${s/86400|0}일 전`;
}
const kstDay = ts => new Date(ts || Date.now()).toLocaleDateString("sv", {timeZone:"Asia/Seoul"});
const chip = (cls, icon, label) =>
  `<span class="chip st-${cls}"><span class="d"></span>${icon} ${esc(label)}</span>`;
const NODE_ST = { active:["good","✓","가동"], draining:["warn","⏸","드레인"],
                  disabled:["crit","✕","차단"] };

  blocked:["serious","⚠","보류"], cancelled:["mut","–","취소"] };
/* v3: 단계 이름 한글화 — 사람 눈에 보이는 모든 곳은 이 이름으로 */
const KIND_KO = { acquire:"소스 준비", generate:"영상 제작", upload_artifacts:"결과 업로드",

  zanmang_autopilot:"잔망루피 자동화", zanmang_decision:"잔망루피 검수 반영",
  editor_assets:"편집실 준비", register_sources:"소스 등록" };
const kindKo = k => KIND_KO[k] || k || "?";
/* v3: 채널 한글명 — channels_mirror 기준, 없으면 코드 그대로 */
const chName = slug => { const c = (state.chans||[]).find(x => x.token_slug === slug);
  return (c && c.name) || slug || "?"; };
const JP_SLUGS = new Set(["SHOTCONE"]);   // 일본 채널(가동 스위치 별도)
/* 전용 파이프라인 채널(§10-①): 작업지시 체인이 아니라 일일 자동화 잡으로 도는 채널 */
const EXT_PIPE = { LOOPY: "잔망루피 자동화 — 더빙 현지화·일 1편·19시 JST 예약" };

// ───────── 인증 ─────────
let myRole = "viewer";
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("#loginMsg").textContent = "로그인 중…";
  const { error } = await sb.auth.signInWithPassword(
    { email: $("#email").value.trim(), password: $("#pw").value });
  $("#loginMsg").textContent = error ? "실패: " + error.message : "";
});
sb.auth.onAuthStateChange(async (_ev, session) => {
  if (session) {
    $("#login").style.display = "none"; $("#app").style.display = "";
    const { data } = await sb.from("user_roles").select("role").maybeSingle();
    myRole = (data && data.role) || "viewer";
    $("#whoami").textContent = `${session.user.email} · ${myRole}`;
    refresh();
  } else { $("#login").style.display = ""; $("#app").style.display = "none"; }
});
$("#btnLogout").onclick = () => sb.auth.signOut();
const can = min => ["viewer","reviewer","operator","admin"].indexOf(myRole)
                >= ["viewer","reviewer","operator","admin"].indexOf(min);

// ───────── RPC · 2클릭 확인 ─────────
async function rpc(fn, args, okMsg){
  const { data, error } = await sb.rpc(fn, args);
  if (error) { toast(`${fn} 거부: ${error.message}`, true); return null; }
  toast(okMsg || "완료"); refresh(); return data ?? true;
}
function armed(btn, label, fire){
  if (btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = label; fire(); return; }
  btn.dataset.armed = "1"; btn.textContent = "확실해요?";
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = label; }, 3000);
}

// ───────── 서명 URL 캐시 ─────────
const _signed = new Map();
async function signedUrl(bucket, key, sec = 900){
  const ck = bucket + "/" + key, hit = _signed.get(ck);
  if (hit && hit.exp > Date.now()) return hit.url;
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(key, sec);
  if (error) throw new Error(error.message);
  _signed.set(ck, { url: data.signedUrl, exp: Date.now() + (sec - 60) * 1000 });
  return data.signedUrl;
}

// ───────── 데이터 ─────────
let state = {}, tab = "home", jobFilter = "all", showRejected = false;
const soft = p => p.then(r => r.error ? { data: [] } : r).catch(() => ({ data: [] }));
async function refresh(){
  if (!(await sb.auth.getSession()).data.session) return;
  const [nodes, deps, jobs, reviews, events, wos, srcs, chans,
         arts, metas, judges, clips, snaps, srcCh, ops, drafts, pubs] = await Promise.all([
    sb.from("node_registry").select("*").order("node_id"),
    sb.from("deployments").select("*").order("engine"),
    sb.from("job_queue").select("id,work_order_id,kind,status,attempt,max_attempts,node_id,error,error_class,required_caps,params,run_after,created_at,updated_at,finished_at").order("updated_at",{ascending:false}).limit(150),
    sb.from("review_queue").select("*").order("created_at",{ascending:false}).limit(120),

    soft(sb.from("artifacts").select("work_order_id,kind,object_key,bucket,created_at").order("created_at",{ascending:false}).limit(300)),
    // ★정렬 필수: 이 표는 run_id→clip_id 연결고리다. 상한에 걸려 잘릴 때 **오래된 것부터**
    // 잘려야 최근 검수건이 살아남는다. 정렬이 없던 동안(8/14 실측) 408행 중 400행만 와서
    // 검수 대기 32건 가운데 13건이 judge 를 못 찾아 '판정 대기중'으로 보였다 — 실제로는
    // 판정이 나와 있었다. 옆의 judge_runs·clips·artifacts 는 처음부터 최신순이었다.
    soft(sb.from("clip_metadata").select("clip_id,ai_video_run_id")
           .order("created_at",{ascending:false}).limit(400)),                       // 0011
    soft(sb.from("judge_runs").select("clip_id,quality_score,confidence,rubric_scores,created_at").order("created_at",{ascending:false}).limit(200)),  // 0011
    soft(sb.from("clips").select("id,video_external_id,episode,duration_sec,created_at").order("created_at",{ascending:false}).limit(200)),           // 0011
    soft(sb.from("dashboard_daily_snapshots").select("*").order("snapshot_date",{ascending:false}).limit(7)),
    // 0023: 채널별 소진. 소스 단위(source_usage)는 그대로 두고 옆에 붙인다 —
    // 어느 채널에도 배정되지 않은 작품은 이 뷰에 안 나오므로 둘 다 필요하다.
    soft(sb.from("source_usage_by_channel").select("*")),
    soft(sb.from("ops_config").select("key,value,note,updated_at")),   // 0025: Gemini 키 슬롯 등
    // 0044: 보내지 않은 편집 초안 — 편집실 첫 화면의 '이어서 하기' 목록
    soft(sb.from("editor_assets").select("*").not("draft","is",null)
           .order("draft_at",{ascending:false}).limit(50)),
    // 발행 잡만 따로 — 위의 잡 150건 창을 벗어난 발행 실패를 놓치지 않기 위해서다.
    // 8/17 실측: 합격 11건 중 1건(한 입 주막 '가왕쇼')이 dead 인데 화면 어디에도 안 보였고,
    // 다음날 낮에 사람이 "합격했는데 왜 안 올라갔지"로 직접 발견했다. 창이 좁으면 같은 일이 반복된다.
    soft(sb.from("job_queue").select("id,work_order_id,kind,status,attempt,max_attempts,node_id,error,error_class,params,run_after,created_at,updated_at,finished_at")
           .in("kind",["publish","zanmang_decision"])
           .order("updated_at",{ascending:false}).limit(200)),
  ]);
  const ovr = await soft(sb.from("channel_design_overrides").select("*"));   // 0014 이전엔 빈 배열
  const plans = await soft(sb.from("channel_plan_overrides").select("*"));   // 0016 이전엔 빈 배열
  const wovr = await soft(sb.from("channel_works_overrides").select("*"));   // 0017 이전엔 빈 배열
  const err = [nodes,deps,jobs,reviews,events,wos,srcs,chans].find(r => r.error);
  if (err){ toast("조회 실패: " + err.error.message, true); return; }
  const runToClip = {}, judgeByClip = {}, clipById = {};
  (metas.data||[]).forEach(m => { if (m.ai_video_run_id) runToClip[m.ai_video_run_id] = m.clip_id; });
  (judges.data||[]).forEach(j => { if (!judgeByClip[j.clip_id]) judgeByClip[j.clip_id] = j; });
  (clips.data||[]).forEach(c => clipById[c.id] = c);
  const artByWo = {};
  (arts.data||[]).forEach(a => {
    const slot = artByWo[a.work_order_id] = artByWo[a.work_order_id] || {};

  });
  const jobsByWo = {};
  (jobs.data||[]).forEach(j => (jobsByWo[j.work_order_id] = jobsByWo[j.work_order_id] || []).push(j));
  const reviewByWo = {};
  (reviews.data||[]).forEach(r => { if (!reviewByWo[r.work_order_id]) reviewByWo[r.work_order_id] = r; });
  state = { nodes:nodes.data, deps:deps.data, jobs:jobs.data, reviews:reviews.data,
            events:events.data, wos:wos.data, srcs:srcs.data, chans:chans.data,
            designOvr:Object.fromEntries((ovr.data||[]).map(o=>[o.token_slug,o])),
            planOvr:Object.fromEntries((plans.data||[]).map(o=>[o.token_slug,o])),
            worksOvr:Object.fromEntries((wovr.data||[]).map(o=>[o.token_slug,o])),
            snaps:snaps.data||[], runToClip, judgeByClip, clipById, artByWo, jobsByWo, reviewByWo,
            srcCh:srcCh.data||[], eps:buildEpMap(srcs.data||[], srcCh.data||[]),
            ops:Object.fromEntries((ops.data||[]).map(o=>[o.key,o])),
            drafts:drafts.data||[], pubJobs:pubs.data||[],
            wo:Object.fromEntries((wos.data||[]).map(w=>[w.id,w])),
            jobById:Object.fromEntries((jobs.data||[]).map(j=>[j.id,j])),
            legacyOk: !!(metas.data||[]).length || !!(clips.data||[]).length };
  render();
  $("#lastSync").textContent = "갱신 " + new Date().toLocaleTimeString("ko-KR");
}

// ───────── 파생 (신호등 — 구 대시보드 §4 규칙: 판정은 언제나 오늘 KST) ─────────
// 이미 해결된 실패인가 — 같은 일을 뒤이어 성공한 잡이 있으면 그렇다(8/12 사용자 요청).
// 실측: 어제 07시 잡이 새벽에 죽고, 오늘 07시 잡이 같은 작품을 성공했는데도 '오늘 실패'에
// 계속 떠 있었다. 같은 대상(작업지시 또는 인입 폴더)의 나중 성공을 해결로 본다.
function jobTarget(x){
  if (x.work_order_id) return "wo:" + x.work_order_id;
  const p = x.params || {};
  return p.folder_url ? "folder:" + p.folder_url
       : p.work_title ? "work:" + x.kind + ":" + p.work_title : null;
}
function isResolved(x, jobs){
  const t = jobTarget(x);
  if (!t) return false;
  const at = x.finished_at || x.updated_at;
  return (jobs || []).some(y => y.status === "succeeded" && y.kind === x.kind
    && jobTarget(y) === t && (y.finished_at || y.updated_at) > at);
}
function woRun(wo){ const r = state.reviewByWo[wo.id]; return r && r.payload && r.payload.run_id; }
function woNode(wo){
  // 이 영상을 실제로 만든 맥. generate 가 정답 — 반려 재생성도 그 맥으로 핀되기 때문(8/12).
  // 아직 안 돌았거나 잡 150건 창을 벗어났으면 노드 핀(required_caps)에서 읽는다.
  const js = state.jobsByWo[(wo || {}).id] || [];
  const done = js.find(j => j.kind === "generate" && j.node_id);
  if (done) return done.node_id;
  for (const j of js) {
    const pin = (j.required_caps || []).find(c => String(c).startsWith("node:"));
    if (pin) return pin.slice(5);
  }
  return (js.find(j => j.node_id) || {}).node_id || "";
}
function woVideoId(wo){
  const run = woRun(wo); const cid = run && state.runToClip[run];
  const c = cid && state.clipById[cid]; return c && c.video_external_id || null;
}
function woStatus(wo){
  // 우선순위: 실패 > 검수대기 > 반려 > 발행/예약 > 합격 > 진행 > 대기
  const js = state.jobsByWo[wo.id] || [];
  const rv = state.reviewByWo[wo.id];
  const pub = js.find(j => j.kind === "publish");
  if (js.some(j => ["failed","dead"].includes(j.status))) return "failed";
  if (rv && rv.status === "waiting") return "review";
  if (rv && rv.status === "rejected") return "rejected";
  if (pub && pub.status === "succeeded")
    return (pub.params && pub.params.publish_at) ? "scheduled" : "published";
  if (rv && rv.status === "approved") return "approved";
  if (js.some(j => j.status === "running")) return "running";
  if (js.length) return "pending";
  return "none";
}
const GEN_DOT = { failed:["bad","실패"], review:["wait","검수 대기"], rejected:["rej","반려"],
  published:["ok","합격·발행"], scheduled:["ok","합격·예약"], approved:["ok","합격"],
  running:["run","진행 중"], pending:["wait","대기"], none:["none","없음"] };
function pubDot(wo){
  const pub = (state.jobsByWo[wo.id]||[]).find(j => j.kind === "publish");
  if (!pub) return ["none","없음"];
  if (["failed","dead"].includes(pub.status)) return ["bad","발행 실패"];
  if (pub.status === "succeeded")
    return (pub.params && pub.params.publish_at) ? ["wait","예약됨"] : ["ok","발행됨"];
  return ["wait","발행 대기"];
}

// ───────── 합격했으나 발행 안 됨 (8/17 사고) ─────────
// 검수함은 합격시키면 그 카드가 목록에서 사라진다. 그런데 그 뒤 발행이 죽어도 화면에는
// 아무 신호가 없었다 — 한 입 주막 '가왕쇼'가 23:41 합격 → 토큰 미로드로 3회 재시도를
// 9분에 소진 → dead 로 묻혔고, 다음날 낮에 사람이 직접 발견했다. 예약 시각(19:00)이
// 지났으면 그대로 유실이다. 합격과 발행 사이의 이 구간을 여기서 잇는다.
// 발행 잡을 state.pubJobs(발행만 따로 조회)에서 찾는 이유: state.jobs 는 최근 150건
// 창이라 하룻밤 지나면 실패한 발행 잡이 창 밖으로 밀려 '없는 것'이 된다.
function pubJobOf(rv){
  const js = state.pubJobs || [];
  return (rv.work_order_id && js.find(j => j.work_order_id === rv.work_order_id))
      || js.find(j => (j.params||{}).review_id === rv.id)   // 잔망루피: 작업지시 없이 잡만 있다
      || null;
}
function unpublished(){
  const cut = Date.now() - 14*24*3600*1000;   // 오래된 합격건은 잡 조회 창을 벗어나 오판한다
  return (state.reviews||[])
    .filter(r => r.status === "approved" && r.decided_at
              && new Date(r.decided_at).getTime() > cut)
    .map(r => ({ rv:r, job:pubJobOf(r) }))
    .filter(x => !x.job || x.job.status !== "succeeded")
    .map(x => {
      const st = x.job ? x.job.status : "none";
      // 방금 합격시킨 건은 '발행 중'이 정상이다. 20분 넘게 안 끝나면 그때 이상으로 본다
      // (정상 발행은 15초~3분에 끝난다 — 8/17 실측 10건).
      const slow = ["pending","running"].includes(st)
                && Date.now() - new Date(x.job.updated_at || x.job.created_at).getTime() > 20*60*1000;
      return { ...x, st, slow,
               bad: st === "none" || slow || ["dead","failed","cancelled"].includes(st) };
    })
    .sort((a,b) => (b.bad - a.bad) || (a.rv.decided_at < b.rv.decided_at ? 1 : -1));
}

// ───────── 탭 셸 ─────────
const TABS = [["home","홈"],["review","검수함"],["edit","편집실"],["feed","영상 피드"],
              ["sources","소스 창고"],
              ["channels","채널 템플릿"],["jobs","작업 내역"],["infra","맥·배포"],["perf","성과"]];
const tabsFor = () => myRole === "admin" ? [...TABS, ["admin","권한 관리"]] : TABS;
function render(){
  // 검수함 입력 보존(운영 결정 8/13): 재렌더가 쓰던 메모·공개방식·예약시각을 지우지 않는다.
  // userTyping() 가드는 '틱 순간의 포커스'만 지킨다 — 메모를 쓰다 영상을 클릭(포커스 이탈)한
  // 뒤의 자동 갱신에 입력이 통째로 날아갔다. 값을 스냅샷해 재렌더 후 되살린다.
  const keep = {};
  document.querySelectorAll('#page .reason, #page select[id^="prv_"], #page input[id^="at_"]')
    .forEach(el => { if (el.id && el.value) keep[el.id] = el.value; });
  const waiting = (state.reviews||[]).filter(r => r.status === "waiting").length;
  // 홈 배지 = 합격했는데 발행이 안 된 건. 검수 대기 배지와 색을 달리한다 —
  // 대기는 '사람이 볼 차례'(노랑)지만 이쪽은 '이미 사람 손을 떠난 뒤 깨진 것'(빨강)이다.
  const stuck = (state.reviews||[]).length ? unpublished().filter(x => x.bad).length : 0;
  $("#tabs").innerHTML = tabsFor().map(([k,l]) =>
    `<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${l}${
      k==="review"&&waiting?`<span class="badge">${waiting}</span>`:""}${
      k==="home"&&stuck?`<span class="badge crit" title="합격했으나 발행 안 됨">${stuck}</span>`:""}</button>`).join("");
  ({home:renderHome, review:renderReview, feed:renderFeed, sources:renderSources,
    edit:renderEdit, channels:renderChannels, jobs:renderJobsTab, infra:renderInfra, perf:renderPerf,
    admin:renderAdmin}[tab] || renderHome)();
  for (const [id, v] of Object.entries(keep)){
    const el = document.getElementById(id);
    if (!el) continue;                       // 그 사이 결정된 카드는 사라진다 — 정상
    if (el.tagName === "SELECT"){ el.value = v; el.onchange && el.onchange(); }
    else if (!el.value) el.value = v;
  }
}

     ((state.wo[x.rv.work_order_id]||{}).work_title || "")).trim()).join(" · ")

    const wo = state.wo[x.rv.work_order_id] || {};

    const at = p.publish_at ? new Date(p.publish_at) : null;

    const retry = can("operator") && x.job && ["dead","failed","cancelled"].includes(x.st)

    return `<tr><td>${esc(chName(x.rv.channel_slug || wo.channel_slug || ""))}</td>
      <td>${esc(what)}${esc(ep)}</td>
      <td class="num" title="${esc(x.rv.decided_at||"")}">${ago(x.rv.decided_at)}</td>

        past ? " 지남" : ""}</span>` : '<span class="sub">즉시</span>'}</td>
      <td>${(x.job||{}).error ? `<details><summary>${esc(x.job.error_class||"오류")}</summary>
        <div class="err">${esc(x.job.error)}</div></details>` : ""}</td>
      <td>${retry}</td></tr>`;
  }).join("");
  $("#page").innerHTML = `
    ${geminiBanner()}
    ${unpub.length ? `<section class="card warnbar fold"><details ${unpubOpen ? "open" : ""}
      ontoggle="unpubOpen=this.open">
      <summary>${unpubBad.length
        ? `<b>⚠ 합격했으나 발행되지 않은 영상이 ${unpubBad.length}건 있습니다</b>
           <span class="sub">${esc(unpubNames)} · 예약 시각이 지나면 그대로 유실됩니다${
             unpub.length > unpubBad.length ? ` · 발행 중 ${unpub.length - unpubBad.length}건` : ""}</span>`
        : `<b>합격한 영상 ${unpub.length}건이 발행 중입니다</b>
           <span class="sub">${esc(unpubNames)} · 아직 유튜브에 올라가지 않았습니다</span>`}</summary>
      <div class="body">
        <div class="sub" style="margin-bottom:8px">합격시키면 검수함에서 그 카드가 사라집니다 —
          그 뒤 발행이 죽어도 알려주는 곳이 여기뿐입니다.</div>
        <div class="tblwrap"><table class="unpub"><tr><th>채널</th><th>작품</th><th>합격</th><th>발행</th>
          <th>예약</th><th>오류</th><th></th></tr>${unpubRows}</table></div>
      </div></details></section>` : ""}
    <div class="tiles">${tiles.map(([k,v,w]) => `<div class="tile"><div class="v">${v}</div>
      <div class="k">${k}${w?` · <span style="color:var(--serious)">${w}</span>`:""}</div></div>`).join("")}</div>
    <section class="card"><h2>지금 각 맥이 하는 일</h2>
      <div class="nowgrid">${nowCards || '<div class="empty">등록된 맥 없음</div>'}</div></section>
    <section class="card"><h2>채널 신호등 — 오늘(KST) 기준</h2>
      <div style="margin-bottom:8px">
        <span class="lg"><span class="chdot ok"></span>완료</span>
        <span class="lg"><span class="chdot wait"></span>대기</span>
        <span class="lg"><span class="chdot run"></span>진행</span>
        <span class="lg"><span class="chdot rej"></span>반려</span>
        <span class="lg"><span class="chdot bad"></span>실패</span>
        <span class="lg"><span class="chdot none"></span>없음</span>
        <span class="sub">오늘(KST) 기준 · 오늘 작업이 없으면 마지막 작업분을 날짜 배지와 함께 표시</span></div>
      <div class="board">${board || '<div class="empty">channels_mirror 비어 있음</div>'}</div></section>
    ${failsToday.length ? `<section class="card"><h2>오늘 실패 상세</h2><div class="tblwrap">
      <table><tr><th>단계</th><th>작품</th><th>분류</th><th>오류</th></tr>${
      failsToday.map(x => `<tr><td>${esc(kindKo(x.kind))}</td>

        <td>${esc(x.error_class||"")}</td>
        <td class="err">${esc((x.error||"").slice(0,160))}</td></tr>`).join("")}</table></div></section>` : ""}
    <section class="card"><h2>마감 기록 (매일 23:55 스냅샷 — 구 시스템 병행분 포함)</h2>
      <div class="tblwrap"><table><tr><th>날짜</th><th>검수 대기</th><th>실패</th><th>기록 시각</th></tr>
      ${snaps || '<tr><td colspan="4" class="empty">스냅샷 없음</td></tr>'}</table></div></section>`;
}
function chainHtml(wo){

// ───────── Gemini 키 슬롯 (0025) ─────────
// 429 의 정체는 분당 rate limit 이 아니라 '결제 계정 월 지출 상한'이었다(8/12 실측).
// 상한은 키가 아니라 계정에 걸리므로 예비 키는 다른 결제 계정 것이어야 한다.
const geminiSlot = () => ((state.ops||{}).gemini_key||{}).value === "fallback"
                       ? "fallback" : "primary";
function geminiBanner(){
  const slot = geminiSlot();
  const stuck = (state.jobs||[]).filter(j => j.status === "pending" && j.error_class === "quota");
  if (slot === "primary" && !stuck.length) return "";
  const o = (state.ops||{}).gemini_key || {};
  const back = can("operator")
    ? `<button class="mini" onclick="rpc('set_gemini_key',{p_slot:'primary'},'주 키로 되돌렸습니다')"
         >주 키로 되돌리기</button>` : "";
  const go = can("operator")
    ? `<button class="mini" onclick="armed(this,'예비 키로 전환',()=>rpc('set_gemini_key',{p_slot:'fallback'},'예비 키로 전환했습니다'))"
         >예비 키로 전환</button>` : "";
  const stuckTxt = stuck.length
    ? ` · 쿼터로 대기 중인 잡 <b>${stuck.length}건</b>(${
        [...new Set(stuck.map(j => kindKo(j.kind)))].join(", ")})` : "";
  const [title, note, act] = slot === "fallback"
    ? [`⚠ Gemini 예비 키로 돌고 있습니다`,
       `${esc(o.note||"")} · ${ago(o.updated_at)}${stuckTxt}`, back]
    : [`⚠ Gemini 쿼터로 막힌 잡이 있습니다`,
       `주 키로 도는 중${stuckTxt}. 지출 상한이면 워커가 자동으로 예비 키로 넘깁니다
        — 급하면 지금 넘기세요(예비 키가 ves.env 에 있어야 합니다).`, go];
  // 막힌 잡이 없으면(예비 키로 도는 중이기만 하면) 펼칠 내용이 없다 — 종전대로 한 줄.
  if (!stuck.length)
    return `<section class="card warnbar"><b>${title}</b><span class="sub">${note}</span>
      <span class="right"></span>${act}</section>`;
  // '잡이 있습니다'만 읽고는 무엇이 밀렸는지 알 수 없어 작업 내역 탭을 뒤져야 했다.
  // 어느 채널의 어느 작품이 언제부터 서 있는지 여기서 바로 편다(합격 후 미발행과 같은 방식).
  const rows = stuck.map(j => {
    const wo = state.wo[j.work_order_id] || {}, p = j.params || {};
    const slug = wo.channel_slug || p.channel_slug || "";
    const pin = (j.required_caps || []).find(c => String(c).startsWith("node:"));
    const at = j.run_after ? new Date(j.run_after) : null;
    return `<tr><td>${esc(kindKo(j.kind))}</td>
      <td>${esc(wo.work_title || p.work_title || "—")}${wo.episode != null ? ` ${wo.episode}화` : ""}</td>
      <td>${slug ? esc(chName(slug)) : ""}</td>
      <td class="mono">${esc(j.node_id || (pin ? pin.slice(5) : ""))}</td>
      <td class="num" title="${esc(j.updated_at||"")}">${ago(j.updated_at)}</td>
      <td class="num">${at && at.getTime() > Date.now()
        ? esc(at.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}))
        : '<span class="sub">즉시</span>'}</td></tr>`;
  }).join("");
  return `<section class="card warnbar fold">
    <details ${quotaOpen ? "open" : ""} ontoggle="quotaOpen=this.open">
      <summary><b>${title}</b><span class="sub">${note}</span></summary>
      <div class="body"><div class="tblwrap"><table>
        <tr><th>단계</th><th>작품</th><th>채널</th><th>맥</th><th>대기</th><th>다음 시도</th></tr>
        ${rows}</table></div></div>
    </details><span class="right"></span>${act}</section>`;
}

// ───────── 홈: 채널 즉시 실행 (0024 run_channel_now) ─────────
// 오늘 planner 가 만든 것과 '별개로 한 편 더'다(사용자 결정 8/12). 되돌리기가 아니라
// 추가 생산이므로 기존 작업지시·검수 카드는 건드리지 않는다.
let runOpen = null;   // 작품·회차 지정 폼이 열린 채널
let runWork = "";     // 그 폼에서 고른 작품
function runBox(slug){
  if (EXT_PIPE[slug]) return "";                     // 전용 파이프라인(잔망루피)은 대상 아님
  if (!can("operator"))
    return '<div class="sub" style="margin-top:9px">작업 실행은 operator 권한이 필요합니다</div>';
  const works = effWorks(slug);
  const w     = works.includes(runWork) ? runWork : (works[0] || "");
  const avail = e => epUsable(e) && epRemain(e, slug) > 0;
  const auto  = w ? epsOf(w).find(avail) : null;
  const eps   = w ? epsOf(w).filter(e => avail(e) && e.ep != null) : [];
  const epLab = e => e.ep != null ? e.ep + "회차" : "단편";
  const form  = runOpen !== slug ? "" : `
    <div class="runform">
      <label>작품<select onchange="runWork=this.value;render()">${
        works.map(x => `<option value="${esc(x)}"${x === w ? " selected" : ""}>${esc(x)}</option>`)
             .join("") || '<option value="">배정된 작품 없음</option>'}</select></label>
      <label>회차<select id="runEp">
        <option value="">자동 — ${auto ? esc(epLab(auto)) : "쓸 수 있는 회차 없음"}</option>
        ${eps.map(e => `<option value="${e.ep}">${e.ep}회차 · 남음 ${epRemain(e, slug)}</option>`).join("")}
      </select></label>
      <button class="mini pri" data-slug="${esc(slug)}"
        onclick="runNow(this.dataset.slug, runWork, document.getElementById('runEp').value)"
        >이 설정으로 실행</button>
    </div>`;
  return `<div class="runbar">
      <button class="mini pri" data-slug="${esc(slug)}"
        onclick="armed(this,'작업 실행',()=>runNow(this.dataset.slug))">작업 실행</button>
      <button class="mini" data-slug="${esc(slug)}"
        onclick="runOpen = runOpen === this.dataset.slug ? null : this.dataset.slug; render()"
        >작품·회차 지정</button>
      <span class="sub">오늘 것과 별개로 한 편 더 만듭니다${
        auto ? ` · 자동 선택: ${esc(w)} ${esc(epLab(auto))}` : " · 지금 쓸 수 있는 소스가 없습니다"}</span>
    </div>${form}`;
}
window.runNow = async (slug, work, ep) => {
  const { data, error } = await sb.rpc("run_channel_now", {
    p_slug: slug, p_work: work || null,
    p_episode: (ep === "" || ep == null) ? null : Number(ep), p_note: null });
  if (error){ toast("작업 실행 거부: " + error.message, true); return; }
  toast(`${data.channel} · ${data.work} ${data.episode != null ? data.episode + "회차" : "단편"}`
        + ` — 잡 ${data.jobs}건 투입`);
  runOpen = null; refresh();
};

// ───────── 검수함 (구 대시보드 검수 UX 계승: judge 참고표시·환각경고·반려유형) ─────────
function judgeBox(run){
  if (!state.legacyOk) return '<div class="judgebox" style="color:var(--muted)">judge 표시는 0011 정책 적용 후 활성화됩니다</div>';
  const cid = run && state.runToClip[run], jg = cid && state.judgeByClip[cid];
  if (!jg) return '<div class="judgebox" style="color:var(--muted)">judge 대기중 — 결정은 그대로 가능합니다</div>';
  const rs = jg.rubric_scores || {};
  const keys = Object.keys(rs).filter(k => typeof rs[k] === "number").slice(0,5);
  return `${rs.hallucination_flag ? '<div class="hallu">⚠ 환각 의심 — 합격해도 발행 게이트에서 자동 차단됩니다</div>' : ""}
    <div class="judgebox"><span class="q">judge 품질 ${Number(jg.quality_score).toFixed(2)}</span>
      ${jg.confidence != null ? " · 신뢰도 " + Number(jg.confidence).toFixed(2) : ""}<br>
      ${keys.map(k => `${esc(k)} ${Number(rs[k]).toFixed(2)}`).join(" · ")}
      ${rs.rationale ? `<details><summary>judge 사유 보기</summary>${esc(rs.rationale)}</details>` : ""}
    </div>`;
}
// 잔망루피 검수 카드 (0026) — 작업지시 없는 전용 파이프라인. 승인하면 원장에 확정하고
// 업로더가 비공개 업로드 + 19:00 JST 예약 공개까지 한다(R9 준수).
const LOOPY_ROUTE = { A:"무변환 — 원본 그대로", B:"자막", C:"더빙", BC:"더빙+자막" };
function loopyCard(r, pay){

    <div class="form">
      <select id="lprv_${r.id}"

        onchange="$('#lat_${r.id}').style.display=this.value==='schedule'?'':'none'">

        ? `<button class="act" title="자막·제목을 고쳐서 같은 영상을 다시 렌더(0038)"
             onclick="rerenderPanel('${r.id}')">✏️ 수정 재렌더</button>` : ""}
    </div>
    <div id="edw_${r.id}" style="display:none"></div>` : '<div class="sub">reviewer 권한 필요</div>';
  return `<div class="review rv2">
    <div class="rv2-vid">${pay.preview_key
      ? `<div id="pv_${r.id}"><video id="pvv_${r.id}" controls playsinline preload="metadata"></video></div>`
      : `<div class="sub" style="padding:18px 6px;text-align:center">현지화 산출물 없음${

    <div class="rv2-body">
      <div class="rh">${chAvatarHtml("LOOPY", 28)}<span class="rv2-chn">${esc(chName("LOOPY"))}</span>
        <span class="right sub">${ago(r.created_at)}</span></div>
      <div class="rv2-work"><b>영상</b>${esc(pay.title || vid)}
        <span class="rv2-mac">${esc(LOOPY_ROUTE[pay.route] || pay.route || "?")}</span>
        ${pay.score != null ? `<span class="sub"> · 적합도 ${Number(pay.score).toFixed(2)}</span>` : ""}</div>
      ${jpMetaHtml(pay)}
      ${pay.notes ? `<div class="sub" style="margin-top:4px">${esc(String(pay.notes).slice(0,160))}</div>` : ""}
      ${pay.url ? `<div class="sub"><a href="${esc(pay.url)}" target="_blank" rel="noopener">원본 ↗</a>

window.decideLoopy = (rid, ok) => {
  const note = (($(`#note_${CSS.escape(rid)}`)||{}).value || "").trim() || null;
  const sel = ($(`#lprv_${CSS.escape(rid)}`)||{}).value || "schedule";
  const at = ($(`#lat_${CSS.escape(rid)}`)||{}).value || "";
  const publish_at = (ok && sel === "schedule" && at) ? new Date(at).toISOString() : null;
  rpc("decide_loopy", { p_review_id: rid, p_approve: ok, p_note: note,
                        p_privacy: ok ? sel : null, p_publish_at: publish_at },
      ok ? (sel === "schedule"
              ? (publish_at ? "승인 — 지정 시각 예약 공개로 업로드합니다"
                            : "승인 — 다음 19:00 JST 슬롯 예약으로 업로드합니다")
              : `승인 — ${sel === "private" ? "비공개" : "일부공개"}로 업로드합니다`)
         : "반려 — 원장에 skipped 로 기록합니다");
};

// JP 검수 메타 블록(제목·설명·자막 — 일본어+한글 대역, 운영 결정 8/14) —
// SHOTCONE(scene_rerender) 카드와 잔망루피 카드가 같은 페이로드 규약을 쓴다.
function jpMetaHtml(pay){
  if (!(pay.youtube_title || pay.description || pay.note || pay.ko_ja_pairs)) return "";
  return `
          <div class="jpmeta" title="현지화 산출 메타 — 영상 안 제목·자막은 프리뷰에서, 업로드 제목·설명은 여기서 확인">
            ${pay.youtube_title ? `<div class="jt">🇯🇵 ${esc(pay.youtube_title)}</div>` : ""}
            ${pay.youtube_title_ko ? `<div class="jtko">🇰🇷 ${esc(pay.youtube_title_ko)}</div>` : ""}
            ${pay.description ? `<div class="jd">${esc(pay.description)}</div>` : ""}
            ${pay.description_ko ? `<div class="jd jdko">${esc(pay.description_ko)}</div>` : ""}
            ${(() => {

            (() => { const n = woNode(wo); return n

      (state.reviews||[]).filter(r => r.status !== "waiting")
        // 최신 결정이 맨 위(운영 결정 8/13) — 종전엔 무정렬(생성시각 fetch 순)이라 뒤죽박죽
        .sort((a,b) => new Date(b.decided_at || b.created_at) - new Date(a.decided_at || a.created_at))

// 발행 전 채널 안내(0044) — 채널에 따라 발행 **후** 사람이 반드시 해야 하는 조치가 있다
// (재미쇼츠 = YouTube Studio 국가 제한). 잊으면 권리 문제라 발행과 실제 전송 사이에
// 확인을 한 번 끼운다. 대상 채널·문구는 ops_config.geoblock_notice — 코드에 박지 않는다.
const noticeFor = slug => {
  try { return (JSON.parse(((state.ops||{}).geoblock_notice||{}).value || "{}"))[slug] || null; }
  catch(e){ return null; }
};
window.closeNotice = () => { const m = $("#noticeModal"); if (m) m.remove(); };
function askNotice(slug, msg, onOk){
  closeNotice();
  const box = document.createElement("div");
  box.id = "noticeModal"; box.className = "nvwrap";
  box.innerHTML = `<div class="nvbox">
    <div class="nvhd">⚠️ ${esc(chName(slug))} — 발행 전 확인</div>
    <div class="nvmsg">${esc(msg)}</div>
    <div class="nvfoot">
      <button class="mini" onclick="closeNotice()">취소</button>
      <button class="pri act" id="nvok">확인했습니다 · 발행</button>
    </div></div>`;
  box.addEventListener("click", e => { if (e.target === box) closeNotice(); });
  document.body.appendChild(box);
  $("#nvok").onclick = () => { closeNotice(); onOk(); };
}

window.approve = rid => {
  const sel = $(`#prv_${CSS.escape(rid)}`).value;
  const at = $(`#at_${CSS.escape(rid)}`).value;
  const note = ($(`#note_${CSS.escape(rid)}`).value || "").trim() || null;
  const privacy = sel === "schedule" ? "private" : sel;
  const publish_at = sel === "schedule" ? (at ? new Date(at).toISOString() : null) : null;
  if (sel === "schedule" && !publish_at) { toast("예약 시각을 선택하세요", true); return; }
  const r = (state.reviews||[]).find(x => x.id === rid) || {};
  const slug = r.channel_slug || (state.wo[r.work_order_id]||{}).channel_slug;
  const go = () => rpc("approve_and_publish",
      { p_review_id: rid, p_privacy: privacy, p_publish_at: publish_at, p_note: note },
      "합격 — publish 잡 생성됨");
  const msg = noticeFor(slug);
  if (msg) askNotice(slug, msg, go); else go();
};
// 반려 단계 — ai-video 13단계 중 어디서부터 다시 돌릴지(0021). 서버가 정본, 여기는 표시만.

window.rejectAsk = rid => {
  const e = CSS.escape(rid);

  box.innerHTML = `<div class="rjpanel">

      <button class="mini" onclick="rejectCancel('${rid}')">취소</button></div>
    ${REJECT_STAGES.map(s => `<button class="rjopt" onclick="reject('${rid}','${s.key}',true)">
      <b>${s.key}</b><span class="why">${s.why}</span><span class="eta">${s.eta}</span></button>`).join("")}
    <div class="rjfoot">
      <button class="mini" onclick="reject('${rid}','영상 분석',false)">기록만 하고 다시 안 만들기</button>
      <span>적어둔 사유는 영상 분석·스토리 구성 재실행에 그대로 반영됩니다 · 같은 맥에서 2회까지</span>
    </div></div>`;
};
window.rejectCancel = rid => {
  const b = $(`#rjb_${CSS.escape(rid)}`), a = $(`#rja_${CSS.escape(rid)}`);
  if (a){ a.style.display = "none"; a.innerHTML = ""; }
  if (b) b.style.display = "";
};
window.reject = async (rid, stage, regen) => {
  const note = ($(`#note_${CSS.escape(rid)}`).value || "").trim();
  const r = await rpc("reject_review",
    { p_review_id: rid, p_note: note || null, p_stage: stage,
      p_regenerate: regen !== false }, "반려 기록됨");
  if (r && typeof r === "object"){
    const where = r.node ? `${r.node} 에서` : "같은 맥에서";
    const what = r.from_step ? `${r.stage} 단계부터` : "처음부터";
    toast(r.regenerated
      ? `반려 — ${where} ${what} 다시 만듭니다 (${r.tries}/2)`
        + (r.note_applied && note ? " · 사유 반영됨" : "")
      : r.reason === "retry_limit"
        ? "반려 — 다시 만들기 상한(2회) 도달, 사람 판단이 필요합니다"
        : r.reason === "no_run_to_resume"
          ? "반려 — 이어달릴 이전 결과가 없습니다. '영상 분석'으로 다시 시도해 주세요"
          : "반려만 기록했습니다 — 다시 만들지 않음",
      r.reason === "retry_limit" || r.reason === "no_run_to_resume");
  }
};

    ${o.telops.length ? `<div class="edcap">방송 텔롭 ${o.telops.length}건</div>${rows(o.telops, "edl")}` : ""}

      <span>반려로 기록되고, 고친 본으로 다시 렌더한 새 검수 카드가 올라옵니다</span>
    </div></div>`;
  // 값은 프로그래매틱으로 — 따옴표·줄바꿈이 attribute 를 깨지 않게(esc 우회 아님, DOM 직결)
  const set = (id, v) => { const el = byId(id); if (el) el.value = v; };
  set(`edt_${rid}`, o.title); set(`edtt_${rid}`, o.top);
  o.subs.forEach(s => set(`eds_${rid}_${s.idx}`, s.ja));
  o.tts.forEach(s => set(`edn_${rid}_${s.idx}`, s.ja));
  o.telops.forEach(s => set(`edl_${rid}_${s.idx}`, s.ja));
};
window.rerenderCancel = rid => {
  const box = byId(`edw_${rid}`); if (box){ box.style.display = "none"; box.innerHTML = ""; }
  const rjb = byId(`rjb_${rid}`); if (rjb) rjb.style.display = "";
  RERENDER_ORIG = null;
};
window.submitRerender = rid => {
  const o = RERENDER_ORIG; if (!o || o.rid !== rid) return;
  const edits = {};
  const t = byId(`edt_${rid}`);
  if (t && t.value.trim() && t.value.trim() !== o.title) edits.youtube_title_ja = t.value.trim();
  const tt = byId(`edtt_${rid}`);
  if (tt && tt.value.trim() && tt.value !== o.top) edits.top_title_ja = tt.value;
  const diff = (list, pfx, asObj) => {
    const out = {};
    list.forEach(s => {
      const el = byId(`${pfx}_${rid}_${s.idx}`);
      if (el && el.value.trim() && el.value.trim() !== s.ja)
        out[s.idx] = asObj ? { ja: el.value.trim() } : el.value.trim();
    });
    return out;
  };
  const subs = diff(o.subs, "eds"), tts = diff(o.tts, "edn"), tel = diff(o.telops, "edl", true);
  if (Object.keys(subs).length) edits.subs = subs;
  if (Object.keys(tts).length) edits.tts = tts;
  if (Object.keys(tel).length) edits.telops = tel;
  if (!Object.keys(edits).length){
    toast("고친 내용이 없습니다 — 그대로 반려하려면 ✕ 반려를 쓰세요", true); return;
  }
  const note = ((byId(`note_${rid}`)||{}).value || "").trim() || null;
  rpc("reject_and_rerender", { p_review_id: rid, p_edits: edits, p_note: note },
      `반려 — 고친 ${Object.keys(edits).length}가지로 다시 렌더합니다 (끝나면 새 검수 카드가 올라옵니다)`);
  RERENDER_ORIG = null;
};

// ═════════ 편집실 (0042 보기 · 0043 고치기) ═════════
// 1단계: 원본 4시간 어디를 잘라 60초를 만들었는지 보여준다 — 그것만으로 검수 판단이
//   달라진다(가왕쇼처럼 '경연 결과 스포 금지' 제약이 있는 작품).
// 2단계: 그 화면에서 제목·자막을 고쳐 다시 렌더한다. 구간(clips)은 3단계.
// 편집 폼 상태는 edForm 하나로 모은다 — 0038 의 RERENDER_ORIG 처럼 전역 단일 슬롯이지만,
// 편집실은 카드를 한 번에 하나만 여는 화면이라(탭 전체를 차지) 충돌 지점이 없다.
let edRid = null, edData = null, edLoading = false, edPoll = null, edCursor = 0;
let edForm = null, edPane = "clips", edSel = -1, edTtsSel = -1;

function edResetForm(){
  const tl = (edData && edData.timeline) || {};
  const subs = (tl.subtitles || []).map(s => ({
    start: Number(s.edited_start) || 0, end: Number(s.edited_end) || 0,
    src: s.source_sec, text: s.text || "",
  }));
  const clips = (tl.clips || []).map(c => ({
    start: Number(c.start_sec) || 0, end: Number(c.end_sec) || 0, role: c.role || "build",
  }));
  // 내레이션(0047) — 좌표이자 신원 = 원본 절대초(src). 자막과 달리 구간을 고쳐도
  // 좌표가 안 흔들리므로 잠그지 않는다. del 은 화면 상태(보낼 때 걸러냄) — 전량
  // 교체 규약에서 '삭제 = 목록에서 빠짐'이지만, 되살리기가 있어야 실수를 되돌린다.
  const tts = (tl.tts || []).map(c => ({
    src: Number(c.source_sec) || 0, dur: Number(c.duration_sec) || 3,
    voice: c.voice || "ko_female", text: c.text || "",
    del: false, isNew: false,
  }));
  // d* = 사람이 지금 만지고 있는 값. 원본과 따로 들고 있어야 화면이 다시 그려져도
  // (탭 전환·재조회) 고치던 것이 날아가지 않는다. clips 는 편집 자체가 순서·개수를
  // 바꾸므로 원본 스냅샷(clips0)과 비교해 '고쳤는지'를 판정한다.
  edForm = { rid: edRid, title: tl.top_title || "", subs,
             dTitle: tl.top_title || "",
             dSubs: subs.map(s => ({ ...s })),
             clips0: clips.map(c => ({ ...c })), clips,
             tts0: tts.map(t => ({ ...t })), tts,
             design: {}, in: null, out: null };
  edSel = -1; edTtsSel = -1;
  // 저장해둔 초안(0044)이 있으면 그 위에서 이어서 고친다. 자막은 전량 교체라 개수가
  // 일치할 때만 덮는다 — 그 사이 재렌더로 자막 구성이 바뀌었으면 엉뚱한 줄에 붙는다.
  const d = (edData && edData.draft) || null;
  if (d){
    if (d.title && d.title.top_title) edForm.dTitle = d.title.top_title;
    if (d.design && typeof d.design === "object") edForm.design = { ...d.design };
    if (Array.isArray(d.clips) && d.clips.length)
      edForm.clips = d.clips.map(c => ({ start: Number(c.start_sec) || 0,
                                         end: Number(c.end_sec) || 0,
                                         role: c.role || "build" }));
    const ds = d.subtitles;
    if (Array.isArray(ds) && ds.length === subs.length)
      edForm.dSubs = ds.map((x, i) => ({ ...subs[i], text: String(x.text ?? subs[i].text) }));
    else if (Array.isArray(ds) && ds.length)
      edForm.draftMismatch = ds.length;      // 화면이 '초안 불일치'로 알린다
    // 내레이션 초안 — 전량 교체 목록을 편집 상태로 되살린다: 원본 행은 src 매칭으로
    // 문구·목소리·창을 덮고, 초안에 없는 원본 행은 '삭제됨', 매칭 안 되는 초안 행은 신규.
    const dt = d.tts;
    if (Array.isArray(dt)){
      const used = new Set();
      edForm.tts = tts.map(t => {
        const j = dt.findIndex((x, k) => !used.has(k)
          && Math.abs(Number(x.source_time_sec) - t.src) < 0.01);
        if (j < 0) return { ...t, del: true };
        used.add(j);
        const x = dt[j];
        return { ...t, text: String(x.text ?? t.text), voice: x.voice || t.voice,
                 dur: Number(x.duration_sec) || t.dur };
      });
      dt.forEach((x, k) => { if (!used.has(k))
        edForm.tts.push({ src: Number(x.source_time_sec) || 0,
                          dur: Number(x.duration_sec) || 3,
                          voice: x.voice || "ko_female", text: String(x.text || ""),
                          del: false, isNew: true }); });
    }
  }
}

const edTitleEl = () => document.getElementById("edtitle");
const edSubEl = i => document.getElementById("edsx_" + i);

// 구간이 원본과 달라졌는가 — 개수·순서·시각·역할 중 하나라도 다르면 참.
function edClipsChanged(){
  const a = edForm.clips, b = edForm.clips0;
  if (a.length !== b.length) return true;
  return a.some((c, i) => Math.abs(c.start - b[i].start) > 0.001
                       || Math.abs(c.end - b[i].end) > 0.001 || c.role !== b[i].role);
}

// 내레이션 원본 행 — 좌표(src)가 곧 신원이므로 인덱스가 아니라 src 로 찾는다
// (새 행이 중간에 끼면 인덱스 비교는 모든 뒷줄을 엉뚱한 원본과 대조하게 된다).
function edTts0For(t){
  return edForm.tts0.find(o => Math.abs(o.src - t.src) < 0.0005);
}

// 내레이션이 원본과 달라졌는가 — 삭제·신규·문구·목소리·창 중 하나라도.
function edTtsChanged(){
  if (edForm.tts.length !== edForm.tts0.length) return true;
  return edForm.tts.some(t => {
    if (t.del || t.isNew) return true;
    const o = edTts0For(t);
    return !o || t.text !== o.text || t.voice !== o.voice
        || Math.abs(t.dur - o.dur) > 0.001;
  });
}

// 내레이션의 원본 장면이 지금 구간 목록에서 빠져 있는가 — 그대로 두면 옆 장면 위에서
// 재생된다(엔진 스냅 규칙). 화면이 미리 경고할 수 있는 유일한 지점이다.
function edTtsOrphan(t){
  return !edForm.clips.some(c => t.src >= c.start - 0.5 && t.src <= c.end + 0.5);
}

// 화면의 현재 값 → 오버라이드. 고치지 않은 항목은 **키 자체를 뺀다** — 자막을 안 건드렸는데
// subtitles 를 보내면 엔진이 전량 교체로 받아 재매핑 결과를 사람 값으로 못박아 버린다.
function edCollect(){
  if (!edForm) return {};
  const ov = {}, t = edForm.dTitle;
  if (t != null && t.trim() && t !== edForm.title) ov.title = { top_title: t };
  const clipsDirty = edClipsChanged();
  if (clipsDirty && edForm.clips.length)
    ov.clips = edForm.clips.map(c => ({ start_sec: +c.start.toFixed(3),
                                        end_sec: +c.end.toFixed(3), role: c.role }));
  // 구간을 바꾸면 자막은 보내지 않는다 — 엔진이 새 구간에 맞춰 대사에서 다시 매핑하는데,
  // 옛 편집본 시간축으로 만든 자막을 함께 보내면 전량 교체라 시각이 통째로 어긋난다.
  if (!clipsDirty){
    const dirty = edForm.dSubs.length !== edForm.subs.length
      || edForm.dSubs.some((s, i) => s.text !== edForm.subs[i].text
                                  || Math.abs(s.start - edForm.subs[i].start) > 0.001);
    if (dirty)
      ov.subtitles = edForm.dSubs
        .map(s => ({ start_sec: +Number(s.start).toFixed(3),
                     end_sec: +Number(s.end).toFixed(3), text: s.text }))
        .filter(x => String(x.text).trim());
  }
  // 내레이션 — 전량 교체(빈 배열 = 전부 삭제). 자막과 달리 구간과 같이 보내도 된다:
  // 좌표가 원본 절대초라 구간이 바뀌어도 안 흔들린다(엔진이 최종 타임라인 기준으로 변환).
  if (edTtsChanged())
    ov.tts = edForm.tts.filter(t => !t.del && String(t.text).trim())
      .map(t => ({ source_time_sec: +Number(t.src).toFixed(3),
                   duration_sec: +Number(t.dur).toFixed(3),
                   voice: t.voice, text: String(t.text).trim() }));
  if (edForm.design && Object.keys(edForm.design).length) ov.design = { ...edForm.design };
  return ov;
}

// 입력할 때마다 '무엇이 달라졌는지'를 화면에 반영 — 전량 교체라 서버에 보낸 뒤에는
// 어느 줄을 고쳤는지 알 수 없다. 고친 줄은 테두리로, 비운 줄은 취소선으로 보여준다.
// 초안 자동 저장(0044) — 고치다 나가도 남는다. 입력할 때마다 보내면 타이핑마다 왕복이라
// 1.5초 쉬면 한 번 보낸다. 저장 성공 시각을 화면에 적어 '남았는지'를 눈으로 확인시킨다.
let edSaveTimer = null, edSavedAt = null;
function edQueueSave(){
  if (!edForm || !edData || !edData.run_id) return;
  clearTimeout(edSaveTimer);
  edSaveTimer = setTimeout(async () => {
    const ov = edCollect();
    const { error } = await sb.rpc("save_editor_draft",
      { p_run_id: edData.run_id, p_draft: Object.keys(ov).length ? ov : null });
    const el = document.getElementById("edsaved");
    if (error){ if (el) el.textContent = "초안 저장 실패 — " + error.message; return; }
    edSavedAt = new Date();
    if (el) el.textContent = Object.keys(ov).length
      ? `초안 저장됨 ${edSavedAt.toLocaleTimeString("ko-KR")}` : "";
  }, 1500);
}

// 한국어 TTS 대략치(자/초) — fit 게이지 표시용. 실제 fit 은 엔진이 mp3 실측으로 한다.
const ED_TTS_CHARS_PER_SEC = 5.5;
const edTtsEst = txt => String(txt || "").replace(/\s/g, "").length / ED_TTS_CHARS_PER_SEC;

window.edMark = () => {
  if (!edForm) return;
  const te = edTitleEl();
  if (te){
    edForm.dTitle = te.value;
    te.classList.toggle("dirty", te.value !== edForm.title);
  }
  edForm.dSubs.forEach((s, i) => {
    const el = edSubEl(i); if (!el) return;
    s.text = el.value;
    const orig = edForm.subs[i];
    el.classList.toggle("dirty", !orig || el.value !== orig.text);
    el.classList.toggle("empty", !el.value.trim());
  });
  edForm.tts.forEach((t, i) => {
    const el = document.getElementById("edtx_" + i); if (!el) return;
    t.text = el.value;
    const orig = edTts0For(t);
    el.classList.toggle("dirty", t.isNew || !orig || el.value !== orig.text);
    el.classList.toggle("empty", !el.value.trim());
    // 창 길이 대비 예상 발화 길이 — 넘치면 엔진이 뜻을 지키며 줄여 재합성한다는 예고
    const e = edTtsEst(t.text), over = e > t.dur;
    const bar = document.getElementById("edtfb_" + i);
    if (bar){ bar.style.width = Math.min(100, e / t.dur * 100) + "%";
              bar.classList.toggle("over", over); }
    const lab = document.getElementById("edtfl_" + i);
    if (lab) lab.innerHTML = over
      ? `예상 ${e.toFixed(1)}s <span class="fitnote">— 창(${t.dur.toFixed(1)}s)보다 길어 AI가 줄여 다시 씁니다</span>`
      : `예상 ${e.toFixed(1)}s / 창 ${t.dur.toFixed(1)}s`;
  });
  const ov = edCollect();
  const bits = [ov.title ? "제목" : null, ov.clips ? "구간" : null,
                ov.subtitles ? "자막" : null, ov.tts ? "내레이션" : null,
                ov.design ? "스타일" : null].filter(Boolean);
  const btn = document.getElementById("edsubmit");
  if (btn){
    btn.disabled = !bits.length;
    btn.textContent = bits.length
      ? `✏️ 고친 내용으로 다시 렌더 (${bits.join("·")})` : "✏️ 고친 내용으로 다시 렌더";
  }
  edQueueSave();
};

// 60초 초과는 막지 않고 알린다 — 렌더가 역할별로 줄이므로 결과는 나오지만, 사람이
// 의도한 구간이 잘릴 수 있다는 것을 알고 보내야 한다.
function confirmOver(total){
  return window.confirm(
    `구간 합계가 ${total.toFixed(1)}초입니다(쇼츠 상한 59.7초).\n` +
    `렌더가 훅 시작·마무리 끝을 지키며 자동으로 줄입니다. 이대로 보낼까요?`);
}

window.edSubmit = async () => {
  const ov = edCollect();
  if (!Object.keys(ov).length){ toast("고친 내용이 없습니다", true); return; }
  if (ov.subtitles && !ov.subtitles.length){
    toast("자막을 전부 지울 수는 없습니다 — 자막 없이 가려면 검수에서 반려하세요", true); return;
  }
  // 내레이션은 빈 배열이 유효하다(전부 삭제) — 단 실수일 수 있으니 한 번 확인.
  if (ov.tts && !ov.tts.length
      && !window.confirm("내레이션을 전부 삭제한 채 다시 렌더합니다 — 음성도 하늘색 자막도 모두 빠집니다. 계속할까요?"))
    return;
  if (ov.clips){
    const bad = ov.clips.find(c => c.end <= c.start);
    if (bad){ toast("끝이 시작보다 앞인 구간이 있습니다", true); return; }
    const total = ov.clips.reduce((a,c) => a + (c.end - c.start), 0);
    if (total > 59.7 && !confirmOver(total)) return;
  }
  const btn = document.getElementById("edsubmit");
  if (btn){ btn.disabled = true; btn.textContent = "보내는 중…"; }
  const r = await rpc("submit_editor_render",
    { p_review_id: edRid, p_overrides: ov, p_note: null },
    "다시 렌더합니다 — 끝나면 새 검수 카드가 올라옵니다(수십 초~수 분)");
  if (r){ edRid = null; edData = null; edForm = null; tab = "review"; render(); }
  else if (btn) edMark();
};

window.openEditor = async (rid) => {
  edRid = rid; edData = null; edForm = null; tab = "edit"; render();
  try {
    const r = await sb.rpc("request_editor_assets", { p_review_id: rid });
    if (r.error) throw r.error;
    edLoadAssets((r.data || {}).run_id);
  } catch (e){
    edData = { error: e.message || String(e) }; render();
  }
};

async function edLoadAssets(runId){
  if (!runId || edLoading) return;
  edLoading = true;
  try {
    const { data, error } = await sb.from("editor_assets")
      .select("*").eq("run_id", runId).maybeSingle();
    if (error) throw error;
    edData = data || { status: "pending", run_id: runId };
    // 준비 중이면 폴링 — 4시간물 스프라이트는 수십 초 걸린다
    if (edData.status === "pending"){
      clearTimeout(edPoll);
      edPoll = setTimeout(() => { edLoading = false; edLoadAssets(runId); }, 5000);
    }
  } catch (e){
    edData = { error: e.message || String(e) };
  } finally {
    if (!edData || edData.status !== "pending") edLoading = false;
    render();
  }
}

const edFmt = s => {
  s = Math.max(0, Math.round(Number(s) || 0));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? String(h).padStart(2,"0") + ":" : "") +
         String(m).padStart(2,"0") + ":" + String(x).padStart(2,"0");
};

// 원본 시각 → 스프라이트 시트 좌표. 어댑터 sprite_layout 과 같은 규약(n = t/interval).
function edTile(sp, t){
  const iv = sp.interval || 10, g = sp.grid || 10, per = g*g;
  const n = Math.floor(t / iv);
  const keys = ((sp.assets||{}).global) || [];
  const sheet = Math.floor(n / per);
  if (sheet >= keys.length) return null;
  return { key: keys[sheet], col: n % g, row: Math.floor((n % per) / g),
           w: sp.thumb_w || 160 };
}

async function edPaintThumb(el, sp, t){
  const tile = edTile(sp, t);
  if (!el || !tile){ if (el) el.style.background = "var(--surface-2)"; return; }
  try {
    const url = await signedUrl("ves-outputs", tile.key, 1800);
    const g = sp.grid || 10, w = tile.w, h = Math.round(w * 9 / 16);
    el.style.backgroundImage = `url("${url}")`;
    el.style.backgroundSize = `${w*g}px ${h*g}px`;
    el.style.backgroundPosition = `-${tile.col*w}px -${tile.row*h}px`;
  } catch(e){ /* 서명 실패는 조용히 — 타임라인 자체는 계속 쓴다 */ }
}

// 편집실 첫 화면(0044) — 열어놓고 아직 재렌더를 안 보낸 것들. 여기서 바로 이어서 한다.
function edDraftList(){
  const rows = (state.drafts || []).filter(d => d.draft);
  if (!rows.length)
    return `<div class="empty">이어서 할 편집이 없습니다 —
      검수함에서 영상의 <b>🎬 편집실</b> 버튼으로 여세요.</div>`;
  return `<div class="edlist">${rows.map(d => {
    const wo = state.wo[d.work_order_id] || {};
    const dr = d.draft || {};
    const bits = [dr.title ? "제목" : null,
                  dr.subtitles ? `자막 ${dr.subtitles.length}줄` : null,
                  dr.clips ? `구간 ${dr.clips.length}개` : null,
                  dr.tts ? `내레이션 ${dr.tts.length}건` : null].filter(Boolean).join(" · ");
    // 카드가 이미 닫혔으면(재렌더·발행·반려) 그 초안으로는 보낼 수 없다 — 미리 알린다
    const rv = (state.reviews||[]).find(x => x.id === d.review_id);
    const dead = !rv || rv.status !== "waiting";
    return `<div class="edcard" onclick="openEditor('${d.review_id}')">
      <span class="badge">${esc(bits || "편집 중")}</span>
      <span class="t">${esc(wo.work_title || d.run_id)}
        ${wo.episode != null ? esc(wo.episode) + "회차" : ""}
        <span class="sub">${esc(chName(wo.channel_slug))} ·
          ${d.draft_at ? new Date(d.draft_at).toLocaleString("ko-KR") : ""}
          ${d.draft_by ? " · " + esc(d.draft_by) : ""}
          ${dead ? " · ⚠ 검수 카드가 닫혀 보낼 수 없습니다" : ""}</span></span>
      <span class="sub">열기 →</span></div>`;
  }).join("")}</div>`;
}

function renderEdit(){
  if (!edRid){
    $("#page").innerHTML = `<section class="card">
      <div class="edhead"><b>편집실</b>
        <span class="sub">보내지 않은 편집 ${(state.drafts||[]).length}건</span></div>
      ${edDraftList()}</section>`;
    return;
  }
  const r = (state.reviews||[]).find(x => x.id === edRid) || {};
  const wo = state.wo[r.work_order_id] || {};
  const head = `<div class="edhead"><b>${esc(wo.work_title || "")}</b>
      ${wo.episode != null ? `<span class="sub">${wo.episode}회차</span>` : ""}
      <span class="rv2-mac">${esc(chName(wo.channel_slug || r.channel_slug))}</span>
      <span class="right"><button class="mini" onclick="tab='review';render()">← 검수함</button>
      <button class="mini" onclick="edRid=null;edData=null;edForm=null;render()">편집 목록</button></span></div>`;

  if (!edData){
    $("#page").innerHTML = `<section class="card">${head}
      <div class="empty">편집실 여는 중…</div></section>`; return;
  }
  if (edData.error){
    $("#page").innerHTML = `<section class="card">${head}
      <div class="empty">열기 실패 — ${esc(edData.error)}
        <button class="mini" onclick="openEditor('${edRid}')">다시 시도</button></div></section>`;
    return;
  }
  if (edData.status === "pending"){
    $("#page").innerHTML = `<section class="card">${head}
      <div class="empty">원본 편집 재료를 만드는 중입니다 — 4시간짜리 원본이면 2~5분 걸립니다.
        <div class="sub" style="margin-top:6px">썸네일·파형·편집용 영상을 그 영상을 만든 맥에서 뜨는 중…</div>
      </div></section>`;
    return;
  }
  if (edData.status === "failed"){
    $("#page").innerHTML = `<section class="card">${head}
      <div class="empty">재료 생성 실패 — ${esc(edData.error || "")}
        <button class="mini" onclick="openEditor('${edRid}')">다시 시도</button></div></section>`;
    return;
  }

  const tl = edData.timeline || {}, sp = edData.sprites || {};
  const dur = Number(tl.duration_sec) || 1;
  const pct = t => (Math.max(0, Math.min(dur, Number(t)||0)) / dur * 100).toFixed(4);
  const pay = r.payload || {};
  const canEdit = can("reviewer") && r.kind === "publish_gate" && r.status === "waiting";
  if (!edForm || edForm.rid !== edRid) edResetForm();
  const med = (sp.assets || {}).media || {};
  const hasVideo = !!(med.scan || (med.closeups||[]).length);

  // 완성본 순서(편집 결과) — 구간을 만지면 여기 길이가 바로 바뀐다
  const total = edForm.clips.reduce((a,c) => a + Math.max(0, c.end - c.start), 0);
  const over = total > 59.7;

  const blocks = edForm.clips.map((c,i) => `
    <div class="edclip ${esc(c.role)} ${i === edSel ? "sel" : ""}"
      style="left:${pct(c.start)}%;width:${Math.max(0.15,((c.end-c.start)/dur*100)).toFixed(4)}%"
      title="${esc(c.role)} · ${edFmt(c.start)}~${edFmt(c.end)} (${(c.end-c.start).toFixed(1)}초)"
      onclick="event.stopPropagation();edPick(${i})"><span>${i+1}</span></div>`).join("");
  const marks = (edForm.in != null ? `<div class="edmark in" style="left:${pct(edForm.in)}%"></div>` : "")
              + (edForm.out != null ? `<div class="edmark out" style="left:${pct(edForm.out)}%"></div>` : "");

  $("#page").innerHTML = `<section class="card">${head}
    <div class="edgrid2">
      <div class="edleft">
        <div class="edprev">${hasVideo
          ? `<video id="edvid" playsinline preload="metadata" controls></video>`
          : `<div class="sub" style="padding:20px;text-align:center">
               편집용 영상이 아직 없습니다 — 재료를 다시 만들면 생깁니다
               <div><button class="mini" onclick="edRebuild()">재료 다시 만들기</button></div></div>`}</div>
        <div class="edbar">
          <button class="mini" onclick="edNudge(-5)" title="5초 뒤로">⏪</button>
          <button class="mini" onclick="edNudge(-1/24)" title="한 프레임 뒤로">◀|</button>
          <button class="mini" onclick="edToggle()" id="edplay">▶</button>
          <button class="mini" onclick="edNudge(1/24)" title="한 프레임 앞으로">|▶</button>
          <button class="mini" onclick="edNudge(5)" title="5초 앞으로">⏩</button>
          <b id="edtime">${edFmt(edCursor)}</b>
          <span class="sub" id="edsrcname"></span>
          <span class="right">
            <button class="mini" onclick="edMarkIn()" title="현재 위치를 구간 시작으로 (I)">[ 시작</button>
            <button class="mini" onclick="edMarkOut()" title="현재 위치를 구간 끝으로 (O)">끝 ]</button>
            <button class="pri mini" onclick="edAddClip()" title="표시한 구간을 목록에 추가">＋ 구간 추가</button>
          </span>
        </div>
        <div class="sub" id="edmarkinfo">${edMarkText()}</div>
      </div>

      <div class="edright">
        <div class="edtabs">
          ${[["clips","구간 "+edForm.clips.length],["subs","자막 "+edForm.dSubs.length],
             ["tts","내레이션 "+edForm.tts.filter(t=>!t.del).length],
             ["style","스타일"]].map(([k,l]) =>
            `<button class="edtab ${edPane===k?"on":""}" onclick="edPane='${k}';render()">${esc(l)}</button>`).join("")}
        </div>
        <div class="edpane">${
          edPane === "clips" ? edPaneClips(canEdit, dur)
          : edPane === "subs" ? edPaneSubs(canEdit)
          : edPane === "tts" ? edPaneTts(canEdit)
          : edPaneStyle(canEdit)}</div>
      </div>
    </div>

    <div class="edcap" style="margin-top:12px">원본 타임라인 — 색 블록이 이 쇼츠에 쓰인 구간입니다
      ${edForm.tts.length ? `<span style="color:#87CEEB">· 하늘색 마커가 내레이션</span>
        <span class="sub">(빗금 = 원본 장면이 구간에서 빠짐)</span>` : ""}
      ${(med.closeups||[]).length ? `<span class="sub">· 진한 부분은 정밀 편집용 고화질이 있는 구간</span>` : ""}</div>
    <div class="edtl" id="edtl" onclick="edClickTl(event)">
      ${sp.assets && sp.assets.wave ? `<img class="edwave" id="edwave">` : ""}
      ${(med.closeups||[]).map(c => `<div class="edhq" style="left:${pct(c.start_sec)}%;width:${
          ((c.end_sec-c.start_sec)/dur*100).toFixed(4)}%"></div>`).join("")}
      <div class="edticks">${edTicks(dur)}</div>
      ${blocks}${marks}
      ${edForm.tts.map((t,i) => `<div class="edcue ${i===edTtsSel?"sel":""} ${
          edTtsOrphan(t)?"orphan":""} ${t.del?"del":""} ${t.isNew?"new":""}"
        style="left:${pct(t.src)}%;width:${Math.max(0.3, t.dur/dur*100).toFixed(4)}%"
        title="내레이션 ${i+1} · 원본 ${edFmt(t.src)} · ${esc(String(t.text).slice(0,24))}"
        onclick="event.stopPropagation();edTtsPick(${i})"></div>`).join("")}
      <div class="edcur" id="edcur" style="left:${pct(edCursor)}%"></div>
    </div>
    <div class="edscrub">
      <div class="edthumb" id="edthumb"></div>
      <div class="edscrubinfo">
        <b class="${over ? "bad" : ""}">완성본 ${total.toFixed(1)}초 · 구간 ${edForm.clips.length}개</b>
        <span class="sub">${over ? "⚠ 60초를 넘으면 렌더가 뒤를 잘라냅니다"
          : "타임라인을 누르면 그 지점으로 이동합니다"}</span></div>
    </div>

    ${canEdit ? `<div class="edfoot2">
      <button class="pri act" id="edsubmit" onclick="edSubmit()" disabled>
        ✏️ 고친 내용으로 다시 렌더</button>
      <span id="edsaved" class="edsaved">${edForm.draftMismatch
        ? `⚠ 저장된 초안(자막 ${edForm.draftMismatch}줄)이 지금 자막 구성과 달라 나머지만 되살렸습니다`
        : (edData.draft_at ? "초안 이어서 편집 중 — "
              + new Date(edData.draft_at).toLocaleString("ko-KR") : "")}</span>
      <span>지금 카드는 반려로 닫히고, 고친 본으로 다시 렌더한 새 카드가 올라옵니다</span>
    </div>` : `<div class="sub" style="margin-top:10px">
      ${r.kind === "publish_gate" ? "reviewer 권한이 있어야 고칠 수 있습니다"
        : "일본어 카드는 검수함의 ✏️ 수정 재렌더를 쓰세요 — 이 화면은 보기 전용입니다"}
    </div>`}</section>`;

  // 값 주입은 프로그래매틱으로(따옴표·줄바꿈이 attribute 를 깨지 않게)
  if (edTitleEl()) edTitleEl().value = edForm.dTitle;
  edForm.dSubs.forEach((s, i) => { const el = edSubEl(i); if (el) el.value = s.text; });
  edForm.tts.forEach((t, i) => {
    const el = document.getElementById("edtx_" + i); if (el) el.value = t.text; });
  Object.entries(edForm.design || {}).forEach(([k,v]) => {
    const el = document.getElementById("edd_" + k); if (el) el.value = v ?? "";
  });
  edMark();

  if (hasVideo) edMountVideo();
  if (sp.assets && sp.assets.wave) signedUrl("ves-outputs", sp.assets.wave, 1800)
    .then(u => { const w = document.getElementById("edwave"); if (w) w.src = u; }).catch(()=>{});
  edPaintThumb(document.getElementById("edthumb"), sp, edCursor);
}

// ── 우측 패널: 구간 ────────────────────────────────────────────────────
function edPaneClips(canEdit, dur){
  if (!edForm.clips.length)
    return `<div class="sub">구간이 없습니다 — 영상에서 <b>[ 시작</b> · <b>끝 ]</b> 을 찍고
      <b>＋ 구간 추가</b> 를 누르세요.</div>`;
  return `<div class="edrows">${edForm.clips.map((c,i) => `
    <div class="edrow2 ${i === edSel ? "sel" : ""}" onclick="edPick(${i})">
      <span class="n">${i+1}</span>
      <select ${canEdit?"":"disabled"} onchange="edSetRole(${i},this.value)"
        onclick="event.stopPropagation()">
        ${["hook","build","payoff"].map(v =>
          `<option value="${v}" ${c.role===v?"selected":""}>${
            v==="hook"?"훅":v==="payoff"?"마무리":"전개"}</option>`).join("")}
      </select>
      <input class="tm" value="${edFmtMs(c.start)}" ${canEdit?"":"disabled"}
        onclick="event.stopPropagation()" onchange="edSetTime(${i},'start',this.value)">
      <span class="dash">~</span>
      <input class="tm" value="${edFmtMs(c.end)}" ${canEdit?"":"disabled"}
        onclick="event.stopPropagation()" onchange="edSetTime(${i},'end',this.value)">
      <span class="len">${(c.end-c.start).toFixed(1)}s</span>
      <span class="ops" onclick="event.stopPropagation()">
        <button class="mini" onclick="edPlayClip(${i})" title="이 구간 재생">▶</button>
        <button class="mini" onclick="edMove(${i},-1)" ${canEdit&&i>0?"":"disabled"} title="위로">↑</button>
        <button class="mini" onclick="edMove(${i},1)" ${canEdit&&i<edForm.clips.length-1?"":"disabled"} title="아래로">↓</button>
        <button class="mini danger" onclick="edDelClip(${i})" ${canEdit?"":"disabled"} title="삭제">✕</button>
      </span></div>`).join("")}</div>
    <div class="sub" style="margin-top:6px">순서가 곧 완성본 순서입니다 ·
      시각은 <b>원본</b> 기준(시:분:초.밀리) · 구간을 바꾸면 자막은 대사에서 다시 맞춰집니다</div>`;
}

// ── 우측 패널: 자막 ────────────────────────────────────────────────────
function edPaneSubs(canEdit){
  const locked = edForm.clips.length && edClipsChanged();
  // 지금 대부분의 작품은 대사 자막을 끄고 렌더한다(소스에 자막이 없어서). 그 사실을 숨기면
  // '고쳤는데 영상이 그대로'로 보인다 — 고쳐 보내면 그 편만 켜진다는 것을 미리 알린다.
  const off = !(state.wo[((state.reviews||[]).find(x=>x.id===edRid)||{}).work_order_id]||{}).has_subtitle;
  return `${locked ? `<div class="edwarn">구간을 고쳤기 때문에 자막은 <b>대사에서 다시 맞춰집니다</b> —
      지금 고친 자막 문구는 보내지 않습니다. 구간을 먼저 확정해 렌더한 뒤 자막을 고치세요.</div>` : ""}
    ${off && !locked ? `<div class="edwarn">이 영상은 지금 <b>대사 자막을 넣지 않고</b> 렌더됐습니다
      (아래는 전사된 대사 원본). 한 줄이라도 고쳐 보내면 <b>그 편만 자막이 켜집니다</b>.</div>` : ""}
    <div class="edcap">상단 제목 <span class="sub">— 영상 안에 그려지는 글자(줄바꿈 유지)</span></div>
    <textarea id="edtitle" rows="2" oninput="edMark()" ${canEdit ? "" : "disabled"}></textarea>
    <div class="edcap">자막 ${edForm.dSubs.length}건
      <span class="sub">— 시각(완성본 기준)을 누르면 원본 위치로 · 비우면 그 줄이 빠집니다</span></div>
    <div class="edsubs">${edForm.dSubs.map((s, i) => `
      <div class="edsub">
        <span class="t" onclick="edSeek(${s.src ?? 0})"
          title="원본 ${s.src != null ? edFmt(s.src) : "—"}">${
          Number(s.start).toFixed(1)}s</span>
        <input class="x" type="text" id="edsx_${i}" oninput="edMark()" ${
          canEdit && !locked ? "" : "disabled"}>
        <button class="mini danger" onclick="edDelSub(${i})" ${
          canEdit && !locked ? "" : "disabled"} title="이 줄 삭제">✕</button>
      </div>`).join("") || '<div class="sub">자막 없음</div>'}</div>
    ${canEdit && !locked ? `<div class="edaddrow">
      <input class="tm" id="edns" placeholder="시작 초" value="${
        (edForm.dSubs.length ? Number(edForm.dSubs[edForm.dSubs.length-1].end).toFixed(1) : "0")}">
      <input class="tm" id="edne" placeholder="끝 초" value="${
        (edForm.dSubs.length ? (Number(edForm.dSubs[edForm.dSubs.length-1].end)+2).toFixed(1) : "2")}">
      <input id="ednt" placeholder="새 자막 문구">
      <button class="mini" onclick="edAddSub()">＋ 자막 추가</button>

}

// ── 우측 패널: 내레이션(0047) ──────────────────────────────────────────
// 문구는 story 단계 LLM 산출물이라 여기가 사람이 고칠 유일한 통로다. 좌표는 원본
// 절대초(신원 겸용) — 구간을 고쳐도 안 흔들리므로 자막처럼 잠그지 않는다.
const ED_VOICES = [["ko_female","기본 여성"],["ko_female_high","밝은 여성"],
                   ["ko_male","기본 남성"],["ko_male_low","낮은 남성"]];
function edVoiceSel(cur, canEdit, handler){
  const opts = ED_VOICES.some(([v]) => v === cur)
    ? ED_VOICES : [[cur, cur], ...ED_VOICES];       // 낯선 프리셋(chat_*)은 현재값 보존
  return `<select ${canEdit?"":"disabled"} onchange="${handler}"
    onclick="event.stopPropagation()">${opts.map(([v,l]) =>
    `<option value="${esc(v)}" ${v===cur?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
}
function edPaneTts(canEdit){
  const orphans = edForm.tts.filter(t => !t.del && edTtsOrphan(t)).length;

    const orphan = edTtsOrphan(t) && !t.del;
    return `
    <div class="ednrow ${i===edTtsSel?"sel":""} ${t.del?"deleted":""}" onclick="edTtsPick(${i})">
      <div class="hd">
        <span class="n">${i+1}</span>
        <span class="t" title="원본 이 지점으로 이동"
          onclick="event.stopPropagation();edSeek(${t.src})">원본 ${edFmt(t.src)}</span>
        <span>창 ${t.dur.toFixed(1)}s</span>
        ${edVoiceSel(t.voice, canEdit && !t.del, `edTtsVoice(${i},this.value)`)}
        ${t.isNew ? `<span style="color:#87CEEB">신규</span>` : ""}
        <span style="margin-left:auto"></span>
        ${t.del
          ? `<button class="mini" onclick="event.stopPropagation();edTtsRestore(${i})">되살리기</button>`
          : `<button class="mini danger" title="이 내레이션 삭제(음성·자막 함께)"
               onclick="event.stopPropagation();edTtsDel(${i})" ${canEdit?"":"disabled"}>✕</button>`}
      </div>
      <textarea id="edtx_${i}" rows="2" oninput="edMark()"
        onclick="event.stopPropagation()" ${canEdit && !t.del ? "" : "disabled"}></textarea>
      ${t.del ? `<div class="fitrow">이 내레이션은 빠집니다 — 음성도 하늘색 자막도 함께</div>` : `
      <div class="fitrow"><span id="edtfl_${i}"></span>
        <div class="fitbar"><i id="edtfb_${i}"></i></div></div>`}
      ${orphan ? (t.isNew
        ? `<div class="orphanwarn">원본 ${edFmt(t.src)} 는 지금 구간 목록에 없는 지점입니다 —
           새 내레이션은 <b>렌더에서 빠집니다</b>. 구간 안의 시각으로 넣으세요.</div>`
        : `<div class="orphanwarn">이 내레이션의 원본 장면(${edFmt(t.src)})이 지금 구간

    </div>`; }).join("");
  return `${orphans ? `<div class="edwarn">⚠ 내레이션 <b>${orphans}건</b>의 원본 장면이

    ${canEdit ? `<div class="edaddrow">
      <input class="tm" id="edntts" placeholder="원본 시각" title="1:23:45.6 또는 초">
      <input class="tm" id="ednttd" placeholder="길이(초)" value="3.0">
      <span id="edndvsel">${edVoiceSel("ko_female", true, "")}</span>
      <input id="edntt" placeholder="새 내레이션 문구 — 그 장면 위에 얹힙니다">
      <button class="mini" onclick="edTtsAdd()">＋ 내레이션 추가</button>
    </div>` : ""}
    <div class="sub" style="margin-top:6px">시각은 <b>원본</b> 기준 — 구간을 옮겨도 내레이션은
      그 장면을 따라갑니다 · 고쳐 보내면 <b>음성을 새로 합성</b>합니다(재렌더 몇 분) ·
      비우면 그 줄이 빠집니다</div>`;
}
