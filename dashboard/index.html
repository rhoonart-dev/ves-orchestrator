let edUndo = [], edRedo = [], edSnapTag = "", edSnapAt = 0;
// P2-a: 플레이어 모드(src=원본 스크럽 / prev=완성본 preview.mp4) · 가상 시퀀스 재생 상태
// 스테이지(좌측 9:16 쇼츠 화면) 모드 — prev: 완성본 mp4, seq: 가상 시퀀스(원본을 이어 재생).
// 원본 스크럽은 모드가 아니라 타임라인 아래 상설 플레이어(#edsrcv)다.
let edStageMode = "prev", edSeq = null, edPrevKey = null, edPrevBucket = null, edPrevT = 0;
let edStyleTool = false, edStageCur = -1, edStageT = 0;   // WYSIWYG: 화면에 떠 있는 자막 줄
let edPrevWarned = false;      // 만료 preview 경고는 카드당 1회 — 렌더마다 토스트 금지
let edSubColorFor = -1;        // 컬러 피커가 열린 순간의 줄 — 재생이 흘러도 그 줄에 적용
let edPrevImages = [];         // 이전 라운드 이미지(0057 prev_images) — 시드 원본
let edOvSel = "sub";           // ✎ 도구의 대상 — title(전체)|sub(그 줄)|tts(전체)
// 일본어 편집 모드(JP-1) — localization_qa 카드는 원본 타임라인 재료가 아니라 카드
// payload(ko_ja_pairs)가 재료다. 계약은 0038 reject_and_rerender 텍스트 치환 그대로.
let edJpMode = null, edJpForm = null, edJpChain = null, edJpTimer = null;
let edJpPane = "subs";   // KR 편집실과 같은 탭 구성 — 자막·대사 | 제목 | 내레이션 | 텔롭

function edResetForm(){
  const tl = (edData && edData.timeline) || {};
  const subs = (tl.subtitles || []).map(s => ({
    start: Number(s.edited_start) || 0, end: Number(s.edited_end) || 0,
    src: s.source_sec, text: s.text || "",
    // 줄 스타일(v3) — 재료 타임라인이 내려주면 보여주고, 없으면 채널 기본값으로 그린다
    style: s.style && typeof s.style === "object" ? { ...s.style } : undefined,
  }));
  const clips = (tl.clips || []).map(c => ({
    start: Number(c.start_sec) || 0, end: Number(c.end_sec) || 0, role: c.role || "build",
  }));
  // 내레이션(0047) — 좌표이자 신원 = 원본 절대초(src). 자막과 달리 구간을 고쳐도
  // 좌표가 안 흔들리므로 잠그지 않는다. del 은 화면 상태(보낼 때 걸러냄) — 전량
  // 교체 규약에서 '삭제 = 목록에서 빠짐'이지만, 되살리기가 있어야 실수를 되돌린다.
  const tts = (tl.tts || []).map(c => ({
    src: Number(c.source_sec) || 0, dur: Number(c.duration_sec) || 3,
    voice: c.voice || "ko_female", text: c.text || "",
    key: c.key || null,               // 합성 mp3(F-204 미리듣기) — 구 재료엔 없다
    del: false, isNew: false,
  }));
  // 이미지(F-408) — 타임라인이 아니라 이전 라운드 오버라이드(prev_images)가 정본.
  // 화면에 보여야 '지우기'가 성립한다(키 생략 = 승계 규약, 0057 머리말).
  const imgs0 = (edPrevImages || []).map(m => ({
    key: String(m.key || ""), name: String(m.key || "").split("/").pop(),
    src: Number(m.source_time_sec) || 0, dur: Number(m.duration_sec) || 3,
    x: Number(m.x) || 0, y: Number(m.y) || 0, w: Number(m.w) || 0.3,
    layer: m.layer, rotate: m.rotate, del: false })).filter(m => m.key);
  // d* = 사람이 지금 만지고 있는 값. 원본과 따로 들고 있어야 화면이 다시 그려져도
  // (탭 전환·재조회) 고치던 것이 날아가지 않는다. clips 는 편집 자체가 순서·개수를
  // 바꾸므로 원본 스냅샷(clips0)과 비교해 '고쳤는지'를 판정한다.
  edForm = { rid: edRid, title: tl.top_title || "", subs,
             dTitle: tl.top_title || "",
             dSubs: subs.map(s => ({ ...s })),
             clips0: clips.map(c => ({ ...c })), clips,
             tts0: tts.map(t => ({ ...t })), tts,
             images: imgs0.map(m => ({ ...m })), images0: imgs0,
             design: {}, in: null, out: null };
  edSel = -1; edTtsSel = -1;
  edUndo = []; edRedo = []; edSnapTag = "";
  // 저장해둔 초안(0044)이 있으면 그 위에서 이어서 고친다. 자막은 전량 교체라 개수가
  // 일치할 때만 덮는다 — 그 사이 재렌더로 자막 구성이 바뀌었으면 엉뚱한 줄에 붙는다.
  const d = (edData && edData.draft) || null;
  if (d){
    if (d.title && d.title.top_title) edForm.dTitle = d.title.top_title;
    if (d.design && typeof d.design === "object") edForm.design = { ...d.design };
    if (Array.isArray(d.clips) && d.clips.length)
      edForm.clips = d.clips.map(c => ({ start: Number(c.start_sec) || 0,
                                         end: Number(c.end_sec) || 0,
                                         role: c.role || "build", del: !!c.del }));
    // 자막 초안 — 인덱스가 아니라 **완성본 시각(start) 매칭**으로 되살린다(내레이션의
    // src 매칭과 같은 규약). 종전 '개수 일치 때만 인덱스 복원'은 한 줄만 지워도 초안
    // 전체를 버리고 불일치 경고를 냈다. 원본에 있는데 초안에 없는 줄 = 삭제된 줄.
    const ds = d.subtitles;
    if (Array.isArray(ds) && ds.length){
      // 신원 복원(V3-b): i0(원본 줄 번호)가 있으면 그걸로 매칭 — 시각 매칭은 타이밍
      // 편집(이동·트리밍) 한 칸에도 깨져 줄이 '삭제+신규'로 갈라지고 src(앵커 복원
      // 수단)까지 잃는다(리뷰 H2). i0 없는 옛 초안은 종전 시각 매칭으로 호환.
      const byI0 = ds.some(x => x.i0 != null);
      const usedS = new Set();
      const pick = (s, i) => {
        const j = byI0
          ? ds.findIndex(x => x.i0 === i)
          : ds.findIndex((x, k) => !usedS.has(k)
              && Math.abs(Number(x.start_sec) - s.start) < 0.01);
        if (j < 0) return null;
        usedS.add(j);
        return ds[j];
      };
      edForm.dSubs = subs.map((s, i) => {
        const x = pick(s, i);
        if (!x) return { ...s, del: true };
        // 스타일도 줄 전체 교체 규약 — 초안 행에 style 이 없으면 '스타일 없음'이다
        return { ...s, text: String(x.text ?? s.text), del: !!x.del, pin: !!x.pin,
                 start: x.pin ? (Number(x.start_sec) || s.start) : s.start,
                 end: x.pin ? (Number(x.end_sec) || s.end) : s.end,
                 style: x.style && typeof x.style === "object" ? { ...x.style } : undefined };
      });
      ds.forEach((x, k) => { if (!usedS.has(k))
        edForm.dSubs.push({ start: Number(x.start_sec) || 0, end: Number(x.end_sec) || 0,
                            text: String(x.text || ""), src: null, added: true,
                            del: !!x.del, pin: !!x.pin,
                            style: x.style && typeof x.style === "object"
                              ? { ...x.style } : undefined }); });
    }
    // 이미지 초안(F-408) — 신원은 스토리지 key(업로드마다 유일). 그대로 되살린다.
    if (Array.isArray(d.images))
      edForm.images = d.images.map(m => ({
        key: m.key, name: m.name || "",
        src: Number(m.source_time_sec) || 0, dur: Number(m.duration_sec) || 3,
        x: Number(m.x) || 0, y: Number(m.y) || 0, w: Number(m.w) || 0.3,
        layer: m.layer, rotate: m.rotate, del: !!m.del })).filter(m => m.key);
    // 내레이션 초안 — 전량 교체 목록을 편집 상태로 되살린다: 원본 행은 src 매칭으로
    // 문구·목소리·창을 덮고, 초안에 없는 원본 행은 '삭제됨', 매칭 안 되는 초안 행은 신규.
    const dt = d.tts;
    if (Array.isArray(dt)){
      const used = new Set();
      edForm.tts = tts.map(t => {
        const j = dt.findIndex((x, k) => !used.has(k)
          && Math.abs(Number(x.source_time_sec) - t.src) < 0.01);
        if (j < 0) return { ...t, del: true };
        used.add(j);
        const x = dt[j];
        return { ...t, text: String(x.text ?? t.text), voice: x.voice || t.voice,
                 dur: Number(x.duration_sec) || t.dur };
      });
      dt.forEach((x, k) => { if (!used.has(k))
        edForm.tts.push({ src: Number(x.source_time_sec) || 0,
                          dur: Number(x.duration_sec) || 3,
                          voice: x.voice || "ko_female", text: String(x.text || ""),
                          del: false, isNew: true }); });
    }
  }
}

const edTitleEl = () => document.getElementById("edtitle");
const edSubEl = i => document.getElementById("edsx_" + i);

// 삭제는 소프트(F-106) — del 표시만 하고 목록엔 남긴다. '보내는 목록'은 이 함수로.
function edClipsEff(){ return edForm.clips.filter(c => !c.del); }

// edit_overrides/v3 전환 플래그 — 켜기 전 조건(0054 적용 + 전 노드 엔진 v3)은 0054
// 머리말의 체크리스트. 꺼지면 화면이 앵커를 안 보낼 뿐 — 서버 라운드 승계(0053)에
// 이미 앵커가 남은 작품의 재제출은 계속 v3 로 나간다(내용 기반). 플래그는 롤백이 아니다.
const edV3 = () => (((state.ops||{}).editor_v3||{}).value === "on");
// 이미지 오버레이(F-408) 플래그 — 켜기 전 조건: 엔진 이미지 합성(E2) 전 노드 배포 +
// submit_editor_render 의 images 거절 해제 마이그레이션 + **editor_v3 도 on**
// (이미지는 v3 스탬프를 유발하고, 스테이지 배치 도구(✎)가 v3 게이트 뒤에 있다).
// 그 전에 켜면 업로드·배치는 되지만 보내기가 서버에서 거절된다(0054 fail-loud).
const edImagesOn = () => (((state.ops||{}).editor_images||{}).value === "on");
// 회전(F-410) 플래그 — 켜기 전 조건: 엔진 69e5c06 전 노드 배포(0058 머리말).
// dc1060f 는 images 의 rotate 를 조용히 무시한다(회전 없이 나감) — 그래서 게이트.
// 플래그는 롤백이 아니다(editor_v3 와 동일): 이미 회전이 실린 카드의 재제출·서버
// 승계는 계속 rotate 를 흘린다 — 끄는 것은 새 회전 편집을 막을 뿐이다.
const edRotOn = () => (((state.ops||{}).editor_rotate||{}).value === "on");

// v3 에서 주의가 필요한 자막들 — 앵커 없는 줄(구간과 함께 보내면 옛 시간축 그대로)과
// 앵커 장면이 구간에서 빠진 줄(엔진이 옆 장면에 스냅해 렌더). 둘 다 막지 않고 알린다.
function edSubAnchorless(){
  const out = [];
  edForm.dSubs.forEach((s, i) => {
    // pin(시각 고정) 줄도 앵커 없이 나간다 — 단 이쪽은 사람이 의도한 고정이다
    if (!s.del && String(s.text).trim() && (s.src == null || s.pin)) out.push(i); });
  return out;
}
function edSubOrphans(){
  const out = [];
  edForm.dSubs.forEach((s, i) => {
    if (s.del || !String(s.text).trim() || s.src == null || s.pin) return;
    if (!edForm.clips.some(c => !c.del && s.src >= c.start - 0.5 && s.src <= c.end + 0.5))
      out.push(i); });
  return out;
}

// 이미지가 이전 라운드(images0)와 달라졌는가 — 안 달라졌으면 키를 생략해 승계에
// 맡긴다(불필요한 전량 교체 방지). 전량 삭제는 빈 배열로 표현된다(0057 규약).
function edImagesChanged(){
  const sig = m => [m.key, +(+m.src).toFixed(3), +(+m.dur).toFixed(3),
                    +(+m.x).toFixed(4), +(+m.y).toFixed(4), +(+m.w).toFixed(4),
                    Math.trunc(+m.layer) || 0,              // undefined 와 0 은 같다(기본)
                    Math.round(+m.rotate) || 0].join("|");
  const a = (edForm.images || []).filter(m => !m.del).map(sig);
  const b = (edForm.images0 || []).map(sig);
  return a.length !== b.length || a.some((v, i) => v !== b[i]);
}

// 구간이 원본과 달라졌는가 — 개수·순서·시각·역할·삭제 중 하나라도 다르면 참.
function edClipsChanged(){
  const a = edClipsEff(), b = edForm.clips0;
  if (a.length !== b.length) return true;
  return a.some((c, i) => Math.abs(c.start - b[i].start) > 0.001
                       || Math.abs(c.end - b[i].end) > 0.001 || c.role !== b[i].role);
}

// ── undo/redo (F-104) ─────────────────────────────────────────────────
function edSnapJson(){
  // in/out 마크 포함 — ＋구간 추가가 마크를 소비하므로, undo 가 마크까지 돌려줘야
  // '재생하며 I→O→추가' 를 다시 찍지 않는다.
  return JSON.stringify({ dTitle: edForm.dTitle, dSubs: edForm.dSubs,
                          clips: edForm.clips, tts: edForm.tts, design: edForm.design,
                          images: edForm.images || [],
                          in: edForm.in, out: edForm.out });
}
// 고치기 **직전**에 부른다. 타이핑은 같은 묶음(tag) 0.8초당 1회 — 스냅샷이 글자
// 단위로 쌓이면 Cmd+Z 가 한 글자씩 물러나 쓸모가 없다.
function edSnap(tag){
  if (!edForm) return;
  const now = Date.now();
  if (tag && tag === edSnapTag && now - edSnapAt < 800){ edSnapAt = now; return; }
  edSnapTag = tag || ""; edSnapAt = now;
  const j = edSnapJson();
  if (edUndo[edUndo.length - 1] === j) return;     // 무변화 — 스택을 더럽히지 않는다
  edUndo.push(j);
  if (edUndo.length > 100) edUndo.shift();
  edRedo.length = 0;
}
function edRestoreSnap(j){
  const s = JSON.parse(j);
  edForm.dTitle = s.dTitle; edForm.dSubs = s.dSubs; edForm.clips = s.clips;
  edForm.tts = s.tts; edForm.design = s.design;
  edForm.images = s.images || [];
  edForm.in = s.in ?? null; edForm.out = s.out ?? null;
  edSel = Math.min(edSel, edForm.clips.length - 1);
  edTtsSel = Math.min(edTtsSel, edForm.tts.length - 1);
  edSnapTag = "";                                   // 다음 타이핑은 새 묶음
  render();                                         // 렌더 꼬리의 edMark 가 dirty·저장 갱신
}
// pop 이 현재 상태와 같으면(입력하다 만 스냅샷 등) 건너뛴다 — 'Cmd+Z 가 씹힌다' 방지
function edPopDiff(stack, cur){
  while (stack.length){
    const j = stack.pop();
    if (j !== cur) return j;
  }
  return null;
}
window.edUndoOp = () => {
  const cur = edSnapJson(), j = edPopDiff(edUndo, cur);
  if (j == null){ toast("되돌릴 것이 없습니다", true); return; }
  edRedo.push(cur); edRestoreSnap(j);
};
window.edRedoOp = () => {
  const cur = edSnapJson(), j = edPopDiff(edRedo, cur);
  if (j == null){ toast("다시 할 것이 없습니다", true); return; }
  edUndo.push(cur); edRestoreSnap(j);
};

// 내레이션 원본 행 — 좌표(src)가 곧 신원이므로 인덱스가 아니라 src 로 찾는다
// (새 행이 중간에 끼면 인덱스 비교는 모든 뒷줄을 엉뚱한 원본과 대조하게 된다).
function edTts0For(t){
  return edForm.tts0.find(o => Math.abs(o.src - t.src) < 0.0005);
}

// 내레이션이 원본과 달라졌는가 — 삭제·신규·문구·목소리·창 중 하나라도.
function edTtsChanged(){
  if (edForm.tts.length !== edForm.tts0.length) return true;
  return edForm.tts.some(t => {
    if (t.del || t.isNew) return true;
    const o = edTts0For(t);
    return !o || t.text !== o.text || t.voice !== o.voice
        || Math.abs(t.dur - o.dur) > 0.001;
  });
}

// 내레이션의 원본 장면이 지금 구간 목록에서 빠져 있는가 — 그대로 두면 옆 장면 위에서
// 재생된다(엔진 스냅 규칙). 화면이 미리 경고할 수 있는 유일한 지점이다.
function edTtsOrphan(t){
  return !edForm.clips.some(c => !c.del && t.src >= c.start - 0.5 && t.src <= c.end + 0.5);
}

// 화면의 현재 값 → 오버라이드. 고치지 않은 항목은 **키 자체를 뺀다** — 자막을 안 건드렸는데
// subtitles 를 보내면 엔진이 전량 교체로 받아 재매핑 결과를 사람 값으로 못박아 버린다.
// forDraft(초안 저장 전용): 삭제 행을 del 마커로 **포함**한다 — 초안이 del 을 못 담으면
// 재입장에서 소프트 삭제가 하드 삭제·부활로 갈라진다. 엔진에 가는 제출 경로는 항상 필터.
function edCollect(forDraft){
  if (!edForm) return {};
  const ov = {}, t = edForm.dTitle;
  if (t != null && t.trim() && t !== edForm.title) ov.title = { top_title: t };
  const clipsDirty = edClipsChanged();
  if (clipsDirty && (forDraft ? edForm.clips.length : edClipsEff().length))
    ov.clips = (forDraft ? edForm.clips : edClipsEff()).map(c => {
      const o = { start_sec: +c.start.toFixed(3), end_sec: +c.end.toFixed(3), role: c.role };
      if (forDraft && c.del) o.del = true;
      return o;
    });
  // 구간을 바꾸면 자막은 보내지 않는다(v2 까지) — 엔진이 새 구간에 맞춰 대사에서 다시
  // 매핑하는데, 옛 편집본 시간축 자막을 함께 보내면 전량 교체라 시각이 통째로 어긋난다.
  // v3 플래그가 켜지면 앵커(source_time_sec — editor_assets 가 내려준 src 그대로)가
  // 좌표를 지키므로 같이 보낼 수 있다(ai-video docs/edit_overrides_v3.md).
  if (!clipsDirty || edV3()){
    // 줄 스타일 비교는 키 순서 무관 정규화로 — JSON 직렬화 순서가 다르면(서버 타임라인
    // vs 초안 재조립) 값이 같아도 영구 dirty 가 된다.
    const edStyleSig = st => !st ? ""
      : [st.size ?? "", st.y ?? "", st.color ?? "",
         Math.round(+st.rotate) || ""].join("|");   // 0 과 없음은 같다(기본)
    const dirty = edForm.dSubs.length !== edForm.subs.length
      || edForm.dSubs.some((s, i) => s.del || s.text !== edForm.subs[i].text
                                  || Math.abs(s.start - edForm.subs[i].start) > 0.001
                                  || Math.abs(s.end - edForm.subs[i].end) > 0.001
                                  || edStyleSig(s.style) !== edStyleSig(edForm.subs[i].style));
    if (dirty)
      ov.subtitles = edForm.dSubs
        .filter(s => forDraft || !s.del)
        .map((s, i) => { const o = { start_sec: +Number(s.start).toFixed(3),
                                end_sec: +Number(s.end).toFixed(3), text: s.text };
                    if (forDraft && s.del) o.del = true;
                    // i0 = 원본 줄 신원(초안 전용) — 시각 매칭 복원은 타이밍 편집에 깨진다
                    if (forDraft && !s.added) o.i0 = i;
                    // pin(시각 고정, V3-b) = 앵커를 빼고 보낸다 — 계약상 앵커 없는
                    // 줄은 start_sec 그대로 박힌다(사람이 트랙에서 정한 시각이 정본)
                    if (edV3() && s.src != null && !s.pin)
                      o.source_time_sec = +Number(s.src).toFixed(3);
                    if (forDraft && s.pin) o.pin = true;
                    // 줄 스타일(F-407·F-410) — 아는 키만 정제해 싣는다(v3 계약).
                    // 플래그 게이트를 안 건다: 전량 교체 규약이라 여기서 빼면 스타일이
                    // 이미 있는 카드의 재제출이 스타일을 조용히 벗긴다. 새 편집만 UI 게이트.
                    if (s.style){
                      const st = {};
                      if (s.style.size != null) st.size = Math.round(+s.style.size);
                      if (s.style.y != null) st.y = +(+s.style.y).toFixed(4);
                      if (s.style.color) st.color = String(s.style.color);
                      // rotate: 있는 값은 그대로 통과(0 은 뺀다 — 기본값) — 새 생성은
                      // UI 게이트(edRotOn). 구 엔진엔 fail-loud 라 조용한 오render 없음
                      if (s.style.rotate != null && Math.round(+s.style.rotate))
                        st.rotate = Math.max(-180, Math.min(180, Math.round(+s.style.rotate)));
                      if (Object.keys(st).length) o.style = st;
                    }
                    return o; })
        .filter(x => forDraft || String(x.text).trim());
  }
  // 내레이션 — 전량 교체(빈 배열 = 전부 삭제). 자막과 달리 구간과 같이 보내도 된다:
  // 좌표가 원본 절대초라 구간이 바뀌어도 안 흔들린다(엔진이 최종 타임라인 기준으로 변환).
  if (edTtsChanged())
    ov.tts = edForm.tts.filter(t => !t.del && String(t.text).trim())
      .map(t => ({ source_time_sec: +Number(t.src).toFixed(3),
                   duration_sec: +Number(t.dur).toFixed(3),
                   voice: t.voice, text: String(t.text).trim() }));
  // 이미지(F-408) — 신원은 스토리지 key. 제출은 key 만 보낸다(어댑터가 run_dir 파일로
  // 치환, 엔진 계약의 file 은 거기서 생긴다). name·del 은 화면 상태라 초안에만.
  // 초안(forDraft)은 플래그와 무관하게 싣는다 — 플래그가 꺼진 새로고침 한 번에 자동
  // 저장이 이미지 없는 초안을 덮어쓰면 업로드 기록이 소리 없이 사라진다.
  // 달라졌을 때만 싣는다(이전 라운드 그대로면 키 생략 = 승계) — 전량 삭제는 빈 배열
  // (0057 규약. 키 생략이면 승계가 이전 이미지를 되살려 삭제가 영영 불가능해진다).
  if ((edImagesOn() || forDraft) && edImagesChanged()){
    const rows = forDraft ? (edForm.images || [])
                          : (edForm.images || []).filter(m => !m.del);
    ov.images = rows.map(m => {
        const o = { key: m.key, source_time_sec: +Number(m.src).toFixed(3),
                    duration_sec: +Number(m.dur).toFixed(3),
                    x: +Number(m.x).toFixed(4), y: +Number(m.y).toFixed(4),
                    w: +Number(m.w).toFixed(4) };
        if (m.layer != null && m.layer !== "") o.layer = Math.trunc(+m.layer) || 0;
        if (m.rotate != null && Math.round(+m.rotate))
          o.rotate = Math.max(-180, Math.min(180, Math.round(+m.rotate)));
        if (forDraft){ o.name = m.name || ""; if (m.del) o.del = true; }
        return o;
      });
  }
  if (edForm.design && Object.keys(edForm.design).length){
    ov.design = { ...edForm.design };
    // 이중 안전(H2): 플래그 전엔 신 키를 절대 내보내지 않는다 — 구 어댑터 즉사 방지
    if (!edImagesOn()) delete ov.design.title_y_fixed;
    if (!Object.keys(ov.design).length) delete ov.design;
  }
  return ov;
}

// 입력할 때마다 '무엇이 달라졌는지'를 화면에 반영 — 전량 교체라 서버에 보낸 뒤에는
// 어느 줄을 고쳤는지 알 수 없다. 고친 줄은 테두리로, 비운 줄은 취소선으로 보여준다.
// 초안 자동 저장(0044) — 고치다 나가도 남는다. 입력할 때마다 보내면 타이핑마다 왕복이라
// 1.5초 쉬면 한 번 보낸다. 저장 성공 시각을 화면에 적어 '남았는지'를 눈으로 확인시킨다.
let edSaveTimer = null, edSavedAt = null;
function edQueueSave(){
  // sent: 제출 성공 후 잔류 화면 — 0047 이 방금 지운 초안을 자동 저장이 1.5초 뒤
  // 되살리면, 같은 run_id 를 재사용하는 새 카드에 낡은 편집이 이중 적용된다.
  if (!edForm || edForm.sent || !edData || !edData.run_id) return;
  clearTimeout(edSaveTimer);
  edSaveTimer = setTimeout(async () => {
    const ov = edCollect(true);
    const { error } = await sb.rpc("save_editor_draft",
      { p_run_id: edData.run_id, p_draft: Object.keys(ov).length ? ov : null });
    const el = document.getElementById("edsaved");
    if (error){ if (el) el.textContent = "초안 저장 실패 — " + error.message; return; }
    edSavedAt = new Date();
    if (el) el.textContent = Object.keys(ov).length
      ? `초안 저장됨 ${edSavedAt.toLocaleTimeString("ko-KR")}` : "";
  }, 1500);
}

// 한국어 TTS 대략치(자/초) — fit 게이지 표시용. 실제 fit 은 엔진이 mp3 실측으로 한다.
const ED_TTS_CHARS_PER_SEC = 5.5;
const edTtsEst = txt => String(txt || "").replace(/\s/g, "").length / ED_TTS_CHARS_PER_SEC;

window.edMark = () => {
  if (!edForm) return;
  const te = edTitleEl();
  if (te){
    edForm.dTitle = te.value;
    te.classList.toggle("dirty", te.value !== edForm.title);
  }
  edForm.dSubs.forEach((s, i) => {
    const el = edSubEl(i); if (!el) return;
    s.text = el.value;
    const orig = edForm.subs[i];
    el.classList.toggle("dirty", !orig || el.value !== orig.text);
    el.classList.toggle("empty", !el.value.trim());
  });
  edForm.tts.forEach((t, i) => {
    const el = document.getElementById("edtx_" + i); if (!el) return;
    t.text = el.value;
    const orig = edTts0For(t);
    el.classList.toggle("dirty", t.isNew || !orig || el.value !== orig.text);
    el.classList.toggle("empty", !el.value.trim());
    // 창 길이 대비 예상 발화 길이 — 넘치면 엔진이 뜻을 지키며 줄여 재합성한다는 예고
    const e = edTtsEst(t.text), over = e > t.dur;
    const bar = document.getElementById("edtfb_" + i);
    if (bar){ bar.style.width = Math.min(100, e / t.dur * 100) + "%";
              bar.classList.toggle("over", over); }
    const lab = document.getElementById("edtfl_" + i);
    if (lab) lab.innerHTML = over
      ? `예상 ${e.toFixed(1)}s <span class="fitnote">— 창(${t.dur.toFixed(1)}s)보다 길어 AI가 줄여 다시 씁니다</span>`
      : `예상 ${e.toFixed(1)}s / 창 ${t.dur.toFixed(1)}s`;
  });
  const ov = edCollect();
  const bits = [ov.title ? "제목" : null, ov.clips ? "구간" : null,
                ov.subtitles ? "자막" : null, ov.tts ? "내레이션" : null,
                ov.images ? "이미지" : null,
                ov.design ? "스타일" : null].filter(Boolean);
  const btn = document.getElementById("edsubmit");
  if (btn){
    btn.disabled = !bits.length;
    btn.textContent = bits.length
      ? `✏️ 고친 내용으로 다시 렌더 (${bits.join("·")})` : "✏️ 고친 내용으로 다시 렌더";
  }
  edQueueSave();
};

// 편집실 구간 상한 = 쇼츠 성립 한계(3분) — 60초는 자동 생성물의 정책이지 사람의
// 한계가 아니다(엔진도 pinned 구간은 179.7초까지 그대로 렌더한다, 2026-08-19).
// 이 값을 넘으면 YouTube 가 쇼츠로 분류하지 않으므로 발행 흐름이 깨진다 — 막는다.
const ED_MAX_TOTAL_SEC = 179.7;

window.edSubmit = async () => {
  // 전 구간 소프트 삭제 상태는 '구간 변경 없음'으로 조용히 무시된다 — 화면(0개)과
  // 결과(원본 구간 그대로)가 갈라지므로 자막의 전량 삭제 차단과 같은 급으로 막는다.
  if (edForm && edForm.clips.length && !edClipsEff().length){
    toast("구간이 전부 삭제돼 있습니다 — 이대로 보내면 구간 변경이 반영되지 않습니다. 되살리거나 새로 추가하세요", true);
    return;
  }
  const ov = edCollect();
  if (!Object.keys(ov).length){ toast("고친 내용이 없습니다", true); return; }
  if (ov.subtitles && !ov.subtitles.length){
    toast("자막을 전부 지울 수는 없습니다 — 자막 없이 가려면 검수에서 반려하세요", true); return;
  }
  // 내레이션은 빈 배열이 유효하다(전부 삭제) — 단 실수일 수 있으니 한 번 확인.
  if (ov.tts && !ov.tts.length
      && !window.confirm("내레이션을 전부 삭제한 채 다시 렌더합니다 — 음성도 하늘색 자막도 모두 빠집니다. 계속할까요?"))
    return;
  // 이미지도 같은 규약(빈 배열 = 전부 삭제, 0057) — 같은 급의 확인
  if (ov.images && !ov.images.length
      && !window.confirm("이미지를 전부 삭제한 채 다시 렌더합니다. 계속할까요?"))
    return;
  if (ov.clips){
    // 필드명은 오버라이드 계약 그대로(start_sec/end_sec) — 종전 c.end/c.start 는
    // undefined 비교·NaN 합계라 이 두 검증이 한 번도 동작한 적이 없었다.
    const bad = ov.clips.find(c => c.end_sec <= c.start_sec);
    if (bad){ toast("끝이 시작보다 앞인 구간이 있습니다", true); return; }
    const total = ov.clips.reduce((a,c) => a + (c.end_sec - c.start_sec), 0);
    if (total > ED_MAX_TOTAL_SEC){
      toast(`구간 합계 ${total.toFixed(1)}초 — 쇼츠 한계(3분)를 넘으면 쇼츠로 발행되지 않습니다. ${ED_MAX_TOTAL_SEC}초 이하로 줄여주세요`, true);
      return;
    }
    // v3 동시 제출의 함정(막지 않고 확인만): 앵커 없는 줄은 옛 시간축 그대로 박힌다
    if (ov.subtitles){
      const nA = ov.subtitles.filter(s => s.source_time_sec == null).length;
      if (nA && !window.confirm(
        `앵커 없는 자막 ${nA}줄이 구간 변경과 함께 나갑니다 — 이 줄들은 옛 시간축 시각 ` +
        `그대로 박혀 어긋날 수 있습니다(자막 탭 경고 참고). 이대로 보낼까요?`)) return;
    }
  }
  const btn = document.getElementById("edsubmit");
  if (btn){ btn.disabled = true; btn.textContent = "보내는 중…"; }
  const r = await rpc("submit_editor_render",
    { p_review_id: edRid, p_overrides: ov, p_note: null },
    "다시 렌더합니다 — 끝나면 새 검수 카드가 올라옵니다(수십 초~수 분)");
  if (r){
    // 편집실에 남는다(F-301) — 진행 스트립이 이 화면에 뜨고, 새 카드가 오면 바로 잇는다
    edTtsStop();
    edForm.sent = true;                      // 자동 저장 차단 — 초안 부활 방지
    const wo = ((state.reviews||[]).find(x => x.id === edRid) || {}).work_order_id;
    edChain = { rid: edRid, woId: wo,
                kind: (ov.clips || ov.tts) ? "resources" : "render", jobs: {} };
    render();                                // 렌더 꼬리가 폴링을 시작한다
  }
  else if (btn) edMark();
};

// 일본어 편집 대상 판정 — SHOTCONE(scene_rerender 카드)·잔망루피(LOOPY)
function edJpKind(r){
  const pay = (r || {}).payload || {};
  if (pay.zanmang_video_id) return "loopy";
  if ((r || {}).kind === "localization_qa" && pay.mode === "scene_rerender") return "shotcone";
  return null;
}

window.openEditor = async (rid) => {
  edRid = rid; edData = null; edForm = null; tab = "edit";
  edPrevImages = [];
  // 일본어 카드(JP-1) — 재료 RPC(request_editor_assets)를 부르지 않는다: LOOPY 는
  // 작업지시가 없어 거절되고, SHOTCONE 도 텍스트 편집에는 카드 payload 로 충분하다.
  clearTimeout(edJpTimer);
  const r0 = (state.reviews || []).find(x => x.id === rid);
  edJpMode = edJpKind(r0);
  if (edJpMode){
    edTtsStop();                       // KR 미리듣기 오디오가 JP 화면 위로 남지 않게
    clearTimeout(edPoll);              // KR 재료 폴링 잔존이 5초마다 render 로 입력을 지운다
    if (!edJpChain || edJpChain.rid !== rid) edJpChain = null;   // 같은 카드 재진입만 유지
    edJpResetForm(r0);
    // 자막 쌍 없이 제목만 있는 카드(LOOPY A 라우트 등)는 제목 탭이 첫 화면
    edJpPane = edJpForm.subs.length ? "subs" : "title";
    if (edJpChain) edJpForm.sent = true;   // 이미 보낸 카드 — 재진입이 이중 제출 폼을 열면 안 된다
    render();
    if (edJpChain) edJpChainPoll();
    return;
  }
  edJpForm = null;
  edZoom = 1; edTlScroll = 0; edKbHelp = false;
  edStageMode = "prev"; edSeq = null; edPrevKey = null; edPrevBucket = null; edPrevT = 0;
  edStyleTool = false; edStageCur = -1; edStageT = 0;
  edPrevWarned = false; edSubColorFor = -1; edOvSel = "sub"; edOutSel = null;
  edTtsStop();
  // 같은 카드 재진입이면 체인 상태를 지키고(스트립·잠금·새 카드 감지), 다른 카드면 버린다
  if (!edChain || edChain.rid !== rid){ edChain = null; clearTimeout(edChainTimer); }
  render();
  try {
    const r = await sb.rpc("request_editor_assets", { p_review_id: rid });
    if (r.error) throw r.error;
    // 이전 라운드 이미지(0057) — 이 run 의 최신 generate 오버라이드. 화면에 보여야
    // '지우기'가 성립한다(키 생략 = 승계라, 안 보이면 영영 못 지운다).
    edPrevImages = Array.isArray((r.data || {}).prev_images) ? r.data.prev_images : [];
    edLoadAssets((r.data || {}).run_id);
  } catch (e){
    edData = { error: e.message || String(e) }; render();
  }
};

async function edLoadAssets(runId){
  if (edJpMode) return;              // JP 화면 진입 후 도착한 잔존 폴 — render 오염 금지
  if (!runId || edLoading) return;
  edLoading = true;
  try {
    const { data, error } = await sb.from("editor_assets")
      .select("*").eq("run_id", runId).maybeSingle();
    if (error) throw error;
    edData = data || { status: "pending", run_id: runId };
    // 준비 중이면 폴링 — 4시간물 스프라이트는 수십 초 걸린다
    if (edData.status === "pending"){
      clearTimeout(edPoll);
      edPoll = setTimeout(() => { edLoading = false; edLoadAssets(runId); }, 5000);
    }
  } catch (e){
    edData = { error: e.message || String(e) };
  } finally {
    if (!edData || edData.status !== "pending") edLoading = false;
    render();
  }
}

const edFmt = s => {
  s = Math.max(0, Math.round(Number(s) || 0));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? String(h).padStart(2,"0") + ":" : "") +
         String(m).padStart(2,"0") + ":" + String(x).padStart(2,"0");
};

// 원본 시각 → 스프라이트 시트 좌표. 어댑터 sprite_layout 과 같은 규약(n = t/interval).
function edTile(sp, t){
  const iv = sp.interval || 10, g = sp.grid || 10, per = g*g;
  const n = Math.floor(t / iv);
  const keys = ((sp.assets||{}).global) || [];
  const sheet = Math.floor(n / per);
  if (sheet >= keys.length) return null;
  return { key: keys[sheet], col: n % g, row: Math.floor((n % per) / g),
           w: sp.thumb_w || 160 };
}

async function edPaintThumb(el, sp, t){
  const tile = edTile(sp, t);
  if (!el || !tile){ if (el) el.style.background = "var(--surface-2)"; return; }
  try {
    const url = await signedUrl("ves-outputs", tile.key, 1800);
    const g = sp.grid || 10, w = tile.w, h = Math.round(w * 9 / 16);
    el.style.backgroundImage = `url("${url}")`;
    el.style.backgroundSize = `${w*g}px ${h*g}px`;
    el.style.backgroundPosition = `-${tile.col*w}px -${tile.row*h}px`;
  } catch(e){ /* 서명 실패는 조용히 — 타임라인 자체는 계속 쓴다 */ }
}

// ───────── 일본어 편집 모드 (JP-1) — localization_qa 카드 전용 ─────────
// 검수함 인라인 패널(0038)의 승격판: 좌측에 일본어 완성본 스테이지, 우측에 한국어
// 원문 병기 번역 편집. 계약은 reject_and_rerender p_edits(idx 좌표 텍스트 치환,
// diff 만 전송) 그대로 — 서버·엔진 무변경. 타이밍·스타일·구간 편집은 JP-2(엔진이
// idx↔타임라인 매핑을 내보낸 뒤)의 몫이라 여기선 문구만 받는다.
function edJpResetForm(r){
  const pay = (r || {}).payload || {}, pr = pay.ko_ja_pairs || {};
  edJpForm = {
    rid: r.id, loopy: edJpMode === "loopy",
    woId: r.work_order_id || null, vid: pay.zanmang_video_id || null,
    prevKey: pay.preview_key || null, prevBucket: pay.bucket || "ves-localized",
    url: pay.url || null,                        // LOOPY A 라우트 — 파일 없이 원본 링크 검수
    // cur = 사람이 지금 만지는 값 — DOM 에만 두면 render() 한 번에 타이핑이 전량
    // 증발한다(KR 의 edForm 과 같은 이유). 원본(ja)과 따로 들어야 diff 도 성립한다.
    title: pay.youtube_title || "", titleKo: pay.youtube_title_ko || "",
    titleCur: pay.youtube_title || "",
    top: (pr.top_title || {}).ja || "", topKo: (pr.top_title || {}).ko || "",
    topCur: (pr.top_title || {}).ja || "",
    subs: (pr.subs || []).map((x, i) => ({ idx: x.idx != null ? x.idx : i,
                                           ja: x.ja || "", ko: x.ko || "", cur: x.ja || "" })),
    tts: (pr.tts || []).map((x, i) => ({ idx: x.idx != null ? x.idx : i,
                                         ja: x.ja || "", ko: x.ko || "", cur: x.ja || "" })),
    // idx 없는 옛 텔롭은 좌표 특정 불가 — 0038 패널과 같은 이유로 편집에서 뺀다
    telops: (pr.telops || []).filter(x => x.idx != null)
                             .map(x => ({ idx: x.idx, ja: x.ja || "", ko: x.ko || "",
                                          cur: x.ja || "" })),
    note: "", sent: false,
  };
}

// 우측 패널(탭) — KR 편집실과 같은 구성. 렌더 내용이 아니라 번역 텍스트가 대상이라

    : `<div class="jprows">${list.map(s => `
        <div class="jprow"><span class="n">${s.idx + 1}</span>

            <input type="text" id="${pfx}${s.idx}" oninput="edJpMark()" ${canEdit ? "" : "disabled"}>
            <div class="ko">${esc(s.ko)}</div>
          </div></div>`).join("")}</div>`;
  if (edJpPane === "title") return `
    <div class="edcap">업로드 제목 <span class="sub">— YouTube 제목</span></div>
    <input type="text" id="jptitle" oninput="edJpMark()" ${canEdit ? "" : "disabled"}
      style="width:100%">

// 고친 항목만 diff — 0038 계약(reject_and_rerender p_edits) 규약. 빈 값은 무시.
// DOM 이 아니라 폼(cur)을 읽는다 — 렌더 직후·재그림 뒤에도 값이 산다.
function edJpCollect(){
  const f = edJpForm, ed = {};
  if ((f.titleCur || "").trim() && f.titleCur.trim() !== f.title)
    ed.youtube_title_ja = f.titleCur.trim();
  if ((f.topCur || "").trim() && f.topCur !== f.top) ed.top_title_ja = f.topCur;
  const diff = (list, asObj) => {
    const out = {};
    list.forEach(s => {
      const v = (s.cur || "").trim();
      if (v && v !== s.ja) out[s.idx] = asObj ? { ja: v } : v;
    });
    return out;
  };
  const subs = diff(f.subs), tts = diff(f.tts), tel = diff(f.telops, true);
  if (Object.keys(subs).length) ed.subs = subs;
  if (Object.keys(tts).length) ed.tts = tts;
  if (Object.keys(tel).length) ed.telops = tel;
  return ed;
}

window.edJpMark = () => {
  const f = edJpForm; if (!f) return;
  // 입력 → 폼 즉시 저장 + dirty 표시. 저장 없이 DOM 에만 두면 탭 전환·재렌더 한 번에
  // 고친 번역이 전부 사라진다.
  const grab = (id, orig, save, keepNl) => {
    const el = document.getElementById(id); if (!el) return;
    save(el.value);
    const same = keepNl ? el.value === orig : el.value.trim() === orig;
    el.classList.toggle("dirty", !same && !!el.value.trim());
  };
  grab("jptitle", f.title, v => f.titleCur = v);
  grab("jptop", f.top, v => f.topCur = v, true);
  f.subs.forEach(s => grab("jps_" + s.idx, s.ja, v => s.cur = v));
  f.tts.forEach(s => grab("jpn_" + s.idx, s.ja, v => s.cur = v));
  f.telops.forEach(s => grab("jpl_" + s.idx, s.ja, v => s.cur = v));
  const n = Object.keys(edJpCollect()).length;
  const btn = document.getElementById("jpsubmit");
  if (btn){
    // sending: 제출 왕복 중 탭 전환이 푸터를 새로 그려도 버튼이 부활하면 안 된다
    btn.disabled = !n || !!f.sending;
    btn.textContent = f.sending ? "보내는 중…"
      : n ? `✏️ 고친 내용으로 다시 렌더 (${n}가지)` : "✏️ 고친 내용으로 다시 렌더";
  }
};

window.edJpSubmit = async () => {
  const f = edJpForm; if (!f) return;
  const ed = edJpCollect();
  if (!Object.keys(ed).length){ toast("고친 내용이 없습니다", true); return; }
  const note = (f.note || "").trim() || null;   // 탭 전환에도 살아 있는 폼 값
  f.sending = true;
  edJpMark();                                   // 버튼 잠금 — 렌더를 타도 유지된다
  const res = await rpc("reject_and_rerender",
    { p_review_id: f.rid, p_edits: ed, p_note: note },
    `반려 — 고친 ${Object.keys(ed).length}가지로 다시 렌더합니다`);
  f.sending = false;
  if (!res){ edJpMark(); return; }
  f.sent = true;
  // 폴 좌표는 체인에 실어 둔다 — 현재 edJpForm 을 읽으면 다른 카드로 옮긴 뒤
  // in-flight 폴이 오염된 쿼리로 영구 폴링한다(리뷰 5). 멱등키는 0038 SQL 이 정본:
  // LOOPY = 'zanmang_rerender:'||vid||':'||review_id, SHOTCONE = 'rerender:'||review_id.
  edJpChain = { rid: f.rid, vid: f.vid, woId: f.woId,
                startedAt: Date.now(), sinceIso: new Date().toISOString(),
                newRid: null, failed: false, job: null,
                key: f.loopy ? `zanmang_rerender:${f.vid}:${f.rid}` : `rerender:${f.rid}` };
  render();
};

function edJpChainHtml(){
  const c = edJpChain;
  const j = c.job || {};
  const st = c.newRid ? "새 카드 도착"
    : c.failed ? "실패 — 잡 탭에서 오류를 확인하세요"
    : j.status === "running" ? "렌더 중…"
    : j.status === "succeeded" ? "렌더 완료 — 새 카드 등록 대기"
    : "대기 중…";
  return `<div class="edwarn" style="margin-top:10px">수정 재렌더 진행: <b>${esc(st)}</b>
    <span class="sub">(${Math.round((Date.now() - c.startedAt) / 60000)}분 경과${
      edJpForm && edJpForm.loopy ? " — 잔망루피는 전체 재실행이라 오래 걸립니다" : ""})</span>
    ${c.newRid ? `<button class="pri mini" onclick="edOpenNew('${c.newRid}')">새 카드 열기</button>` : ""}
  </div>`;
}

// 표적 폴링(무렌더) — render() 는 재생 중인 완성본 video 를 파괴한다(KR 체인과 같은 이유).
// 화면을 떠나면 쉬고(renderEditJp 꼬리가 복귀 시 재개), 좌표는 체인 자신의 것만 읽는다.
async function edJpChainPoll(){
  const c = edJpChain; if (!c || c.newRid || c.failed) return;
  clearTimeout(edJpTimer);
  if (tab !== "edit" || edRid !== c.rid) return;
  try {
    const { data: jobs } = await sb.from("job_queue").select("status,error")
      .eq("idempotency_key", c.key).order("created_at", { ascending: false }).limit(1);
    if (edJpChain !== c) return;             // 그 사이 다른 카드·제출로 교체됨
    c.job = (jobs || [])[0] || null;
    if (c.job && ["failed", "dead", "cancelled", "blocked"].includes(c.job.status))
      c.failed = true;                       // KR 체인과 같은 종결 어휘(blocked = 사람 개입)
    let q = sb.from("review_queue").select("id").eq("kind", "localization_qa")
      .eq("status", "waiting").neq("id", c.rid)
      .gt("created_at", c.sinceIso)          // 제출 이전부터 있던 카드를 새 카드로 오인 금지
      .order("created_at", { ascending: false }).limit(3);
    q = c.vid ? q.contains("payload", { zanmang_video_id: c.vid })
              : q.eq("work_order_id", c.woId);
    const { data: cards } = await q;
    if (edJpChain !== c) return;
    if ((cards || []).length) c.newRid = cards[0].id;
  } catch (e){ /* 폴링 실패는 다음 틱에 재시도 */ }
  const el = document.getElementById("jpchain");
  if (el) el.innerHTML = edJpChainHtml();
  if (!c.newRid && !c.failed) edJpTimer = setTimeout(edJpChainPoll, 8000);
}

  edMark();

  edOvSelSync();   // 템플릿은 '자막' 하드코딩 — 선택 상태를 렌더 직후 동기(마운트 대기 X)
  edMountStage();
  if (hasVideo) edMountSrc();
  if (sp.assets && sp.assets.wave) signedUrl("ves-outputs", sp.assets.wave, 1800)
    .then(u => { const w = document.getElementById("edwave"); if (w) w.src = u; }).catch(()=>{});
  edTlAfterRender();
  // 다른 탭에 갔다 오면 폴링 타이머가 죽어 있다 — 진행 중 체인이 있으면 재개
  if (edChain && edChain.rid === edRid && !edChain.newRid && !edChain.failed) edChainPoll();
  edPaintThumb(document.getElementById("edthumb"), sp, edCursor);
}

  return `<div class="sub" style="margin-bottom:6px">비워두면 채널 기본값을 그대로 씁니다 —
      이 편에만 적용됩니다.</div>
    <div class="edrows">${ED_STYLE_FIELDS.map(([k,l,ph]) => `
      <div class="edrow3"><label>${esc(l)}</label>
        <input id="edd_${k}" placeholder="${esc(base[k] != null ? "채널: " + base[k] : ph)}"
          ${canEdit?"":"disabled"} oninput="edStyleSet('${k}',this.value)"></div>`).join("")}</div>
    ${edDesign().title_y_fixed ? `<div class="sub" style="margin-top:6px">
      제목이 <b>고정 위치 모드</b>입니다(화면 드래그).
      <button class="mini" onclick="edTitleAutoY()"
        title="title_y·title_y_fixed 를 지우고 엔진 자동 배치(영상 위)로">자동 배치로 되돌리기</button></div>` : ""}
    <div class="sub" style="margin-top:8px">자막 줄별 위치·크기·색은 왼쪽 쇼츠 화면의
      ✎ 로 — 여기 값은 이 편 전체 기본값입니다. TTS 세로는 ✎ 드래그와 같은 값
      (하단 px)이고 모든 내레이션에 함께 적용됩니다.</div>`;
}

// ── 플레이어 ───────────────────────────────────────────────────────────
// 원본 시각 t 를 어느 소스로 볼지: 고화질 클로즈업 구간이면 그것, 아니면 전체 프리뷰.
// 어느 쪽이든 화면에 찍히는 시각은 **원본 절대초**다(offset 을 더해 되돌린다).
function edSourceAt(t){
  const med = ((edData.sprites||{}).assets||{}).media || {};
  for (const c of med.closeups || [])
    if (t >= c.start_sec && t <= c.end_sec)
      return { key: c.key, offset: c.start_sec, hq: true };
  return med.scan ? { key: med.scan, offset: 0, hq: false } : null;
}

// 원본 스크럽 플레이어(#edsrcv) — 원본 타임라인 아래 상설. 구간 찍기(I/O)의 좌표 기준.
let edCurSrc = null, edSeeking = false, edLoadGen = 0;
function edMountSrc(){
  const v = document.getElementById("edsrcv"); if (!v) return;
  v.ontimeupdate = () => {
    if (edSeeking) return;
    edCursorSet((edCurSrc ? edCurSrc.offset : 0) + v.currentTime, false);
  };
  v.onplay = () => {
    const b = document.getElementById("edplay"); if (b) b.textContent = "⏸";
    // 한쪽만 소리 낸다 — 원본을 재생하면 스테이지(완성본·시퀀스)를 멈춘다
    const stv = document.getElementById("edvid");
    if (stv && !stv.paused){ if (edSeq) edSeqStop(); else stv.pause(); }
  };
  v.onpause = () => { const b = document.getElementById("edplay"); if (b) b.textContent = "▶"; };
  edLoadSource(edCursor, false);
}

// 쇼츠 스테이지(#edvid) — prev: 완성본 mp4 그대로(F-201, 서버 작업 0),
// seq: 가상 시퀀스(F-202)가 원본 소스를 구간 순서대로 이어 연다.
let edStageSrcCur = null, edStageGen = 0, edStageSeeking = false;
async function edMountStage(){
  const v = document.getElementById("edvid"); if (!v) return;
  v.ontimeupdate = () => {
    if (edStageMode === "prev"){
      edPrevT = v.currentTime || edPrevT;              // 렌더 후 위치 복원용
      edStagePaint(v.currentTime);
      return;
    }
    // 파일 전환 로드 중의 틱은 구 파일 것 — 오프셋도 구간 인덱스도 어긋난 시각이라
    // 시퀀스를 죽이거나(뒤로 튐 판정) 구간을 건너뛴다. 로드가 끝날 때까지 삼킨다.
    if (!edSeq || edStageSeeking) return;
    edSeqTick((edStageSrcCur ? edStageSrcCur.offset : 0) + v.currentTime);
  };
  v.onplay = () => {
    // 한쪽만 소리 낸다 — 스테이지를 재생하면 원본 스크럽을 멈춘다
    const sv = document.getElementById("edsrcv"); if (sv) sv.pause();
  };
  // 구간이 closeup 파일 경계를 넘으면 파일이 구간 끝 전에 끝난다 — timeupdate 가 멎어
  // 시퀀스가 고착되므로 ended 를 '구간 끝 도달'로 친다.
  v.onended = () => {
    if (!edSeq || edStageMode !== "seq" || edStageSeeking) return;
    const { eff } = edEffList(), s = edSeq;
    if (s.k + 1 < eff.length){ s.k++; edStageLoad(eff[s.k].c.start, true); }
    else edSeqStop();
  };
  if (edStageMode === "prev" && edPrevKey){
    // 만료·404 preview 는 렌더마다 여기를 다시 지난다 — 경고는 카드당 1회만
    v.onerror = () => {
      if (edPrevWarned) return;
      edPrevWarned = true;
      toast("완성본을 열 수 없습니다(보존 만료일 수 있음) — ▶ 가상 미리보기로 확인하세요", true);
    };
    try {
      const url = await signedUrl(edPrevBucket || "ves-outputs", edPrevKey, 1800);
      if (v.src !== url || v.error) v.src = url;
      if (edPrevT > 0){
        const seekBack = () => { v.removeEventListener("loadedmetadata", seekBack);
                                 v.currentTime = edPrevT; };
        if (v.readyState > 0) seekBack(); else v.addEventListener("loadedmetadata", seekBack);
      }
    } catch (e){
      if (!edPrevWarned){ edPrevWarned = true; toast("완성본 열기 실패: " + e.message, true); }
    }
  }
  // seq 모드의 소스 로드는 edSeqStart·edSeqTick 이 edStageLoad 로 한다
  edStagePaint(edStageT);
}

// 스테이지 전용 소스 로더 — edLoadSource 와 같은 강화 패턴(세대표·메타데이터 대기·같은 URL
// 재대입 금지)이되, 원본 커서(edCursor)를 건드리지 않고 스테이지에만 연다.
async function edStageLoad(t, play){
  const v = document.getElementById("edvid"); if (!v || edStageMode !== "seq") return;
  const want = edSourceAt(t); if (!want) return;
  const gen = ++edStageGen;
  if (!edStageSrcCur || edStageSrcCur.key !== want.key || v.readyState === 0){
    // 파일 전환 — 구 파일이 로드 동안 계속 돌면 오프셋 어긋난 틱이 시퀀스를 오염시킨다
    edStageSeeking = true;
    v.pause();
    edStageSrcCur = null;
    let url;
    try { url = await signedUrl("ves-outputs", want.key, 3600); }
    catch(e){ if (gen === edStageGen){ toast("영상 열기 실패: " + e.message, true);
                                       edStageSeeking = false; } return; }
    if (gen !== edStageGen) return;
    if (v.src !== url || v.error) v.src = url;
    await new Promise(res => {
      const done = () => { v.removeEventListener("loadedmetadata", done); res(); };
      if (v.readyState > 0) return done();
      v.addEventListener("loadedmetadata", done);
      setTimeout(done, 15000);
    });
    if (gen !== edStageGen) return;
    if (v.readyState === 0){
      edStageSeeking = false;
      toast("영상 로드가 느립니다 — 잠시 후 다시 눌러 주세요", true);
      return;
    }
    edStageSrcCur = want;
    edStageSeeking = false;
  }
  if (gen !== edStageGen) return;
  v.currentTime = Math.max(0, t - want.offset);
  if (play) v.play().catch(()=>{});
}

// 시킹은 메타데이터가 온 뒤에만 유효하다 — readyState 0 인 video 에 currentTime 을 넣으면
// 브라우저가 그 시킹을 조용히 버린다. 종전 코드는 src 대입 직후 edCurSrc 를 기록해서,
// 로드가 끝나기 전의 재클릭이 "같은 소스"로 판정돼 로드 분기를 건너뛰고 죽은 시킹만 했다
// (타임라인 클릭 후 화면이 검게 멈추는 '먹통'의 정체). 그래서 ① edCurSrc 는 메타데이터가
// 실제로 온 뒤에만 기록하고, ② 세대표(edLoadGen)로 낡은 호출을 물러나게 한다 — 연타로
// 로드 두 개가 겹치면 뒤 클릭이 이기고 앞 클릭은 src 도 시킹도 건드리지 않는다.
async function edLoadSource(t, play){
  const v = document.getElementById("edsrcv"); if (!v) return;
  const want = edSourceAt(t);
  if (!want){ return; }
  const gen = ++edLoadGen;
  const nm = document.getElementById("edsrcname");
  if (!edCurSrc || edCurSrc.key !== want.key || v.readyState === 0){
    edSeeking = true;
    edCurSrc = null;                     // 로드 완료 전엔 '열린 소스 없음'
    let url;
    try { url = await signedUrl("ves-outputs", want.key, 3600); }
    catch(e){ if (gen === edLoadGen){ toast("영상 열기 실패: " + e.message, true); edSeeking = false; } return; }
    if (gen !== edLoadGen) return;
    // 같은 URL 이 이미 로드 중이면 src 재대입 금지 — 대입은 받던 것을 처음부터 다시 받는다.
    // 단 이전 로드가 에러로 죽었으면(v.error) 같은 URL 이라도 다시 대입해 되살린다.
    if (v.src !== url || v.error) v.src = url;
    await new Promise(res => {
      const done = () => { v.removeEventListener("loadedmetadata", done); res(); };
      if (v.readyState > 0) return done();
      v.addEventListener("loadedmetadata", done);
      setTimeout(done, 15000);           // scan 은 150~400MB — 종전 4초는 모자랐다
    });
    if (gen !== edLoadGen) return;
    if (v.readyState === 0){             // 타임아웃 — 시킹해봐야 버려지니 사실대로 알린다
      edSeeking = false;
      toast("영상 로드가 느립니다 — 잠시 후 다시 눌러 주세요", true);
      return;
    }
    edCurSrc = want;
    edSeeking = false;
  }
  if (gen !== edLoadGen) return;
  // fps 라벨은 재료 메타에서 — 구 재료엔 메타가 없다(scan_fps 는 0048 전, closeup_fps 는
  // 그 이전 전부). 폴백은 소스별: 프록시 scan 은 4fps 가 사실이고, 마스터 scan 은 fps
  // 미상이라 숫자를 뺀다. 클로즈업은 반대로 마스터 산출물의 24 가 사실이고, 구 프록시
  // 산출물은 기록된 24 가 거짓(4fps 프레임 복제)이라 4fps 로 바로잡는다.
  const med2 = (((edData.sprites||{}).assets||{}).media||{});
  if (nm) nm.textContent = want.hq
    ? (med2.closeup_fps ? `정밀 구간(${med2.closeup_fps}fps)`
       : med2.closeup_source === "proxy" ? "정밀 구간(4fps)"
       : "정밀 구간(24fps)")
    : med2.scan_fps ? `전체 훑기(${med2.scan_fps}fps)`
    : med2.source === "master" ? "전체 훑기"
    : "전체 훑기(4fps)";
  v.currentTime = Math.max(0, t - want.offset);
  if (play) v.play().catch(()=>{});
}

function edCursorSet(t, moveVideo){
  edCursor = Math.max(0, Number(t) || 0);
  const dur = Number((edData.timeline||{}).duration_sec) || 1;
  const cur = document.getElementById("edcur");
  if (cur) cur.style.left = (edCursor / dur * 100).toFixed(4) + "%";
  // 줌 상태에서 커서가 화면 밖으로 나가면 따라간다 — 단, 사용자가 방금(1.5초 내)
  // 일부러 팬했다면 쉰다. 재생 중 timeupdate 가 미니맵 드래그를 되끌어오면 안 된다.
  const tl = document.getElementById("edtl");
  if (tl && !edDrag && tl.scrollWidth > tl.clientWidth + 1 && Date.now() - edPanAt > 1500){
    const x = edCursor / dur * tl.scrollWidth;
    if (x < tl.scrollLeft + 8 || x > tl.scrollLeft + tl.clientWidth - 8){
      edProgScroll = true;
      tl.scrollLeft = Math.max(0, x - tl.clientWidth / 2);
    }
  }
  const lab = document.getElementById("edtime");
  if (lab) lab.textContent = edFmtMs(edCursor);
  edPaintThumb(document.getElementById("edthumb"), edData.sprites || {}, edCursor);
  if (moveVideo) edLoadSource(edCursor, false);
}

window.edSeek = t => edCursorSet(t, true);
window.edClickTl = ev => {
  // 좌표 기준은 뷰포트가 아니라 캔버스(edtlc) — 줌 상태에서도 클릭 시각이 맞는다
  const el = document.getElementById("edtlc") || document.getElementById("edtl");
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const dur = Number((edData.timeline||{}).duration_sec) || 1;
  edSeek((ev.clientX - rect.left) / rect.width * dur);
};
window.edToggle = () => {
  // 소리 내는 쪽을 토글한다 — 시퀀스 중이거나 스테이지(완성본)가 재생 중이면 스테이지,
  // 아니면 원본 스크럽. 완성본을 보다 Space 로 원본이 켜지면 오디오가 겹친다.
  const stv = document.getElementById("edvid");
  if (edSeq){ if (stv){ if (stv.paused) stv.play().catch(()=>{}); else stv.pause(); } return; }
  if (stv && !stv.paused){ stv.pause(); return; }
  const v = document.getElementById("edsrcv"); if (!v) return;
  if (v.paused) v.play().catch(()=>{}); else v.pause();
};
window.edNudge = d => {
  const v = document.getElementById("edsrcv");
  if (v && edCurSrc){ v.currentTime = Math.max(0, v.currentTime + d); edCursorSet(edCurSrc.offset + v.currentTime, false); }
  else edSeek(edCursor + d);
};
window.edPlayClip = i => {
  const c = edForm.clips[i]; if (!c) return;
  edPick(i);
  edLoadSource(c.start, true);
};
window.edRebuild = () => openEditor(edRid);

// ── 구간 편집 ─────────────────────────────────────────────────────────
function edMarkText(){
  const a = edForm.in, b = edForm.out;
  if (a == null && b == null) return "구간을 찍으려면 영상을 재생하며 [ 시작 · 끝 ] 을 누르세요";
  const len = (a != null && b != null) ? ` · 길이 ${(b-a).toFixed(1)}초` : "";
  return `표시: ${a != null ? edFmtMs(a) : "—"} ~ ${b != null ? edFmtMs(b) : "—"}${len}`;
}
// 마킹은 무렌더(F-103) — render() 는 재생 중이던 video 를 파괴한다. 마커 표시·안내문만
// 제자리 갱신하면 '재생하며 I → O → ＋구간 추가' 가 끊기지 않는다.
function edMarksSync(){
  if (!edForm) return;
  const dur = Number(((edData||{}).timeline||{}).duration_sec) || 1;
  const set = (id, v) => { const el = document.getElementById(id); if (!el) return;
    el.style.display = v != null ? "" : "none";
    if (v != null)
      el.style.left = (Math.max(0, Math.min(dur, v)) / dur * 100).toFixed(4) + "%"; };
  set("edmarkin", edForm.in); set("edmarkout", edForm.out);
  const info = document.getElementById("edmarkinfo");
  if (info) info.textContent = edMarkText();
}
window.edMarkIn  = () => { if (!edForm) return; edForm.in = edCursor;
  if (edForm.out != null && edForm.out <= edCursor) edForm.out = null; edMarksSync(); };
window.edMarkOut = () => { if (!edForm) return; edForm.out = edCursor;
  if (edForm.in != null && edForm.in >= edCursor) edForm.in = null; edMarksSync(); };
window.edAddClip = () => {
  if (!edCanEdit()){ toast("이 카드는 지금 고칠 수 없습니다", true); return; }
  const a = edForm.in, b = edForm.out;
  if (a == null || b == null || b <= a){ toast("시작과 끝을 먼저 찍으세요", true); return; }
  edSnap();
  // 소스 시각순 정렬은 목록이 아직 그 순서일 때만 — 출력 트랙 드래그·↑↓로 만든
  // 커스텀 순서(= 완성본 순서)를 새 구간 추가가 통째로 리셋하면 안 된다.
  const wasSorted = edForm.clips.every((c, k, arr) => !k || arr[k-1].start <= c.start);
  edForm.clips.push({ start: +a.toFixed(3), end: +b.toFixed(3),
                      role: edClipsEff().length ? "build" : "hook" });
  if (wasSorted) edForm.clips.sort((x,y) => x.start - y.start);
  edForm.in = edForm.out = null;
  edSel = edForm.clips.findIndex(c => c.start === +a.toFixed(3));
  render();
};
window.edPick = i => { edSel = i; edSelSync();
  const c = edForm.clips[i]; if (c) edSeek(c.start); else render(); };
// 삭제는 소프트(F-106) — 목록에 취소선으로 남고 되살리기·Cmd+Z 로 복구된다.
// 종전의 무확인 즉시 splice 는 자동 저장(1.5초)이 실수까지 초안에 덮어썼다.
window.edDelClip = i => { edSnap(); edForm.clips[i].del = true; render(); };
window.edRestoreClip = i => { edSnap(); edForm.clips[i].del = false; render(); };
window.edMove = (i, d) => {
  const j = i + d; if (j < 0 || j >= edForm.clips.length) return;
  edSnap();
  const t = edForm.clips[i]; edForm.clips[i] = edForm.clips[j]; edForm.clips[j] = t;
  edSel = j; render();
};
window.edSetRole = (i, v) => { edSnap(); edForm.clips[i].role = v; edMark(); };
window.edSetTime = (i, which, v) => {
  const t = edParseTime(v);
  if (t == null){ toast("시각 형식: 1:23:45.6 또는 초", true); render(); return; }
  const c = edForm.clips[i];
  if (which === "start" && t >= c.end){ toast("시작이 끝보다 뒤입니다", true); render(); return; }
  if (which === "end" && t <= c.start){ toast("끝이 시작보다 앞입니다", true); render(); return; }
  edSnap();
  c[which] = +t.toFixed(3); render();
};

// "1:02:03.4" | "2:03" | "123.4" → 초. 형식이 아니면 null(조용히 0으로 만들지 않는다).
function edParseTime(v){
  const s = String(v || "").trim(); if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const m = s.match(/^(?:(\d+):)?(\d{1,2}):(\d{1,2}(?:\.\d+)?)$/);
  if (!m) return null;
  return (+(m[1]||0)) * 3600 + (+m[2]) * 60 + parseFloat(m[3]);
}
const edFmtMs = s => {
  s = Math.max(0, Number(s) || 0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = (s%60).toFixed(1);
  return (h ? h + ":" : "") + String(m).padStart(2,"0") + ":" + String(x).padStart(4,"0");
};

// ── 자막 편집 ─────────────────────────────────────────────────────────
window.edDelSub = i => { edSnap(); edForm.dSubs[i].del = true; render(); };
window.edRestoreSub = i => { edSnap(); edForm.dSubs[i].del = false; render(); };
window.edAddSub = () => {
  const a = edParseTime(($("#edns")||{}).value), b = edParseTime(($("#edne")||{}).value);
  const t = (($("#ednt")||{}).value || "").trim();
  if (a == null || b == null || b <= a){ toast("자막 시간이 올바르지 않습니다", true); return; }
  if (!t){ toast("자막 문구를 적으세요", true); return; }
  edSnap();
  edForm.dSubs.push({ start: a, end: b, text: t, src: null, added: true });
  edForm.dSubs.sort((x,y) => x.start - y.start);
  render();
};

// ── 내레이션 편집(0047) ────────────────────────────────────────────────
window.edTtsPick = i => { edTtsSel = i; edPane = "tts";
  const t = edForm.tts[i]; if (t) edSeek(t.src); else render(); };
window.edTtsDel = i => { edSnap(); edForm.tts[i].del = true; render(); };
window.edTtsRestore = i => { edSnap(); edForm.tts[i].del = false; render(); };
window.edTtsVoice = (i, v) => { edSnap(); edForm.tts[i].voice = v; edMark(); };
window.edTtsAdd = () => {
  const src = edParseTime(($("#edntts")||{}).value);

// ── 스타일 ────────────────────────────────────────────────────────────
window.edStyleSet = (k, v) => {
  // 스냅샷은 beforeinput(값 변경 전)이 이미 잡는다 — 여기서 또 잡으면 태그가 교대돼

  // 스위치 없이 title_y 만 나가면 렌더는 자동 배치라 미리보기와 결과가 갈라진다.

// ── 타임라인 줌·팬 (F-101) ────────────────────────────────────────────
// 종전 10등분 고정 눈금은 4시간물 최대 줌에서 눈금 사이가 수십 분씩 벌어진다.
// 보이는 구간에만, 화면상 ~90px 간격이 되는 '깔끔한 걸음'으로 다시 그린다 —
// 캔버스 전체에 그리면 최대 줌에서 눈금이 수천 개가 되므로 스크롤 때마다 재그림.
const ED_TICK_STEPS = [1,2,5,10,15,30,60,120,300,600,900,1800,3600,7200];
const ED_ZOOM_MAX = 120;   // 4시간물에서 1px ≈ 0.1초 — 프레임 근처까지 간다

function edTickStep(dur, viewportPx){
  const perPx = dur / Math.max(1, edZoom) / Math.max(1, viewportPx);
  return ED_TICK_STEPS.find(s => s / perPx >= 90) || ED_TICK_STEPS[ED_TICK_STEPS.length-1];
}

let edTickKey = "";
function edDrawTicks(){
  const el = document.getElementById("edtl"), tk = document.getElementById("edticks");
  if (!el || !tk || !edData) return;
  const dur = Number((edData.timeline||{}).duration_sec) || 1;
  const step = edTickStep(dur, el.clientWidth);
  const t0 = el.scrollLeft / Math.max(1, el.scrollWidth) * dur;
  const t1 = (el.scrollLeft + el.clientWidth) / Math.max(1, el.scrollWidth) * dur;
  const lab = document.getElementById("edzoomlab");
  if (lab) lab.textContent = (edZoom < 10 ? edZoom.toFixed(1) : String(Math.round(edZoom))) + "×";
  // 보이는 눈금 집합이 그대로면 innerHTML 재생성을 건너뛴다 — 팬 중 매 프레임 재그림 방지
  const i0 = Math.max(0, Math.floor(t0/step)), i1 = Math.floor(Math.min(dur, t1 + step)/step);
  const key = `${dur}:${step}:${i0}:${i1}`;
  if (key === edTickKey) return;
  edTickKey = key;
  let out = "";
  for (let i = i0; i <= i1; i++){
    const t = i * step; if (t > dur) break;
    // 경계 눈금은 정렬 클래스(l/r) — 캔버스 밖 오버행 방지(위 CSS 주석 참고)
    const cls = t < step/2 ? "l" : (dur - t) < step/2 ? "r" : "";
    out += `<span class="${cls}" style="left:${(t/dur*100).toFixed(4)}%">${edFmt(t)}</span>`;
  }
  tk.innerHTML = out;
}

// 렌더가 DOM 을 새로 만들 때마다 저장해 둔 줌·스크롤을 되입힌다 — 탭 전환에도 유지
function edTlAfterRender(){
  const el = document.getElementById("edtl"); if (!el) return;
  edProgScroll = true;
  el.scrollLeft = edTlScroll;
  edDrawTicks(); edMmSync(); edMarksSync();
}

// 줌은 렌더 없이 캔버스 폭·스크롤만 바꾼다 — anchorX(뷰포트 px) 아래 시각을 고정한다
function edZoomSet(z, anchorX){
  const el = document.getElementById("edtl"), c = document.getElementById("edtlc");
  if (!el || !c) return;
  z = Math.max(1, Math.min(ED_ZOOM_MAX, z));
  const ax = anchorX != null ? anchorX : el.clientWidth / 2;
  const frac = (el.scrollLeft + ax) / Math.max(1, el.scrollWidth);
  edZoom = z;
  c.style.width = (z * 100).toFixed(2) + "%";
  edProgScroll = true;
  el.scrollLeft = Math.max(0, frac * el.scrollWidth - ax);
  edDrawTicks(); edMmSync();
}
window.edZoomBy = f => edZoomSet(edZoom * f);
window.edZoomFit = () => edZoomSet(1);

window.edTlOnWheel = ev => {
  // 세로 휠 = 줌(포인터 아래 시각 고정) · 가로 스와이프/Shift+휠 = 팬.
  // deltaX 를 무시하면 트랙패드 가로 스와이프가 '연속 줌아웃'이 되고, Chromium 은
  // Shift+휠을 deltaX 로 재매핑하므로 deltaY 만 보면 팬이 무동작이 된다.
  ev.preventDefault();
  if (edDrag) return;   // 드래그 중 배율·팬 변경 금지 — x0/pxPerSec 기준이 무너진다
  const el = document.getElementById("edtl"); if (!el) return;
  const dx = ev.deltaX, dy = ev.deltaY;
  if (ev.shiftKey || Math.abs(dx) > Math.abs(dy)){ el.scrollLeft += (dx || dy); return; }
  if (!dy) return;
  const x = ev.clientX - el.getBoundingClientRect().left;
  edZoomSet(edZoom * (dy < 0 ? 1.25 : 1/1.25), x);
};

let edTickRaf = 0;
window.edTlOnScroll = () => {
  const el = document.getElementById("edtl"); if (!el) return;
  edTlScroll = el.scrollLeft;                 // 단일 장부 — clamp 후 실제 값
  if (edProgScroll) edProgScroll = false;     // 코드가 만든 스크롤은 팬으로 안 친다
  else edPanAt = Date.now();                  // 스크롤바·휠 팬 — 자동 추적을 잠시 쉰다
  cancelAnimationFrame(edTickRaf);
  edTickRaf = requestAnimationFrame(() => { edDrawTicks(); edMmSync(); });
};

// ── 미니맵 — 뷰포트 표시 + 팬 손잡이 ──────────────────────────────────
function edMmSync(){
  const el = document.getElementById("edtl"), vp = document.getElementById("edmmvp");
  if (!el || !vp) return;
  vp.style.left = (el.scrollLeft / Math.max(1, el.scrollWidth) * 100).toFixed(3) + "%";
  vp.style.width = Math.min(100,
    el.clientWidth / Math.max(1, el.scrollWidth) * 100).toFixed(3) + "%";
}
function edMmPan(ev){
  const mm = document.getElementById("edmm"), el = document.getElementById("edtl");
  if (!mm || !el) return;
  const r = mm.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  edPanAt = Date.now();                       // 사용자 팬 — 커서 자동 추적이 쉬어야 한다
  el.scrollLeft = Math.max(0, frac * el.scrollWidth - el.clientWidth / 2);
}
window.edMmDown = ev => {
  ev.preventDefault();
  edMmPan(ev);
  // 창 밖에서 버튼을 놓으면 mouseup 이 안 온다 — buttons 를 보고 스스로 끝낸다
  const move = e => { if (!e.buttons){ up(); return; } edMmPan(e); };
  const up = () => { document.removeEventListener("mousemove", move);
                     document.removeEventListener("mouseup", up); };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
};

// ── 클립 드래그 편집 (F-102) ──────────────────────────────────────────
// 몸통 = 이동, 양끝 핸들 = 트리밍. 드래그 중엔 블록만 제자리 갱신하고 render() 는
// 드롭에서 한 번 — 재생 중 드래그가 video 를 파괴하면 안 된다.
let edDrag = null, edDragJust = false;

function edSnapTargets(exceptI){
  const out = [0, Number((edData.timeline||{}).duration_sec) || 1];
  edForm.clips.forEach((c, i) => { if (i !== exceptI && !c.del) out.push(c.start, c.end); });
  edForm.tts.forEach(x => { if (!x.del) out.push(x.src, x.src + x.dur); });
  edForm.dSubs.forEach(s => { if (s.src != null && !s.del) out.push(s.src); });
  return out;
}
// 화면상 8px 안이면 경계에 붙는다. 정수 초 그리드는 더 가까운 경계가 없을 때만.
// 반환 null = 스냅 없음 — '스냅 안 됨'을 t 그대로 돌려주면 호출부의 거리 비교에서
// 거리 0으로 이겨버려 반대쪽 끝의 스냅이 영영 선택되지 않는다.
function edSnapSec(t, targets, pxPerSec){
  const thr = 8 / Math.max(1e-6, pxPerSec);
  let best = null, bd = thr;
  targets.forEach(x => { const d = Math.abs(x - t); if (d < bd){ bd = d; best = x; } });
  const g = Math.round(t);
  if (Math.abs(g - t) < Math.min(bd, thr)) best = g;
  return best;
}

function edClipTitle(c){
  return `${c.role} · ${edFmt(c.start)}~${edFmt(c.end)} (${(c.end - c.start).toFixed(1)}초)`;
}

window.edClipClick = (ev, i) => {
  ev.stopPropagation();
  if (edDragJust){ edDragJust = false; return; }   // 드롭 직후의 click 은 시킹이 아니다
  edPick(i);
};
// 드롭 표시는 다음 틱에 자동 소거 — render() 가 원소를 갈아끼우면 유령 click 이
// 아예 안 와서, 소거를 click 에만 맡기면 플래그가 새어 다음 정상 클릭을 삼킨다.
function edDropFlag(){
  edDragJust = true;
  setTimeout(() => { edDragJust = false; }, 0);
}

window.edClipDown = (ev, i) => {
  if (!edCanEdit() || !edForm.clips[i] || edForm.clips[i].del) return;
  if (ev.button !== 0) return;
  ev.preventDefault(); ev.stopPropagation();
  edSeqStop();   // 재생 틱이 드래그 중 변이값으로 점프·정지를 일으키면 안 된다
  const tlc = document.getElementById("edtlc"); if (!tlc) return;
  const dur = Number((edData.timeline||{}).duration_sec) || 1;
  const c = edForm.clips[i];
  edSel = i; edSelSync(); edDragJust = false;
  // 스냅샷은 실제로 움직였을 때 1회 — 클릭만 하고 만 드래그가 무변화 스텝을 남기면
  // Cmd+Z 가 한 번 씹힌다. pre 에 드래그 전 상태를 들고 있다가 첫 이동에서 push.
  edDrag = { i, x0: ev.clientX, s0: c.start, e0: c.end, dur,
             mode: ev.target.classList.contains("hL") ? "L"
                 : ev.target.classList.contains("hR") ? "R" : "M",
             pxPerSec: tlc.getBoundingClientRect().width / dur,
             targets: edSnapTargets(i), pre: edSnapJson(), snapped: false, moved: false };
  document.addEventListener("mousemove", edClipMove);
  document.addEventListener("mouseup", edClipUp);
};
function edClipMove(ev){
  const d = edDrag; if (!d) return;
  if (!ev.buttons){ edClipUp(); return; }          // 창 밖에서 버튼을 놓은 경우
  if (!d.moved && Math.abs(ev.clientX - d.x0) <= 3) return;
  if (!d.snapped){                                  // 첫 실이동 — 드래그 전 상태를 push
    edUndo.push(d.pre); if (edUndo.length > 100) edUndo.shift();
    edRedo.length = 0; edSnapTag = "";
    d.snapped = true; d.moved = true;
  }
  const c = edForm.clips[d.i];
  const dt = (ev.clientX - d.x0) / d.pxPerSec;
  const snap = ev.altKey ? (v => v) : (v => edSnapSec(v, d.targets, d.pxPerSec));
  if (d.mode === "M"){
    const len = d.e0 - d.s0;
    let ns = Math.max(0, Math.min(d.dur - len, d.s0 + dt));
    const s1 = snap(ns), s2 = snap(ns + len);          // 시작·끝 중 가까운 스냅에
    const d1 = s1 == null ? Infinity : Math.abs(s1 - ns);
    const d2 = s2 == null ? Infinity : Math.abs(s2 - (ns + len));
    if (d1 <= d2 && s1 != null) ns = s1;
    else if (s2 != null) ns = s2 - len;
    ns = Math.max(0, Math.min(d.dur - len, ns));
    c.start = +ns.toFixed(3); c.end = +(ns + len).toFixed(3);
  } else if (d.mode === "L"){
    const raw = Math.max(0, Math.min(c.end - 0.2, d.s0 + dt));
    const ns = snap(raw) ?? raw;
    c.start = +Math.max(0, Math.min(c.end - 0.2, ns)).toFixed(3);
  } else {
    const raw = Math.max(c.start + 0.2, Math.min(d.dur, d.e0 + dt));
    const ne = snap(raw) ?? raw;
    c.end = +Math.max(c.start + 0.2, Math.min(d.dur, ne)).toFixed(3);
  }
  const el = document.querySelectorAll("#edtlc .edclip")[d.i];
  if (el){
    el.style.left = (c.start / d.dur * 100).toFixed(4) + "%";
    el.style.width = Math.max(0.15, (c.end - c.start) / d.dur * 100).toFixed(4) + "%";
    el.title = edClipTitle(c);
  }
}
function edClipUp(){
  const d = edDrag; edDrag = null;
  document.removeEventListener("mousemove", edClipMove);
  document.removeEventListener("mouseup", edClipUp);
  if (d && d.moved){ edDropFlag(); render(); }
}

// ── 출력 타임라인 (F-105) — 완성본 순서 트랙 ─────────────────────────
// 좌표계가 다르다: 원본 트랙은 원본 절대초, 여기는 출력 누적초(0~). 내레이션 위치는
// '담고 있는 구간의 오프셋 + 구간 내 상대시각'으로 환산한다(엔진과 같은 규칙의 근사).
function edEffList(){
  const eff = []; let off = 0;
  edForm.clips.forEach((c, i) => {
    if (!c.del){ eff.push({ i, c, off }); off += Math.max(0, c.end - c.start); } });
  return { eff, total: off };
}
// 자막의 출력 시각 — 한 벌만 존재해야 한다(트랙·오버레이·충돌검사 공용).
// 앵커가 있고 고정(pin)이 아니면 재매핑, 아니면 start(완성본 시각) 그대로.
// pin = 사람이 타이밍을 손댄 줄(V3-b): 계약상 앵커를 빼고 보내 시각이 그대로 박힌다.
function edSubOutPos(eff, s){
  if (s.src != null && !s.pin){
    const r = edOutPos(eff, s.src);
    return r ? r.p : null;            // 앵커 장면이 구간에서 빠짐 — 트랙에 안 그린다(경고는 목록에)
  }
  return Number(s.start) || 0;
}

// 출력 시각 → 원본 절대초 역산(V3-b) — 출력은 구간의 연속 결합이라 총길이 안 어디든
// 정확히 한 구간에 떨어진다(간극 없음). 경계는 뒤 구간이 이긴다.
function edSrcAtOut(p){
  const { eff, total } = edEffList();
  if (!eff.length) return null;
  const q = Math.max(0, Math.min(Math.max(total - 0.001, 0), p));
  for (let k = eff.length - 1; k >= 0; k--){
    const e = eff[k];
    if (q >= e.off - 1e-9)
      return { src: e.c.start + Math.min(e.c.end - e.c.start, q - e.off), e };
  }
  return { src: eff[0].c.start, e: eff[0] };
}

function edOutHtml(){
  const { eff, total } = edEffList();
  const lim = 59.7, span = Math.max(total, lim) || 1;
  const px = v => (Math.max(0, Math.min(span, v)) / span * 100).toFixed(3) + "%";
  const wpx = v => Math.max(0.35, v / span * 100).toFixed(3) + "%";
  const cf = edConflicts();                    // 주황 = 자막↔내레이션 같은 순간 겹침(F-205)
  const selIs = (t, i) => edOutSel && edOutSel.t === t && edOutSel.i === i ? "sel" : "";
  // V 레인 — 구간(순서 드래그, 종전 그대로)
  const v = eff.map(e => `<div class="edoclip ${esc(e.c.role)} ${e.i === edSel ? "sel" : ""}"
      data-i="${e.i}" style="left:${px(e.off)};width:${wpx(e.c.end - e.c.start)}"
      title="${e.i + 1}번 구간 · 완성본 ${e.off.toFixed(1)}~${
        (e.off + e.c.end - e.c.start).toFixed(1)}초 — 끌면 순서가 바뀝니다"
      onmousedown="edOutDown(event,${e.i})"><span>${e.i + 1}</span></div>`).join("");
  // S 레인 — 자막 블록: 끌면 이동, 양끝 트리밍 — 손대는 순간 그 줄은 시각 고정(호박색)
  let s = "";
  edForm.dSubs.forEach((sb, si) => {
    if (sb.del || !String(sb.text).trim()) return;
    const p = edSubOutPos(eff, sb);
    if (p == null) return;
    const len = Math.max(0.3, (Number(sb.end) - Number(sb.start)) || 0);
    // 고정 시각이 총길이 밖이면(구간 축소) 오른끝 안쪽에 경고색으로 그린다 — 숨기면
    // 인스펙터 진입 수단이 없어 영영 못 고친다(리뷰 M3)
    const oob = total > 0 && p > total - 0.05;
    const pd = oob ? Math.max(0, span - Math.max(0.5, len)) : p;
    s += `<div class="edoel osub ${sb.pin || sb.src == null ? "pin" : ""} ${
        cf.subClash.has(si) ? "clash" : ""} ${oob ? "oob" : ""} ${selIs("sub", si)}"
      data-t="sub" data-i="${si}" style="left:${px(pd)};width:${wpx(len)}"
      title="자막 ${si + 1} · ${esc(String(sb.text).slice(0, 24))}${
        sb.pin ? " · 시각 고정(앵커 해제)" : sb.src == null ? " · 신규(시각 고정)" : ""}${
        oob ? " · ⚠ 완성본 길이 밖 — 시작을 앞으로 당기세요" : ""}"
      onmousedown="edOutElDown(event,'sub',${si})"><i class="hL"
        onmousedown="edOutElDown(event,'sub',${si},'L')"></i><i class="hR"
        onmousedown="edOutElDown(event,'sub',${si},'R')"></i></div>`;
  });
  // N 레인 — 내레이션: 끌면 원본 절대초 역산(다른 장면 위로), 오른쪽 핸들 = 창 길이
  let n = "";
  edForm.tts.forEach((t, ti) => {
    if (t.del) return;
    const r = edOutPos(eff, t.src);
    if (!r) return;
    n += `<div class="edoel ocue ${cf.ttsClash.has(ti) ? "clash" : ""} ${selIs("tts", ti)}"
      data-t="tts" data-i="${ti}" style="left:${px(r.p)};width:${wpx(t.dur)}"
      title="내레이션 ${ti + 1} · ${esc(String(t.text).slice(0, 24))} — 끌면 다른 장면 위로 옮겨집니다(음성 재합성)"
      onmousedown="edOutElDown(event,'tts',${ti})"><i class="hR"
        onmousedown="edOutElDown(event,'tts',${ti},'R')"></i></div>`;
  });
  // I 레인 — 이미지: 끌면 원본 앵커 역산, 양끝 트리밍
  let im = "";
  if (edImagesOn())
    (edForm.images || []).forEach((m, mi) => {
      if (m.del) return;
      const r = edOutPos(eff, m.src);
      if (!r) return;
      im += `<div class="edoel oimg ${selIs("img", mi)}"
        data-t="img" data-i="${mi}" style="left:${px(r.p)};width:${wpx(m.dur)}"
        title="이미지 ${mi + 1} · ${esc(m.name || "")}"
        onmousedown="edOutElDown(event,'img',${mi})"><i class="hL"
          onmousedown="edOutElDown(event,'img',${mi},'L')"></i><i class="hR"
          onmousedown="edOutElDown(event,'img',${mi},'R')"></i></div>`;
    });
  let h = `<div class="edlane v">${v}</div>
    <div class="edlane s"><span class="lb">자막</span>${s}</div>
    <div class="edlane n"><span class="lb">내레이션</span>${n}</div>
    <div class="edlane i"><span class="lb">이미지</span>${im}</div>`;
  if (total > lim)
    h += `<div class="edoover" style="left:${px(lim)};width:${
      ((total - lim) / span * 100).toFixed(3)}%"></div>`;
  // 상한선은 안쪽으로 2px 클램프 — total≤상한이면 left 가 100% 라 overflow 에 잘린다
  h += `<div class="edolim" style="left:calc(${px(lim)} - 2px)" title="쇼츠 상한 59.7초"></div>`;
  h += `<div class="edocur" id="edocur"></div>`;   // 가상 미리보기(F-202) 재생 헤드
  return h;
}
// ── V3-b: 완성본 트랙 요소 편집(자막·내레이션·이미지) ─────────────────
let edOutSel = null;   // {t:"sub"|"tts"|"img", i} — 인스펙터·하이라이트 대상

function edOutElState(t, obj){
  const { eff } = edEffList();
  if (t === "sub"){
    const p = edSubOutPos(eff, obj);
    return { p: p == null ? 0 : p,
             len: Math.max(0.3, (Number(obj.end) - Number(obj.start)) || 0) };
  }
  const r = edOutPos(eff, obj.src);
  return { p: r ? r.p : 0, len: Number(obj.dur) || 0 };
}

// 이동·트리밍 적용 — 스냅은 프레임(1/24s, V3-c). 자막은 손대는 순간 시각 고정
// (앵커 해제 — 계약: 앵커 없는 줄은 start_sec 그대로 박힌다. src 는 화면 참조용으로 남긴다).
// 스냅은 프레임 단위(V3-c) — 재료·렌더가 24fps 라 1/24s 가 실제 최소 단위다
const ED_FPS = 24;
const edQF = v => Math.round(v * ED_FPS) / ED_FPS;
function edOutElApply(t, obj, st0, mode, d, total){
  const maxP = Math.max(0, total - 0.1);
  // 반올림(edQF)을 클램프 **앞**에 — 뒤에 두면 경계를 반프레임 넘는다(리뷰 L2)
  if (t === "sub"){
    let p = st0.p, len = st0.len;
    if (mode === "M") p = Math.max(0, Math.min(maxP, edQF(st0.p + d)));
    else if (mode === "L"){
      const np = Math.max(0, Math.min(st0.p + st0.len - 0.3, edQF(st0.p + d)));
      len = st0.len - (np - st0.p); p = np;
    } else len = Math.max(0.3, edQF(st0.len + d));
    if (obj.src != null) obj.pin = true;
    obj.start = +p.toFixed(3); obj.end = +(p + len).toFixed(3);
    return;
  }
  // 내레이션·이미지 — 좌표는 원본 절대초: 출력 위치를 역산해 옮긴다(장면이 바뀐다)
  if (mode === "R"){
    obj.dur = +Math.max(0.3, Math.min(60, edQF(st0.len + d))).toFixed(3);
  } else if (mode === "L" && t === "img"){
    const np = Math.max(0, Math.min(st0.p + st0.len - 0.3, edQF(st0.p + d)));
    const hit = edSrcAtOut(np); if (!hit) return;
    obj.dur = +Math.min(60, st0.len - (np - st0.p)).toFixed(3);   // L 쪽도 60 상한(리뷰 L4)
    obj.src = +hit.src.toFixed(3);
  } else {
    const np = Math.max(0, Math.min(maxP, edQF(st0.p + d)));
    const hit = edSrcAtOut(np); if (!hit) return;
    obj.src = +hit.src.toFixed(3);
  }
}

// 선택 블록 프레임 이동(← → · Shift=1초) — render() 는 스테이지 video 를 파괴하므로
// 무렌더 갱신(드래그와 같은 패턴). 다른 표시(원본 타임라인 마커)는 다음 render 에서.
function edOutNudge(d){
  const sel = edOutSel, obj = edOutSelObj();
  if (!sel || !obj || !edCanEdit()) return;
  if (sel.t === "sub" && edSubsTimingLocked()){
    toast("구간을 고쳐 자막은 이번 렌더에서 다시 맞춰집니다 — 자막 시각은 렌더 후 고치세요", true);
    return;
  }
  const { total } = edEffList();
  const st = edOutElState(sel.t, obj);
  const wasOob = sel.t === "sub" && total > 0 && st.p > total - 0.05;
  edSnap("outnudge" + sel.t + sel.i);
  edOutElApply(sel.t, obj, st, "M", d, total);
  if (wasOob){ edMark(); render(); return; }   // 길이 밖 특수 배치는 재그림이 정직하다(L2)
  const wrap = document.getElementById("edouttl");
  const el = wrap && wrap.querySelector(`.edoel[data-t="${sel.t}"][data-i="${sel.i}"]`);
  if (el){
    const span = Math.max(total, 59.7) || 1;
    const p2 = edOutElState(sel.t, obj);
    el.style.left = (Math.max(0, Math.min(span, p2.p)) / span * 100) + "%";
    el.style.width = Math.max(0.35, p2.len / span * 100) + "%";
    if (sel.t === "sub" && obj.pin) el.classList.add("pin");
  }
  edInspSync(); edMark();
}

// 트랙 바닥 클릭 = 그 순간부터 가상 미리보기(V3-c) — 블록 클릭은 각자 처리.
// click 은 mousedown·mouseup 의 **공통 조상**에서 발화한다 — 블록을 누르고 밖에서
// 놓으면 target 이 컨테이너라 closest 가드가 못 잡는다(리뷰 M1, 실측). 블록
// mousedown 시각을 기록해 그 제스처의 잔여 click 을 삼킨다.
let edOutElAt = 0;
window.edOutClickTl = ev => {
  if (ev.target.closest(".edoclip,.edoel")) return;
  if (edDrag || Date.now() - edOutElAt < 500) return;   // 블록 제스처의 슬립-클릭
  const wrap = document.getElementById("edouttl"); if (!wrap || !edForm) return;
  const { eff, total } = edEffList(); if (!eff.length) return;
  const rect = wrap.getBoundingClientRect();
  const span = Math.max(total, 59.7) || 1;
  // 끝 0.2s 안쪽으로 클램프 — 끝-0.05 안에 떨어지면 틱이 즉시 정지시켜 '무반응'이 된다(M3)
  const p = Math.max(0, Math.min(Math.max(total - 0.2, 0),
    (ev.clientX - rect.left) / Math.max(1, rect.width) * span));
  edOutSeek(p, !!edSeq);                     // 재생 중이었으면 이어서 재생
};
function edOutSeek(p, play){
  const hit = edSrcAtOut(p); if (!hit) return;
  // 구간 경계 직전(끝 0.15s 안)이면 안쪽으로 — 정지 클릭이 틱의 '다음 구간 자동재생'
  // 창(끝-0.05)에 떨어지면 요청 없는 재생이 시작된다(M3 경계 변형)
  hit.src = Math.max(hit.e.c.start, Math.min(hit.src, hit.e.c.end - 0.15));
  const { eff, total } = edEffList();
  const k = eff.findIndex(e => e.i === hit.e.i);
  if (k < 0) return;
  edTtsStop();
  const sv = document.getElementById("edsrcv"); if (sv) sv.pause();   // edSeqStart 와 동일(L1)
  if (edStageMode !== "seq"){
    edStageMode = "seq"; edStageSrcCur = null; ++edStageGen;
    edStageBtnsSync();
  }
  edSeq = { k };
  const b = document.getElementById("edseqbtn"); if (b) b.textContent = "⏹ 미리보기 중";
  const nt = document.getElementById("edovnote"); if (nt) nt.style.display = "";
  edStageLoad(hit.src, !!play);
  const oc = document.getElementById("edocur");
  if (oc){ oc.style.display = "";
    oc.style.left = (p / (Math.max(total, 59.7) || 1) * 100).toFixed(3) + "%"; }
}

// 자막 타이밍 편집 잠금 — 자막 패널의 locked 와 같은 조건: v2(플래그 off)에서 구간을
// 고친 상태면 자막은 어차피 제출에서 빠진다. 트랙만 열어두면 '고쳤는데 안 나가는'
// 조용한 유실이 된다(리뷰 M4).
function edSubsTimingLocked(){
  return !!(edForm.clips.length && edClipsChanged() && !edV3());
}

function edOutSelObj(){
  const sel = edOutSel; if (!sel || !edForm) return null;
  const obj = sel.t === "sub" ? edForm.dSubs[sel.i]
            : sel.t === "tts" ? edForm.tts[sel.i] : (edForm.images || [])[sel.i];
  return obj && !obj.del ? obj : null;
}

function edInspHtml(){
  const sel = edOutSel, obj = edOutSelObj();
  if (!sel || !obj)
    return `<span class="sub">완성본 트랙의 블록을 누르면 시작·끝·길이를 숫자로 고칠 수
      있습니다 — 블록을 끌면 이동, 양끝 핸들이 길이입니다</span>`;
  const st = edOutElState(sel.t, obj);
  const name = sel.t === "sub" ? `자막 ${sel.i + 1}`
             : sel.t === "tts" ? `내레이션 ${sel.i + 1}` : `이미지 ${sel.i + 1}`;
  const ce = edCanEdit();
  const pinned = sel.t === "sub" && (obj.pin || obj.src == null);
  return `<b>${name}</b>
    <span class="sub">시작</span><input id="edin_s" value="${st.p.toFixed(2)}"
      ${ce ? "" : "disabled"} onchange="edInspSet('s',this.value)">
    <span class="sub">끝</span><input id="edin_e" value="${(st.p + st.len).toFixed(2)}"
      ${ce ? "" : "disabled"} onchange="edInspSet('e',this.value)">
    <span class="sub">길이</span><input id="edin_d" value="${st.len.toFixed(2)}"
      ${ce ? "" : "disabled"} onchange="edInspSet('d',this.value)">
    <span class="sub" title="24fps 프레임 번호">${Math.round(st.p * ED_FPS)}f ~ ${
      Math.round((st.p + st.len) * ED_FPS)}f</span>
    ${pinned ? `<span class="sub" style="color:#b45309" title="구간을 바꿔도 이 줄은
        완성본 시각 그대로 박힙니다(앵커를 빼고 보냄)">📌 시각 고정</span>
      ${obj.src != null && ce ? `<button class="mini" onclick="edInspRepin()"
        title="원본 장면 따라가기(앵커)로 되돌립니다 — 시각은 렌더 때 재매핑">앵커 복원</button>` : ""}` : ""}
    <button class="mini" onclick="edOutSel=null;render()" title="선택 해제">✕</button>`;
}
function edInspSync(){
  const el = document.getElementById("edinsp");
  if (el) el.innerHTML = edInspHtml();
}
function edOutSync(){
  document.querySelectorAll("#edouttl .edoel").forEach(el =>
    el.classList.toggle("sel",
      !!edOutSel && el.dataset.t === edOutSel.t && +el.dataset.i === edOutSel.i));
  edInspSync();
}
window.edInspSet = (k, v) => {
  const sel = edOutSel, obj = edOutSelObj();
  if (!sel || !obj || !edCanEdit()){ edInspSync(); return; }
  if (sel.t === "sub" && edSubsTimingLocked()){
    toast("구간을 고쳐 자막은 이번 렌더에서 다시 맞춰집니다 — 자막 시각은 렌더 후 고치세요", true);
    edInspSync(); return;
  }
  const num = Number(v);
  if (!isFinite(num)){ edInspSync(); return; }
  const { total } = edEffList();
  const st = edOutElState(sel.t, obj);
  // 무변화 커밋(표기만 바꾼 onchange)은 무시 — 앵커 줄이 이유 없이 pin 되면 안 된다
  const cur = k === "s" ? st.p : k === "d" ? st.len : st.p + st.len;
  if (Math.abs(num - cur) < 0.005){ edInspSync(); return; }
  edSnap();
  if (k === "s") edOutElApply(sel.t, obj, st, "M", num - st.p, total);
  else if (k === "d") edOutElApply(sel.t, obj, st, "R", num - st.len, total);
  else edOutElApply(sel.t, obj, st, "R", (num - st.p) - st.len, total);  // 끝 = 시작 고정 길이 조정
  edMark(); render();
};
window.edInspRepin = () => {
  const obj = edOutSelObj();
  if (!obj || !edCanEdit() || edOutSel.t !== "sub" || obj.src == null) return;
  edSnap();
  obj.pin = false;
  edMark(); render();
};

window.edOutElDown = (ev, t, i, hd) => {
  if (ev.button !== 0) return;
  ev.preventDefault(); ev.stopPropagation();
  edSeqStop();
  edOutElAt = Date.now();          // 이 제스처의 잔여 click 이 바닥 시킹으로 새지 않게(M1)
  edOutSel = { t, i };
  edOutSync();
  if (!edCanEdit()) return;
  if (t === "sub" && edSubsTimingLocked()){
    toast("구간을 고쳐 자막은 이번 렌더에서 다시 맞춰집니다 — 자막 시각은 렌더 후 고치세요", true);
    return;
  }
  const wrap = document.getElementById("edouttl"); if (!wrap) return;
  const el = wrap.querySelector(`.edoel[data-t="${t}"][data-i="${i}"]`); if (!el) return;
  const obj = edOutSelObj(); if (!obj) return;
  const { total } = edEffList();
  const span = Math.max(total, 59.7) || 1;
  const secPerPx = span / Math.max(1, wrap.getBoundingClientRect().width);
  const x0 = ev.clientX;
  const st0 = edOutElState(t, obj);
  let moved = false;
  edSnap("outel" + t + i + (hd || "M"));
  edDrag = { out: true };            // 드래그 중 키·휠·자동추적 동결(V 구간 드래그와 공용)
  const move = e => {
    if (!e.buttons){ up(); return; }
    if (Math.abs(e.clientX - x0) > 2) moved = true;
    if (!moved) return;
    edOutElApply(t, obj, st0, hd || "M", (e.clientX - x0) * secPerPx, total);
    const p2 = edOutElState(t, obj);          // 무렌더 반영 — render 는 드래그를 끊는다
    el.style.left = (Math.max(0, Math.min(span, p2.p)) / span * 100) + "%";
    el.style.width = Math.max(0.35, p2.len / span * 100) + "%";
    if (t === "sub" && obj.pin) el.classList.add("pin");
    edInspSync();
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    edDrag = null;
    if (moved){ edMark(); render(); }
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
};

window.edOutDown = (ev, i) => {
  if (ev.button !== 0) return;
  ev.preventDefault();
  edOutElAt = Date.now();          // V 블록 제스처도 바닥 클릭으로 새지 않게(M1)
  edSeqStop();
  edSel = i; edSelSync(); edDragJust = false;
  edDrag = { out: true };            // 드래그 중 키·휠·자동추적 동결(위 가드들 공용)
  const x0 = ev.clientX; let moved = false;
  const move = e => {
    if (!e.buttons){ up(e); return; }
    if (Math.abs(e.clientX - x0) > 4) moved = true;
  };
  const up = e => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    edDrag = null;
    if (!moved){ const c = edForm.clips[i]; if (c) edSeek(c.start); return; }
    if (!edCanEdit()) return;
    // 드롭 x 와 다른 블록들의 중앙 비교로 삽입 슬롯 결정 → 전체 목록 인덱스로 환산
    let slot = 0; const mids = [];
    document.querySelectorAll("#edouttl .edoclip").forEach(el => {
      const j = +el.dataset.i; if (j === i) return;
      const m = el.getBoundingClientRect();
      mids.push({ j, mid: m.left + m.width / 2 });
    });
    mids.forEach((m, k) => { if (e.clientX > m.mid) slot = k + 1; });
    edSnap();
    const list = edForm.clips;
    const [mv] = list.splice(i, 1);
    const effIdx = [];
    list.forEach((c, j) => { if (!c.del) effIdx.push(j); });
    const at = slot >= effIdx.length ? list.length : effIdx[slot];
    list.splice(at, 0, mv);
    edSel = at; edDropFlag(); render();
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
};

// ── 스테이지 모드 (F-201) · 가상 시퀀스 (F-202) · 오버레이 (F-203) ────
// 모드 전환·시퀀스 시작은 무렌더 — render() 는 두 플레이어를 전부 파괴한다.
// 템플릿과 어긋나지 않게, 모드에 걸린 화면 조각(버튼 on·플레이스홀더)만 제자리 갱신.
function edStageBtnsSync(){
  const bp = document.getElementById("edprevbtn");
  if (bp) bp.classList.toggle("on", edStageMode === "prev");
  const bs = document.getElementById("edseqbtn");
  if (bs) bs.classList.toggle("on", edStageMode === "seq");
  const ph = document.getElementById("edphold");
  if (ph) ph.style.display = edStageMode === "prev" && !edPrevKey ? "" : "none";
  const st = document.getElementById("edstage");
  if (st) st.classList.toggle("seqfit", edStageMode === "seq");
  edStageBandSync();
}

// 영상 밴드(V3-a) — 실제 렌더 수식 그대로: 폭 1080 고정, 높이 = 1080×(세로비/가로비),
// 위치 = design.video_y(캔버스 px, 없으면 세로 중앙), 밴드 안 cover 크롭(얼굴 추종은 근사).
function edStageBandGeom(d){
  let rw = 16, rh = 9;
  const m = String(d.aspect_ratio || "16:9").trim().match(/^(\d+)\s*:\s*(\d+)$/);
  if (m && +m[1] > 0){ rw = +m[1]; rh = +m[2]; }

// 밴드 세로 드래그 → design.video_y (엔진과 같은 캔버스 px — 클램프도 렌더와 동일)
window.edBandDragDown = ev => {
  if (ev.button !== 0 || !edStyleTool || !edCanEdit() || edStageMode !== "seq") return;
  const st = document.getElementById("edstage"); if (!st || !edForm) return;
  ev.preventDefault(); ev.stopPropagation();
  const H = st.clientHeight || 480;
  const g0 = edStageBandGeom(edDesign());
  const cy = ev.clientY;
  edSnap("banddrag");
  const move = e => {
    if (!e.buttons){ up(); return; }
    const ny = Math.max(0, Math.min(1 - g0.bandH, g0.vy + (e.clientY - cy) / H));
    edForm.design = { ...(edForm.design || {}), video_y: Math.round(ny * 1920) };
    edStageBandSync();
  };

    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    const el = document.getElementById("edd_video_y");
    if (el) el.value = (edForm.design || {}).video_y ?? "";
