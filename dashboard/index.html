// ── 충돌 검사 (F-205) — 출력 시간축 기준 ─────────────────────────────
// 자막↔내레이션 같은 순간 겹침, 원본 구간 중복(같은 장면 2회), 내레이션 창의
// 구간 경계 이탈. 전부 '막지 않고 알리는' 검사 — 렌더는 어차피 돌아간다.
// 원본 절대초 → 출력초. 한 벌만 존재해야 한다 — 마커·오버레이·충돌 검사가 서로 다른
// 환산을 쓰면 경고와 마커가 다른 위치 이야기를 한다. 구간 안으로 클램프.
function edOutPos(eff, srcV){
  const e = eff.find(x => srcV >= x.c.start - 0.5 && srcV <= x.c.end + 0.5);
  if (!e) return null;
  return { p: e.off + Math.max(0, Math.min(e.c.end - e.c.start, srcV - e.c.start)), e };
}
function edConflicts(){
  const { eff } = edEffList();
  const subs = [], cues = [];
  edForm.dSubs.forEach((s, i) => {
    if (s.del || !String(s.text).trim()) return;
    const len = Math.max(0.3, (Number(s.end) - Number(s.start)) || 0);
    const q = edSubOutPos(eff, s);            // 앵커/고정/신규 공용 규약(V3-b)
    if (q != null) subs.push({ i, a: q, b: q + len });
  });
  edForm.tts.forEach((t, i) => {
    if (t.del) return;
    const r = edOutPos(eff, t.src); if (!r) return;
    cues.push({ i, a: r.p, b: r.p + t.dur, cut: t.src + t.dur > r.e.c.end + 0.05 });
  });
  const subClash = new Set(), ttsClash = new Set();
  subs.forEach(s => cues.forEach(c => {
    if (s.a < c.b && c.a < s.b){ subClash.add(s.i); ttsClash.add(c.i); } }));
  // 원본 구간 중복 — 드래그(픽셀 환산)의 수십 ms 스침까지 경고하면 못 끄니 50ms 문턱
  const dup = [];
  eff.forEach((x, k) => eff.slice(k + 1).forEach(y => {
    if (x.c.start < y.c.end - 0.05 && y.c.start < x.c.end - 0.05)
      dup.push([x.i + 1, y.i + 1]); }));
  return { subClash, ttsClash, ttsCut: new Set(cues.filter(c => c.cut).map(c => c.i)), dup };
}

// ── 재렌더 진행 표시 (F-301) + 연속 편집 (F-304) ─────────────────────
// 제출 후 편집실을 떠나지 않는다 — 체인 잡(editrender:*)만 5초 표적 폴링해 스트립을
// 부분 갱신한다. 전체 refresh/render 는 재생 중 video 와 편집 상태를 파괴한다.
let edChain = null, edChainTimer = null;
const ED_CHAIN_STEPS = [["acquire","소스"],["generate","렌더"],
                        ["upload_artifacts","업로드"],["ingest","등록"],
                        ["evaluate","검수 준비"]];
function edChainHtml(){
  if (!edChain) return "";
  const jobs = edChain.jobs || {};
  const chips = ED_CHAIN_STEPS.map(([k, l]) => {
    const j = jobs[k] || {};
    const st = j.status || "pending";
    const cls = st === "succeeded" ? "ok"
              : ["failed", "dead", "cancelled"].includes(st) ? "bad"
              : st === "blocked" ? "hold" : st === "running" ? "run" : "";
    return `<span class="edchip ${cls}" title="${esc(k)} — ${esc(st)}${
      j.error ? " · " + esc(String(j.error).slice(0, 80)) : ""}">${l}</span>`;
  }).join(`<span class="arr">→</span>`);
  const eta = edChain.kind === "retry" ? "실패 지점부터 재시도 중"
    : edChain.kind === "resources"
    ? "구간·내레이션 수정 — 리소스부터 다시 만듭니다(몇 분)"
    : "제목·자막·스타일만 — 렌더만 다시 합니다(1분 내)";
  let tail = "";
  if (edChain.failed)
    tail = `<div class="edwarn" style="margin-top:8px">⚠ 렌더 체인 ${
      edChain.failed.status === "blocked" ? "대기(사람 개입 필요)" : "실패"} — ${
      esc(edChain.failed.kind)}(${esc(edChain.failed.status)}): ${
      esc(String(edChain.failed.error || "").slice(0, 160))}
      <span class="sub">보낸 초안은 남아 있습니다</span>
      <button class="pri mini" onclick="edRetryChain()"
        title="멈춘 잡만 되살립니다 — 인프라 실패(업로드·등록 등)의 정석 복구">실패 지점부터 재시도</button>
      <button class="mini" onclick="edResubmit()"
        title="편집 내용을 전량 다시 보냅니다 — 문구·구간을 고쳐서 다시 시도할 때">고쳐서 다시 보내기</button></div>`;
  else if (edChain.newRid)
    tail = `<div class="edchaindone">✅ 새 검수 카드가 올라왔습니다 —
      <button class="pri mini" onclick="edOpenNew('${edChain.newRid}')">방금 렌더 결과 열기</button>
      <span class="sub">새 편집실의 '현재 완성본'이 방금 렌더입니다 — 이전 판과 비교하려면
      지금 이 화면의 완성본을 먼저 봐두세요.</span></div>`;
  return `<div class="edchain" id="edchain">
    <b>재렌더 진행</b> <span class="sub">${eta} · 이 카드는 반려로 닫혔고 끝나면 새 카드가 올라옵니다</span>
    <div class="edchainrow">${chips}</div>${tail}</div>`;
}
async function edChainPoll(){
  // 목록 화면(edRid=null)·다른 카드에선 멈춘다 — 스트립도 없는데 fetch 만 돈다
  if (!edChain || tab !== "edit" || edRid !== edChain.rid) return;
  try {
    const { data } = await sb.from("job_queue")
      .select("kind,status,error")
      .like("idempotency_key", "editrender:" + edChain.rid + "%");
    if (edChain){
      const jobs = {};
      (data || []).forEach(j => { jobs[j.kind] = j; });
      edChain.jobs = jobs;
      // failed 만이 아니다 — transient 소진은 dead, 사람 개입은 blocked, 취소는 cancelled.
      // 이걸 모르면 회색 칩인 채 5초 폴이 영원히 돈다.
      edChain.failed = (data || []).find(j =>
        ["failed", "dead", "cancelled", "blocked"].includes(j.status)) || null;
      if ((jobs.evaluate || {}).status === "succeeded" && !edChain.newRid){
        const { data: rv } = await sb.from("review_queue")
          .select("id").eq("work_order_id", edChain.woId)
          .eq("kind", "publish_gate").eq("status", "waiting")
          .order("created_at", { ascending: false }).limit(1);
        if (rv && rv.length) edChain.newRid = rv[0].id;
      }
      const el = document.getElementById("edchain");
      if (el) el.outerHTML = edChainHtml();   // 부분 갱신 — render() 는 video 를 죽인다
    }
  } catch (e){ /* 폴링 실패는 다음 틱에 다시 */ }
  clearTimeout(edChainTimer);
  if (edChain && !edChain.newRid && !edChain.failed)
    edChainTimer = setTimeout(edChainPoll, 5000);
}
// 새 카드는 편집실이 자동 갱신에서 빠져 state.reviews 에 없다 — 먼저 채우고 연다.
// 안 채우면 헤더 공란 + '일본어 카드 보기 전용' 오안내 화면이 뜬다.
window.edOpenNew = async rid => {
  try { await refresh(); } catch (e){ /* 실패해도 열기는 시도 */ }
  openEditor(rid);
};
// 재제출(F-302) — 화면의 현재 편집 상태(= 보낸 초안이 복원된 edForm)를 다시 보낸다.
// RPC(0050)가 rejected 카드의 재제출 가드를 검증한다. 새 체인은 기존 제출 경로 공용.
window.edResubmit = () => {
  edChain = null; clearTimeout(edChainTimer);   // 새 제출이 새 체인을 세운다
  if (edForm) edForm.sent = false;
  edSubmit();
};
// 실패 지점부터 재시도(F-302) — 인프라 실패의 정석 복구. 재제출(전량 오버라이드)은
// 실패 체인이 run_dir 을 이미 변형했으면 diff 가 붕괴한다(재료 = 이미 고친 본).
window.edRetryChain = async () => {
  const res = await rpc("retry_editor_chain", { p_review_id: edRid },
                        "실패한 지점부터 체인을 다시 돕니다");
  if (!res) return;
  if (edForm) edForm.sent = true;
  const wo = ((state.reviews||[]).find(x => x.id === edRid) || {}).work_order_id;
  edChain = { rid: edRid, woId: wo, kind: "retry", jobs: {} };
  render();
};

// ── 키보드 단축키 (F-103) ─────────────────────────────────────────────
function edCanEdit(r){
  // '현재 편집 중인 카드' 조회를 한 곳으로 — renderEdit 은 찾아 둔 행을 넘긴다.
  // 체인 잠금도 여기서 — 전역 핸들러(Delete 키·드래그)가 각자 챙기면 반드시 샌다.
  if (edChain && edChain.rid === edRid) return false;
  r = r || (state.reviews||[]).find(x => x.id === edRid) || {};
  if (!can("reviewer") || r.kind !== "publish_gate") return false;
  if (r.status === "waiting") return true;
  // 재제출 경로(F-302): 편집 재렌더로 닫혔고 새 카드가 없으면 **고쳐서** 다시 보낼 수
  // 있어야 한다 — 초안 내용 자체가 실패 원인(엔진 검증)일 수 있다. 서버(0050)가 같은
  // 조건을 다시 검증한다.
  if (r.status === "rejected" && edData && edData.draft_sent_at)
    return !(state.reviews||[]).some(x => x.work_order_id === r.work_order_id
      && x.kind === "publish_gate" && x.status === "waiting");
  return false;
}
// 선택 하이라이트를 렌더 없이 맞춘다 — 키보드 내비마다 render() 를 돌리면 video 가
// 다시 로드된다. 블록·행 모두 인덱스 = clips 인덱스라 순서 대응이 성립한다.
function edSelSync(){
  document.querySelectorAll("#edtlc .edclip").forEach((el, i) =>
    el.classList.toggle("sel", i === edSel));
  // 행 하이라이트는 구간 패널에서만 — 다른 패널(이미지 등)도 .edrow2 를 쓰므로
  // 인덱스=clips 가정은 clips 패널에서만 성립한다.
  if (edPane === "clips")
    document.querySelectorAll(".edpane .edrow2").forEach((el, i) =>
      el.classList.toggle("sel", i === edSel));
  document.querySelectorAll("#edouttl .edoclip").forEach(el =>
    el.classList.toggle("sel", +el.dataset.i === edSel));   // 두 트랙 상호 하이라이트
}
window.edKbToggle = () => {
  edKbHelp = !edKbHelp;
  const el = document.getElementById("edkb");
  if (el) el.classList.toggle("on", edKbHelp);
};
// 되돌리기(Cmd+Z)는 여기 없다 — undo 스택(F-104)과 함께 온다. 스택 없이 바인딩만
// 하면 눌러도 아무 일이 없어 '되돌려졌다'는 오해만 산다.
document.addEventListener("keydown", e => {
  if (tab !== "edit" || !edForm) return;
  if (edDrag) return;   // 드래그 중 키 조작 금지 — Cmd+Z 가 스택·드래그 상태를 찢는다
  // Cmd+Z / Shift+Cmd+Z (F-104) — 입력 필드 안에서는 네이티브 undo 에 양보한다
  if ((e.metaKey || e.ctrlKey) && !e.altKey && e.code === "KeyZ"){
    const t0 = e.target;
    if (t0 && (/^(INPUT|TEXTAREA)$/.test(t0.tagName) || t0.isContentEditable)) return;
    e.preventDefault();
    if (e.shiftKey) edRedoOp(); else edUndoOp();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  // BUTTON 포함 — 버튼에 포커스가 남은 채 Space 를 누르면 '버튼 재클릭 + 재생 토글'
  // 이중 동작이 된다. 포커스가 컨트롤에 있으면 네이티브 동작에 양보한다.
  if (t && (/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(t.tagName) || t.isContentEditable)) return;
  const k = e.key;
  // 오토리피트는 이동·줌만 — 토글류(Space·I/O·Delete·?)가 리피트되면 초당 십수 회
  // 삭제↔복원이 교대돼 스냅샷 스택이 실제 편집 이력을 밀어낸다.
  if (e.repeat && !/^Arrow/.test(k) && k !== "+" && k !== "=" && k !== "-") return;
  if (k === " "){ e.preventDefault(); edToggle(); }
  // I/O 는 e.code(자판 위치)로 — 한글 IME 가 켜져 있으면 e.key 가 "ㅑ"/"ㅐ"로 들어와
  // 문자 비교가 영영 안 맞는다. 검수자 대부분이 한글 자판이다.
  else if (e.code === "KeyI"){ e.preventDefault(); edMarkIn(); }
  else if (e.code === "KeyO"){ e.preventDefault(); edMarkOut(); }
  else if (k === "ArrowLeft"){ e.preventDefault();
    // 읽기 전용 카드에선 트랙 선택이 있어도 소스 이동으로 — 무음으로 죽으면 안 된다(M2)
    if (edOutSel && edOutSelObj() && edCanEdit()) edOutNudge(e.shiftKey ? -1 : -1 / ED_FPS);
    else edNudge(e.shiftKey ? -1 : -1/24); }
  else if (k === "ArrowRight"){ e.preventDefault();
    if (edOutSel && edOutSelObj() && edCanEdit()) edOutNudge(e.shiftKey ? 1 : 1 / ED_FPS);
    else edNudge(e.shiftKey ? 1 : 1/24); }
  else if (k === "ArrowUp" || k === "ArrowDown"){
    if (!edForm.clips.length) return;
    e.preventDefault();
    const d = k === "ArrowUp" ? -1 : 1;
    edPick(((edSel < 0 ? (d > 0 ? -1 : 0) : edSel) + d
            + edForm.clips.length) % edForm.clips.length);
  }
  else if (k === "Delete" || k === "Backspace"){
    if (!edCanEdit()) return;
    // 완성본 트랙에서 요소를 선택했으면 그것이 삭제 대상 — 구간(edSel)보다 우선.
    // 두 선택이 동시에 보일 수 있어, 눈에 보이는 마지막 선택이 이겨야 한다(리뷰 M2).
    if (edOutSel && edOutSelObj()){
      e.preventDefault();
      const { t, i } = edOutSel;
      if (t === "sub") edDelSub(i);
      else if (t === "tts") edTtsDel(i);
      else edImgDel(i);
      return;
    }
    const c = edForm.clips[edSel];
    if (c){ e.preventDefault();
      if (c.del) edRestoreClip(edSel); else edDelClip(edSel); }
  }
  else if (k === "+" || k === "="){ e.preventDefault(); edZoomBy(1.5); }
  else if (k === "-"){ e.preventDefault(); edZoomBy(1/1.5); }
  else if (k === "0"){ e.preventDefault(); edZoomFit(); }
  else if (k === "?"){ e.preventDefault(); edKbToggle(); }
  else if (k === "Escape"){
    if (edKbHelp) edKbToggle();
    else if (edOutSel){ edOutSel = null; edOutSync(); }
  }
});
// 타이핑 스냅샷(F-104) — 값이 **바뀌기 전**(beforeinput)에 잡는다. 바뀐 뒤에 잡으면
// 그 타이핑은 영영 못 되돌린다. 필드 단위 0.8초 묶음은 edSnap 이 처리.
// 대상은 타이핑이 edForm 을 **즉시** 바꾸는 필드만(제목·자막·내레이션·스타일) —
// 추가행 스크래치(edn*)·시각 입력(.tm, onchange 커밋)은 커밋 시점의 edSnap 이 잡는다.
// 무차별로 잡으면 '입력하다 만' 타이핑이 무변화 스냅샷으로 남아 Cmd+Z 가 한 번 씹힌다.
document.addEventListener("beforeinput", e => {
  if (tab !== "edit" || !edForm) return;
  const t = e.target;
  if (t && /^(edtitle$|edsx_|edtx_|edd_)/.test(t.id || ""))
    edSnap("type:" + t.id);
}, true);

// ───────── 채널 필터 칩 (목업: 맥별 → 채널별 나열) ─────────
// items: channel_slug 를 가진 행들. varName: 전역 필터 변수 이름('feedCh'|'rvCh').
function channelChips(items, cur, varName){
  const cnt = {};
  (items||[]).forEach(r => { const s = r.channel_slug; if (s) cnt[s] = (cnt[s]||0) + 1; });
  const chans = (state.chans||[]).slice()
    .sort((a,b) => (a.name||a.token_slug).localeCompare(b.name||b.token_slug, "ko"));
  // 검수함 칩의 건수는 '검수 대기' 시맨틱 노랑으로 강조 (피드는 중립 유지)
  const nStyle = varName === "rvCh"
    ? "color:var(--warn);font-weight:700" : "opacity:.6";
  const btn = (val, label, n) =>
    `<button class="mini ${cur===val?"on":""}" onclick="${varName}='${val}';feedCalOff=0;render()">${label}${
      n ? ` <span style="${nStyle}">${n}</span>` : ""}</button>`;
  // 좌우 화살표가 훑을 순서를 칩과 같은 배열에서 만든다 — 둘이 어긋나면
  // 화살표가 화면에 없는 탭으로 데려간다.
  chipNavVar = varName;
  chipNavAll = [{ val: "all", label: "전체", n: (items||[]).length }].concat(
    chans.map(c => ({ val: c.token_slug, label: c.name || c.token_slug,
                      n: cnt[c.token_slug] || 0 })));
  const arrow = (d, cls, glyph, lbl) => {
    const t = chipNavTarget(d);
    return `<button class="chipnav ${cls}" ${t ? "" : "disabled"} onclick="chipNav(${d})"
      title="${lbl} 채널${t ? " — " + esc(t.label) : ""}" aria-label="${lbl} 채널">${glyph}</button>`;
  };
  return `<div class="filters">${btn("all", "전체", (items||[]).length)}${
    chans.map(c => btn(c.token_slug, esc(c.name||c.token_slug), cnt[c.token_slug])).join("")}</div>` +
    arrow(-1, "l", "‹", "이전") + arrow(1, "r", "›", "다음");
}

// ───────── 채널 탭 좌우 이동 (운영 요청 2026-08-14) ─────────
// 한 채널을 다 검수하고 다음으로 넘어갈 때 칩을 눈으로 찾아 클릭하던 수고를 없앤다.
// 규칙(운영자 결정): ① 건수 0인 채널은 건너뛴다 — 검수는 남은 것만 훑는 작업이라 빈 탭에
// 멈추면 화살표를 두 번 눌러야 한다. ② 끝에서는 처음으로 순환한다 — 남은 채널을 계속
// 돌며 비울 수 있다. 검수함·영상 피드가 이 함수를 공유한다(칩 컴포넌트가 하나다).
let chipNavAll = [], chipNavVar = null;
function chipNavTarget(d){
  const all = chipNavAll, len = all.length;
  if (!len) return null;
  const cur = chipNavVar === "rvCh" ? rvCh : feedCh;
  let i = all.findIndex(x => x.val === cur);
  if (i < 0) i = 0;                       // 지금 탭이 빈 채널이면 그 자리에서 출발
  for (let k = 1; k <= len; k++){         // 한 바퀴 돌며 첫 '건수 있는' 탭을 찾는다
    const j = ((i + d * k) % len + len) % len;
    if (all[j].n > 0 && all[j].val !== cur) return all[j];
  }
  return null;                            // 갈 곳이 없다(건수 있는 탭이 지금 것뿐)
}
window.chipNav = d => {
  const t = chipNavTarget(d);
  if (!t) return;
  if (chipNavVar === "rvCh") rvCh = t.val; else feedCh = t.val;
  feedCalOff = 0;
  render();
  window.scrollTo({ top: 0 });            // 다음 채널은 위에서부터 본다
};
// ←/→ 키로도 넘긴다. 메모·공개방식 입력 중에는 넘기지 않는다 —
// 사유를 쓰다 방향키를 누르면 카드가 통째로 바뀌어 입력이 무의미해진다.
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  if (tab !== "review" && tab !== "feed") return;
  const t = e.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  if (e.key === "ArrowLeft"){ e.preventDefault(); chipNav(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); chipNav(1); }
});

// ───────── 목업: 피드 채널 상세 헤더 + 업로드 달력 ─────────
// 채널 아이콘 — 목업용 정적 스냅샷 (2026-08-11 YouTube og:image 수집).
// 실서비스 제안: channels_mirror 에 avatar_url 컬럼을 두고 channels_sync 가 갱신하거나
// 구 대시보드 chavatars API 방식 재사용 (아바타 변경 시 스냅샷은 낡는다).
const CH_AVATARS = {};   // 0020: 아이콘은 channels_mirror.avatar_url(매일 자동 갱신)에서 온다
let feedCalOff = 0;
window.feedCalNav = d => { feedCalOff += d; render(); };
// 업로드 이력 — perf_video_map(laeebly 유튜브 미러) 채널별 캐시.
// 구·신 대시보드 어느 쪽에서 발행했든 유튜브에 올라간 영상이 전부 잡힌다(3월~).
// 한계: perf_sync 가 시간당 1회라 방금 발행분은 늦게 반영 → publish 성공 잡과 합집합으로 보충.
let pvmCache = {};   // token_slug -> "loading" | {days:Set<YYYY-MM-DD>}
function pvmLoad(slug){
  if (pvmCache[slug]) return;
  pvmCache[slug] = "loading";
  const cid = ((state.chans||[]).find(c => c.token_slug === slug)||{}).channel_id;
  if (!cid){ pvmCache[slug] = {days:new Set()}; return; }
  Promise.all([
    sb.from("perf_video_map").select("published_at").eq("channel_id", cid).limit(2000),
    // 채널 자체 총 영상 수 — 유튜브 채널 통계 미러(우리가 만든 것 외 전부 포함)
    sb.from("perf_channel_snapshot").select("video_count,snapshot_date").eq("channel_id", cid)
      .order("snapshot_date", {ascending:false}).limit(1),
  ]).then(([vm, cs]) => {
    const days = new Set();
    (vm.data||[]).forEach(r => { if (r.published_at) days.add(kstDay(r.published_at)); });
    const c = (cs.data||[])[0];
    pvmCache[slug] = {days, vcount: c ? Number(c.video_count) : null, vdate: c ? c.snapshot_date : null};
    if (tab === "feed" && feedCh === slug) render();
  });
}
// 채널 아바타 — 실제 아이콘, 로드 실패·미수집 시 채널명 해시 색 이니셜 폴백
function chAvatarHtml(slug, size){
  const name = chName(slug);
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  const ch = (state.chans||[]).find(x => x.token_slug === slug);
  const url = (ch && ch.avatar_url) || CH_AVATARS[slug];
  return `<span class="chav" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;
    background:linear-gradient(135deg,hsl(${h},55%,45%),hsl(${(h+45)%360},60%,58%))">${esc(name.slice(0,1))}${
    url ? `<img src="${url}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
}
// 채널의 현재 생성 신호등 (홈 탭과 동일 규칙: 오늘 작업분 우선, 없으면 최근 작업분)
function chSignal(slug){
  const today = kstDay();
  if (EXT_PIPE[slug]){
    const zj = (state.jobs||[]).find(x => x.kind === "zanmang_autopilot" && kstDay(x.created_at) === today);
    const [cls, label] = !zj ? ["none","오늘 실행 전"]
      : zj.status === "succeeded" ? ["ok","오늘 실행 완료"]
      : zj.status === "running" ? ["run","실행 중"]
      : ["failed","dead"].includes(zj.status) ? ["bad","실패"] : ["wait","대기"];
    return {cls, label};
  }
  const alive = (state.wos||[]).filter(w => w.status !== "cancelled" && w.channel_slug === slug);
  const todays = alive.filter(w => kstDay(w.service_date || w.created_at) === today);
  const cur = todays.length ? todays[0] : alive[0];
  const st = cur ? woStatus(cur) : "none";
  const [cls, label] = GEN_DOT[st] || GEN_DOT.none;
  return {cls, label};
}
// 신호등 색은 테마 무관 동일 (홈 탭 점 색과 일치하도록 라이트에서도 다크 팔레트 고정)
const SIG_COLOR = { ok:"#0ca30c", wait:"#fab219", bad:"#d03b3b",
                    rej:"#d03b3b", run:"#3987e5", none:"var(--muted)" };

function chHeader(slug){
  const ch = (state.chans||[]).find(c => c.token_slug === slug) || {};
  const name = ch.name || chName(slug);
  const wOvr = (state.worksOvr||{})[slug];
  const works = (wOvr && wOvr.works) || ch.works || [];
  // 업로드 일자 = perf_video_map(유튜브 실발행 이력, 구 대시보드분 포함) ∪ publish 성공 잡(당일 보충)
  pvmLoad(slug);
  const pvm = pvmCache[slug];
  const upDays = new Set(pvm && pvm !== "loading" ? pvm.days : []);
  (state.wos||[]).filter(w => w.channel_slug === slug).forEach(w => {
    const pub = (state.jobsByWo[w.id]||[]).find(j => j.kind === "publish" && j.status === "succeeded");
    if (pub) upDays.add(kstDay(pub.finished_at || pub.updated_at));
  });
  const now = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Seoul"}));
  const base = new Date(now.getFullYear(), now.getMonth() + feedCalOff, 1);
  const y = base.getFullYear(), m = base.getMonth();
  const days = new Date(y, m + 1, 0).getDate(), first = base.getDay();
  const todayStr = kstDay(), pad = n => String(n).padStart(2, "0");
  const sig = chSignal(slug), sigColor = SIG_COLOR[sig.cls] || SIG_COLOR.none;
  let cnt = 0;
  const cells = ["일","월","화","수","목","금","토"].map(d => `<span class="dow">${d}</span>`);
  for (let i = 0; i < first; i++) cells.push("<span></span>");
  for (let d = 1; d <= days; d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const up = upDays.has(ds); if (up) cnt++;
    const cls = ["d", up && "up", ds === todayStr && "today", ds > todayStr && "future"]
      .filter(Boolean).join(" ");
    const tdStyle = ds === todayStr ? ` style="outline-color:${sigColor}"` : "";
    const tdTip = ds === todayStr ? ` · 오늘 · ${sig.label}` : "";
    cells.push(`<span class="${cls}"${tdStyle} title="${ds}${up ? " · 업로드 ✓" : ""}${tdTip}">${d}</span>`);
  }
  return `<div class="chhead">
    ${ch.channel_id
      ? `<a class="avlink" href="https://youtube.com/channel/${esc(ch.channel_id)}" target="_blank" rel="noopener" title="YouTube 채널 열기">${chAvatarHtml(slug, 74)}</a>`
      : chAvatarHtml(slug, 74)}
    <div class="info">
      <div class="nm">${esc(name)}
        <button class="mini" onclick="tab='channels';render()">템플릿 편집</button></div>
      <div class="wk"><b>오늘 신호등</b><span class="chdot ${sig.cls}" style="display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:5px"></span>${esc(sig.label)}</div>
      <div class="wk"><b>사용 작품</b>${works.length ? esc(works.join(", ")) : "배정된 작품 없음"}</div>
      <div class="wk" title="유튜브 채널에 올라와 있는 전체 영상 수 — perf_sync(매시간) 미러값${
          pvm && pvm.vdate ? " · " + esc(pvm.vdate) + " 집계" : ""}"><b>채널 영상</b>${
        pvm === "loading" ? '<span style="color:var(--muted)">집계 중…</span>'
        : (pvm && pvm.vcount != null)
          ? `<b style="font-size:13px">${fmtN(pvm.vcount)}개</b>${
              pvm.vdate && pvm.vdate !== kstDay()
                ? ` <span style="color:var(--muted)">· ${esc(String(pvm.vdate).slice(5))} 집계</span>` : ""}`
          : '<span style="color:var(--muted)">집계 없음</span>'}</div>
      <div class="wk" style="font-size:11.5px;color:var(--muted)">달력: 유튜브 발행 이력(구·신 대시보드 무관) + 오늘 발행분${pvm === "loading" ? " · 이력 불러오는 중…" : ""}</div>
    </div>
    <div class="chcal">
      <div class="mh"><button class="mini" onclick="feedCalNav(-1)">◀</button>
        <span>${y}년 ${m+1}월<span class="sum">업로드 ${cnt}일</span></span>
        <button class="mini" onclick="feedCalNav(1)">▶</button></div>
      <div class="cg">${cells.join("")}</div>
    </div>
  </div>`;
}

// ───────── 소스 (v3.3: 회차 그룹 + 채널별 잔량 + 소진 직접 수정 — 0023·0024) ─────────
let srcOpen = new Set();
window.srcToggle = w => { srcOpen.has(w) ? srcOpen.delete(w) : srcOpen.add(w); render(); };

// 이 채널이 실제로 맡은 작품 — 관제 수정본(0017) > channels.json 미러
function effWorks(slug){
  const o = (state.worksOvr||{})[slug];
  return (o && o.works)
      || ((state.chans||[]).find(c => c.token_slug === slug) || {}).works || [];
}

/* source_usage(파일 1행) + source_usage_by_channel(0023) → 회차 단위 지도.
   한 회차에 파일 행이 여럿인 경우가 실제로 있다(혜미리예채파 5화 3행 · 샤먼:미신전 회차NULL 6행).
   화면은 회차로 묶되, **숫자는 행 단위로 합산한다**(0027).
     · 종전엔 소진이 (작품, 회차) 단위라 행마다 같은 값이 와서 Math.max 가 맞았다.
     · 0027 부터 행(=영상)마다 자기 한도를 갖는다 — 5화에 8분·40분 영상이 하나씩이면
       한도는 1+3=4편이다. max 를 그대로 두면 3편으로 보이고, 한 영상이 소진되면
       회차 전체가 소진된 것처럼 보여 planner 가 배정하는 걸 관제가 설명 못 한다.
     · used_legacy 만은 예외 — 레거시 장부가 회차 단위라 뷰가 행마다 같은 값을 반복해
       준다. 합치면 행 수만큼 부풀므로 회차당 한 번만 센다.
     · 합산 대상은 **planner 가 실제로 고를 수 있는 행**뿐이다(활성 · 3분 초과).
       전부 더하면 비활성·짧은 클립까지 한도에 들어가 화면이 부풀고, 관제가 '남음 27'
       이라고 표시한 뒤 실행하면 RPC 가 거절한다 — 이 개편이 없애려던 바로 그 증상이
       반대 방향으로 되살아난다(실측: 국대 단편 한도 33 vs 실제 6). */
/* planner 가 실제로 고를 수 있는 행인가. 0031 부터 뷰가 usable 을 계산해 준다 —
   하한이 작품마다 다르므로(work_cards.min_source_duration_sec) 화면이 숫자를 알면
   또 어긋난다. 0031 적용 전(뷰에 컬럼이 없어 undefined)에는 종전 규칙으로 폴백한다. */
const srcUsable = r => r.usable != null
  ? r.usable === true
  : (r.is_active !== false && (r.duration_sec == null || Number(r.duration_sec) > 180));
function buildEpMap(srcs, byCh){
  const map = {}, key = ep => ep == null ? "-" : String(ep);
  (srcs||[]).forEach(r => {
    const m = map[r.work_title] = map[r.work_title] || {};
    const e = m[key(r.episode)] = m[key(r.episode)] ||
      { work:r.work_title, ep:r.episode, limit:0, active:false, dur:null,
        files:0, usable:0, usedAny:0, ids:[], limits:[], ch:{}, videos:[] };
    if (r.is_active !== false) e.active = true;
    e.files += 1; e.ids.push(r.source_id);
    // 0040: 영상 단위 상세 — 제외된 행도 목록에는 흐리게 보인다(왜 안 쓰는지 알 수 있게)
    e.videos.push({ sid:r.source_id, url:r.source_url || "", title:r.title || "",
                    dur:Number(r.duration_sec) || null, limit:Number(r.use_limit) || 0,
                    usable:srcUsable(r), active:r.is_active !== false,
                    wo:Number(r.times_used) || 0, pin:0,
                    ord:(r.published_ts || r.created_at || "") + "|" + r.source_id });
    if (!srcUsable(r)) return;                  // 비활성·3분 이하는 셈에서 뺀다
    e.usable  += 1;
    e.limit   += Number(r.use_limit)  || 0;     // 행별 한도의 합(0027)
    e.usedAny += Number(r.times_used) || 0;     // 전 채널 합 — 행별 사용의 합
    e.limits.push(Number(r.use_limit) || 0);
    // 길이는 쓸 수 있는 행에서만 집는다 — 비활성 57초 클립 하나가 회차 전체를
    // '3분 이하'로 만들어 화면에서 숨기면서 planner 는 정상 배정하는 일이 생겼다.
    const d = Number(r.duration_sec); if (!e.dur && d > 0) e.dur = d;
  });
  (byCh||[]).forEach(r => {
    const e = (map[r.work_title] || {})[key(r.episode)]; if (!e) return;
    if (!srcUsable(r)) return;                  // 한도와 같은 기준으로 센다
    const c = e.ch[r.channel_slug] = e.ch[r.channel_slug] || { wo:0, lg:0, pin:0, used:0 };
    c.wo  += Number(r.used_wo) || 0;
    c.pin += Number(r.used_legacy_pin) || 0;    // 0040: 영상에 못박힌 몫 — 행 단위 정확값
    c.lg   = Math.max(c.lg, Number(r.used_legacy) || 0);  // 못박히지 않은 회차 몫 — 한 번만
    c.used = c.wo + c.pin + c.lg;
    // 영상 행에도 이 채널 몫을 얹는다(전 채널 합) — 영상 목록의 사용량 재료
    const v = e.videos.find(v => v.sid === r.source_id);
    if (v) v.pin += Number(r.used_legacy_pin) || 0;
  });
  return map;
}

/* 0040: 회차 안의 영상 목록 — planner 와 같은 순서(업로드시각→등록시각)로 세우고,
   못박히지 않은 레거시 몫(회차 단위)은 planner 와 같은 규칙으로 **앞선 영상부터** 배분.
   순수 — 아래 검증 하니스가 이 함수를 그대로 꺼내 돌린다. */
function videoRows(e){
  const vids = (e.videos||[]).slice().sort((a,b) => a.ord < b.ord ? -1 : a.ord > b.ord ? 1 : 0);
  let lgUn = Object.values(e.ch||{}).reduce((s,c) => s + (c.lg||0), 0);
  return vids.map(v => {
    let take = 0;
    if (v.usable && lgUn > 0){
      take = Math.min(Math.max(v.limit - v.wo - v.pin, 0), lgUn);
      lgUn -= take;
    }
    const used = v.wo + v.pin + take;
    return { ...v, used, left: v.usable ? Math.max(v.limit - used, 0) : 0 };
  });
}
const epsOf    = w => Object.values((state.eps||{})[w] || {})
                        .sort((a,b) => (a.ep ?? 1e9) - (b.ep ?? 1e9));
// 쓸 수 있는 행이 하나라도 있으면 그 회차는 쓸 수 있다(0027: 회차에 영상이 여럿이다)
const epUsable = e => e.usable > 0;
const epUsed   = (e, slug) => (e.ch[slug] || {}).used || 0;
const epRemain = (e, slug) => Math.max(0, e.limit - epUsed(e, slug));   // 0023: 소진은 채널별

// 0040: 영상 목록 펼침 상태 — 회차 키(작품|회차)로 기억한다
let vidOpen = new Set();
window.vidToggle = k => { vidOpen.has(k) ? vidOpen.delete(k) : vidOpen.add(k); render(); };
const mmss = d => d == null ? "–" : Math.floor(d/60) + ":" + String(Math.round(d%60)).padStart(2,"0");

function videoList(e, chs, nextSid){
  const rows = videoRows(e).map(v => {
    const label = v.title || (v.url ? v.url.split("v=").pop() : v.sid.slice(0,8));
    const name  = v.url
      ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(label)}</a>`
      : esc(label);
    let tag;
    if (!v.usable) tag = `<span class="vtag off">${v.active ? "하한 미만" : "비활성"}</span>`;
    else if (v.sid === nextSid) tag = `<span class="vtag next">다음 차례</span>`;
    else if (v.left > 0) tag = `<span class="vtag">${v.left}편 남음</span>`;
    else tag = `<span class="vtag done">소진</span>`;
    const pct = v.limit ? Math.min(100, Math.round(v.used / v.limit * 100)) : 100;
    const src = v.wo ? `발주 ${v.wo}` : (v.used ? `레거시 ${v.used}` : "미사용");
    return `<div class="vidrow${v.usable ? "" : " dim"}"><span class="vt">${name}</span>
      <span class="vdur">${mmss(v.dur)}</span>
      <span class="gauge vsm"><i class="${v.left ? "" : "full"}" style="width:${pct}%"></i></span>
      <span class="cnt">${v.used}/${v.limit}</span>
      <span class="sub" style="min-width:56px">${src}</span>${tag}</div>`;
  }).join("");
  return `<div class="vids">${rows}</div>`;
}

function epBlock(e, chs, editable, nextSid){
  const sid  = e.ids[0];
  const lab  = e.ep != null ? e.ep + "회차" : "단편";
  const vkey = e.work + "|" + (e.ep == null ? "-" : e.ep);
  const vopen = vidOpen.has(vkey);
  // 영상이 여럿이거나 제목·URL 이 있으면 펼침 버튼을 단다(0040 이전 데이터면 안 뜬다)
  const canOpen = (e.videos||[]).some(v => v.url || v.title);
  const vbtn = canOpen
    ? `<button class="mini" data-k="${esc(vkey)}" onclick="vidToggle(this.dataset.k)">
         ${vopen ? "▾" : "▸"} 영상 ${e.files}개</button>` : "";
  const mins = e.dur ? `<span class="sub">${Math.floor(e.dur/60)}분</span>` : "";
  // 한도·남음은 쓸 수 있는 행만 센다 — 파일 수와 다르면 그 사실을 같이 보여준다
  const nf   = e.files > 1
    ? `<span class="sub">파일 ${e.files}개${
         e.usable < e.files ? ` · 쓸 수 있는 것 ${e.usable}개` : ""}</span>`
    : "";
  const dead = epUsable(e) ? ""
             : (!e.active ? '<span class="sub">비활성</span>'
                          : '<span class="sub">3분 이하 — 미사용</span>');
  /* 0027: 한도는 영상(파일 행)마다 걸린다. 입력칸은 '영상당' 값을 받아 이 회차의 행
     전부에 같은 값을 건다 — 회차 합계(e.limit)를 입력받으면 행마다 얼마씩 나눌지가
     모호해진다. 행마다 값이 다르면(길이 비례로 1·3 이 섞인다) 최댓값을 보여준다. */
  const each = e.limits.length ? Math.max(...e.limits) : 0;
  const mixed = new Set(e.limits).size > 1;
  const lim  = editable
    ? `<label class="ednum" title="${e.files > 1
          ? `영상 ${e.files}개 각각의 편수 상한. 저장하면 이 회차의 영상 전부에 같은 값이 걸립니다`
          : "이 영상으로 만들 편수 상한"}">
         ${e.files > 1 ? "영상당 한도" : "한도"}<input type="number" min="0" max="20"
                   value="${each}" data-sids="${esc(e.ids.join(","))}"
                   onchange="srcLimit(this)"></label>${
      e.files > 1 ? `<span class="sub">합계 ${e.limit}${mixed ? " · 영상별로 다름" : ""}</span>` : ""}`
    : `<span class="sub">한도 ${e.limit}${e.files > 1 ? ` (영상 ${e.files}개 합)` : ""}</span>`;
  const rows = chs.length ? chs.map(c => {
    const s = c.token_slug, u = e.ch[s] || { wo:0, lg:0 };
    const used = epUsed(e, s), remain = epRemain(e, s);
    const pct  = e.limit ? Math.min(100, Math.round(used / e.limit * 100)) : 100;
    const full = !epUsable(e) || remain === 0;
    const box  = editable
      ? `<input type="number" min="0" max="99" value="${used}" data-sid="${sid}"
                data-ch="${esc(s)}" onchange="srcUsed(this)"
                title="이 채널이 이 회차를 실제로 몇 번 썼는지. 발주 기록보다 낮게는 못 내립니다">`
      : "";
    return `<div class="eprow chrow"><span class="ep2" title="${esc(c.name)}">${esc(c.name)}</span>
      <span class="gauge"><i class="${full ? "full" : ""}" style="width:${pct}%"></i></span>
      <span class="cnt">${used}/${e.limit}</span>${box}
      <span class="sub">발주 ${u.wo}${u.lg ? ` · 보정 ${u.lg}` : ""}${
        full ? "" : ` · 남음 ${remain}`}</span></div>`;
  }).join("")
    : '<div class="eprow"><span class="sub">배정된 채널이 없어 소진되지 않습니다 — 채널 템플릿에서 작품을 배정하세요</span></div>';
  return `<div class="epgrp"><div class="ephd"><b>${lab}</b>${mins}${nf}${dead}${vbtn}
      <span class="right"></span>${lim}</div>${vopen ? videoList(e, chs, nextSid) : ""}${rows}</div>`;
}

function renderSources(){
  const chOf = w => (state.chans||[]).filter(c => effWorks(c.token_slug).includes(w));
  /* 며칠치 = 남은 편수 ÷ 배정 채널 수. source_watch(LOW_DAYS=3)가 보충 인입을 거는 기준과
     같은 셈을 쓴다 — 거기는 채널 구분 없이 (use_limit − 전체 사용)으로 세므로 여기도 그렇게
     센다. 그래야 '보충 인입 예약' 표시가 실제 동작과 어긋나지 않는다.
     (채널별 실제 잔량은 아래 회차 상세에 채널마다 따로 나온다.)
     작품이 30개·회차가 200개 넘으므로 정렬 비교자 안에서 다시 세지 않는다 — 한 번만 재고 쓴다. */
  const info = {};
  Object.keys(state.eps || {}).forEach(w => {
    const eps = epsOf(w), chs = chOf(w);
    const rem = eps.filter(epUsable).reduce((s,e) => s + Math.max(0, e.limit - e.usedAny), 0);
    info[w] = { eps, chs, rem, days: chs.length ? rem / chs.length : Infinity };
  });
  const works = Object.keys(info)
                  .sort((a,b) => (info[a].days - info[b].days) || a.localeCompare(b, "ko"));
  const editable = can("operator");

  const blocks = works.map(w => {
    const { eps, chs, rem, days } = info[w];
    const head = rem === 0
      ? chip("crit","✕","전 회차 소진 — 보충 인입 대기 중")
      : days <= 3
        ? chip("warn","!",`${rem}편 남음${days === Infinity ? "" : ` · ${Math.floor(days)}일치`} — 보충 인입 예약`)
        : chip("good","✓",`앞으로 ${rem}편${days === Infinity ? "" : ` · ${Math.floor(days)}일치`}`);
    const nexts = chs.map(c => {
      const e = eps.find(x => epUsable(x) && epRemain(x, c.token_slug) > 0);
      return `${c.name}: ${e ? (e.ep != null ? e.ep + "회차" : "단편") : "없음"}`;
    }).join(" · ");
    const open = srcOpen.has(w);
    // 0040: '다음 차례' 표시는 단일 채널 작품만 — 두 채널이 공유하는 작품(SNL)은 채널마다
    // 다음이 달라 하나로 못 찍는다(채널별 남음은 각 채널 줄에 이미 있다).
    const nextSid = chs.length === 1
      ? (() => { for (const e of eps){ const v = videoRows(e).find(x => x.usable && x.left > 0);
                 if (v) return v.sid; } return null; })()
      : null;
    return `<div class="srcwork">
      <div class="swh" style="cursor:pointer" data-w="${esc(w)}" onclick="srcToggle(this.dataset.w)">
        <span class="sub">${open ? "▾" : "▸"}</span><b>${esc(w)}</b>
        <span class="sub">${eps.length}개 회차</span>
        ${chs.length ? `<span class="sub">→ ${esc(chs.map(c => c.name).join(", "))}</span>`
                     : '<span class="sub">배정 채널 없음</span>'}
        <span class="right"></span>
        ${nexts ? `<span class="pill" title="채널별 다음 사용 회차">다음 ${esc(nexts)}</span>` : ""}
        ${head}</div>
      ${open ? eps.map(e => epBlock(e, chs, editable, nextSid)).join("") : ""}</div>`;
  }).join("");

  $("#page").innerHTML = `<section class="card">
    <h2>소스 창고 — 작품명을 누르면 회차별·채널별 잔량이 열립니다
      <button class="mini right" onclick="srcAll()">모두 ${srcOpen.size ? "접기" : "펼치기"}</button></h2>
    <div class="sub" style="margin-bottom:8px">소진은 채널별로 셉니다(0023) — 같은 회차를 두 채널이
      각자 한도만큼 씁니다. <b>한도</b>는 그 회차로 만들 편수 상한(등록 시 길이로 자동 결정: 10분 미만 1
      · 10~30분 2 · 30분↑ 3), <b>쓴 수</b>는 그 채널이 실제로 쓴 합계(발주 기록 + 레거시 보정)입니다.
      ${editable ? "숫자를 고치면 바로 저장됩니다." : "수정은 operator 권한이 필요합니다."}</div>
    ${(state.srcs||[]).length && !(state.srcCh||[]).length
      ? `<div class="sub" style="color:var(--serious);margin-bottom:8px">⚠ 채널별 소진
         (source_usage_by_channel)을 못 읽었습니다 — 아래 채널 숫자는 0으로 보입니다. 0023·0024
         적용 여부와 읽기 권한을 확인하세요.</div>` : ""}
    ${blocks || '<div class="empty">등록된 소스 없음 — 유튜브형은 자동, 파일형은 메인 맥에서 deploy/register_source.py 로 등록</div>'}
    </section>`;
}
window.srcAll = () => {
  srcOpen = srcOpen.size ? new Set() : new Set(Object.keys(state.eps || {}));
  render();
};
window.srcLimit = el => {
  const v = parseInt(el.value, 10);
  if (!Number.isInteger(v) || v < 0 || v > 20){
    toast("한도는 0~20 사이 정수여야 합니다", true); refresh(); return; }
  // 0027: set_source_limit 이 고른 그 행만 고친다 — 회차에 영상이 여럿이면 행마다 건다.
  // rpc() 헬퍼는 호출마다 토스트·refresh 를 내므로 여기서는 sb.rpc 를 직접 쓰고
  // 결과를 모아 한 번만 알린다. 거부되면 새로고침해 입력칸을 실제 값으로 되돌린다.
  const sids = (el.dataset.sids || "").split(",").filter(Boolean);
  Promise.all(sids.map(sid => sb.rpc("set_source_limit", { p_source: sid, p_limit: v })))
    .then(rs => {
      const bad = rs.find(r => r.error);
      if (bad) toast(`set_source_limit 거부: ${bad.error.message}`, true);
      else     toast(sids.length > 1 ? `영상 ${sids.length}개 한도 ${v}편으로 저장`
                                     : `한도 ${v}편으로 저장`);
      refresh();
    });
};
window.srcUsed = el => {
  const v = parseInt(el.value, 10);
  if (!Number.isInteger(v) || v < 0){
    toast("쓴 수는 0 이상 정수여야 합니다", true); refresh(); return; }
  rpc("set_source_used",
      { p_source: el.dataset.sid, p_channel: el.dataset.ch, p_used: v }, `쓴 수 ${v}로 저장`)
    .then(r => { if (r === null) refresh(); });
};

function paletteColors(){
  const base = ["#FFFFFF","#000000","#FFD84D","#FFFF00","#FF69B4","#F5F5F5","#FF3B30","#3987E5","#0CA30C"];
  const used = new Set();
  (state.chans||[]).forEach(c => {
    const o = state.designOvr[c.token_slug];
    const d = (o && o.design) || c.design || {};
    DESIGN_FIELDS.forEach(([k,,t]) => {
      if (t !== "color") return;
      const v = String(d[k] || "");
      if (/^#[0-9a-fA-F]{6}$/.test(v)) used.add(v.toUpperCase());
    });
  });
  return [...new Set([...base, ...used])];
}

const swatch = v => `<span class="sw" style="background:${esc(String(v))}"></span>`;
function renderChannels(){

    const effWorks = (wOvr && wOvr.works) || ch.works || [];
    const isExt = !!EXT_PIPE[ch.token_slug];

// ── 목업: 채널 설정 모달 (B안) ──
function chModalHtml(ch){

  const pal = paletteColors();

      const opts = t === "font" ? FONT_OPTIONS : STYLE_OPTIONS;
      const known = opts.some(([val]) => val === v);
      return `<select id="df_${k}">
        <option value="">${t === "font" ? "기본(" + esc(DESIGN_DEFAULTS[k] || "엔진 기본") + ")" : "자동(작품 장르 기준)"}</option>
        ${!v || known ? "" : `<option value="${esc(v)}" selected>${esc(v)} (직접 입력값)</option>`}
        ${opts.map(([val, lab]) => `<option value="${esc(val)}" ${v === val ? "selected" : ""}>${esc(lab)}</option>`).join("")}

    const def = DESIGN_DEFAULTS[k];
    return `<span class="crow"><input id="df_${k}" value="${esc(v)}"

  const others = (state.chans||[]).filter(c => c.token_slug !== slug);
  return `<div class="mmask" onclick="if(event.target===this){chEdit=null;render()}">
    <div class="mpanel">
      <div class="mhead">${chAvatarHtml(slug, 26)}<b>${esc(ch.name || slug)}</b>
        ${isOvr ? chip("info","✎","관제 수정본") : ""}
        <button class="mini right" onclick="chEdit=null;render()">✕ 닫기</button></div>

      <div class="msec"><div class="msec-h">작품 배정</div>
        <textarea id="wk_${slug}" rows="3" style="width:100%"
          placeholder="작품명을 줄 단위로 — laeebly 정본 표기와 똑같이">${esc(effWorks.join("\n"))}</textarea>
        <div class="dacts">
          <button class="mini pri act" style="padding:4px 12px;font-size:12px" onclick="worksSave('${esc(slug)}')">저장 — 다음 계획부터</button>

        <div class="sub">⚠ 작품명은 권리 정본(laeebly)·소스 등록과 글자까지 같아야 합니다</div></div>

      ${isExt
        ? `<div class="msec"><div class="msec-h">파이프라인</div>

            <select id="pe_${esc(slug)}">${epOpts(plan ? plan.work_title : effWorks[0])}</select>

        <div class="dacts">
          <button class="pri mini" onclick="chSave('${esc(slug)}')">✓ 저장 — 다음 생성부터 적용</button>
          ${isOvr ? `<button class="mini danger" data-l="해제" onclick="armed(this,'해제',()=>chClear('${esc(slug)}'))">파일 기본으로 해제</button>` : ""}
        </div>
        <div class="sub">빈 칸 = 미설정(엔진 기본). 저장은 통째 교체 — 화면에 보이는 그대로 적용됩니다.</div></div>
    </div></div>`;
}
// 디자인 diff 미리보기 — 폼 값 vs 현재 적용값
window.dfDiffUpdate = slug => {
  const ch = (state.chans||[]).find(c => c.token_slug === slug); if (!ch) return;
  const d = effDesign(ch).design || {};
  const diffs = [];
  for (const [k, l] of DESIGN_FIELDS){
    const el = $("#df_" + k); if (!el) return;
    const nv = el.value.trim();
    const ov = d[k] !== undefined ? String(d[k]) : "";
    if (nv !== ov) diffs.push(`${l}: ${ov || "기본"} → ${nv || "기본"}`);
  }
  const ftEl = $("#df_face_tracking");
  const ft = ftEl ? ftEl.value : "", oft = d.face_tracking === false ? "false" : "";
  if (ft !== oft) diffs.push(`얼굴크롭: ${oft ? "끔" : "기본(켬)"} → ${ft ? "끔" : "기본(켬)"}`);
  const box = $("#dfdiff"); if (!box) return;
  box.innerHTML = diffs.length
    ? "저장 시 바뀌는 것: " + diffs.map(x => esc(x)).join(" · ")
    : '<span class="sub">변경 없음 — 저장해도 지금과 동일</span>';
};
// 다른 채널 디자인 불러오기 (저장 전까지 미반영)
window.dfCopyFrom = (src, slug) => {
  if (!src) return;
  const ch = (state.chans||[]).find(c => c.token_slug === src); if (!ch) return;
  const d = effDesign(ch).design || {};
  for (const [k] of DESIGN_FIELDS){
    const el = $("#df_" + k); if (el) el.value = d[k] !== undefined ? String(d[k]) : "";
  }
  const f = $("#df_face_tracking"); if (f) f.value = d.face_tracking === false ? "false" : "";
  toast(`${ch.name || src} 디자인을 불러왔습니다 — 저장 전까지 반영되지 않습니다`);
  dfDiffUpdate(slug);
};
window.chSave = slug => {
  const design = {};
  for (const [k,,t] of DESIGN_FIELDS){
    const v = ($("#df_"+k)?.value ?? "").trim();
    if (!v) continue;
    design[k] = (t === "num" && /^-?\d+$/.test(v)) ? parseInt(v,10) : v;
  }
  if ($("#df_face_tracking")?.value === "false") design.face_tracking = false;
  if (!Object.keys(design).length){ toast("설정할 값이 없습니다 — 해제를 쓰세요", true); return; }
  chEdit = null;
  rpc("set_channel_design", { p_slug: slug, p_design: design }, "저장됨 — 다음 생성부터 적용");
};

};

      ].join("") : "";

// ───────── 노드·배포 ─────────
function renderInfra(){
  const nodes = (state.nodes||[]), deps = (state.deps||[]);
  const nodeCards = nodes.map(n => {
    const [cls,ic,lb] = NODE_ST[n.status] || ["mut","?",n.status];
    const hbOld = n.last_seen_at && Date.now()-new Date(n.last_seen_at).getTime() > 8*60*1000;
    const ev = n.engine_versions || {};
    const evs = Object.entries(ev).map(([k,v]) =>
      `<div class="kv"><span class="k">${esc(k)}</span><span class="v mono">${esc(v)}</span></div>`).join("");
    const acts = can("operator") ? `<div class="acts">
      ${n.status!=="active"  ? `<button class="mini" onclick="setNode('${esc(n.node_id)}','active')">활성화</button>`:""}
      ${n.status==="active"  ? `<button class="mini" onclick="setNode('${esc(n.node_id)}','draining')">드레인</button>`:""}
      ${n.status!=="disabled"? `<button class="mini danger" data-l="차단" onclick="armed(this,'차단',()=>setNode('${esc(n.node_id)}','disabled'))">차단</button>`:""}
      </div>` : "";
    // 0025: 이 맥에 예비 Gemini 키가 배포됐나. 미보고(구 워커)는 표시하지 않는다.
    const slots = ((n.meta||{}).gemini_slots)||null;
    const keyChip = !slots ? ""
      : slots.includes("fallback") ? chip("good","🔑","예비 키 있음")
      : chip("warn","🔑","예비 키 없음");
    return `<div class="node"><div class="hd"><b>${esc(n.node_id)}</b>${chip(cls,ic,lb)}
        ${hbOld ? chip("serious","⚠","무응답") : ""}${keyChip}</div>
      <div class="kv"><span class="k">심박</span><span class="v">${ago(n.last_seen_at)}</span></div>
      <div class="kv"><span class="k">디스크</span><span class="v">${n.disk_free_gb!=null?Number(n.disk_free_gb).toFixed(0)+" GB":"—"}</span></div>
      ${evs || '<div class="sub">엔진 버전 미보고</div>'}${acts}</div>`;
  }).join("");
  const engines = deps.map(d => d.engine);
  const matrix = `<tr><th>engine \ node</th>${nodes.map(n=>`<th class="mono">${esc(n.node_id)}</th>`).join("")}<th>origin</th></tr>` +
    engines.map(eng => {
      const d = deps.find(x=>x.engine===eng) || {};
      const target = (d.pinned_sha || d.last_seen_sha || "").slice(0,7);
      return `<tr><td>${esc(eng)}${d.pinned_sha?' 📌':''}</td>${nodes.map(n => {
        const sha = ((n.engine_versions||{})[eng]||"").slice(0,7);
        const ok = sha && target && (target.startsWith(sha) || sha.startsWith(target));
        return `<td class="mono ${sha ? (ok?"shaok":"shabad") : ""}">${esc(sha||"—")}</td>`;
      }).join("")}<td class="mono">${esc(target||"—")}</td></tr>`;
    }).join("");
  const depRows = deps.map(d => {
    const acts = can("operator") ? (d.pinned_sha
      ? `<button class="mini" onclick="rpc('unpin_engine',{p_engine:'${esc(d.engine)}'},'핀 해제')">핀 해제</button>`

// ───────── 성과 (v3.3: 기간 선택 + 그래프 대시보드 — perf_* 미러 직결) ─────────
// 원본 3종은 perf_sync(스케줄러, 매시간)가 laeebly 에서 복사해 둔 것이다.
//   perf_video_snapshot   일별 영상 조회/좋아요        perf_video_map  영상↔채널·발행일·내려간 시각
//   perf_channel_snapshot 일별 구독자·채널 누적 조회

// 그 구멍에서 톱니가 생기므로 — 영상 하나하나의 관측점을 선형 보간해 매일 값을 만든 뒤
// 차분한다. 결측 뒤로 몰리지 않으면서 구간 총량은 그대로 보존된다.
let perf = null, perfLoading = false, perfSort = { col: "dper", dir: -1 };
// 지표 셋을 한 페이지에 나란히 그린다. 영상 스냅샷에서 오는 것(views·likes)과 채널
// 스냅샷에서 오는 것(subs)이 섞여 있어 시리즈 키를 따로 든다 — subs 는 "누적"이 아니라
// 그 시점의 구독자 수라 누적 차트의 제목·해석이 다르다(absolute).
const PERF_METRICS = {
  views: { key: "cum", label: "조회수", daily: "일별 조회 증가", total: "누적 조회수",
           unit: "회", color: "var(--accent)" },
  likes: { key: "lik", label: "좋아요", daily: "일별 좋아요 증가", total: "누적 좋아요",

           unit: "명", color: "var(--good)", absolute: true },

const PERF_COV_LOW = 0.7;   // 이 아래면 "그날 대부분이 보간 추정" — 차트에 음영으로 표시한다
// perf_sync 가 ops_config.perf_backfill_status 에 남기는 보완 상태.
// laeebly 가 통계를 안 주는 채널은 YouTube 공개 API 로 메우는데, 키가 없으면 그 보완이
// 통째로 멈춘다(2026-08 실측: 8일간 6개 채널 48편이 비었고 화면엔 아무 표시가 없었다).
const PERF_BACKFILL_MSG = {
  api_key_missing: ["노드에 YouTube API 키가 없어 성과 보완이 멈춰 있습니다",
                    "스케줄러 노드의 secrets/ves.env 에 YOUTUBE_API_KEY 를 넣으면 다음 회전(1시간 내)에 채워집니다"],
  api_error: ["YouTube API 호출이 실패해 성과 보완이 되지 않았습니다",
              "키가 만료됐거나 하루 쿼터를 넘겼을 수 있습니다"],
  partial: ["일부 영상만 보완됐습니다", "비공개·삭제된 영상은 API 가 통계를 주지 않습니다 — 그만큼은 정상입니다"],
  // 호출은 멀쩡한데 받을 게 없는 경우 — 비공개로 돌린 영상이 대개 여기다(붉게 띄우지 않는다)
  unavailable: ["통계를 받을 수 없는 영상이 있습니다",
                "비공개로 돌렸거나 삭제된 영상입니다 — YouTube API 가 통계를 주지 않으니 성과에서도 빠집니다"],
};
const PERF_BACKFILL_SOFT = ["partial", "unavailable"];
function perfBackfillNote(){
  const row = (state.ops || {}).perf_backfill_status;

  </section>`;
}
let perfFrom = null, perfTo = null;   // 직접 지정 구간(YYYY-MM-DD). 있으면 프리셋보다 우선
let perfVid = null;                   // 상세를 펼친 영상(content_id)
// 채널 멀티 필터 — null=전체, Set=선택된 채널들(빈 Set=전부 해제). 차트·표 전부에 걸린다.
let perfChSet = null, perfFilterOpen = false;
let perfDays = 28;   // 기간 프리셋(일) — 0 이면 보유 전체
let perfLoadedDays = 0;      // 지금 perf 에 담긴 스냅샷 창(일). 더 긴 기간을 고르면 다시 받는다
const PERF_RANGES = [[7, "7일"], [14, "14일"], [28, "28일"], [90, "90일"], [0, "전체"]];
const PERF_MAX_DAYS = 120;   // perf_sync KEEP_DAYS 와 짝 — 미러가 보관하는 상한
// 구간 첫날의 증가분을 내려면 하루 전 값이 있어야 한다 → 고른 기간 + 이틀
const perfWant = d => d > 0 ? Math.min(d + 2, PERF_MAX_DAYS) : PERF_MAX_DAYS;
// 지금 화면이 요구하는 로드 창(일). 직접 지정 구간은 그 시작일까지 거슬러 필요하다.
function perfNeedDays(){
  if (!perfFrom) return perfWant(perfDays);
  const back = Math.round((Date.parse(kstDay() + "T00:00:00Z") - Date.parse(perfFrom + "T00:00:00Z")) / DAY_MS);
  return Math.min(PERF_MAX_DAYS, Math.max(3, back + 2));
}
const fmtN = v => v == null ? "—" : Number(v).toLocaleString("ko-KR");
const fmtD = v => v == null ? "—" : (v > 0 ? "+" : "") + Number(v).toLocaleString("ko-KR");
// 축·타일용 축약 — 12,345 → 1.2만
const fmtK = v => { const n = Math.abs(Number(v) || 0);
  return n >= 10000 ? (v / 10000).toFixed(n >= 100000 ? 0 : 1) + "만"
       : n >= 1000 ? (v / 1000).toFixed(1) + "천" : String(Math.round(v)); };
const chNameById = id => { const c = (state.chans||[]).find(x => x.channel_id === id);
  return (c && c.name) || (id || "").slice(0,10); };
const DAY_MS = 86400000;
const dayAdd = (ds, n) => new Date(Date.parse(ds + "T00:00:00Z") + n * DAY_MS).toISOString().slice(0,10);
const mmdd = ds => ds.slice(5).replace("-", "/");

async function loadPerf(days){
  if (perfLoading) return; perfLoading = true;
  const want = perfWant(days);
  const from = dayAdd(kstDay(), -want);
  try {
    const [vs, vm, cs] = await Promise.all([
      // 고른 기간만큼만 받는다 — 실측 2026-08 은 영상 291 × 40일 ≈ 4.9천 행이지만
      // 영상이 늘면 (영상 수 × 일수)로 커진다. 한도에 닿으면 서버 집계 RPC 로 옮길 것.
      sb.from("perf_video_snapshot").select("content_id,snapshot_date,view_count,like_count")
        .gte("snapshot_date", from).limit(60000),
      sb.from("perf_video_map").select("*").limit(3000),
      sb.from("perf_channel_snapshot").select("*").gte("snapshot_date", from).limit(20000),
    ]);
    if (vs.error || vm.error || cs.error) throw new Error((vs.error||vm.error||cs.error).message);
    perf = (vs.data||[]).length ? { vs: vs.data, vm: vm.data||[], cs: cs.data||[] } : { empty: true };
    perfLoadedDays = want;
  } catch(e){ perf = { error: String(e.message || e) }; }
  finally { perfLoading = false; render(); }
}

// 영상 하나의 관측점(o) 을 매일 값으로 편다. ix 는 관측 항목(1=조회, 2=좋아요).
// 보유 구간 안에서 발행된 영상은 발행일 0 에서 출발한다 — 첫 스냅샷까지의 조회가 발행
// 이후 날들로 분배된다. 구간 밖 발행분은 첫 관측값이 기준선일 뿐(증가로 세지 않음).
function perfInterp(o, ix, N, pubI){
  const arr = new Array(N).fill(null);
  let pi, pv;
  if (pubI != null && pubI < o[0][0]) { pi = pubI; pv = 0; }
  else { pi = o[0][0]; pv = o[0][ix]; }
  arr[pi] = pv;
  o.forEach(pt => { const i = pt[0], v = pt[ix];
    if (i <= pi) { arr[i] = v; return; }
    const span = i - pi, dv = v - pv;
    for (let k = 1; k <= span; k++) arr[pi + k] = Math.round(pv + dv * k / span);
    pi = i; pv = v;
  });
  for (let k = pi + 1; k < N; k++) arr[k] = pv;   // 마지막 관측 이후는 값 유지(증가 0)
  return arr;
}

// 원본 → 파생. 영상별 일별 시리즈(보간)와 채널별 합계를 만든다 — perf 를 새로 받을 때 한 번만.
function perfBuild(){
  if (perf.built) return perf.built;
  let min = null, max = null;
  perf.vs.forEach(s => { const d = s.snapshot_date;
    if (!min || d < min) min = d; if (!max || d > max) max = d; });
  const dates = []; for (let d = min; d <= max; d = dayAdd(d, 1)) dates.push(d);
  const N = dates.length, at = new Map(dates.map((d, i) => [d, i]));

  const obs = new Map();   // content_id → [[날짜인덱스, 조회, 좋아요], ...]
  perf.vs.forEach(s => { const i = at.get(s.snapshot_date); if (i === undefined) return;
    let a = obs.get(s.content_id); if (!a) obs.set(s.content_id, a = []);
    a.push([i, Number(s.view_count)||0, Number(s.like_count)||0]); });

  const vids = [];
  perf.vm.forEach(m => {
    const o = (obs.get(m.content_id) || []).sort((x, y) => x[0] - y[0]);
    if (!o.length) return;                       // 스냅샷이 아직 없는 영상 — 표·차트에서 제외
    const pub = m.published_at ? kstDay(m.published_at) : null;
    const pubI = pub && at.has(pub) ? at.get(pub) : null;
    const last = o[o.length - 1];
    vids.push({ cid: m.content_id, chId: m.channel_id, ch: chNameById(m.channel_id),
      title: m.title || m.content_id, work: m.work_title || "", dead: !!m.dead_at,
      pub: pub || "", cum: perfInterp(o, 1, N, pubI), lik: perfInterp(o, 2, N, pubI),
      obs: new Set(o.map(x => x[0])), views: last[1], likes: last[2] });
  });

  const chans = new Map();
  const ensure = (chId) => { const ch = chNameById(chId); let g = chans.get(ch);
    if (!g) chans.set(ch, g = { ch, chId, cum: new Array(N).fill(0), lik: new Array(N).fill(0),
      ups: new Array(N).fill(0), subs: new Array(N).fill(null),
      chViews: new Array(N).fill(null), vids: 0,
      seen: new Array(N).fill(0), live: new Array(N).fill(0) });
    return g; };
  vids.forEach(v => { const g = ensure(v.chId); g.vids++;
    for (let i = 0; i < N; i++){
      if (v.cum[i] != null) g.cum[i] += v.cum[i];
      if (v.lik[i] != null) g.lik[i] += v.lik[i];
    } });
  // 업로드 수는 vm 전체에서 센다 — 방금 발행돼 아직 스냅샷이 없는 영상도 올라간 건 올라간 것.
  perf.vm.forEach(m => { if (!m.published_at) return;
    const i = at.get(kstDay(m.published_at)); if (i === undefined) return;
    ensure(m.channel_id).ups[i]++; });
  // 일별 수집률 = 그날 스냅샷이 찍힌 영상 ÷ 그날 살아 있던 영상.
  // 원천 수집이 성겼던 구간(2026-06~07 실측 27~32%)의 증가값은 관측이 아니라 보간 추정이다.
  const chOf = new Map(perf.vm.map(m => [m.content_id, m.channel_id]));
  perf.vm.forEach(m => {
    if (!m.published_at) return;
    const pd = kstDay(m.published_at);
    const from = at.has(pd) ? at.get(pd) : (pd < dates[0] ? 0 : -1);
    if (from < 0) return;                         // 보유 구간 뒤에 올라온 영상
    let to = N - 1;
    if (m.dead_at){ const dd = kstDay(m.dead_at);
      if (at.has(dd)) to = at.get(dd); else if (dd < dates[0]) return; }
    const g = ensure(m.channel_id);
    for (let i = from; i <= to; i++) g.live[i]++;
  });
  perf.vs.forEach(s => { const i = at.get(s.snapshot_date); if (i === undefined) return;
    const cid = chOf.get(s.content_id); if (cid === undefined) return;
    ensure(cid).seen[i]++; });
  // 채널 스냅샷(구독자·채널 누적 조회) — 결측일은 직전 값을 끌고 간다
  const csAt = new Map();
  perf.cs.forEach(s => { const i = at.get(s.snapshot_date); if (i === undefined) return;
    const g = ensure(s.channel_id); let arr = csAt.get(g.ch);
    if (!arr) csAt.set(g.ch, arr = new Array(N).fill(null));
    arr[i] = s; });
  chans.forEach(g => { const arr = csAt.get(g.ch); if (!arr) return;
    let ls = null, lv = null;
    for (let i = 0; i < N; i++){ const s = arr[i];
      if (s){ ls = Number(s.subscriber_count); lv = Number(s.view_count); }
      g.subs[i] = ls; g.chViews[i] = lv; } });

  perf.built = { dates, N, vids, chans: [...chans.values()], maxDate: max, minDate: min };
  return perf.built;
}

// 기간·채널 필터를 적용한 뷰 — 타일·차트·표가 전부 이걸 본다.
function perfView(){
  const B = perfBuild(), N = B.N;
  // 표시 구간 [a..b] — 직접 지정한 날짜는 보유 범위 밖이면 가까운 쪽으로 붙인다
  let a, b;
  if (perfFrom || perfTo){
    const i0 = perfFrom ? B.dates.findIndex(d => d >= perfFrom) : 0;
    a = i0 < 0 ? N - 1 : i0;
    b = N - 1;
    if (perfTo){ let k = -1; B.dates.forEach((d, i) => { if (d <= perfTo) k = i; }); b = k < 0 ? a : k; }
    if (b < a) b = a;
  } else {
    a = N - (perfDays > 0 ? Math.min(perfDays, N) : N); b = N - 1;
  }
  const span = b - a + 1;
  const sel = B.chans.filter(g => !perfChSet || perfChSet.has(g.ch));
  const dates = B.dates.slice(a, b + 1);
  const at = (key, i) => sel.reduce((t, g) => t + (g[key][i] || 0), 0);
  const seriesOf = key => dates.map((_, i) => at(key, a + i));
  const before = key => a > 0 ? at(key, a - 1) : null;   // 구간 첫날의 증가분을 낼 기준점
  const dailyOf = (arr, prev) => arr.map((v, i) => i ? v - arr[i-1] : (prev == null ? 0 : v - prev));

  // 지표 셋을 한꺼번에 만든다 — 화면이 셋을 나란히 그린다
  const metrics = {};
  Object.keys(PERF_METRICS).forEach(k => { const M = PERF_METRICS[k];
    const total = seriesOf(M.key), daily = dailyOf(total, before(M.key));
    metrics[k] = { M, total, daily, end: total[total.length-1],
                   gain: daily.reduce((t, v) => t + v, 0) }; });
  const ups = seriesOf("ups"), upTotal = ups.reduce((t, v) => t + v, 0);
  // 수집률(0~1) — 낮은 날은 차트에 음영으로 표시하고 툴팁에도 적는다
  const cov = dates.map((_, i) => { const live = at("live", a + i);
    return live ? Math.min(1, at("seen", a + i) / live) : null; });
  const covOk = cov.filter(v => v != null);
  const covAvg = covOk.length ? covOk.reduce((t, v) => t + v, 0) / covOk.length : null;
  const covLow = cov.filter(v => v != null && v < PERF_COV_LOW).length;
  const cum = metrics.views.total, gain = metrics.views.gain;
  // 전기(같은 길이의 직전 구간) 조회 증가 — 비교할 데이터가 있을 때만
  const prevGain = (a - span - 1 >= 0) ? at("cum", a - 1) - at("cum", a - span - 1) : null;

  // 채널별 요약(같은 구간) — 표·막대·스파크라인이 같은 행을 쓴다
  const rowsCh = sel.map(g => {
    const take = key => { const arr = g[key].slice(a, b + 1);
      const prev = a > 0 ? g[key][a-1] : arr[0];
      return { arr, end: arr[arr.length-1], gain: (arr[arr.length-1] || 0) - (prev || 0) }; };
    const v = take("cum"), l = take("lik");
    return { ch: g.ch, chId: g.chId, vids: g.vids,
      upsArr: g.ups.slice(a, b + 1), ups: g.ups.slice(a, b + 1).reduce((t, x) => t + x, 0),
      gain: v.gain, cum: v.end, likes: l.end, likeGain: l.gain,
      subs: g.subs[b], dsubs: (g.subs[b] != null && g.subs[a] != null) ? g.subs[b] - g.subs[a] : null,
      chViews: g.chViews[b],
      series: v.arr.map((x, i) => i ? x - v.arr[i-1] : 0) };
  }).sort((x, y) => (y.gain||0) - (x.gain||0));

  // 영상별 행 — "기간 조회수"는 구간 시작 직전 값 대비, 즉 그 기간에 벌어들인 조회수다
  const rowsVid = B.vids.filter(v => !perfChSet || perfChSet.has(v.ch)).map(v => {
    const span2 = arr => { const cb = arr[b], prev = a > 0 ? arr[a-1] : arr[a];
      return cb == null ? null : cb - (prev == null ? 0 : prev); };
    return { title: v.title, work: v.work, ch: v.ch, cid: v.cid, dead: v.dead, pub: v.pub,
      views: v.cum[b] == null ? v.views : v.cum[b],
      dper: span2(v.cum), likes: v.lik[b] == null ? v.likes : v.lik[b], dlike: span2(v.lik),
      isNew: !!(v.pub && v.pub >= dates[0]) };
  });
  const fresh = rowsVid.filter(r => r.isNew);
  return { B, a, b, span, dates, metrics, cum, ups, cov, covAvg, covLow,
    daily: metrics.views.daily, gain, prevGain,
    likeNow: metrics.likes.end, likeGain: metrics.likes.gain,
    subsNow: at("subs", b), dsubs: at("subs", b) - at("subs", a), chViewNow: at("chViews", b),
    upTotal, rowsCh, rowsVid, freshCount: fresh.length,
    freshAvg: fresh.length ? Math.round(fresh.reduce((t, r) => t + (r.views||0), 0) / fresh.length) : null };
}

// ── 인라인 SVG 차트 (대시보드는 단일 파일 자급자족 — 차트 라이브러리를 두지 않는다) ──
// 원천 수집이 성겼던 날은 값이 관측이 아니라 보간 추정이다 — 그 구간에 음영을 깔아
// "여기는 덜 믿을 값"이라고 화면이 먼저 말하게 한다(연속 구간은 하나로 묶어 그린다).
function pfCovBand(cov, X, n, pw, T, ph){
  if (!cov.length) return "";
  const w = pw / Math.max(1, n), out = [];
  let from = -1;
  const flush = to => { if (from < 0) return;
    const x0 = X(from) - w / 2, x1 = X(to) + w / 2;
    out.push(`<rect x="${x0.toFixed(1)}" y="${T}" width="${(x1 - x0).toFixed(1)}" height="${ph}"
      fill="var(--muted)" opacity=".13"/>`); from = -1; };
  cov.forEach((v, i) => { const low = v != null && v < PERF_COV_LOW;
    if (low && from < 0) from = i;
    if (!low) flush(i - 1); });
  flush(n - 1);
  return out.join("");
}
const pfCovTip = v => v == null ? "" :
  ` · 수집 ${Math.round(v * 100)}%${v < PERF_COV_LOW ? "(대부분 보간 추정)" : ""}`;
// 선택 지표의 일별 증가(라인/영역) + 업로드 수(막대) 콤보. 날짜마다 투명 rect 를 깔아 툴팁.
function pfCombo(dates, daily, ups, M, W, H, cov){
  W = W || 560; H = H || 240; cov = cov || [];
  const hasUp = ups.some(u => u), L = 52, R = hasUp ? 40 : 12, T = 14, BM = 28;
  const pw = W - L - R, ph = H - T - BM, n = dates.length;
  const hi = Math.max(1, ...daily), lo = Math.min(0, ...daily);
  const maxU = Math.max(1, ...ups);
  const X = i => n === 1 ? L + pw / 2 : L + pw * i / (n - 1);
  const Y = v => T + ph - ph * (v - lo) / (hi - lo);
  const uh = ph * 0.4, bw = Math.max(3, Math.min(20, (pw / Math.max(1, n)) * 0.55));
  const pts = daily.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const step = Math.max(1, Math.ceil(n / 8));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 조회 증가와 업로드 수">
    ${[hi, (hi + lo) / 2, lo].map(v => `<line class="gl" x1="${L}" x2="${L + pw}"
      y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke-dasharray="${v === 0 ? "" : "3 4"}"/>
      <text class="ax" x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmtK(v)}</text>`).join("")}
    ${pfCovBand(cov, X, n, pw, T, ph)}
    ${!hasUp ? "" : ups.map((u, i) => u ? `<rect x="${(X(i) - bw / 2).toFixed(1)}"
      y="${(T + ph - uh * u / maxU).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${(uh * u / maxU).toFixed(1)}" rx="2" fill="var(--info)" opacity=".5"/>` : "").join("")}
    <polygon points="${X(0).toFixed(1)},${Y(lo).toFixed(1)} ${pts} ${X(n-1).toFixed(1)},${Y(lo).toFixed(1)}"
      fill="${M.color}" opacity=".09"/>
    <polyline points="${pts}" fill="none" stroke="${M.color}" stroke-width="2.2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${n <= 45 ? daily.map((v, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6"
      fill="${M.color}"/>`).join("") : ""}
    ${hasUp ? `<text class="ax" x="${L + pw + 8}" y="${(T + ph - uh).toFixed(1)}"
      fill="var(--info)">${maxU}편</text>` : ""}
    ${dates.map((d, i) => i % step === 0 || i === n - 1
      ? `<text class="ax" x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${mmdd(d)}</text>` : "").join("")}
    ${dates.map((d, i) => `<rect class="hit" x="${(X(i) - pw / Math.max(1, n) / 2).toFixed(1)}" y="${T}"
      width="${(pw / Math.max(1, n)).toFixed(1)}" height="${ph}" fill="transparent"
      ><title>${esc(d)} · ${M.label} ${fmtD(daily[i])}${M.unit}${
        hasUp ? ` · 업로드 ${ups[i]}편` : ""}${pfCovTip(cov[i])}</title></rect>`).join("")}
  </svg>`;
}

// 선택 지표의 누적(구독자는 그 시점 값) — 세로축을 0 부터 잡으면 변화가 안 보여
// 데이터 범위에 맞춘다(캡션에 명시).
function pfArea(dates, cum, M, W, H, cov){
  W = W || 560; H = H || 240; cov = cov || [];
  const L = 52, R = 12, T = 14, BM = 28;
  const pw = W - L - R, ph = H - T - BM, n = dates.length;
  const hi = Math.max(...cum), lo = Math.min(...cum);
  const pad = (hi - lo) * 0.15 || Math.max(1, hi * 0.02);
  const y0 = Math.max(0, lo - pad), y1 = hi + pad;
  const X = i => n === 1 ? L + pw / 2 : L + pw * i / (n - 1);
  const Y = v => T + ph - ph * (v - y0) / (y1 - y0 || 1);
  const pts = cum.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const step = Math.max(1, Math.ceil(n / 8));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="누적 조회수 추이">
    ${[y1, (y0 + y1) / 2, y0].map(v => `<line class="gl" x1="${L}" x2="${L + pw}"
      y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke-dasharray="3 4"/>
      <text class="ax" x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmtK(v)}</text>`).join("")}
    ${pfCovBand(cov, X, n, pw, T, ph)}
    <polygon points="${X(0).toFixed(1)},${(T + ph).toFixed(1)} ${pts} ${X(n-1).toFixed(1)},${(T + ph).toFixed(1)}"
      fill="${M.color}" opacity=".14"/>
    <polyline points="${pts}" fill="none" stroke="${M.color}" stroke-width="2.2"
      stroke-linejoin="round"/>
    ${dates.map((d, i) => i % step === 0 || i === n - 1
      ? `<text class="ax" x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${mmdd(d)}</text>` : "").join("")}
    ${dates.map((d, i) => `<rect class="hit" x="${(X(i) - pw / Math.max(1, n) / 2).toFixed(1)}" y="${T}"
      width="${(pw / Math.max(1, n)).toFixed(1)}" height="${ph}" fill="transparent"
      ><title>${esc(d)} · ${esc(M.total)} ${fmtN(cum[i])}${M.unit}${pfCovTip(cov[i])}</title></rect>`).join("")}
  </svg>`;
}

// 채널 표에 들어가는 미니 추이선(선택 지표의 일별 증가)
function pfSpark(vals, w, h, color){
  const n = vals.length; if (!n) return "";
  const hi = Math.max(1, ...vals), lo = Math.min(0, ...vals);
  const X = i => n === 1 ? w / 2 : w * i / (n - 1);
  const Y = v => h - 1 - (h - 2) * (v - lo) / (hi - lo || 1);
  return `<svg class="pf-spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"
    preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${color}"
    stroke-width="1.6" points="${vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}"/></svg>`;
}

// 채널별 영상 개수 — 기간 안에 올린 분(밝은 파랑)과 그 전부터 있던 분을 이어 붙인 가로 막대.
function pfChBars(V){
  const rows = V.rowsCh.slice().sort((x, y) => y.vids - x.vids);
  const max = Math.max(1, ...rows.map(r => r.vids));
  return `<div class="pf-cb">${rows.map(r => { const old = Math.max(0, r.vids - r.ups);
    return `<div class="nm ${perfChSet && perfChSet.has(r.ch) ? "sel" : ""}"
        title="클릭 — 이 채널만 보기 (다시 클릭하면 전체)" onclick="perfChOnly('${esc(r.ch)}')">${esc(r.ch)}</div>
      <div class="bar" title="${esc(r.ch)} · 추적 영상 ${r.vids}편 (최근 ${V.span}일 업로드 ${r.ups}편)">
        <i style="width:${(old / max * 100).toFixed(1)}%"></i>
        <b style="width:${(Math.min(r.ups, r.vids) / max * 100).toFixed(1)}%"></b></div>
      <div class="n">${fmtN(r.vids)}<span>${r.ups ? " +" + r.ups : ""}</span></div>`; }).join("")
    || '<div class="empty">채널 없음</div>'}</div>`;
}

// 업로드 히트맵 — "어느 채널이 며칠에 몇 편 올렸나" 를 한 판에. 진할수록 그날 편수가 많다.
function pfHeat(V){
  const dates = V.dates, n = dates.length, today = kstDay();
  const rows = V.rowsCh.slice().sort((a, b) => (b.ups||0) - (a.ups||0));
  const maxU = Math.max(1, ...rows.flatMap(r => r.upsArr));
  const step = Math.max(1, Math.ceil(n / 10));
  const cols = `grid-template-columns:repeat(${n},minmax(0,1fr))`;
  return `<div class="pf-heat">
    <div></div><div class="row" style="${cols}">${dates.map((d, i) =>
      `<div class="hd">${i % step === 0 || i === n - 1 ? mmdd(d) : ""}</div>`).join("")}</div>
    ${rows.map(r => `<div class="nm ${perfChSet && perfChSet.has(r.ch) ? "sel" : ""}"
        title="클릭 — 이 채널만 보기 (다시 클릭하면 전체)" onclick="perfChOnly('${esc(r.ch)}')">${esc(r.ch)}</div>
      <div class="row" style="${cols}">${r.upsArr.map((u, i) => `<div
        class="c ${u ? "up" : ""} ${dates[i] === today ? "today" : ""}"
        ${u ? `style="opacity:${(0.3 + 0.7 * u / maxU).toFixed(2)}"` : ""}
        title="${esc(r.ch)} · ${esc(dates[i])} · ${u ? u + "편 업로드" : "업로드 없음"}"></div>`).join("")}</div>`).join("")
    || '<div class="empty">채널 없음</div>'}
  </div>`;
}

// 영상 하나의 상세 — 표에서 행을 누르면 그 아래로 펼친다(대시보드 관행: bdetail).
// 차트는 표시 구간이 아니라 그 영상이 살아온 전 구간을 그린다 — 발행 직후 급상승이
// 구간 밖으로 잘려 나가면 영상을 판단할 수 없다.
function pfVidDetail(V, cid){
  const v = V.B.vids.find(x => x.cid === cid);
  if (!v) return '<div class="empty">이 영상의 스냅샷이 없습니다</div>';
  let s0 = v.cum.findIndex(x => x != null); if (s0 < 0) s0 = 0;
  const ds = V.B.dates.slice(s0), cum = v.cum.slice(s0), lik = v.lik.slice(s0);
  const dOf = arr => arr.map((x, i) => i ? (x||0) - (arr[i-1]||0) : 0);
  // 이 영상이 실제로 찍힌 날 = 1, 아니면 0 — 차트가 추정 구간에 음영을 깐다
  const cov = ds.map((_, i) => v.obs.has(s0 + i) ? 1 : 0);
  const miss = cov.filter(x => !x).length;
  const views = cum[cum.length-1] || 0, likes = lik[lik.length-1] || 0;
  const prevC = V.a > 0 ? v.cum[V.a-1] : v.cum[V.a];
  const gain = (v.cum[V.b] || 0) - (prevC || 0);
  const pubI = v.pub ? V.B.dates.indexOf(v.pub) : -1;
  const age = v.pub ? Math.round((Date.parse(V.B.maxDate + "T00:00:00Z")
                                - Date.parse(v.pub + "T00:00:00Z")) / DAY_MS) + 1 : null;
  // 첫날·첫 7일은 그 시기 스냅샷이 있어야 낼 수 있다 — 보유 구간 밖 발행분은 알 수 없다
  const at = k => pubI >= 0 ? (v.cum[Math.min(pubI + k, V.B.N - 1)] || 0) - (v.cum[pubI] || 0) : null;
  const d1 = at(1), d7 = at(7);
  const box = (val, k, tip) => `<span title="${esc(tip||"")}"><b>${val}</b>${k}</span>`;
  return `<div class="pf-vd">
    <img class="th" src="https://i.ytimg.com/vi/${esc(cid)}/mqdefault.jpg" alt=""
      loading="lazy" onerror="this.remove()">
    <div class="meta">
      <div class="t">${v.dead ? '<span class="sub" title="내려간 영상">†</span> ' : ""}${esc(v.title)}</div>
      <div class="m">${esc(v.ch)}${v.work ? " · " + esc(v.work) : ""}${
        v.pub ? " · " + esc(v.pub) + " 게시" : ""}${age ? ` · ${age}일째` : ""}
        · <a href="https://youtu.be/${esc(cid)}" target="_blank" rel="noopener">유튜브에서 열기 ↗</a></div>
      <div class="kpis">
        ${box(fmtN(views), "누적 조회")}
        ${box(fmtD(gain), `최근 ${V.span}일 조회`)}
        ${box(fmtN(likes), "좋아요")}
        ${box(views ? (likes / views * 100).toFixed(2) + "%" : "—", "좋아요율", "좋아요 ÷ 누적 조회")}
        ${box(age ? fmtN(Math.round(views / age)) : "—", "하루 평균", "누적 조회 ÷ 게시 후 일수")}
        ${box(d1 == null ? "—" : fmtN(d1), "첫날",
          d1 == null ? "미러 보유 구간보다 먼저 올라온 영상 — 그때 스냅샷이 없다" : "게시 다음 날까지의 조회(보간값)")}
        ${box(d7 == null ? "—" : fmtN(d7), "첫 7일",
          d7 == null ? "미러 보유 구간보다 먼저 올라온 영상 — 그때 스냅샷이 없다" : "게시 후 7일까지의 조회(보간값)")}
      </div>
    </div>
  </div>
  <div class="pf-duo two">
    <div><div class="pf-cap">일별 조회 증가</div>
      ${pfCombo(ds, dOf(cum), [], PERF_METRICS.views, 520, 200, cov)}</div>
    <div><div class="pf-cap">누적 조회수</div>
      ${pfArea(ds, cum, PERF_METRICS.views, 520, 200, cov)}</div>
    <div><div class="pf-cap">일별 좋아요 증가</div>
      ${pfCombo(ds, dOf(lik), [], PERF_METRICS.likes, 520, 200, cov)}</div>
    <div><div class="pf-cap">누적 좋아요</div>
      ${pfArea(ds, lik, PERF_METRICS.likes, 520, 200, cov)}</div>
  </div>
  <div class="pf-note">게시일부터 지금까지 — 위 기간 설정과 무관하게 이 영상의 전 구간을 그린다.${
    miss ? ` <b class="pf-warn">회색 띠 ${miss}일</b>은 이 영상의 스냅샷이 없어 앞뒤 관측을 이어 붙인 추정이다.` : ""}</div>`;
}

// 지표 한 덩어리(일별 증가 + 누적) — 조회수·좋아요·구독자를 같은 판형으로 나란히 놓는다
function pfMetricCard(V, k, withUps){
  const m = V.metrics[k], M = m.M;
  const head = M.absolute
    ? `지금 ${fmtN(m.end)}${M.unit} · ${V.span}일 ${fmtD(m.gain)}`
    : `${V.span}일 ${fmtD(m.gain)}${M.unit} · 누적 ${fmtN(m.end)}`;
  return `<section class="card pf-chart"><h2>${esc(M.label)}
      <span class="pf-sum" style="color:${M.color}">${head}</span></h2>
    <div class="pf-duo">
      <div><div class="pf-cap">${esc(M.daily)}${withUps
        ? ' <i class="lg" style="background:var(--info);opacity:.6"></i>업로드 편수(오른쪽 눈금)' : ""}</div>
        ${pfCombo(V.dates, m.daily, withUps ? V.ups : [], M, 0, 0, V.cov)}</div>
      <div><div class="pf-cap">${esc(M.total)}</div>${pfArea(V.dates, m.total, M, 0, 0, V.cov)}</div>
    </div>
    <div class="pf-note">${M.absolute
      ? "구독자는 채널 스냅샷에서 온다 — 채널 단위 값이라 영상 목록 필터와 무관하다. 오른쪽 세로축은 0 부터가 아니다."
      : `${esc(M.label)} 증가는 영상별 스냅샷을 보간해 계산한다(수집이 하루 빠져도 다음 날로 몰리지 않음). 오른쪽 세로축은 0 부터가 아니다.`}${
      V.covLow ? ` <b class="pf-warn">회색 띠 ${V.covLow}일</b>은 원천 수집이 ${Math.round(PERF_COV_LOW*100)}% 미만이라 그날 값 대부분이 보간 추정이다.` : ""}</div>
  </section>`;
}

function renderPerf(){
  if (!perf){ loadPerf(perfFrom ? perfNeedDays() - 2 : perfDays);
    $("#page").innerHTML = '<section class="card"><div class="empty">성과 불러오는 중…</div></section>'; return; }
  if (perf.error){
    $("#page").innerHTML = `<section class="card"><h2>성과</h2><div class="empty">불러오기 실패: ${esc(perf.error)}
      <button class="mini" onclick="perfReload()">다시 시도</button></div></section>`; return; }
  if (perf.empty){
    $("#page").innerHTML = `<section class="card"><h2>성과</h2><div class="empty">아직 미러된 성과 데이터가 없습니다 —
      perf_sync(매시간)가 첫 회전을 돌면 여기에 채워집니다.</div></section>`; return; }

  const V = perfView(), B = V.B;
  const chipChs = B.chans.map(g => g.ch).sort((x, y) => x.localeCompare(y, "ko"));
  const pct = (V.prevGain != null && V.prevGain > 0)
    ? Math.round((V.gain - V.prevGain) / V.prevGain * 100) : null;
  const perDay = V.span ? (V.upTotal / V.span) : 0;
  const custom = !!(perfFrom || perfTo);

  // 영상 표 — 정렬 후 상위 200
  const COLS = [["title","영상 제목"],["work","작품"],["ch","채널"],
    ["dper",`${V.span}일 조회`],["views","전체 누적"],["likes","좋아요"],["pub","게시일"]];
  const c = perfSort.col, dir = perfSort.dir;
  const vrows = V.rowsVid.slice().sort((x, y) => { const p = x[c], q = y[c];
    const cmp = (typeof p === "number" || typeof q === "number")
      ? (Number(p)||0) - (Number(q)||0) : String(p??"").localeCompare(String(q??""), "ko");
    return dir * cmp; });

  $("#page").innerHTML = `
    <div class="pf-ctl">
      <span class="pf-seg">${PERF_RANGES.map(([d, l]) =>
        `<button class="${!custom && perfDays === d ? "on" : ""}" onclick="perfRange(${d})">${l}</button>`).join("")}</span>
      <span class="pf-dates ${custom ? "on" : ""}" title="구간을 직접 지정한다 — 미러 보유 범위 안에서">
        <input type="date" value="${esc(perfFrom || V.dates[0])}" min="${esc(B.dates[0])}"
          max="${esc(B.maxDate)}" onchange="perfSetRange('from', this.value)">
        <span>~</span>
        <input type="date" value="${esc(perfTo || B.maxDate)}" min="${esc(B.dates[0])}"
          max="${esc(B.maxDate)}" onchange="perfSetRange('to', this.value)">
        ${custom ? '<button class="mini" onclick="perfSetRange(\'clear\')" title="프리셋으로 돌아간다">✕</button>' : ""}
      </span>
      <span class="pill" title="미러 보유 구간 — perf_sync 가 매시간 갱신한다">보유 ${esc(B.dates[0])} ~ ${esc(B.maxDate)}</span>
      ${V.covAvg == null ? "" : `<span class="pill ${V.covAvg < PERF_COV_LOW ? "bad" : ""}"
        title="원천(laeebly)이 그날 실제로 찍어 준 영상 비율의 평균. 낮은 날은 값이 관측이 아니라 앞뒤 관측을 이은 보간 추정이다.">수집률 ${
        Math.round(V.covAvg * 100)}%${V.covLow ? ` · ${V.covLow}일 성김` : ""}</span>`}
      ${perfChSet ? `<span class="pill" style="color:var(--accent)">채널 ${perfChSet.size}개만</span>` : ""}
      <span class="sp"></span>
      <button class="mini ${perfChSet ? "on" : ""}"
        onclick="perfFilterOpen=!perfFilterOpen;render()">⏷ 채널 필터${perfChSet ? " 적용 중" : ""}</button>
      <button class="mini" onclick="perfReload()">새로고침</button>
    </div>
    ${perfFilterOpen ? `<div class="filters">
      <button class="mini" onclick="perfChSet=null;render()">✓ 전체 선택</button>
      <button class="mini" onclick="perfChSet=new Set();render()">✕ 전체 해제</button>
      <span style="border-left:1px solid var(--line);margin:0 2px"></span>
      ${chipChs.map(ch => { const g = B.chans.find(x => x.ch === ch);
        return `<button class="mini ${!perfChSet || perfChSet.has(ch) ? "on" : ""}"
        ${g.vids ? "" : 'style="opacity:.45" title="영상 스냅샷 없음 — 수집 확인 필요"'}
        onclick="perfChToggle('${esc(ch)}')">${esc(ch)} <span style="opacity:.6">${g.vids}</span></button>`; }).join("")}
    </div>` : ""}

    ${perfBackfillNote()}
    ${V.covLow >= Math.max(3, V.span * 0.25) ? `<section class="card pf-warnbar">
      <b>이 기간의 ${V.covLow}일은 원천 수집이 ${Math.round(PERF_COV_LOW*100)}% 미만입니다.</b>
      그 날들의 조회·좋아요 증가는 관측이 아니라 앞뒤 관측을 이어 붙인 추정이라, 하루하루의
      모양보다 구간 합계를 보는 편이 안전합니다. 차트의 회색 띠가 그 구간입니다.
      ${B.dates[0] < "2026-07-23" ? "(실측: 2026-06-26~07-22 구간이 27~32%대)" : ""}
    </section>` : ""}
    <div class="pf-kpi">
      <div class="tile"><div class="v">${fmtN(V.gain)}</div><div class="k">${V.span}일 조회수</div>
        <div class="d ${pct == null ? "" : pct >= 0 ? "up" : "dn"}">${
          pct == null ? "직전 구간 데이터 없음" : `${pct >= 0 ? "▲" : "▼"} ${Math.abs(pct)}% · 직전 ${V.span}일 ${fmtN(V.prevGain)}`}</div></div>
      <div class="tile"><div class="v">${fmtN(V.cum[V.cum.length-1])}</div><div class="k">누적 조회수 (관리 영상)</div>
        <div class="d" title="유튜브 채널 통계의 전체 누적 — 우리가 만들지 않은 영상까지 포함">채널 전체 ${fmtN(V.chViewNow)}</div></div>
      <div class="tile"><div class="v">${fmtN(V.upTotal)}<span style="font-size:15px">편</span></div>
        <div class="k">${V.span}일 업로드</div>
        <div class="d">하루 평균 ${perDay.toFixed(1)}편 · 채널 ${V.rowsCh.length}개</div></div>
      <div class="tile"><div class="v">${fmtN(V.subsNow)}</div><div class="k">구독자 합계</div>
        <div class="d ${V.dsubs > 0 ? "up" : V.dsubs < 0 ? "dn" : ""}">${V.span}일 ${fmtD(V.dsubs)}</div></div>
      <div class="tile"><div class="v">${fmtN(V.likeNow)}</div><div class="k">누적 좋아요</div>
        <div class="d ${V.likeGain > 0 ? "up" : ""}">${V.span}일 ${fmtD(V.likeGain)}</div></div>
      <div class="tile"><div class="v">${V.freshAvg == null ? "—" : fmtN(V.freshAvg)}</div>
        <div class="k">신규 영상 평균 조회</div>
        <div class="d">이 기간 발행 ${V.freshCount}편 기준</div></div>
    </div>

    ${pfMetricCard(V, "views", true)}
    ${pfMetricCard(V, "likes", false)}
    ${pfMetricCard(V, "subs", false)}

    <section class="card"><h2>채널별 영상 개수</h2>
      ${pfChBars(V)}
      <div class="pf-note">막대는 추적 중인 영상 수 — 밝은 칸이 이 기간에 올린 분이다.</div>
    </section>

    <section class="card"><h2>채널별 업로드 — 며칠에 몇 편</h2>
      ${pfHeat(V)}
      <div class="pf-note">칸이 진할수록 그날 업로드가 많다. 채널명을 누르면 그 채널만 본다.</div>
    </section>

    <section class="card"><h2>채널 요약 — ${V.span}일</h2>
    <div class="tblwrap"><table><tr><th>채널</th><th>영상</th><th>업로드</th>
      <th>${V.span}일 조회</th><th>누적 조회</th><th>좋아요</th><th>구독자</th>
      <th>구독 ${V.span}일</th><th>조회 추이</th></tr>${
    V.rowsCh.map(r => `<tr class="${perfChSet && perfChSet.has(r.ch) ? "selrow" : ""}" style="cursor:pointer"
        title="클릭 — 이 채널만 보기 (다시 클릭하면 전체)" onclick="perfChOnly('${esc(r.ch)}')">
      <td>${esc(r.ch)}</td><td class="num">${fmtN(r.vids)}</td><td class="num">${fmtN(r.ups)}</td>
      <td class="num">${fmtN(r.gain)}</td><td class="num">${fmtN(r.cum)}</td>
      <td class="num">${fmtN(r.likes)}</td><td class="num">${fmtN(r.subs)}</td>
      <td class="num">${fmtD(r.dsubs)}</td>
      <td>${pfSpark(r.series, 96, 22, PERF_METRICS.views.color)}</td></tr>`).join("")
    || '<tr><td colspan="9" class="empty">채널 없음</td></tr>'}</table></div></section>

    <section class="card"><h2>영상별 성과 — 행을 누르면 상세${
        vrows.length > 200 ? ` (상위 200/${vrows.length}편)` : ""}</h2>
    <div class="tblwrap"><table><tr>${COLS.map(([k, l]) =>
      `<th class="sortable" onclick="perfSortBy('${k}')">${l}${perfSort.col === k ? (dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr>${
    vrows.slice(0, 200).map(r => `<tr class="${perfVid === r.cid ? "selrow" : ""}" style="cursor:pointer"
      title="클릭 — 상세 열기" onclick="perfOpenVid('${esc(r.cid)}')">
      <td>${r.dead ? '<span class="sub" title="내려간 영상">†</span> ' : ""}${esc(r.title)}</td>
      <td>${esc(r.work)}</td><td>${esc(r.ch)}</td>
      <td class="num">${fmtN(r.dper)}</td><td class="num">${fmtN(r.views)}</td>
      <td class="num">${fmtN(r.likes)}</td>
      <td class="num">${esc(r.pub)}${r.isNew ? ' <span class="sub" title="이 기간에 발행">신규</span>' : ""}</td></tr>${
      perfVid === r.cid ? `<tr><td colspan="7" class="vdcell">${pfVidDetail(V, r.cid)}</td></tr>` : ""}`).join("")
    || `<tr><td colspan="7" class="empty">${perfChSet && perfChSet.size === 0
        ? "선택된 채널이 없습니다 — 필터에서 채널을 켜거나 전체 선택을 누르세요" : "영상 스냅샷 없음"}</td></tr>`}</table></div></section>`;
}
// 영상 상세 토글 — 같은 행을 다시 누르면 접힌다
window.perfOpenVid = cid => { perfVid = perfVid === cid ? null : cid; render(); };
// 직접 구간 지정 — 로드해 둔 창보다 더 거슬러야 하면 다시 받는다
window.perfSetRange = (which, val) => {
  if (which === "clear"){ perfFrom = perfTo = null; render(); return; }
  if (which === "from") perfFrom = val || null; else perfTo = val || null;
  if (perfFrom && perfTo && perfFrom > perfTo){ const t = perfFrom; perfFrom = perfTo; perfTo = t; }
  if (perfNeedDays() > perfLoadedDays) perf = null;
  render();
};


window.perfRange = d => { perfDays = d; perfFrom = perfTo = null;   // 프리셋이 직접 지정을 대체한다
  if (perfWant(d) > perfLoadedDays) perf = null;   // 더 긴 창이 필요 — 다시 받는다
  render(); };
// 칩 토글 — 전체(null)에서 하나 끄면 "그 채널만 제외" 상태가 된다
window.perfChToggle = ch => {
  const all = perfBuild().chans.map(g => g.ch);
  if (!perfChSet) perfChSet = new Set(all);
  perfChSet.has(ch) ? perfChSet.delete(ch) : perfChSet.add(ch);
  if (perfChSet.size === all.length) perfChSet = null;   // 전부 켜지면 전체 상태로 정규화
  render();
};
// 요약 행·히트맵 행 클릭 — 이 채널만 보기 (재클릭 시 전체)
window.perfChOnly = ch => {
  perfChSet = (perfChSet && perfChSet.size === 1 && perfChSet.has(ch)) ? null : new Set([ch]);
  render();
};
window.perfReload = () => { perf = null; perfLoadedDays = 0; render(); };
window.perfSortBy = c => {
  perfSort = perfSort.col === c ? { col: c, dir: -perfSort.dir } : { col: c, dir: -1 };
  render();
};

// ───────── 권한 관리 (admin 전용 — RPC 로만, 0015) ─────────
let adminUsers = null;
async function loadAdmin(){
  const { data, error } = await sb.rpc("list_user_roles");
  adminUsers = error ? { error: error.message } : { rows: data || [] };
  render();
}
function renderAdmin(){
  if (myRole !== "admin"){
    $("#page").innerHTML = '<section class="card"><div class="empty">admin 전용 화면입니다</div></section>'; return; }
  if (!adminUsers){ loadAdmin();
    $("#page").innerHTML = '<section class="card"><div class="empty">사용자 목록 불러오는 중…</div></section>'; return; }
  if (adminUsers.error){
    $("#page").innerHTML = `<section class="card"><h2>권한 관리</h2>
      <div class="empty">불러오기 실패: ${esc(adminUsers.error)}
      <button class="mini" onclick="adminUsers=null;render()">다시 시도</button></div></section>`; return; }
  const ROLES = ["viewer","reviewer","operator","admin"];
  const ROLE_KO = { viewer:"보기만", reviewer:"검수 가능", operator:"운영(잡·노드)", admin:"관리자" };
  const meEmail = ($("#whoami").textContent || "").split(" ·")[0];
  $("#page").innerHTML = `<section class="card">
    <h2>권한 관리 — 변경은 즉시 적용 <button class="mini right" onclick="adminUsers=null;render()">새로고침</button></h2>
    <div class="sub" style="margin-bottom:8px">viewer(보기) < reviewer(검수) < operator(운영) < admin(관리) ·
      새 팀원은 먼저 로그인 계정(Supabase Auth)이 만들어져 있어야 목록에 보입니다.
      자기 자신의 권한은 바꿀 수 없습니다(잠금 사고 방지).</div>
    <div class="tblwrap"><table><tr><th>이메일</th><th>권한</th><th>메모</th><th></th></tr>${
    adminUsers.rows.map((u,i) => {
      const self = u.email === meEmail;
      return `<tr><td>${esc(u.email)}${self ? ' <span class="sub">(나)</span>' : ""}</td>
        <td><select id="ur_${i}" ${self ? "disabled" : ""}>${ROLES.map(r =>
          `<option value="${r}" ${u.role===r?"selected":""}>${r} — ${ROLE_KO[r]}</option>`).join("")}</select></td>
        <td><input id="un_${i}" value="${esc(u.note||"")}" placeholder="메모(선택)" ${self ? "disabled" : ""}></td>
        <td>${self ? "" : `<button class="mini pri" onclick="adminSave(${i},'${esc(u.email)}')">저장</button>`}</td></tr>`;
    }).join("") || '<tr><td colspan="4" class="empty">사용자 없음</td></tr>'}</table></div></section>`;
}
window.adminSave = (i, email) => {
  const role = $(`#ur_${i}`).value, note = ($(`#un_${i}`).value || "").trim() || null;
  adminUsers = null;
  rpc("set_user_role", { p_email: email, p_role: role, p_note: note }, `${email} → ${role}`);
};

// ───────── 폴링 ─────────
let auto = true;
// v3: 영상 시청·입력 중엔 자동 갱신을 잠시 멈춘다 — 재생/타이핑 중 화면이 갈리지 않게
const anyVideoPlaying = () =>
  [...document.querySelectorAll("video")].some(v => !v.paused && !v.ended);
const userTyping = () => { const a = document.activeElement;
  return !!a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName); };
setInterval(() => { if (auto && !document.hidden && tab !== "perf" && tab !== "edit"
                    && !anyVideoPlaying() && !userTyping()) refresh(); }, 15000);
$("#btnRefresh").onclick = () => refresh();
$("#btnTheme").onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
$("#btnAuto").onclick = e => { auto = !auto; e.target.textContent = `자동 15s: ${auto?"켬":"끔"}`; };
// 편집실은 제외 — 복귀 refresh 가 미리보기 재생·편집 중 DOM 을 예고 없이 갈아치운다
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && auto && tab !== "edit") refresh(); });
window.rpc = rpc; window.armed = armed; window.$ = $;
</script>
</body>
</html>
