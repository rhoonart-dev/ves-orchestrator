<style>
  :root{
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222221;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --ring:rgba(255,255,255,.10);
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --info:#3987e5;
    --accent:#e2a63d; --accent-ink:#231b0b;   /* 목업: 포인트 컬러 — 웜그레이 팔레트에 맞춘 앰버(구 대시보드 골드 계승) */
  }
  /* v3.2: 화이트 테마 — 같은 변수만 갈아끼운다(컴포넌트 CSS 무변경) */
  :root[data-theme="light"]{
    color-scheme:light;
    /* 목업: 라이트 쿨톤 시안 — 웜그레이에서 블루그레이로 살짝 이동 (원래 값: #f4f4f2/#f0efec/#44433f/#807e78/#dcdbd6) */
    --page:#f2f4f6; --surface:#ffffff; --surface-2:#edf0f3;
    --ink:#17181a; --ink-2:#3f434a; --muted:#79808a;
    --line:#d6dbe1; --ring:rgba(20,40,70,.10);
    --good:#0ca30c; --warn:#b07500; --serious:#c05a2e; --crit:#c22525;
    --info:#1f6fd0;
    --accent:#e2a63d; --accent-ink:#231b0b;   /* 목업: 다크와 동일한 밝은 앰버 */
  }
  :root[data-theme="light"] .st-good{color:#0b8a0b}
  :root[data-theme="light"] .st-crit{color:#c22525}
  :root[data-theme="light"] .st-info{color:#1f6fd0}
  :root[data-theme="light"] nav.tabs button.on{color:var(--ink)}
  :root[data-theme="light"] nav.tabs .badge{background:#fab219;color:#3d2c04}  /* 검수함 배지: 밝은 노랑 고정 */
  :root[data-theme="light"] .chdot{background:#c6c5be}       /* 없음: 라이트에선 연회색 */
  :root[data-theme="light"] .chdot.none{background:#c6c5be}
  :root[data-theme="light"] .chdot.rej{background:transparent}  /* 도넛 가운데는 투명 */
  :root[data-theme="light"] .chdot.ok{background:#0ca30c}
  :root[data-theme="light"] .chdot.wait{background:#fab219}
  :root[data-theme="light"] .chdot.bad{background:#d03b3b}
  :root[data-theme="light"] .chdot.run{background:#3987e5}
  :root[data-theme="light"] .chcal .d.up{background:#0ca30c}
  :root[data-theme="light"] .fp-pub{color:#0b8a0b}
  :root[data-theme="light"] .fp-rej{color:#c22525}
  :root[data-theme="light"] .fp-run{color:#1f6fd0}
  :root[data-theme="light"] .judgebox .q{color:var(--ink)}
  :root[data-theme="light"] .now .what .st{color:#1f6fd0}
  :root[data-theme="light"] .gauge{background:#dcdbd6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
  h2{font-size:13px;margin:0 0 8px;color:var(--ink-2);font-weight:600;
     text-transform:uppercase;letter-spacing:.6px}
  main{max-width:1220px;margin:0 auto;padding:14px 16px}
  .topwrap{position:sticky;top:0;z-index:5;background:var(--page)}  /* 목업: 헤더+탭 한 덩어리 고정 — 틈 제거 */
  header.top{background:var(--page);
    display:flex;align-items:center;gap:10px;padding:10px 16px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  header.top .sp{flex:1}
  nav.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);
    background:var(--page);overflow-x:auto}
  nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;
    border-radius:0;color:var(--ink-2);padding:9px 13px;white-space:nowrap;font-weight:600}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--good)}  /* 목업: 탭 인디케이터 = 로고 초록 */
  nav.tabs .badge{background:var(--warn);color:#3d2c04;border-radius:999px;
    font-size:11px;padding:0 6px;margin-left:5px;font-weight:700}
  .pill{font-size:12px;color:var(--ink-2);border:1px solid var(--line);
        border-radius:999px;padding:3px 10px;background:var(--surface)}
  button{font:inherit;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--muted)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.pri{background:var(--good);border-color:var(--good);color:#fff;font-weight:600}
  button.danger:hover{background:var(--crit);border-color:var(--crit);color:#fff}
  /* 목업: 결정 버튼 C안(미니멀) — 테두리 + 색은 글자에만, 호버 시 채움 */
  button.pri.act{background:transparent;border-color:var(--line);color:#2f9e5f;font-weight:700}
  button.pri.act:hover{background:#2f9e5f;border-color:#2f9e5f;color:#fff}
  button.danger.act{background:transparent;border-color:var(--line);color:#d05a52}
  button.danger.act:hover{background:#c73f36;border-color:#c73f36;color:#fff}
  button.act{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:600}
  button.danger{border-color:var(--crit);color:var(--crit);background:transparent}
  button.mini{padding:2px 8px;font-size:12px;border-radius:6px}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  section.card{background:var(--surface);border:1px solid var(--ring);
    border-radius:12px;padding:14px;margin:14px 0}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
  .tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;
        padding:10px 12px}
  .tile .v{font-size:26px;font-weight:700;line-height:1.1}
  .tile .k{font-size:12px;color:var(--muted);margin-top:2px}
  /* 상태 칩 — 아이콘+라벨 동반(색 단독 금지) */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;
    border-radius:999px;padding:2px 9px;border:1px solid var(--line);
    background:var(--surface-2);white-space:nowrap}
  .chip .d{width:8px;height:8px;border-radius:50%;flex:none}
  .st-good .d{background:var(--good)}      .st-good{color:#7ddc7d}
  .st-warn .d{background:var(--warn)}      .st-warn{color:var(--warn)}
  .st-serious .d{background:var(--serious)}.st-serious{color:var(--serious)}
  .st-crit .d{background:var(--crit)}      .st-crit{color:#ff9b9b}
  .st-info .d{background:var(--info)}      .st-info{color:#9cc4f2}
  .st-mut .d{background:var(--muted)}      .st-mut{color:var(--ink-2)}
  /* 신호등 (구 대시보드 §4 규칙 계승 — 오늘 KST 기준, 색은 두 열에서 같은 뜻) */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .bch{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;
    background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;
       padding:9px 9px;cursor:pointer}
  .bch .nm{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;gap:6px;
           align-items:center;justify-content:space-between}
  .dots{display:flex;gap:16px;font-size:11.5px;color:var(--muted)}
  .bch .dots{border-left:1px solid var(--line);padding-left:10px;align-self:stretch;align-items:center;gap:8px}
  .dcol{display:flex;flex-direction:column;gap:3px;align-items:center;width:52px;flex:none}
  .dcol.dim{opacity:.4}
  .bch:hover{border-color:var(--muted)}
  .bchL{flex:1;min-width:0}
  .bchName{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;min-width:0}
  .bchName>span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:keep-all;line-height:1.3}
  .bchWork{font-size:11.5px;color:var(--muted);margin-top:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dcap{font-size:10px;color:var(--muted);letter-spacing:.4px}
  .dlab{font-size:10.5px;color:var(--ink-2);text-align:center;line-height:1.25;word-break:keep-all}
  .chdot{width:14px;height:14px;border-radius:50%;background:#3a3a38}
  .chdot.ok{background:var(--good)} .chdot.wait{background:var(--warn)}
  .chdot.bad{background:var(--crit)} .chdot.none{background:#3a3a38}
  .chdot.rej{background:transparent;border:4px solid var(--crit);width:14px;height:14px;box-sizing:border-box}
  .chdot.run{background:var(--info)}
  .bdetail{grid-column:1/-1;background:var(--surface-2);border:1px solid var(--ring);
    border-radius:10px;padding:10px 12px}
  .lg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);
      margin-right:11px}
  .lg .chdot{width:10px;height:10px}
  /* 피드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .fcard{background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;
         overflow:hidden}
  .fcard .th{aspect-ratio:9/14;background:#000;display:flex;align-items:center;
    justify-content:center;color:var(--muted);font-size:12px;cursor:pointer;
    background-size:cover;background-position:center}
  .fcard .bd{padding:8px 10px}
  .fcard .t{font-size:12.5px;font-weight:600;line-height:1.3;margin-bottom:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fcard .m{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;
    align-items:center}
  .fcard video{width:100%;display:block}
  .fpill{font-size:10.5px;border-radius:999px;padding:1px 7px;border:1px solid var(--line)}
  .fp-pub{color:#7ddc7d;border-color:var(--good)} .fp-wait{color:var(--warn);border-color:var(--warn)}
  .fp-rej{color:#ff9b9b;border-color:var(--crit)} .fp-run{color:#9cc4f2;border-color:var(--info)}
  .fp-mut{color:var(--ink-2)}
  /* 검수함 */
  .review{background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;
          padding:12px;margin-bottom:10px}
  .review .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .review video{width:100%;max-width:320px;border-radius:8px;margin-top:8px;
                background:#000;aspect-ratio:9/16}
  .review .form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .judgebox{font-size:12px;color:var(--ink-2);background:var(--surface);
    border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;
    line-height:1.7}
  .judgebox .q{font-weight:700;color:var(--ink)}
  .judgebox details summary{cursor:pointer;color:var(--muted);font-size:11.5px}
  .hallu{color:var(--crit);font-size:12px;font-weight:600;margin-top:6px}
  .notehint{color:var(--warn);font-size:12px;margin:6px 0 0}
  /* 사유·메모: 한 줄 input 은 길게 쓰면 앞이 안 보였다(운영 결정 8/13 — 여러 줄) */
  .reason{width:100%;margin-top:8px;min-height:68px;resize:vertical;font:inherit;line-height:1.5}
  /* 반려 패널 — 평소엔 안 보이고, 반려를 누를 때만 카드 안에서 펼쳐진다 */
  .rjpanel{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;
    background:var(--chip,rgba(127,127,127,.06))}
  .rjpanel .rjhd{display:flex;align-items:center;justify-content:space-between;
    font-size:12.5px;font-weight:600;margin-bottom:8px}
  .rjopt{display:flex;width:100%;align-items:baseline;gap:8px;text-align:left;
    padding:7px 10px;margin-top:5px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font-size:13px;cursor:pointer}
  .rjopt:hover{border-color:var(--crit);color:var(--crit)}
  .rjopt b{flex:none;min-width:76px;font-weight:600}
  .rjopt .why{color:var(--muted);font-size:12px;flex:1}
  .rjopt .eta{flex:none;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .rjfoot{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    font-size:11.5px;color:var(--muted)}
  /* 테이블 공통 */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--muted);font-weight:600;text-align:left;font-size:12px;
     border-bottom:1px solid var(--line);padding:5px 8px;white-space:nowrap}
  td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.num{font-variant-numeric:tabular-nums}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .err{color:var(--serious);font-size:12px;word-break:break-all}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  tr.selrow td{background:rgba(128,128,128,.14);font-weight:600}
  /* 목업: 선택 칩 = 무채색 강조 (비선택 칩에서 살짝 진하게) */
  .filters button.on{background:rgba(128,128,128,.18);border-color:var(--muted);color:var(--ink);font-weight:700}
  .dgroup{border-top:1px solid var(--line);margin-top:11px;padding-top:9px}
  .dgroup:first-of-type{border-top:none;margin-top:6px;padding-top:0}
  .dghead{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.6px;margin-bottom:6px}
  .dgroup .dform{margin-top:0}
  /* 목업 B안: 채널 설정 모달 */
  .mmask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;
    align-items:flex-start;justify-content:center;padding:4vh 16px;box-sizing:border-box}
  .mpanel{width:min(720px,96vw);max-height:92vh;overflow:auto;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-sizing:border-box;
    box-shadow:0 14px 44px rgba(0,0,0,.45)}
  .mhead{display:flex;align-items:center;gap:9px;font-size:15px}
  .mhead .right{margin-left:auto}
  .msec{border-top:1px solid var(--line);margin-top:13px;padding-top:11px}
  .msec-h{font-size:12px;font-weight:700;margin-bottom:6px}

const memStore = (() => { const m = new Map(); return {

}
function ago(ts){
  if (!ts) return "—";
  const s = Math.max(0,(Date.now()-new Date(ts).getTime())/1000);
  if (s<60) return `${s|0}초 전`;
  if (s<3600) return `${s/60|0}분 전`;
  if (s<86400) return `${s/3600|0}시간 ${((s%3600)/60)|0}분 전`;
  return `${s/86400|0}일 전`;
}

// ───────── 서명 URL 캐시 ─────────
const _signed = new Map();
async function signedUrl(bucket, key, sec = 900){
  const ck = bucket + "/" + key, hit = _signed.get(ck);
  if (hit && hit.exp > Date.now()) return hit.url;
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(key, sec);
  if (error) throw new Error(error.message);
  _signed.set(ck, { url: data.signedUrl, exp: Date.now() + (sec - 60) * 1000 });
  return data.signedUrl;
}

// ───────── 파생 (신호등 — 구 대시보드 §4 규칙: 판정은 언제나 오늘 KST) ─────────
// 이미 해결된 실패인가 — 같은 일을 뒤이어 성공한 잡이 있으면 그렇다(8/12 사용자 요청).
// 실측: 어제 07시 잡이 새벽에 죽고, 오늘 07시 잡이 같은 작품을 성공했는데도 '오늘 실패'에
// 계속 떠 있었다. 같은 대상(작업지시 또는 인입 폴더)의 나중 성공을 해결로 본다.
function jobTarget(x){
  if (x.work_order_id) return "wo:" + x.work_order_id;
  const p = x.params || {};
  return p.folder_url ? "folder:" + p.folder_url
       : p.work_title ? "work:" + x.kind + ":" + p.work_title : null;
}
function isResolved(x, jobs){
  const t = jobTarget(x);
  if (!t) return false;
  const at = x.finished_at || x.updated_at;
  return (jobs || []).some(y => y.status === "succeeded" && y.kind === x.kind
    && jobTarget(y) === t && (y.finished_at || y.updated_at) > at);
}
function woRun(wo){ const r = state.reviewByWo[wo.id]; return r && r.payload && r.payload.run_id; }
function woNode(wo){
  // 이 영상을 실제로 만든 맥. generate 가 정답 — 반려 재생성도 그 맥으로 핀되기 때문(8/12).
  // 아직 안 돌았거나 잡 150건 창을 벗어났으면 노드 핀(required_caps)에서 읽는다.
  const js = state.jobsByWo[(wo || {}).id] || [];
  const done = js.find(j => j.kind === "generate" && j.node_id);
  if (done) return done.node_id;
  for (const j of js) {
    const pin = (j.required_caps || []).find(c => String(c).startsWith("node:"));
    if (pin) return pin.slice(5);
  }
  return (js.find(j => j.node_id) || {}).node_id || "";
}
function woVideoId(wo){
  const run = woRun(wo); const cid = run && state.runToClip[run];
  const c = cid && state.clipById[cid]; return c && c.video_external_id || null;
}
function woStatus(wo){
  // 우선순위: 실패 > 검수대기 > 반려 > 발행/예약 > 합격 > 진행 > 대기
  const js = state.jobsByWo[wo.id] || [];
  const rv = state.reviewByWo[wo.id];
  const pub = js.find(j => j.kind === "publish");
  if (js.some(j => ["failed","dead"].includes(j.status))) return "failed";
  if (rv && rv.status === "waiting") return "review";
  if (rv && rv.status === "rejected") return "rejected";
  if (pub && pub.status === "succeeded")
    return (pub.params && pub.params.publish_at) ? "scheduled" : "published";
  if (rv && rv.status === "approved") return "approved";
  if (js.some(j => j.status === "running")) return "running";
  if (js.length) return "pending";
  return "none";
}
const GEN_DOT = { failed:["bad","실패"], review:["wait","검수 대기"], rejected:["rej","반려"],
  published:["ok","합격·발행"], scheduled:["ok","합격·예약"], approved:["ok","합격"],
  running:["run","진행 중"], pending:["wait","대기"], none:["none","없음"] };
function pubDot(wo){
  const pub = (state.jobsByWo[wo.id]||[]).find(j => j.kind === "publish");
  if (!pub) return ["none","없음"];
  if (["failed","dead"].includes(pub.status)) return ["bad","발행 실패"];
  if (pub.status === "succeeded")
    return (pub.params && pub.params.publish_at) ? ["wait","예약됨"] : ["ok","발행됨"];
  return ["wait","발행 대기"];
}

  // userTyping() 가드는 '틱 순간의 포커스'만 지킨다 — 메모를 쓰다 영상을 클릭(포커스 이탈)한
  // 뒤의 자동 갱신에 입력이 통째로 날아갔다. 값을 스냅샷해 재렌더 후 되살린다.
  const keep = {};
  document.querySelectorAll('#page .reason, #page select[id^="prv_"], #page input[id^="at_"]')
    .forEach(el => { if (el.id && el.value) keep[el.id] = el.value; });

  $("#tabs").innerHTML = tabsFor().map(([k,l]) =>
    `<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${l}${
      k==="review"&&waiting?`<span class="badge">${waiting}</span>`:""}</button>`).join("");
  ({home:renderHome, review:renderReview, feed:renderFeed, sources:renderSources,
    channels:renderChannels, jobs:renderJobsTab, infra:renderInfra, perf:renderPerf,
    admin:renderAdmin}[tab] || renderHome)();

    const el = document.getElementById(id);

// ───────── Gemini 키 슬롯 (0025) ─────────
// 429 의 정체는 분당 rate limit 이 아니라 '결제 계정 월 지출 상한'이었다(8/12 실측).
// 상한은 키가 아니라 계정에 걸리므로 예비 키는 다른 결제 계정 것이어야 한다.
const geminiSlot = () => ((state.ops||{}).gemini_key||{}).value === "fallback"
                       ? "fallback" : "primary";
function geminiBanner(){
  const slot = geminiSlot();
  const stuck = (state.jobs||[]).filter(j => j.status === "pending" && j.error_class === "quota");
  if (slot === "primary" && !stuck.length) return "";
  const o = (state.ops||{}).gemini_key || {};
  const back = can("operator")
    ? `<button class="mini" onclick="rpc('set_gemini_key',{p_slot:'primary'},'주 키로 되돌렸습니다')"
         >주 키로 되돌리기</button>` : "";
  const go = can("operator")
    ? `<button class="mini" onclick="armed(this,'예비 키로 전환',()=>rpc('set_gemini_key',{p_slot:'fallback'},'예비 키로 전환했습니다'))"
         >예비 키로 전환</button>` : "";
  const stuckTxt = stuck.length
    ? ` · 쿼터로 대기 중인 잡 <b>${stuck.length}건</b>(${
        [...new Set(stuck.map(j => kindKo(j.kind)))].join(", ")})` : "";
  return slot === "fallback"
    ? `<section class="card warnbar"><b>⚠ Gemini 예비 키로 돌고 있습니다</b>
        <span class="sub">${esc(o.note||"")} · ${ago(o.updated_at)}${stuckTxt}</span>
        <span class="right"></span>${back}</section>`
    : `<section class="card warnbar"><b>⚠ Gemini 쿼터로 막힌 잡이 있습니다</b>
        <span class="sub">주 키로 도는 중${stuckTxt}. 지출 상한이면 워커가 자동으로 예비 키로 넘깁니다
        — 급하면 지금 넘기세요(예비 키가 ves.env 에 있어야 합니다).</span>
        <span class="right"></span>${go}</section>`;
}

// ───────── 홈: 채널 즉시 실행 (0024 run_channel_now) ─────────
// 오늘 planner 가 만든 것과 '별개로 한 편 더'다(사용자 결정 8/12). 되돌리기가 아니라
// 추가 생산이므로 기존 작업지시·검수 카드는 건드리지 않는다.
let runOpen = null;   // 작품·회차 지정 폼이 열린 채널
let runWork = "";     // 그 폼에서 고른 작품
function runBox(slug){
  if (EXT_PIPE[slug]) return "";                     // 전용 파이프라인(잔망루피)은 대상 아님
  if (!can("operator"))
    return '<div class="sub" style="margin-top:9px">작업 실행은 operator 권한이 필요합니다</div>';
  const works = effWorks(slug);
  const w     = works.includes(runWork) ? runWork : (works[0] || "");
  const avail = e => epUsable(e) && epRemain(e, slug) > 0;
  const auto  = w ? epsOf(w).find(avail) : null;
  const eps   = w ? epsOf(w).filter(e => avail(e) && e.ep != null) : [];
  const epLab = e => e.ep != null ? e.ep + "회차" : "단편";
  const form  = runOpen !== slug ? "" : `
    <div class="runform">
      <label>작품<select onchange="runWork=this.value;render()">${
        works.map(x => `<option value="${esc(x)}"${x === w ? " selected" : ""}>${esc(x)}</option>`)
             .join("") || '<option value="">배정된 작품 없음</option>'}</select></label>
      <label>회차<select id="runEp">
        <option value="">자동 — ${auto ? esc(epLab(auto)) : "쓸 수 있는 회차 없음"}</option>
        ${eps.map(e => `<option value="${e.ep}">${e.ep}회차 · 남음 ${epRemain(e, slug)}</option>`).join("")}
      </select></label>
      <button class="mini pri" data-slug="${esc(slug)}"
        onclick="runNow(this.dataset.slug, runWork, document.getElementById('runEp').value)"
        >이 설정으로 실행</button>
    </div>`;
  return `<div class="runbar">
      <button class="mini pri" data-slug="${esc(slug)}"
        onclick="armed(this,'작업 실행',()=>runNow(this.dataset.slug))">작업 실행</button>
      <button class="mini" data-slug="${esc(slug)}"
        onclick="runOpen = runOpen === this.dataset.slug ? null : this.dataset.slug; render()"
        >작품·회차 지정</button>
      <span class="sub">오늘 것과 별개로 한 편 더 만듭니다${
        auto ? ` · 자동 선택: ${esc(w)} ${esc(epLab(auto))}` : " · 지금 쓸 수 있는 소스가 없습니다"}</span>
    </div>${form}`;
}
window.runNow = async (slug, work, ep) => {
  const { data, error } = await sb.rpc("run_channel_now", {
    p_slug: slug, p_work: work || null,
    p_episode: (ep === "" || ep == null) ? null : Number(ep), p_note: null });
  if (error){ toast("작업 실행 거부: " + error.message, true); return; }
  toast(`${data.channel} · ${data.work} ${data.episode != null ? data.episode + "회차" : "단편"}`
        + ` — 잡 ${data.jobs}건 투입`);
  runOpen = null; refresh();
};

// ───────── 검수함 (구 대시보드 검수 UX 계승: judge 참고표시·환각경고·반려유형) ─────────
function judgeBox(run){
  if (!state.legacyOk) return '<div class="judgebox" style="color:var(--muted)">judge 표시는 0011 정책 적용 후 활성화됩니다</div>';
  const cid = run && state.runToClip[run], jg = cid && state.judgeByClip[cid];
  if (!jg) return '<div class="judgebox" style="color:var(--muted)">judge 대기중 — 결정은 그대로 가능합니다</div>';
  const rs = jg.rubric_scores || {};
  const keys = Object.keys(rs).filter(k => typeof rs[k] === "number").slice(0,5);
  return `${rs.hallucination_flag ? '<div class="hallu">⚠ 환각 의심 — 합격해도 발행 게이트에서 자동 차단됩니다</div>' : ""}
    <div class="judgebox"><span class="q">judge 품질 ${Number(jg.quality_score).toFixed(2)}</span>
      ${jg.confidence != null ? " · 신뢰도 " + Number(jg.confidence).toFixed(2) : ""}<br>
      ${keys.map(k => `${esc(k)} ${Number(rs[k]).toFixed(2)}`).join(" · ")}
      ${rs.rationale ? `<details><summary>judge 사유 보기</summary>${esc(rs.rationale)}</details>` : ""}
    </div>`;
}
// 잔망루피 검수 카드 (0026) — 작업지시 없는 전용 파이프라인. 승인하면 원장에 확정하고
// 업로더가 비공개 업로드 + 19:00 JST 예약 공개까지 한다(R9 준수).
const LOOPY_ROUTE = { A:"무변환 — 원본 그대로", B:"자막", C:"더빙", BC:"더빙+자막" };

    <div class="rv2-body">

      ${pay.notes ? `<div class="sub" style="margin-top:4px">${esc(String(pay.notes).slice(0,160))}</div>` : ""}
      ${pay.url ? `<div class="sub"><a href="${esc(pay.url)}" target="_blank" rel="noopener">원본 ↗</a>

}
window.decideLoopy = (rid, ok) => {
  const note = (($(`#note_${CSS.escape(rid)}`)||{}).value || "").trim() || null;
  rpc("decide_loopy", { p_review_id: rid, p_approve: ok, p_note: note },
      ok ? "승인 — 업로드·예약 잡을 넣었습니다" : "반려 — 원장에 skipped 로 기록합니다");
};

function renderReview(){
  const all = (state.reviews||[]).filter(r => r.status === "waiting");
  const rs = all.filter(r => rvCh === "all" || r.channel_slug === rvCh);
  const chChips = channelChips(all, rvCh, "rvCh");
  $("#page").innerHTML = `<section class="card"><h2>검수 대기 ${rs.length}건 — 결정은 100% 사람 · 프리뷰는 카드에서 바로 재생</h2>${chChips}<div class="rvgrid">` +
    (rs.map(r => {
      const wo = state.wo[r.work_order_id] || {};
      const pay = r.payload || {};
      const run = pay.run_id || "";
      // 잔망루피(0026): 작업지시가 없는 전용 파이프라인 건. 공개 방식이 업로더에 고정돼 있어
      // (비공개 + 19:00 JST 다음 빈 슬롯) 관제에서 고를 게 없다 — 승인/반려 둘뿐.
      if (pay.zanmang_video_id) return loopyCard(r, pay);
      const jg = judgeBox(run);
      const low = (() => { const cid = state.runToClip[run], j = cid && state.judgeByClip[cid];
        return j && Number(j.quality_score) < 0.5; })();
      const form = can("reviewer") ? `
        <textarea class="reason" id="note_${r.id}" rows="3"
          placeholder="사유·메모 — 반려 시 재생성 프롬프트에 그대로 반영됩니다('제작' 단계 제외)"></textarea>
        ${low ? '<p class="notehint">💬 judge 가 낮게 봤습니다 — 그래도 합격시키신다면 이유를 남겨 주세요. judge 를 고칠 근거가 됩니다.</p>' : ""}
        <div class="form" id="rjb_${r.id}">
          <select id="prv_${r.id}"
            title="R9: 자동 발행은 비공개·일부공개·예약까지 — 공개 전환은 사람이 Studio 에서"
            onchange="$('#at_${r.id}').style.display=this.value==='schedule'?'':'none'">
            <option value="private">비공개</option><option value="unlisted">일부공개</option>
            <option value="schedule" title="비공개로 올리고 지정 시각에 자동 공개">예약공개</option>
          </select>
          <input id="at_${r.id}" type="datetime-local" style="display:none">
          <button class="pri act" onclick="approve('${r.id}')">✓ 합격 · 발행</button>
          <button class="danger act" onclick="rejectAsk('${r.id}')">✕ 반려</button>
        </div>
        <div id="rja_${r.id}" style="display:none"></div>` : '<div class="sub">reviewer 권한 필요</div>';
      const slug = wo.channel_slug || r.channel_slug;
      return `<div class="review rv2">
        <div class="rv2-vid">${pay.preview_key
          ? `<div id="pv_${r.id}"><video id="pvv_${r.id}" controls playsinline preload="metadata" poster=""></video></div>`
          : '<div class="sub" style="padding:24px 6px;text-align:center">프리뷰 파일 없음</div>'}</div>
        <div class="rv2-body">
          <div class="rh">${chAvatarHtml(slug, 28)}${(() => {
              const cid = ((state.chans||[]).find(c => c.token_slug === slug)||{}).channel_id;
              return cid
                ? `<a class="rv2-chn" href="https://youtube.com/channel/${esc(cid)}" target="_blank" rel="noopener" title="YouTube 채널 열기">${esc(chName(slug))} ↗</a>`
                : `<span class="rv2-chn">${esc(chName(slug))}</span>`; })()}
            <span class="right sub">${ago(r.created_at)}</span></div>
          <div class="rv2-work"><b>작품</b>${esc(wo.work_title || run || r.id.slice(0,8))}${
            wo.episode != null ? ` <span style="color:var(--muted)">· ${wo.episode}회차</span>` : ""}${
            (() => { const n = woNode(wo); return n
              ? ` <span class="rv2-mac" title="이 영상을 제작한 맥 — 반려 후 재생성도 같은 맥에서 돕니다">🖥 ${esc(n)}</span>` : ""; })()}</div>
          ${jg}${form}</div></div>`;
    }).join("") || `<div class="empty">${rvCh==="all" ? "검수 대기 항목 없음 🎉" : esc(chName(rvCh)) + " — 검수 대기가 없습니다"}</div>`) + `</div></section>
    <section class="card"><h2>최근 결정${rvCh==="all" ? "" : ` — ${esc(chName(rvCh))}`}</h2><div class="tblwrap"><table>
      <tr><th>시각</th><th>채널</th><th>작품</th><th>결정</th><th>결정자</th><th>사유</th></tr>${
      (state.reviews||[]).filter(r => r.status !== "waiting")
        // 최신 결정이 맨 위(운영 결정 8/13) — 종전엔 무정렬(생성시각 fetch 순)이라 뒤죽박죽
        .sort((a,b) => new Date(b.decided_at || b.created_at) - new Date(a.decided_at || a.created_at))
        // 위 채널 칩과 연동 — 칩을 고르면 그 채널의 결정 기록만
        .filter(r => rvCh === "all" || r.channel_slug === rvCh)
        .slice(0,20).map(r => {
        const wo = state.wo[r.work_order_id] || {};
        const slug = wo.channel_slug || r.channel_slug;
        const d = r.status === "approved" ? chip("good","✓","합격")
                : r.status === "rejected" ? chip("crit","✕","반려") : chip("mut","–",r.status);
        return `<tr><td class="num">${ago(r.decided_at || r.created_at)}</td>
          <td style="white-space:nowrap">${chAvatarHtml(slug, 18)} ${esc(chName(slug))}</td>
          <td>${esc(wo.work_title||"")}</td><td>${d}</td>
          <td class="sub">${esc((r.decided_by||"").slice(0,18))}</td>
          <td class="sub">${esc((r.decision_note||"").slice(0,80))}</td></tr>`;
      }).join("") || '<tr><td colspan="6" class="empty">아직 없음</td></tr>'}</table></div></section>`;
  // v3: 프리뷰 자동 로드 — 버튼 없이 카드에서 바로 본다(서명 URL)
  rs.forEach(async r => {
    const pay = r.payload || {}; if (!pay.preview_key) return;
    try {
      const url = await signedUrl(pay.bucket || "ves-outputs", pay.preview_key, 1800);
      const v = document.getElementById("pvv_" + r.id);
      if (v && v.src !== url) v.src = url;
    } catch(e){
      const d = document.getElementById("pv_" + r.id);
      if (d) d.innerHTML = `<div class="sub">프리뷰 로드 실패 — ${esc(e.message)}</div>`;
    }
  });
}
window.loadPreview = async (rid, key, bucket) => {

    $(`#pv_${CSS.escape(rid)}`).innerHTML =

window.approve = rid => {

// 반려 단계 — ai-video 13단계 중 어디서부터 다시 돌릴지(0021). 서버가 정본, 여기는 표시만.
const REJECT_STAGES = [
  { key:"영상 분석",   why:"영상을 다시 보고 장면부터 새로 고른다", eta:"40~70분" },
  { key:"스토리 구성", why:"장면은 그대로, 고르고 잇는 것만 다시",   eta:"15~25분" },

];
window.rejectAsk = rid => {
  const e = CSS.escape(rid);

    <div class="rjfoot">

    </div></div>`;
};
window.rejectCancel = rid => {
  const b = $(`#rjb_${CSS.escape(rid)}`), a = $(`#rja_${CSS.escape(rid)}`);
  if (a){ a.style.display = "none"; a.innerHTML = ""; }

window.reject = async (rid, stage, regen) => {
  const note = ($(`#note_${CSS.escape(rid)}`).value || "").trim();
  const r = await rpc("reject_review",
    { p_review_id: rid, p_note: note || null, p_stage: stage,
      p_regenerate: regen !== false }, "반려 기록됨");
  if (r && typeof r === "object"){
    const where = r.node ? `${r.node} 에서` : "같은 맥에서";
    const what = r.from_step ? `${r.stage} 단계부터` : "처음부터";
    toast(r.regenerated
      ? `반려 — ${where} ${what} 다시 만듭니다 (${r.tries}/2)`
        + (r.note_applied && note ? " · 사유 반영됨" : "")
      : r.reason === "retry_limit"
        ? "반려 — 다시 만들기 상한(2회) 도달, 사람 판단이 필요합니다"
        : r.reason === "no_run_to_resume"
          ? "반려 — 이어달릴 이전 결과가 없습니다. '영상 분석'으로 다시 시도해 주세요"
          : "반려만 기록했습니다 — 다시 만들지 않음",
      r.reason === "retry_limit" || r.reason === "no_run_to_resume");
  }
};

// ───────── 채널 필터 칩 (목업: 맥별 → 채널별 나열) ─────────
// items: channel_slug 를 가진 행들. varName: 전역 필터 변수 이름('feedCh'|'rvCh').
function channelChips(items, cur, varName){
  const cnt = {};
  (items||[]).forEach(r => { const s = r.channel_slug; if (s) cnt[s] = (cnt[s]||0) + 1; });
  const chans = (state.chans||[]).slice()
    .sort((a,b) => (a.name||a.token_slug).localeCompare(b.name||b.token_slug, "ko"));
  // 검수함 칩의 건수는 '검수 대기' 시맨틱 노랑으로 강조 (피드는 중립 유지)
  const nStyle = varName === "rvCh"
    ? "color:var(--warn);font-weight:700" : "opacity:.6";
  const btn = (val, label, n) =>
    `<button class="mini ${cur===val?"on":""}" onclick="${varName}='${val}';feedCalOff=0;render()">${label}${
      n ? ` <span style="${nStyle}">${n}</span>` : ""}</button>`;
  return `<div class="filters">${btn("all", "전체", (items||[]).length)}${
    chans.map(c => btn(c.token_slug, esc(c.name||c.token_slug), cnt[c.token_slug])).join("")}</div>`;
}

// ───────── 목업: 피드 채널 상세 헤더 + 업로드 달력 ─────────
// 채널 아이콘 — 목업용 정적 스냅샷 (2026-08-11 YouTube og:image 수집).
// 실서비스 제안: channels_mirror 에 avatar_url 컬럼을 두고 channels_sync 가 갱신하거나
// 구 대시보드 chavatars API 방식 재사용 (아바타 변경 시 스냅샷은 낡는다).
const CH_AVATARS = {};   // 0020: 아이콘은 channels_mirror.avatar_url(매일 자동 갱신)에서 온다
let feedCalOff = 0;
window.feedCalNav = d => { feedCalOff += d; render(); };
// 업로드 이력 — perf_video_map(laeebly 유튜브 미러) 채널별 캐시.
// 구·신 대시보드 어느 쪽에서 발행했든 유튜브에 올라간 영상이 전부 잡힌다(3월~).
// 한계: perf_sync 가 시간당 1회라 방금 발행분은 늦게 반영 → publish 성공 잡과 합집합으로 보충.
let pvmCache = {};   // token_slug -> "loading" | {days:Set<YYYY-MM-DD>}
function pvmLoad(slug){
  if (pvmCache[slug]) return;
  pvmCache[slug] = "loading";
  const cid = ((state.chans||[]).find(c => c.token_slug === slug)||{}).channel_id;
  if (!cid){ pvmCache[slug] = {days:new Set()}; return; }
  Promise.all([
    sb.from("perf_video_map").select("published_at").eq("channel_id", cid).limit(2000),
    // 채널 자체 총 영상 수 — 유튜브 채널 통계 미러(우리가 만든 것 외 전부 포함)
    sb.from("perf_channel_snapshot").select("video_count,snapshot_date").eq("channel_id", cid)
      .order("snapshot_date", {ascending:false}).limit(1),
  ]).then(([vm, cs]) => {
    const days = new Set();
    (vm.data||[]).forEach(r => { if (r.published_at) days.add(kstDay(r.published_at)); });
    const c = (cs.data||[])[0];
    pvmCache[slug] = {days, vcount: c ? Number(c.video_count) : null, vdate: c ? c.snapshot_date : null};
    if (tab === "feed" && feedCh === slug) render();
  });
}
// 채널 아바타 — 실제 아이콘, 로드 실패·미수집 시 채널명 해시 색 이니셜 폴백
function chAvatarHtml(slug, size){
  const name = chName(slug);
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  const ch = (state.chans||[]).find(x => x.token_slug === slug);
  const url = (ch && ch.avatar_url) || CH_AVATARS[slug];
  return `<span class="chav" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;
    background:linear-gradient(135deg,hsl(${h},55%,45%),hsl(${(h+45)%360},60%,58%))">${esc(name.slice(0,1))}${
    url ? `<img src="${url}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
}
// 채널의 현재 생성 신호등 (홈 탭과 동일 규칙: 오늘 작업분 우선, 없으면 최근 작업분)
function chSignal(slug){
  const today = kstDay();
  if (EXT_PIPE[slug]){
    const zj = (state.jobs||[]).find(x => x.kind === "zanmang_autopilot" && kstDay(x.created_at) === today);
    const [cls, label] = !zj ? ["none","오늘 실행 전"]
      : zj.status === "succeeded" ? ["ok","오늘 실행 완료"]
      : zj.status === "running" ? ["run","실행 중"]
      : ["failed","dead"].includes(zj.status) ? ["bad","실패"] : ["wait","대기"];
    return {cls, label};
  }
  const alive = (state.wos||[]).filter(w => w.status !== "cancelled" && w.channel_slug === slug);
  const todays = alive.filter(w => kstDay(w.service_date || w.created_at) === today);
  const cur = todays.length ? todays[0] : alive[0];
  const st = cur ? woStatus(cur) : "none";
  const [cls, label] = GEN_DOT[st] || GEN_DOT.none;
  return {cls, label};
}
// 신호등 색은 테마 무관 동일 (홈 탭 점 색과 일치하도록 라이트에서도 다크 팔레트 고정)
const SIG_COLOR = { ok:"#0ca30c", wait:"#fab219", bad:"#d03b3b",
                    rej:"#d03b3b", run:"#3987e5", none:"var(--muted)" };

function chHeader(slug){
  const ch = (state.chans||[]).find(c => c.token_slug === slug) || {};
  const name = ch.name || chName(slug);
  const wOvr = (state.worksOvr||{})[slug];
  const works = (wOvr && wOvr.works) || ch.works || [];
  // 업로드 일자 = perf_video_map(유튜브 실발행 이력, 구 대시보드분 포함) ∪ publish 성공 잡(당일 보충)
  pvmLoad(slug);
  const pvm = pvmCache[slug];
  const upDays = new Set(pvm && pvm !== "loading" ? pvm.days : []);
  (state.wos||[]).filter(w => w.channel_slug === slug).forEach(w => {
    const pub = (state.jobsByWo[w.id]||[]).find(j => j.kind === "publish" && j.status === "succeeded");
    if (pub) upDays.add(kstDay(pub.finished_at || pub.updated_at));
  });
  const now = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Seoul"}));
  const base = new Date(now.getFullYear(), now.getMonth() + feedCalOff, 1);
  const y = base.getFullYear(), m = base.getMonth();
  const days = new Date(y, m + 1, 0).getDate(), first = base.getDay();
  const todayStr = kstDay(), pad = n => String(n).padStart(2, "0");
  const sig = chSignal(slug), sigColor = SIG_COLOR[sig.cls] || SIG_COLOR.none;
  let cnt = 0;
  const cells = ["일","월","화","수","목","금","토"].map(d => `<span class="dow">${d}</span>`);
  for (let i = 0; i < first; i++) cells.push("<span></span>");
  for (let d = 1; d <= days; d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const up = upDays.has(ds); if (up) cnt++;
    const cls = ["d", up && "up", ds === todayStr && "today", ds > todayStr && "future"]
      .filter(Boolean).join(" ");
    const tdStyle = ds === todayStr ? ` style="outline-color:${sigColor}"` : "";
    const tdTip = ds === todayStr ? ` · 오늘 · ${sig.label}` : "";
    cells.push(`<span class="${cls}"${tdStyle} title="${ds}${up ? " · 업로드 ✓" : ""}${tdTip}">${d}</span>`);
  }
  return `<div class="chhead">
    ${ch.channel_id
      ? `<a class="avlink" href="https://youtube.com/channel/${esc(ch.channel_id)}" target="_blank" rel="noopener" title="YouTube 채널 열기">${chAvatarHtml(slug, 74)}</a>`
      : chAvatarHtml(slug, 74)}
    <div class="info">
      <div class="nm">${esc(name)}
        <button class="mini" onclick="tab='channels';render()">템플릿 편집</button></div>
      <div class="wk"><b>오늘 신호등</b><span class="chdot ${sig.cls}" style="display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:5px"></span>${esc(sig.label)}</div>
      <div class="wk"><b>사용 작품</b>${works.length ? esc(works.join(", ")) : "배정된 작품 없음"}</div>
      <div class="wk" title="유튜브 채널에 올라와 있는 전체 영상 수 — perf_sync(매시간) 미러값${
          pvm && pvm.vdate ? " · " + esc(pvm.vdate) + " 집계" : ""}"><b>채널 영상</b>${
        pvm === "loading" ? '<span style="color:var(--muted)">집계 중…</span>'
        : (pvm && pvm.vcount != null)
          ? `<b style="font-size:13px">${fmtN(pvm.vcount)}개</b>${
              pvm.vdate && pvm.vdate !== kstDay()
                ? ` <span style="color:var(--muted)">· ${esc(String(pvm.vdate).slice(5))} 집계</span>` : ""}`
          : '<span style="color:var(--muted)">집계 없음</span>'}</div>
      <div class="wk" style="font-size:11.5px;color:var(--muted)">달력: 유튜브 발행 이력(구·신 대시보드 무관) + 오늘 발행분${pvm === "loading" ? " · 이력 불러오는 중…" : ""}</div>
    </div>
    <div class="chcal">
      <div class="mh"><button class="mini" onclick="feedCalNav(-1)">◀</button>
        <span>${y}년 ${m+1}월<span class="sum">업로드 ${cnt}일</span></span>
        <button class="mini" onclick="feedCalNav(1)">▶</button></div>
      <div class="cg">${cells.join("")}</div>
    </div>
  </div>`;
}

// ───────── 소스 (v3.3: 회차 그룹 + 채널별 잔량 + 소진 직접 수정 — 0023·0024) ─────────
let srcOpen = new Set();

/* source_usage(파일 1행) + source_usage_by_channel(0023) → 회차 단위 지도.
   한 회차에 파일 행이 여럿인 경우가 실제로 있다(혜미리예채파 5화 3행 · 샤먼:미신전 회차NULL 6행).
   화면은 회차로 묶되, **숫자는 행 단위로 합산한다**(0027).
     · 종전엔 소진이 (작품, 회차) 단위라 행마다 같은 값이 와서 Math.max 가 맞았다.
     · 0027 부터 행(=영상)마다 자기 한도를 갖는다 — 5화에 8분·40분 영상이 하나씩이면
       한도는 1+3=4편이다. max 를 그대로 두면 3편으로 보이고, 한 영상이 소진되면
       회차 전체가 소진된 것처럼 보여 planner 가 배정하는 걸 관제가 설명 못 한다.
     · used_legacy 만은 예외 — 레거시 장부가 회차 단위라 뷰가 행마다 같은 값을 반복해
       준다. 합치면 행 수만큼 부풀므로 회차당 한 번만 센다.
     · 합산 대상은 **planner 가 실제로 고를 수 있는 행**뿐이다(활성 · 3분 초과).
       전부 더하면 비활성·짧은 클립까지 한도에 들어가 화면이 부풀고, 관제가 '남음 27'
       이라고 표시한 뒤 실행하면 RPC 가 거절한다 — 이 개편이 없애려던 바로 그 증상이
       반대 방향으로 되살아난다(실측: 국대 단편 한도 33 vs 실제 6). */
const srcUsable = r => r.is_active !== false &&
                       (r.duration_sec == null || Number(r.duration_sec) > 180);
function buildEpMap(srcs, byCh){
  const map = {}, key = ep => ep == null ? "-" : String(ep);
  (srcs||[]).forEach(r => {
    const m = map[r.work_title] = map[r.work_title] || {};
    const e = m[key(r.episode)] = m[key(r.episode)] ||
      { work:r.work_title, ep:r.episode, limit:0, active:false, dur:null,
        files:0, usable:0, usedAny:0, ids:[], limits:[], ch:{} };
    if (r.is_active !== false) e.active = true;
    e.files += 1; e.ids.push(r.source_id);
    if (!srcUsable(r)) return;                  // 비활성·3분 이하는 셈에서 뺀다
    e.usable  += 1;
    e.limit   += Number(r.use_limit)  || 0;     // 행별 한도의 합(0027)
    e.usedAny += Number(r.times_used) || 0;     // 전 채널 합 — 행별 사용의 합
    e.limits.push(Number(r.use_limit) || 0);
    // 길이는 쓸 수 있는 행에서만 집는다 — 비활성 57초 클립 하나가 회차 전체를
    // '3분 이하'로 만들어 화면에서 숨기면서 planner 는 정상 배정하는 일이 생겼다.
    const d = Number(r.duration_sec); if (!e.dur && d > 0) e.dur = d;
  });
  (byCh||[]).forEach(r => {
    const e = (map[r.work_title] || {})[key(r.episode)]; if (!e) return;
    if (!srcUsable(r)) return;                  // 한도와 같은 기준으로 센다
    const c = e.ch[r.channel_slug] = e.ch[r.channel_slug] || { wo:0, lg:0, used:0 };
    c.wo += Number(r.used_wo) || 0;
    c.lg  = Math.max(c.lg, Number(r.used_legacy) || 0);   // 회차 단위 장부 — 한 번만
    c.used = c.wo + c.lg;
  });
  return map;
}
const epsOf    = w => Object.values((state.eps||{})[w] || {})
                        .sort((a,b) => (a.ep ?? 1e9) - (b.ep ?? 1e9));
// 쓸 수 있는 행이 하나라도 있으면 그 회차는 쓸 수 있다(0027: 회차에 영상이 여럿이다)
const epUsable = e => e.usable > 0;
const epUsed   = (e, slug) => (e.ch[slug] || {}).used || 0;
const epRemain = (e, slug) => Math.max(0, e.limit - epUsed(e, slug));   // 0023: 소진은 채널별

function epBlock(e, chs, editable){
  const sid  = e.ids[0];
  const lab  = e.ep != null ? e.ep + "회차" : "단편";
  const mins = e.dur ? `<span class="sub">${Math.floor(e.dur/60)}분</span>` : "";
  // 한도·남음은 쓸 수 있는 행만 센다 — 파일 수와 다르면 그 사실을 같이 보여준다
  const nf   = e.files > 1
    ? `<span class="sub">파일 ${e.files}개${
         e.usable < e.files ? ` · 쓸 수 있는 것 ${e.usable}개` : ""}</span>`
    : "";
  const dead = epUsable(e) ? ""
             : (!e.active ? '<span class="sub">비활성</span>'
                          : '<span class="sub">3분 이하 — 미사용</span>');
  /* 0027: 한도는 영상(파일 행)마다 걸린다. 입력칸은 '영상당' 값을 받아 이 회차의 행
     전부에 같은 값을 건다 — 회차 합계(e.limit)를 입력받으면 행마다 얼마씩 나눌지가
     모호해진다. 행마다 값이 다르면(길이 비례로 1·3 이 섞인다) 최댓값을 보여준다. */
  const each = e.limits.length ? Math.max(...e.limits) : 0;
  const mixed = new Set(e.limits).size > 1;
  const lim  = editable
    ? `<label class="ednum" title="${e.files > 1
          ? `영상 ${e.files}개 각각의 편수 상한. 저장하면 이 회차의 영상 전부에 같은 값이 걸립니다`
          : "이 영상으로 만들 편수 상한"}">
         ${e.files > 1 ? "영상당 한도" : "한도"}<input type="number" min="0" max="20"
                   value="${each}" data-sids="${esc(e.ids.join(","))}"
                   onchange="srcLimit(this)"></label>${
      e.files > 1 ? `<span class="sub">합계 ${e.limit}${mixed ? " · 영상별로 다름" : ""}</span>` : ""}`
    : `<span class="sub">한도 ${e.limit}${e.files > 1 ? ` (영상 ${e.files}개 합)` : ""}</span>`;
  const rows = chs.length ? chs.map(c => {
    const s = c.token_slug, u = e.ch[s] || { wo:0, lg:0 };
    const used = epUsed(e, s), remain = epRemain(e, s);
    const pct  = e.limit ? Math.min(100, Math.round(used / e.limit * 100)) : 100;
    const full = !epUsable(e) || remain === 0;
    const box  = editable
      ? `<input type="number" min="0" max="99" value="${used}" data-sid="${sid}"
                data-ch="${esc(s)}" onchange="srcUsed(this)"
                title="이 채널이 이 회차를 실제로 몇 번 썼는지. 발주 기록보다 낮게는 못 내립니다">`
      : "";

function renderSources(){
  const chOf = w => (state.chans||[]).filter(c => effWorks(c.token_slug).includes(w));
  /* 며칠치 = 남은 편수 ÷ 배정 채널 수. source_watch(LOW_DAYS=3)가 보충 인입을 거는 기준과
     같은 셈을 쓴다 — 거기는 채널 구분 없이 (use_limit − 전체 사용)으로 세므로 여기도 그렇게
     센다. 그래야 '보충 인입 예약' 표시가 실제 동작과 어긋나지 않는다.
     (채널별 실제 잔량은 아래 회차 상세에 채널마다 따로 나온다.)
     작품이 30개·회차가 200개 넘으므로 정렬 비교자 안에서 다시 세지 않는다 — 한 번만 재고 쓴다. */
  const info = {};
  Object.keys(state.eps || {}).forEach(w => {
    const eps = epsOf(w), chs = chOf(w);
    const rem = eps.filter(epUsable).reduce((s,e) => s + Math.max(0, e.limit - e.usedAny), 0);
    info[w] = { eps, chs, rem, days: chs.length ? rem / chs.length : Infinity };
  });
  const works = Object.keys(info)
                  .sort((a,b) => (info[a].days - info[b].days) || a.localeCompare(b, "ko"));
  const editable = can("operator");

  const blocks = works.map(w => {
    const { eps, chs, rem, days } = info[w];
    const head = rem === 0
      ? chip("crit","✕","전 회차 소진 — 보충 인입 대기 중")
      : days <= 3
        ? chip("warn","!",`${rem}편 남음${days === Infinity ? "" : ` · ${Math.floor(days)}일치`} — 보충 인입 예약`)
        : chip("good","✓",`앞으로 ${rem}편${days === Infinity ? "" : ` · ${Math.floor(days)}일치`}`);
    const nexts = chs.map(c => {
      const e = eps.find(x => epUsable(x) && epRemain(x, c.token_slug) > 0);
      return `${c.name}: ${e ? (e.ep != null ? e.ep + "회차" : "단편") : "없음"}`;
    }).join(" · ");
    const open = srcOpen.has(w);
    return `<div class="srcwork">
      <div class="swh" style="cursor:pointer" data-w="${esc(w)}" onclick="srcToggle(this.dataset.w)">
        <span class="sub">${open ? "▾" : "▸"}</span><b>${esc(w)}</b>
        <span class="sub">${eps.length}개 회차</span>
        ${chs.length ? `<span class="sub">→ ${esc(chs.map(c => c.name).join(", "))}</span>`
                     : '<span class="sub">배정 채널 없음</span>'}
        <span class="right"></span>
        ${nexts ? `<span class="pill" title="채널별 다음 사용 회차">다음 ${esc(nexts)}</span>` : ""}
        ${head}</div>
      ${open ? eps.map(e => epBlock(e, chs, editable)).join("") : ""}</div>`;
  }).join("");

  $("#page").innerHTML = `<section class="card">
    <h2>소스 창고 — 작품명을 누르면 회차별·채널별 잔량이 열립니다
      <button class="mini right" onclick="srcAll()">모두 ${srcOpen.size ? "접기" : "펼치기"}</button></h2>
    <div class="sub" style="margin-bottom:8px">소진은 채널별로 셉니다(0023) — 같은 회차를 두 채널이
      각자 한도만큼 씁니다. <b>한도</b>는 그 회차로 만들 편수 상한(등록 시 길이로 자동 결정: 10분 미만 1
      · 10~30분 2 · 30분↑ 3), <b>쓴 수</b>는 그 채널이 실제로 쓴 합계(발주 기록 + 레거시 보정)입니다.
      ${editable ? "숫자를 고치면 바로 저장됩니다." : "수정은 operator 권한이 필요합니다."}</div>
    ${(state.srcs||[]).length && !(state.srcCh||[]).length
      ? `<div class="sub" style="color:var(--serious);margin-bottom:8px">⚠ 채널별 소진
         (source_usage_by_channel)을 못 읽었습니다 — 아래 채널 숫자는 0으로 보입니다. 0023·0024
         적용 여부와 읽기 권한을 확인하세요.</div>` : ""}
    ${blocks || '<div class="empty">등록된 소스 없음 — 유튜브형은 자동, 파일형은 메인 맥에서 deploy/register_source.py 로 등록</div>'}
    </section>`;
}

window.srcLimit = el => {
  const v = parseInt(el.value, 10);
  if (!Number.isInteger(v) || v < 0 || v > 20){
    toast("한도는 0~20 사이 정수여야 합니다", true); refresh(); return; }
  // 0027: set_source_limit 이 고른 그 행만 고친다 — 회차에 영상이 여럿이면 행마다 건다.
  // rpc() 헬퍼는 호출마다 토스트·refresh 를 내므로 여기서는 sb.rpc 를 직접 쓰고
  // 결과를 모아 한 번만 알린다. 거부되면 새로고침해 입력칸을 실제 값으로 되돌린다.
  const sids = (el.dataset.sids || "").split(",").filter(Boolean);
  Promise.all(sids.map(sid => sb.rpc("set_source_limit", { p_source: sid, p_limit: v })))
    .then(rs => {
      const bad = rs.find(r => r.error);
      if (bad) toast(`set_source_limit 거부: ${bad.error.message}`, true);
      else     toast(sids.length > 1 ? `영상 ${sids.length}개 한도 ${v}편으로 저장`
                                     : `한도 ${v}편으로 저장`);
      refresh();
    });
};
window.srcUsed = el => {

  if (!Number.isInteger(v) || v < 0){
    toast("쓴 수는 0 이상 정수여야 합니다", true); refresh(); return; }
  rpc("set_source_used",
      { p_source: el.dataset.sid, p_channel: el.dataset.ch, p_used: v }, `쓴 수 ${v}로 저장`)
    .then(r => { if (r === null) refresh(); });
};

function paletteColors(){
  const base = ["#FFFFFF","#000000","#FFD84D","#FFFF00","#FF69B4","#F5F5F5","#FF3B30","#3987E5","#0CA30C"];
  const used = new Set();
  (state.chans||[]).forEach(c => {
    const o = state.designOvr[c.token_slug];
    const d = (o && o.design) || c.design || {};
    DESIGN_FIELDS.forEach(([k,,t]) => {
      if (t !== "color") return;
      const v = String(d[k] || "");
      if (/^#[0-9a-fA-F]{6}$/.test(v)) used.add(v.toUpperCase());
    });
  });
  return [...new Set([...base, ...used])];
}

// ───────── 성과 (v3.2: laeebly youtube_*_snapshot 미러 직결 — perf_sync 가 매시간 복사) ─────────
let perf = null, perfLoading = false, perfSort = { col: "views", dir: -1 };
// 목업: 영상별 성과 채널 멀티 필터 — null=전체, Set=선택된 채널들(빈 Set=전부 해제)
let perfChSet = null, perfFilterOpen = false;
const fmtN = v => v == null ? "—" : Number(v).toLocaleString("ko-KR");
const fmtD = v => v == null ? "—" : (v > 0 ? "+" : "") + Number(v).toLocaleString("ko-KR");
const chNameById = id => { const c = (state.chans||[]).find(x => x.channel_id === id);
  return (c && c.name) || (id || "").slice(0,10); };
async function loadPerf(){
  if (perfLoading) return; perfLoading = true;
  try {
    const md = await sb.from("perf_video_snapshot").select("snapshot_date")
      .order("snapshot_date",{ascending:false}).limit(1);
    const maxDate = md.data && md.data[0] && md.data[0].snapshot_date;
    if (!maxDate){ perf = { empty: true }; return; }
    const dOf = n => { const t = new Date(maxDate + "T00:00:00Z");
      t.setUTCDate(t.getUTCDate() - n); return t.toISOString().slice(0,10); };
    const dates = [maxDate, dOf(1), dOf(28)];
    const [vs, vm, cs] = await Promise.all([
      sb.from("perf_video_snapshot").select("*").in("snapshot_date", dates).limit(9000),
      sb.from("perf_video_map").select("*").limit(3000),
      sb.from("perf_channel_snapshot").select("*").gte("snapshot_date", dOf(29)).limit(2000),
    ]);
    if (vs.error || vm.error || cs.error)
      throw new Error((vs.error||vm.error||cs.error).message);
    perf = { maxDate, dates, vs: vs.data||[], vm: vm.data||[], cs: cs.data||[] };
  } catch(e){ perf = { error: String(e.message || e) }; }
  finally { perfLoading = false; render(); }
}
function perfRows(){
  const [d0, d1, d28] = perf.dates;
  const snap = {};
  perf.vs.forEach(s => (snap[s.content_id] = snap[s.content_id] || {})[s.snapshot_date] = s);
  return perf.vm.map(m => {
    const s = snap[m.content_id] || {};
    const cur = s[d0] || s[d1], prev = s[d1], old = s[d28];
    return { title: m.title || m.content_id, work: m.work_title || "",
      ch: chNameById(m.channel_id), cid: m.content_id, dead: !!m.dead_at,
      views: cur ? Number(cur.view_count) : null,
      d1: cur && prev && cur !== prev ? Number(cur.view_count) - Number(prev.view_count) : null,
      d28: cur && old ? Number(cur.view_count) - Number(old.view_count) : null,
      likes: cur ? Number(cur.like_count) : null,
      pub: m.published_at ? kstDay(m.published_at) : "" };
  }).filter(r => r.views != null);
}
function renderPerf(){
  if (!perf){ loadPerf();
    $("#page").innerHTML = '<section class="card"><div class="empty">성과 불러오는 중…</div></section>'; return; }
  if (perf.error){
    $("#page").innerHTML = `<section class="card"><h2>성과</h2><div class="empty">불러오기 실패: ${esc(perf.error)}
      <button class="mini" onclick="perf=null;render()">다시 시도</button></div></section>`; return; }
  if (perf.empty){
    $("#page").innerHTML = `<section class="card"><h2>성과</h2><div class="empty">아직 미러된 성과 데이터가 없습니다 —
      perf_sync(매시간)가 첫 회전을 돌면 여기에 채워집니다.</div></section>`; return; }
  // 채널 요약 — 구독자(최신·28일 증감) + 영상 28일 조회 증가 합
  const rows = perfRows();
  const byCh = {};
  rows.forEach(r => { const g = byCh[r.ch] = byCh[r.ch] || { ch:r.ch, vids:0, views:0, d28:0 };
    g.vids++; g.views += r.views||0; g.d28 += r.d28||0; });
  const csByCh = {};
  perf.cs.forEach(s => (csByCh[s.channel_id] = csByCh[s.channel_id] || []).push(s));
  const chSum = Object.keys(csByCh).map(cid => {
    const arr = csByCh[cid].slice().sort((a,b) => a.snapshot_date < b.snapshot_date ? 1 : -1);
    const cur = arr[0], old = arr[arr.length-1];
    const g = byCh[chNameById(cid)] || {};
    return { ch: chNameById(cid), subs: Number(cur.subscriber_count),
      dsubs: Number(cur.subscriber_count) - Number(old.subscriber_count),
      vids: g.vids || 0, d28: g.d28 || 0 };
  }).sort((a,b) => (b.d28||0) - (a.d28||0));
  // 영상 표 — 정렬 + 상위 200
  const COLS = [["title","영상 제목"],["work","작품"],["ch","채널"],["views","조회수"],
    ["d1","+1일"],["d28","+28일"],["likes","좋아요"],["pub","게시일"]];
  const c = perfSort.col, dir = perfSort.dir;
  const allChs = Object.keys(byCh).sort((a,b) => a.localeCompare(b, "ko"));
  const chipChs = [...new Set([...allChs, ...chSum.map(r => r.ch)])].sort((a,b) => a.localeCompare(b, "ko"));
  const vrows = perfChSet ? rows.filter(r => perfChSet.has(r.ch)) : rows;
  vrows.sort((a,b) => { const x = a[c], y = b[c];
    const cmp = (typeof x === "number" || typeof y === "number")
      ? (Number(x)||0) - (Number(y)||0) : String(x??"").localeCompare(String(y??""), "ko");
    return dir * cmp; });
  const top = vrows.slice(0, 200);
  $("#page").innerHTML = `
    <section class="card"><h2>채널 요약 — 기준일 ${esc(perf.maxDate)} (laeebly 수집분 미러, 매시간 갱신)
      <button class="mini right" onclick="perf=null;render()">새로고침</button></h2>
    <div class="tblwrap"><table><tr><th>채널</th><th>구독자</th><th>구독 +28일</th>
      <th>추적 영상</th><th>조회 +28일</th></tr>${
    chSum.map(r => `<tr class="${perfChSet && perfChSet.has(r.ch) ? "selrow" : ""}" style="cursor:pointer"
        title="클릭 — 아래 영상 목록을 이 채널만 (다시 클릭하면 전체로)"
        onclick="perfChOnly('${esc(r.ch)}')"><td>${esc(r.ch)}</td><td class="num">${fmtN(r.subs)}</td>
      <td class="num">${fmtD(r.dsubs)}</td><td class="num">${fmtN(r.vids)}</td>
      <td class="num">${fmtD(r.d28)}</td></tr>`).join("")
    || '<tr><td colspan="5" class="empty">채널 스냅샷 없음</td></tr>'}</table></div></section>
    <section class="card"><h2>영상별 성과 — 열 제목 클릭으로 정렬${vrows.length > 200 ? ` (상위 200/${vrows.length}개 표시)` : ""}${
        perfChSet ? ` · <b>${perfChSet.size}개 채널 선택</b> · 영상 ${vrows.length}개` : ""}
      <button class="mini right ${perfChSet ? "on" : ""}"
        onclick="perfFilterOpen=!perfFilterOpen;render()">⏷ 채널 필터${perfChSet ? " 적용 중" : ""}</button></h2>
    ${perfFilterOpen ? `<div class="filters">
      <button class="mini" onclick="perfChSet=null;render()">✓ 전체 선택</button>
      <button class="mini" onclick="perfChSet=new Set();render()">✕ 전체 해제</button>
      <span style="border-left:1px solid var(--line);margin:0 2px"></span>
      ${chipChs.map(ch => { const n = byCh[ch] ? byCh[ch].vids : 0;
        return `<button class="mini ${!perfChSet || perfChSet.has(ch) ? "on" : ""}" ${n ? "" : 'style="opacity:.45" title="영상 스냅샷 없음 — 수집 확인 필요"'}
        onclick="perfChToggle('${esc(ch)}')">${esc(ch)} <span style="opacity:.6">${n}</span></button>`; }).join("")}
    </div>` : ""}
    <div class="tblwrap"><table><tr>${COLS.map(([k,l]) =>
      `<th class="sortable" onclick="perfSortBy('${k}')">${l}${perfSort.col===k?(dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr>${
    top.map(r => `<tr><td>${r.dead?'<span class="sub" title="내려간 영상">†</span> ':""}<a href="https://youtu.be/${esc(r.cid)}" target="_blank" rel="noopener" style="color:inherit">${esc(r.title)}</a></td>
      <td>${esc(r.work)}</td><td>${esc(r.ch)}</td>
      <td class="num">${fmtN(r.views)}</td><td class="num">${fmtD(r.d1)}</td>
      <td class="num">${fmtD(r.d28)}</td><td class="num">${fmtN(r.likes)}</td>
      <td class="num">${esc(r.pub)}</td></tr>`).join("")
    || `<tr><td colspan="8" class="empty">${perfChSet && perfChSet.size === 0
        ? "선택된 채널이 없습니다 — 필터에서 채널을 켜거나 전체 선택을 누르세요" : "영상 스냅샷 없음"}</td></tr>`}</table></div></section>`;
}
// 칩 토글 — 전체(null)에서 하나 끄면 "그 채널만 제외" 상태가 된다
window.perfChToggle = ch => {
  const all = perfAllChs();
  if (!perfChSet) perfChSet = new Set(all);
  perfChSet.has(ch) ? perfChSet.delete(ch) : perfChSet.add(ch);
  if (perfChSet.size === all.length) perfChSet = null;   // 전부 켜지면 전체 상태로 정규화
  render();
};
// 요약 행 클릭 — 이 채널만 보기 (재클릭 시 전체)
window.perfChOnly = ch => {
  perfChSet = (perfChSet && perfChSet.size === 1 && perfChSet.has(ch)) ? null : new Set([ch]);
  render();
};
function perfAllChs(){
  const set = new Set();
  perfRows().forEach(r => set.add(r.ch));
  return [...set];
}
window.perfSortBy = c => {
  perfSort = perfSort.col === c ? { col:c, dir:-perfSort.dir } : { col:c, dir:-1 };
  render();
};

// ───────── 권한 관리 (admin 전용 — RPC 로만, 0015) ─────────
let adminUsers = null;
async function loadAdmin(){
  const { data, error } = await sb.rpc("list_user_roles");
  adminUsers = error ? { error: error.message } : { rows: data || [] };
  render();
}
function renderAdmin(){
  if (myRole !== "admin"){
    $("#page").innerHTML = '<section class="card"><div class="empty">admin 전용 화면입니다</div></section>'; return; }
  if (!adminUsers){ loadAdmin();
    $("#page").innerHTML = '<section class="card"><div class="empty">사용자 목록 불러오는 중…</div></section>'; return; }
  if (adminUsers.error){
    $("#page").innerHTML = `<section class="card"><h2>권한 관리</h2>
      <div class="empty">불러오기 실패: ${esc(adminUsers.error)}
      <button class="mini" onclick="adminUsers=null;render()">다시 시도</button></div></section>`; return; }
  const ROLES = ["viewer","reviewer","operator","admin"];
  const ROLE_KO = { viewer:"보기만", reviewer:"검수 가능", operator:"운영(잡·노드)", admin:"관리자" };
  const meEmail = ($("#whoami").textContent || "").split(" ·")[0];
  $("#page").innerHTML = `<section class="card">
    <h2>권한 관리 — 변경은 즉시 적용 <button class="mini right" onclick="adminUsers=null;render()">새로고침</button></h2>
    <div class="sub" style="margin-bottom:8px">viewer(보기) < reviewer(검수) < operator(운영) < admin(관리) ·
      새 팀원은 먼저 로그인 계정(Supabase Auth)이 만들어져 있어야 목록에 보입니다.
      자기 자신의 권한은 바꿀 수 없습니다(잠금 사고 방지).</div>
    <div class="tblwrap"><table><tr><th>이메일</th><th>권한</th><th>메모</th><th></th></tr>${
    adminUsers.rows.map((u,i) => {
      const self = u.email === meEmail;
      return `<tr><td>${esc(u.email)}${self ? ' <span class="sub">(나)</span>' : ""}</td>
        <td><select id="ur_${i}" ${self ? "disabled" : ""}>${ROLES.map(r =>
          `<option value="${r}" ${u.role===r?"selected":""}>${r} — ${ROLE_KO[r]}</option>`).join("")}</select></td>
        <td><input id="un_${i}" value="${esc(u.note||"")}" placeholder="메모(선택)" ${self ? "disabled" : ""}></td>
        <td>${self ? "" : `<button class="mini pri" onclick="adminSave(${i},'${esc(u.email)}')">저장</button>`}</td></tr>`;
    }).join("") || '<tr><td colspan="4" class="empty">사용자 없음</td></tr>'}</table></div></section>`;
}
window.adminSave = (i, email) => {
  const role = $(`#ur_${i}`).value, note = ($(`#un_${i}`).value || "").trim() || null;
  adminUsers = null;
  rpc("set_user_role", { p_email: email, p_role: role, p_note: note }, `${email} → ${role}`);
};

// ───────── 폴링 ─────────
let auto = true;
// v3: 영상 시청·입력 중엔 자동 갱신을 잠시 멈춘다 — 재생/타이핑 중 화면이 갈리지 않게
const anyVideoPlaying = () =>
  [...document.querySelectorAll("video")].some(v => !v.paused && !v.ended);
const userTyping = () => { const a = document.activeElement;
  return !!a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName); };
setInterval(() => { if (auto && !document.hidden && tab !== "perf"
                    && !anyVideoPlaying() && !userTyping()) refresh(); }, 15000);
$("#btnRefresh").onclick = () => refresh();
$("#btnTheme").onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
$("#btnAuto").onclick = e => { auto = !auto; e.target.textContent = `자동 15s: ${auto?"켬":"끔"}`; };
document.addEventListener("visibilitychange", () => { if (!document.hidden && auto) refresh(); });
window.rpc = rpc; window.armed = armed; window.$ = $;
</script>
</body>
</html>
