// ── 플레이어 ───────────────────────────────────────────────────────────
// 원본 시각 t 를 어느 소스로 볼지: 고화질 클로즈업 구간이면 그것, 아니면 전체 프리뷰.
// 어느 쪽이든 화면에 찍히는 시각은 **원본 절대초**다(offset 을 더해 되돌린다).
function edSourceAt(t){
  const med = ((edData.sprites||{}).assets||{}).media || {};
  for (const c of med.closeups || [])
    if (t >= c.start_sec && t <= c.end_sec)
      return { key: c.key, offset: c.start_sec, hq: true };
  return med.scan ? { key: med.scan, offset: 0, hq: false } : null;
}

let edCurSrc = null, edSeeking = false, edLoadGen = 0;
async function edMountVideo(){
  const v = document.getElementById("edvid"); if (!v) return;
  v.ontimeupdate = () => {
    if (edSeeking) return;
    edCursorSet((edCurSrc ? edCurSrc.offset : 0) + v.currentTime, false);
  };
  v.onplay = () => { const b = document.getElementById("edplay"); if (b) b.textContent = "⏸"; };
  v.onpause = () => { const b = document.getElementById("edplay"); if (b) b.textContent = "▶"; };
  await edLoadSource(edCursor, false);
}

// 시킹은 메타데이터가 온 뒤에만 유효하다 — readyState 0 인 video 에 currentTime 을 넣으면
// 브라우저가 그 시킹을 조용히 버린다. 종전 코드는 src 대입 직후 edCurSrc 를 기록해서,
// 로드가 끝나기 전의 재클릭이 "같은 소스"로 판정돼 로드 분기를 건너뛰고 죽은 시킹만 했다
// (타임라인 클릭 후 화면이 검게 멈추는 '먹통'의 정체). 그래서 ① edCurSrc 는 메타데이터가
// 실제로 온 뒤에만 기록하고, ② 세대표(edLoadGen)로 낡은 호출을 물러나게 한다 — 연타로
// 로드 두 개가 겹치면 뒤 클릭이 이기고 앞 클릭은 src 도 시킹도 건드리지 않는다.
async function edLoadSource(t, play){
  const v = document.getElementById("edvid"); if (!v) return;
  const want = edSourceAt(t);
  if (!want){ return; }
  const gen = ++edLoadGen;
  const nm = document.getElementById("edsrcname");
  if (!edCurSrc || edCurSrc.key !== want.key || v.readyState === 0){
    edSeeking = true;
    edCurSrc = null;                     // 로드 완료 전엔 '열린 소스 없음'
    let url;
    try { url = await signedUrl("ves-outputs", want.key, 3600); }
    catch(e){ if (gen === edLoadGen){ toast("영상 열기 실패: " + e.message, true); edSeeking = false; } return; }
    if (gen !== edLoadGen) return;
    // 같은 URL 이 이미 로드 중이면 src 재대입 금지 — 대입은 받던 것을 처음부터 다시 받는다.
    // 단 이전 로드가 에러로 죽었으면(v.error) 같은 URL 이라도 다시 대입해 되살린다.
    if (v.src !== url || v.error) v.src = url;
    await new Promise(res => {
      const done = () => { v.removeEventListener("loadedmetadata", done); res(); };
      if (v.readyState > 0) return done();
      v.addEventListener("loadedmetadata", done);
      setTimeout(done, 15000);           // scan 은 150~400MB — 종전 4초는 모자랐다
    });
    if (gen !== edLoadGen) return;
    if (v.readyState === 0){             // 타임아웃 — 시킹해봐야 버려지니 사실대로 알린다
      edSeeking = false;
      toast("영상 로드가 느립니다 — 잠시 후 다시 눌러 주세요", true);
      return;
    }
    edCurSrc = want;
    edSeeking = false;
  }
  if (gen !== edLoadGen) return;
  if (nm) nm.textContent = want.hq ? "정밀 구간(24fps)" : "전체 훑기(4fps)";
  v.currentTime = Math.max(0, t - want.offset);
  if (play) v.play().catch(()=>{});
}

function edCursorSet(t, moveVideo){
  edCursor = Math.max(0, Number(t) || 0);
  const dur = Number((edData.timeline||{}).duration_sec) || 1;
  const cur = document.getElementById("edcur");
  if (cur) cur.style.left = (edCursor / dur * 100).toFixed(4) + "%";
  const lab = document.getElementById("edtime");
  if (lab) lab.textContent = edFmtMs(edCursor);
  edPaintThumb(document.getElementById("edthumb"), edData.sprites || {}, edCursor);
  if (moveVideo) edLoadSource(edCursor, false);
}

window.edSeek = t => edCursorSet(t, true);
window.edClickTl = ev => {
  const el = document.getElementById("edtl"); if (!el) return;
  const rect = el.getBoundingClientRect();
  const dur = Number((edData.timeline||{}).duration_sec) || 1;
  edSeek((ev.clientX - rect.left) / rect.width * dur);
};
window.edToggle = () => {
  const v = document.getElementById("edvid"); if (!v) return;
  if (v.paused) v.play().catch(()=>{}); else v.pause();
};
window.edNudge = d => {
  const v = document.getElementById("edvid");
  if (v && edCurSrc){ v.currentTime = Math.max(0, v.currentTime + d); edCursorSet(edCurSrc.offset + v.currentTime, false); }
  else edSeek(edCursor + d);
};
window.edPlayClip = i => {

function edMarkText(){
  const a = edForm.in, b = edForm.out;
  if (a == null && b == null) return "구간을 찍으려면 영상을 재생하며 [ 시작 · 끝 ] 을 누르세요";
  const len = (a != null && b != null) ? ` · 길이 ${(b-a).toFixed(1)}초` : "";
  return `표시: ${a != null ? edFmtMs(a) : "—"} ~ ${b != null ? edFmtMs(b) : "—"}${len}`;
}
window.edMarkIn  = () => { edForm.in  = edCursor; if (edForm.out != null && edForm.out <= edCursor) edForm.out = null; render(); };
window.edMarkOut = () => { edForm.out = edCursor; if (edForm.in  != null && edForm.in  >= edCursor) edForm.in  = null; render(); };
window.edAddClip = () => {
  const a = edForm.in, b = edForm.out;
  if (a == null || b == null || b <= a){ toast("시작과 끝을 먼저 찍으세요", true); return; }
  edForm.clips.push({ start: +a.toFixed(3), end: +b.toFixed(3),
                      role: edForm.clips.length ? "build" : "hook" });
  edForm.clips.sort((x,y) => x.start - y.start);
  edForm.in = edForm.out = null;
  edSel = edForm.clips.findIndex(c => c.start === +a.toFixed(3));
  render();
};
window.edPick = i => { edSel = i; const c = edForm.clips[i]; if (c) edSeek(c.start); else render(); };
window.edDelClip = i => { edForm.clips.splice(i,1); if (edSel >= edForm.clips.length) edSel = -1; render(); };
window.edMove = (i, d) => {
  const j = i + d; if (j < 0 || j >= edForm.clips.length) return;
  const t = edForm.clips[i]; edForm.clips[i] = edForm.clips[j]; edForm.clips[j] = t;
  edSel = j; render();
};
window.edSetRole = (i, v) => { edForm.clips[i].role = v; edMark(); };
window.edSetTime = (i, which, v) => {
  const t = edParseTime(v);
  if (t == null){ toast("시각 형식: 1:23:45.6 또는 초", true); render(); return; }
  const c = edForm.clips[i];
  if (which === "start" && t >= c.end){ toast("시작이 끝보다 뒤입니다", true); render(); return; }
  if (which === "end" && t <= c.start){ toast("끝이 시작보다 앞입니다", true); render(); return; }
  c[which] = +t.toFixed(3); render();
};

// "1:02:03.4" | "2:03" | "123.4" → 초. 형식이 아니면 null(조용히 0으로 만들지 않는다).
function edParseTime(v){
  const s = String(v || "").trim(); if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const m = s.match(/^(?:(\d+):)?(\d{1,2}):(\d{1,2}(?:\.\d+)?)$/);
  if (!m) return null;
  return (+(m[1]||0)) * 3600 + (+m[2]) * 60 + parseFloat(m[3]);
}
const edFmtMs = s => {
  s = Math.max(0, Number(s) || 0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = (s%60).toFixed(1);
  return (h ? h + ":" : "") + String(m).padStart(2,"0") + ":" + String(x).padStart(4,"0");
};

function edTicks(dur){
  // 눈금은 10등분 — 4시간이든 40분이든 같은 밀도로 읽힌다
  let out = "";
  for (let i = 0; i <= 10; i++)
    out += `<span style="left:${i*10}%">${edFmt(dur * i / 10)}</span>`;
  return out;
}

// ───────── 채널 필터 칩 (목업: 맥별 → 채널별 나열) ─────────
// items: channel_slug 를 가진 행들. varName: 전역 필터 변수 이름('feedCh'|'rvCh').
function channelChips(items, cur, varName){
  const cnt = {};
  (items||[]).forEach(r => { const s = r.channel_slug; if (s) cnt[s] = (cnt[s]||0) + 1; });
  const chans = (state.chans||[]).slice()
    .sort((a,b) => (a.name||a.token_slug).localeCompare(b.name||b.token_slug, "ko"));
  // 검수함 칩의 건수는 '검수 대기' 시맨틱 노랑으로 강조 (피드는 중립 유지)
  const nStyle = varName === "rvCh"
    ? "color:var(--warn);font-weight:700" : "opacity:.6";
  const btn = (val, label, n) =>
    `<button class="mini ${cur===val?"on":""}" onclick="${varName}='${val}';feedCalOff=0;render()">${label}${
      n ? ` <span style="${nStyle}">${n}</span>` : ""}</button>`;
  // 좌우 화살표가 훑을 순서를 칩과 같은 배열에서 만든다 — 둘이 어긋나면
  // 화살표가 화면에 없는 탭으로 데려간다.
  chipNavVar = varName;
  chipNavAll = [{ val: "all", label: "전체", n: (items||[]).length }].concat(
    chans.map(c => ({ val: c.token_slug, label: c.name || c.token_slug,
                      n: cnt[c.token_slug] || 0 })));
  const arrow = (d, cls, glyph, lbl) => {
    const t = chipNavTarget(d);
    return `<button class="chipnav ${cls}" ${t ? "" : "disabled"} onclick="chipNav(${d})"
      title="${lbl} 채널${t ? " — " + esc(t.label) : ""}" aria-label="${lbl} 채널">${glyph}</button>`;
  };
  return `<div class="filters">${btn("all", "전체", (items||[]).length)}${
    chans.map(c => btn(c.token_slug, esc(c.name||c.token_slug), cnt[c.token_slug])).join("")}</div>` +
    arrow(-1, "l", "‹", "이전") + arrow(1, "r", "›", "다음");
}

// ───────── 채널 탭 좌우 이동 (운영 요청 2026-08-14) ─────────
// 한 채널을 다 검수하고 다음으로 넘어갈 때 칩을 눈으로 찾아 클릭하던 수고를 없앤다.
// 규칙(운영자 결정): ① 건수 0인 채널은 건너뛴다 — 검수는 남은 것만 훑는 작업이라 빈 탭에
// 멈추면 화살표를 두 번 눌러야 한다. ② 끝에서는 처음으로 순환한다 — 남은 채널을 계속
// 돌며 비울 수 있다. 검수함·영상 피드가 이 함수를 공유한다(칩 컴포넌트가 하나다).
let chipNavAll = [], chipNavVar = null;
function chipNavTarget(d){
  const all = chipNavAll, len = all.length;
  if (!len) return null;
  const cur = chipNavVar === "rvCh" ? rvCh : feedCh;
  let i = all.findIndex(x => x.val === cur);
  if (i < 0) i = 0;                       // 지금 탭이 빈 채널이면 그 자리에서 출발
  for (let k = 1; k <= len; k++){         // 한 바퀴 돌며 첫 '건수 있는' 탭을 찾는다
    const j = ((i + d * k) % len + len) % len;
    if (all[j].n > 0 && all[j].val !== cur) return all[j];
  }
  return null;                            // 갈 곳이 없다(건수 있는 탭이 지금 것뿐)
}
window.chipNav = d => {
  const t = chipNavTarget(d);
  if (!t) return;
  if (chipNavVar === "rvCh") rvCh = t.val; else feedCh = t.val;
  feedCalOff = 0;
  render();
  window.scrollTo({ top: 0 });            // 다음 채널은 위에서부터 본다
};
// ←/→ 키로도 넘긴다. 메모·공개방식 입력 중에는 넘기지 않는다 —
// 사유를 쓰다 방향키를 누르면 카드가 통째로 바뀌어 입력이 무의미해진다.
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  if (tab !== "review" && tab !== "feed") return;
  const t = e.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  if (e.key === "ArrowLeft"){ e.preventDefault(); chipNav(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); chipNav(1); }
});

// ───────── 목업: 피드 채널 상세 헤더 + 업로드 달력 ─────────
// 채널 아이콘 — 목업용 정적 스냅샷 (2026-08-11 YouTube og:image 수집).
// 실서비스 제안: channels_mirror 에 avatar_url 컬럼을 두고 channels_sync 가 갱신하거나
// 구 대시보드 chavatars API 방식 재사용 (아바타 변경 시 스냅샷은 낡는다).
const CH_AVATARS = {};   // 0020: 아이콘은 channels_mirror.avatar_url(매일 자동 갱신)에서 온다
let feedCalOff = 0;
window.feedCalNav = d => { feedCalOff += d; render(); };
// 업로드 이력 — perf_video_map(laeebly 유튜브 미러) 채널별 캐시.
// 구·신 대시보드 어느 쪽에서 발행했든 유튜브에 올라간 영상이 전부 잡힌다(3월~).
// 한계: perf_sync 가 시간당 1회라 방금 발행분은 늦게 반영 → publish 성공 잡과 합집합으로 보충.
let pvmCache = {};   // token_slug -> "loading" | {days:Set<YYYY-MM-DD>}
function pvmLoad(slug){
  if (pvmCache[slug]) return;
  pvmCache[slug] = "loading";
  const cid = ((state.chans||[]).find(c => c.token_slug === slug)||{}).channel_id;
  if (!cid){ pvmCache[slug] = {days:new Set()}; return; }
  Promise.all([
    sb.from("perf_video_map").select("published_at").eq("channel_id", cid).limit(2000),
    // 채널 자체 총 영상 수 — 유튜브 채널 통계 미러(우리가 만든 것 외 전부 포함)
    sb.from("perf_channel_snapshot").select("video_count,snapshot_date").eq("channel_id", cid)
      .order("snapshot_date", {ascending:false}).limit(1),
  ]).then(([vm, cs]) => {
    const days = new Set();
    (vm.data||[]).forEach(r => { if (r.published_at) days.add(kstDay(r.published_at)); });
    const c = (cs.data||[])[0];
    pvmCache[slug] = {days, vcount: c ? Number(c.video_count) : null, vdate: c ? c.snapshot_date : null};
    if (tab === "feed" && feedCh === slug) render();
  });
}
// 채널 아바타 — 실제 아이콘, 로드 실패·미수집 시 채널명 해시 색 이니셜 폴백
function chAvatarHtml(slug, size){
  const name = chName(slug);
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  const ch = (state.chans||[]).find(x => x.token_slug === slug);
  const url = (ch && ch.avatar_url) || CH_AVATARS[slug];
  return `<span class="chav" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;
    background:linear-gradient(135deg,hsl(${h},55%,45%),hsl(${(h+45)%360},60%,58%))">${esc(name.slice(0,1))}${
    url ? `<img src="${url}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
}
// 채널의 현재 생성 신호등 (홈 탭과 동일 규칙: 오늘 작업분 우선, 없으면 최근 작업분)
function chSignal(slug){
  const today = kstDay();
  if (EXT_PIPE[slug]){
    const zj = (state.jobs||[]).find(x => x.kind === "zanmang_autopilot" && kstDay(x.created_at) === today);
    const [cls, label] = !zj ? ["none","오늘 실행 전"]
      : zj.status === "succeeded" ? ["ok","오늘 실행 완료"]
      : zj.status === "running" ? ["run","실행 중"]
      : ["failed","dead"].includes(zj.status) ? ["bad","실패"] : ["wait","대기"];
    return {cls, label};
  }
  const alive = (state.wos||[]).filter(w => w.status !== "cancelled" && w.channel_slug === slug);
  const todays = alive.filter(w => kstDay(w.service_date || w.created_at) === today);
  const cur = todays.length ? todays[0] : alive[0];
  const st = cur ? woStatus(cur) : "none";
  const [cls, label] = GEN_DOT[st] || GEN_DOT.none;
  return {cls, label};
}
// 신호등 색은 테마 무관 동일 (홈 탭 점 색과 일치하도록 라이트에서도 다크 팔레트 고정)
const SIG_COLOR = { ok:"#0ca30c", wait:"#fab219", bad:"#d03b3b",
                    rej:"#d03b3b", run:"#3987e5", none:"var(--muted)" };

function chHeader(slug){
  const ch = (state.chans||[]).find(c => c.token_slug === slug) || {};
  const name = ch.name || chName(slug);
  const wOvr = (state.worksOvr||{})[slug];
  const works = (wOvr && wOvr.works) || ch.works || [];
  // 업로드 일자 = perf_video_map(유튜브 실발행 이력, 구 대시보드분 포함) ∪ publish 성공 잡(당일 보충)
  pvmLoad(slug);
  const pvm = pvmCache[slug];
  const upDays = new Set(pvm && pvm !== "loading" ? pvm.days : []);
  (state.wos||[]).filter(w => w.channel_slug === slug).forEach(w => {
    const pub = (state.jobsByWo[w.id]||[]).find(j => j.kind === "publish" && j.status === "succeeded");
    if (pub) upDays.add(kstDay(pub.finished_at || pub.updated_at));
  });
  const now = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Seoul"}));
  const base = new Date(now.getFullYear(), now.getMonth() + feedCalOff, 1);
  const y = base.getFullYear(), m = base.getMonth();
  const days = new Date(y, m + 1, 0).getDate(), first = base.getDay();
  const todayStr = kstDay(), pad = n => String(n).padStart(2, "0");
  const sig = chSignal(slug), sigColor = SIG_COLOR[sig.cls] || SIG_COLOR.none;
  let cnt = 0;
  const cells = ["일","월","화","수","목","금","토"].map(d => `<span class="dow">${d}</span>`);
  for (let i = 0; i < first; i++) cells.push("<span></span>");
  for (let d = 1; d <= days; d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const up = upDays.has(ds); if (up) cnt++;
    const cls = ["d", up && "up", ds === todayStr && "today", ds > todayStr && "future"]
      .filter(Boolean).join(" ");
    const tdStyle = ds === todayStr ? ` style="outline-color:${sigColor}"` : "";
    const tdTip = ds === todayStr ? ` · 오늘 · ${sig.label}` : "";
    cells.push(`<span class="${cls}"${tdStyle} title="${ds}${up ? " · 업로드 ✓" : ""}${tdTip}">${d}</span>`);
  }
  return `<div class="chhead">
    ${ch.channel_id
      ? `<a class="avlink" href="https://youtube.com/channel/${esc(ch.channel_id)}" target="_blank" rel="noopener" title="YouTube 채널 열기">${chAvatarHtml(slug, 74)}</a>`
      : chAvatarHtml(slug, 74)}
    <div class="info">
      <div class="nm">${esc(name)}
        <button class="mini" onclick="tab='channels';render()">템플릿 편집</button></div>
      <div class="wk"><b>오늘 신호등</b><span class="chdot ${sig.cls}" style="display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:5px"></span>${esc(sig.label)}</div>
      <div class="wk"><b>사용 작품</b>${works.length ? esc(works.join(", ")) : "배정된 작품 없음"}</div>
      <div class="wk" title="유튜브 채널에 올라와 있는 전체 영상 수 — perf_sync(매시간) 미러값${
          pvm && pvm.vdate ? " · " + esc(pvm.vdate) + " 집계" : ""}"><b>채널 영상</b>${
        pvm === "loading" ? '<span style="color:var(--muted)">집계 중…</span>'
        : (pvm && pvm.vcount != null)
          ? `<b style="font-size:13px">${fmtN(pvm.vcount)}개</b>${
              pvm.vdate && pvm.vdate !== kstDay()
                ? ` <span style="color:var(--muted)">· ${esc(String(pvm.vdate).slice(5))} 집계</span>` : ""}`
          : '<span style="color:var(--muted)">집계 없음</span>'}</div>
      <div class="wk" style="font-size:11.5px;color:var(--muted)">달력: 유튜브 발행 이력(구·신 대시보드 무관) + 오늘 발행분${pvm === "loading" ? " · 이력 불러오는 중…" : ""}</div>
    </div>
    <div class="chcal">
      <div class="mh"><button class="mini" onclick="feedCalNav(-1)">◀</button>
        <span>${y}년 ${m+1}월<span class="sum">업로드 ${cnt}일</span></span>
        <button class="mini" onclick="feedCalNav(1)">▶</button></div>
      <div class="cg">${cells.join("")}</div>
    </div>
  </div>`;
}

        <div class="bd"><div class="t">${esc(w.work_title)}${

          <div class="m"><span class="fpill ${pc}">${pl}</span>

// ───────── 소스 (v3.3: 회차 그룹 + 채널별 잔량 + 소진 직접 수정 — 0023·0024) ─────────
let srcOpen = new Set();
window.srcToggle = w => { srcOpen.has(w) ? srcOpen.delete(w) : srcOpen.add(w); render(); };

// 이 채널이 실제로 맡은 작품 — 관제 수정본(0017) > channels.json 미러
function effWorks(slug){
  const o = (state.worksOvr||{})[slug];
  return (o && o.works)
      || ((state.chans||[]).find(c => c.token_slug === slug) || {}).works || [];
}

/* source_usage(파일 1행) + source_usage_by_channel(0023) → 회차 단위 지도.
   한 회차에 파일 행이 여럿인 경우가 실제로 있다(혜미리예채파 5화 3행 · 샤먼:미신전 회차NULL 6행).
   화면은 회차로 묶되, **숫자는 행 단위로 합산한다**(0027).
     · 종전엔 소진이 (작품, 회차) 단위라 행마다 같은 값이 와서 Math.max 가 맞았다.
     · 0027 부터 행(=영상)마다 자기 한도를 갖는다 — 5화에 8분·40분 영상이 하나씩이면
       한도는 1+3=4편이다. max 를 그대로 두면 3편으로 보이고, 한 영상이 소진되면
       회차 전체가 소진된 것처럼 보여 planner 가 배정하는 걸 관제가 설명 못 한다.
     · used_legacy 만은 예외 — 레거시 장부가 회차 단위라 뷰가 행마다 같은 값을 반복해
       준다. 합치면 행 수만큼 부풀므로 회차당 한 번만 센다.
     · 합산 대상은 **planner 가 실제로 고를 수 있는 행**뿐이다(활성 · 3분 초과).
       전부 더하면 비활성·짧은 클립까지 한도에 들어가 화면이 부풀고, 관제가 '남음 27'
       이라고 표시한 뒤 실행하면 RPC 가 거절한다 — 이 개편이 없애려던 바로 그 증상이
       반대 방향으로 되살아난다(실측: 국대 단편 한도 33 vs 실제 6). */
/* planner 가 실제로 고를 수 있는 행인가. 0031 부터 뷰가 usable 을 계산해 준다 —
   하한이 작품마다 다르므로(work_cards.min_source_duration_sec) 화면이 숫자를 알면
   또 어긋난다. 0031 적용 전(뷰에 컬럼이 없어 undefined)에는 종전 규칙으로 폴백한다. */
const srcUsable = r => r.usable != null
  ? r.usable === true
  : (r.is_active !== false && (r.duration_sec == null || Number(r.duration_sec) > 180));
function buildEpMap(srcs, byCh){
  const map = {}, key = ep => ep == null ? "-" : String(ep);
  (srcs||[]).forEach(r => {
    const m = map[r.work_title] = map[r.work_title] || {};
    const e = m[key(r.episode)] = m[key(r.episode)] ||
      { work:r.work_title, ep:r.episode, limit:0, active:false, dur:null,
        files:0, usable:0, usedAny:0, ids:[], limits:[], ch:{}, videos:[] };
    if (r.is_active !== false) e.active = true;
    e.files += 1; e.ids.push(r.source_id);
    // 0040: 영상 단위 상세 — 제외된 행도 목록에는 흐리게 보인다(왜 안 쓰는지 알 수 있게)
    e.videos.push({ sid:r.source_id, url:r.source_url || "", title:r.title || "",
                    dur:Number(r.duration_sec) || null, limit:Number(r.use_limit) || 0,
                    usable:srcUsable(r), active:r.is_active !== false,
                    wo:Number(r.times_used) || 0, pin:0,
                    ord:(r.published_ts || r.created_at || "") + "|" + r.source_id });
    if (!srcUsable(r)) return;                  // 비활성·3분 이하는 셈에서 뺀다
    e.usable  += 1;
    e.limit   += Number(r.use_limit)  || 0;     // 행별 한도의 합(0027)
    e.usedAny += Number(r.times_used) || 0;     // 전 채널 합 — 행별 사용의 합
    e.limits.push(Number(r.use_limit) || 0);
    // 길이는 쓸 수 있는 행에서만 집는다 — 비활성 57초 클립 하나가 회차 전체를
    // '3분 이하'로 만들어 화면에서 숨기면서 planner 는 정상 배정하는 일이 생겼다.
    const d = Number(r.duration_sec); if (!e.dur && d > 0) e.dur = d;
  });
  (byCh||[]).forEach(r => {
    const e = (map[r.work_title] || {})[key(r.episode)]; if (!e) return;
    if (!srcUsable(r)) return;                  // 한도와 같은 기준으로 센다
    const c = e.ch[r.channel_slug] = e.ch[r.channel_slug] || { wo:0, lg:0, pin:0, used:0 };
    c.wo  += Number(r.used_wo) || 0;
    c.pin += Number(r.used_legacy_pin) || 0;    // 0040: 영상에 못박힌 몫 — 행 단위 정확값
    c.lg   = Math.max(c.lg, Number(r.used_legacy) || 0);  // 못박히지 않은 회차 몫 — 한 번만
    c.used = c.wo + c.pin + c.lg;
    // 영상 행에도 이 채널 몫을 얹는다(전 채널 합) — 영상 목록의 사용량 재료
    const v = e.videos.find(v => v.sid === r.source_id);
    if (v) v.pin += Number(r.used_legacy_pin) || 0;
  });
  return map;
}

/* 0040: 회차 안의 영상 목록 — planner 와 같은 순서(업로드시각→등록시각)로 세우고,
   못박히지 않은 레거시 몫(회차 단위)은 planner 와 같은 규칙으로 **앞선 영상부터** 배분.
   순수 — 아래 검증 하니스가 이 함수를 그대로 꺼내 돌린다. */
function videoRows(e){
  const vids = (e.videos||[]).slice().sort((a,b) => a.ord < b.ord ? -1 : a.ord > b.ord ? 1 : 0);
  let lgUn = Object.values(e.ch||{}).reduce((s,c) => s + (c.lg||0), 0);
  return vids.map(v => {
    let take = 0;
    if (v.usable && lgUn > 0){
      take = Math.min(Math.max(v.limit - v.wo - v.pin, 0), lgUn);
      lgUn -= take;
    }
    const used = v.wo + v.pin + take;
    return { ...v, used, left: v.usable ? Math.max(v.limit - used, 0) : 0 };
  });
}
const epsOf    = w => Object.values((state.eps||{})[w] || {})
                        .sort((a,b) => (a.ep ?? 1e9) - (b.ep ?? 1e9));
// 쓸 수 있는 행이 하나라도 있으면 그 회차는 쓸 수 있다(0027: 회차에 영상이 여럿이다)
const epUsable = e => e.usable > 0;
const epUsed   = (e, slug) => (e.ch[slug] || {}).used || 0;
const epRemain = (e, slug) => Math.max(0, e.limit - epUsed(e, slug));   // 0023: 소진은 채널별

// 0040: 영상 목록 펼침 상태 — 회차 키(작품|회차)로 기억한다
let vidOpen = new Set();
window.vidToggle = k => { vidOpen.has(k) ? vidOpen.delete(k) : vidOpen.add(k); render(); };
const mmss = d => d == null ? "–" : Math.floor(d/60) + ":" + String(Math.round(d%60)).padStart(2,"0");

function videoList(e, chs, nextSid){
  const rows = videoRows(e).map(v => {
    const label = v.title || (v.url ? v.url.split("v=").pop() : v.sid.slice(0,8));
    const name  = v.url
      ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(label)}</a>`
      : esc(label);
    let tag;
    if (!v.usable) tag = `<span class="vtag off">${v.active ? "하한 미만" : "비활성"}</span>`;
    else if (v.sid === nextSid) tag = `<span class="vtag next">다음 차례</span>`;
    else if (v.left > 0) tag = `<span class="vtag">${v.left}편 남음</span>`;
    else tag = `<span class="vtag done">소진</span>`;
    const pct = v.limit ? Math.min(100, Math.round(v.used / v.limit * 100)) : 100;
    const src = v.wo ? `발주 ${v.wo}` : (v.used ? `레거시 ${v.used}` : "미사용");
    return `<div class="vidrow${v.usable ? "" : " dim"}"><span class="vt">${name}</span>
      <span class="vdur">${mmss(v.dur)}</span>
      <span class="gauge vsm"><i class="${v.left ? "" : "full"}" style="width:${pct}%"></i></span>
      <span class="cnt">${v.used}/${v.limit}</span>
      <span class="sub" style="min-width:56px">${src}</span>${tag}</div>`;
  }).join("");
  return `<div class="vids">${rows}</div>`;
}

function epBlock(e, chs, editable, nextSid){
  const sid  = e.ids[0];
  const lab  = e.ep != null ? e.ep + "회차" : "단편";
  const vkey = e.work + "|" + (e.ep == null ? "-" : e.ep);
  const vopen = vidOpen.has(vkey);
  // 영상이 여럿이거나 제목·URL 이 있으면 펼침 버튼을 단다(0040 이전 데이터면 안 뜬다)
  const canOpen = (e.videos||[]).some(v => v.url || v.title);
  const vbtn = canOpen
    ? `<button class="mini" data-k="${esc(vkey)}" onclick="vidToggle(this.dataset.k)">
         ${vopen ? "▾" : "▸"} 영상 ${e.files}개</button>` : "";
  const mins = e.dur ? `<span class="sub">${Math.floor(e.dur/60)}분</span>` : "";
  // 한도·남음은 쓸 수 있는 행만 센다 — 파일 수와 다르면 그 사실을 같이 보여준다
  const nf   = e.files > 1
    ? `<span class="sub">파일 ${e.files}개${
         e.usable < e.files ? ` · 쓸 수 있는 것 ${e.usable}개` : ""}</span>`
    : "";
  const dead = epUsable(e) ? ""
             : (!e.active ? '<span class="sub">비활성</span>'
                          : '<span class="sub">3분 이하 — 미사용</span>');
  /* 0027: 한도는 영상(파일 행)마다 걸린다. 입력칸은 '영상당' 값을 받아 이 회차의 행
     전부에 같은 값을 건다 — 회차 합계(e.limit)를 입력받으면 행마다 얼마씩 나눌지가
     모호해진다. 행마다 값이 다르면(길이 비례로 1·3 이 섞인다) 최댓값을 보여준다. */
  const each = e.limits.length ? Math.max(...e.limits) : 0;
  const mixed = new Set(e.limits).size > 1;
  const lim  = editable
    ? `<label class="ednum" title="${e.files > 1
          ? `영상 ${e.files}개 각각의 편수 상한. 저장하면 이 회차의 영상 전부에 같은 값이 걸립니다`
          : "이 영상으로 만들 편수 상한"}">
         ${e.files > 1 ? "영상당 한도" : "한도"}<input type="number" min="0" max="20"
                   value="${each}" data-sids="${esc(e.ids.join(","))}"
                   onchange="srcLimit(this)"></label>${
      e.files > 1 ? `<span class="sub">합계 ${e.limit}${mixed ? " · 영상별로 다름" : ""}</span>` : ""}`
    : `<span class="sub">한도 ${e.limit}${e.files > 1 ? ` (영상 ${e.files}개 합)` : ""}</span>`;
  const rows = chs.length ? chs.map(c => {
    const s = c.token_slug, u = e.ch[s] || { wo:0, lg:0 };
    const used = epUsed(e, s), remain = epRemain(e, s);
    const pct  = e.limit ? Math.min(100, Math.round(used / e.limit * 100)) : 100;
    const full = !epUsable(e) || remain === 0;
    const box  = editable
      ? `<input type="number" min="0" max="99" value="${used}" data-sid="${sid}"
                data-ch="${esc(s)}" onchange="srcUsed(this)"
                title="이 채널이 이 회차를 실제로 몇 번 썼는지. 발주 기록보다 낮게는 못 내립니다">`
      : "";
    return `<div class="eprow chrow"><span class="ep2" title="${esc(c.name)}">${esc(c.name)}</span>
      <span class="gauge"><i class="${full ? "full" : ""}" style="width:${pct}%"></i></span>
      <span class="cnt">${used}/${e.limit}</span>${box}
      <span class="sub">발주 ${u.wo}${u.lg ? ` · 보정 ${u.lg}` : ""}${
        full ? "" : ` · 남음 ${remain}`}</span></div>`;
  }).join("")
    : '<div class="eprow"><span class="sub">배정된 채널이 없어 소진되지 않습니다 — 채널 템플릿에서 작품을 배정하세요</span></div>';
  return `<div class="epgrp"><div class="ephd"><b>${lab}</b>${mins}${nf}${dead}${vbtn}
      <span class="right"></span>${lim}</div>${vopen ? videoList(e, chs, nextSid) : ""}${rows}</div>`;
}

function renderSources(){
  const chOf = w => (state.chans||[]).filter(c => effWorks(c.token_slug).includes(w));
  /* 며칠치 = 남은 편수 ÷ 배정 채널 수. source_watch(LOW_DAYS=3)가 보충 인입을 거는 기준과
     같은 셈을 쓴다 — 거기는 채널 구분 없이 (use_limit − 전체 사용)으로 세므로 여기도 그렇게
     센다. 그래야 '보충 인입 예약' 표시가 실제 동작과 어긋나지 않는다.
     (채널별 실제 잔량은 아래 회차 상세에 채널마다 따로 나온다.)
     작품이 30개·회차가 200개 넘으므로 정렬 비교자 안에서 다시 세지 않는다 — 한 번만 재고 쓴다. */
  const info = {};
  Object.keys(state.eps || {}).forEach(w => {
    const eps = epsOf(w), chs = chOf(w);
    const rem = eps.filter(epUsable).reduce((s,e) => s + Math.max(0, e.limit - e.usedAny), 0);
    info[w] = { eps, chs, rem, days: chs.length ? rem / chs.length : Infinity };
  });
  const works = Object.keys(info)
                  .sort((a,b) => (info[a].days - info[b].days) || a.localeCompare(b, "ko"));
  const editable = can("operator");

  const blocks = works.map(w => {
    const { eps, chs, rem, days } = info[w];
    const head = rem === 0
      ? chip("crit","✕","전 회차 소진 — 보충 인입 대기 중")
      : days <= 3
        ? chip("warn","!",`${rem}편 남음${days === Infinity ? "" : ` · ${Math.floor(days)}일치`} — 보충 인입 예약`)
        : chip("good","✓",`앞으로 ${rem}편${days === Infinity ? "" : ` · ${Math.floor(days)}일치`}`);
    const nexts = chs.map(c => {
      const e = eps.find(x => epUsable(x) && epRemain(x, c.token_slug) > 0);
      return `${c.name}: ${e ? (e.ep != null ? e.ep + "회차" : "단편") : "없음"}`;
    }).join(" · ");
    const open = srcOpen.has(w);
    // 0040: '다음 차례' 표시는 단일 채널 작품만 — 두 채널이 공유하는 작품(SNL)은 채널마다
    // 다음이 달라 하나로 못 찍는다(채널별 남음은 각 채널 줄에 이미 있다).
    const nextSid = chs.length === 1
      ? (() => { for (const e of eps){ const v = videoRows(e).find(x => x.usable && x.left > 0);
                 if (v) return v.sid; } return null; })()
      : null;
    return `<div class="srcwork">
      <div class="swh" style="cursor:pointer" data-w="${esc(w)}" onclick="srcToggle(this.dataset.w)">
        <span class="sub">${open ? "▾" : "▸"}</span><b>${esc(w)}</b>
        <span class="sub">${eps.length}개 회차</span>
        ${chs.length ? `<span class="sub">→ ${esc(chs.map(c => c.name).join(", "))}</span>`
                     : '<span class="sub">배정 채널 없음</span>'}
        <span class="right"></span>
        ${nexts ? `<span class="pill" title="채널별 다음 사용 회차">다음 ${esc(nexts)}</span>` : ""}
        ${head}</div>
      ${open ? eps.map(e => epBlock(e, chs, editable, nextSid)).join("") : ""}</div>`;
  }).join("");

  $("#page").innerHTML = `<section class="card">
    <h2>소스 창고 — 작품명을 누르면 회차별·채널별 잔량이 열립니다
      <button class="mini right" onclick="srcAll()">모두 ${srcOpen.size ? "접기" : "펼치기"}</button></h2>
    <div class="sub" style="margin-bottom:8px">소진은 채널별로 셉니다(0023) — 같은 회차를 두 채널이
      각자 한도만큼 씁니다. <b>한도</b>는 그 회차로 만들 편수 상한(등록 시 길이로 자동 결정: 10분 미만 1
      · 10~30분 2 · 30분↑ 3), <b>쓴 수</b>는 그 채널이 실제로 쓴 합계(발주 기록 + 레거시 보정)입니다.
      ${editable ? "숫자를 고치면 바로 저장됩니다." : "수정은 operator 권한이 필요합니다."}</div>
    ${(state.srcs||[]).length && !(state.srcCh||[]).length
      ? `<div class="sub" style="color:var(--serious);margin-bottom:8px">⚠ 채널별 소진
         (source_usage_by_channel)을 못 읽었습니다 — 아래 채널 숫자는 0으로 보입니다. 0023·0024
         적용 여부와 읽기 권한을 확인하세요.</div>` : ""}
    ${blocks || '<div class="empty">등록된 소스 없음 — 유튜브형은 자동, 파일형은 메인 맥에서 deploy/register_source.py 로 등록</div>'}
    </section>`;
}
window.srcAll = () => {
  srcOpen = srcOpen.size ? new Set() : new Set(Object.keys(state.eps || {}));
  render();
};
window.srcLimit = el => {
  const v = parseInt(el.value, 10);
  if (!Number.isInteger(v) || v < 0 || v > 20){
    toast("한도는 0~20 사이 정수여야 합니다", true); refresh(); return; }
  // 0027: set_source_limit 이 고른 그 행만 고친다 — 회차에 영상이 여럿이면 행마다 건다.
  // rpc() 헬퍼는 호출마다 토스트·refresh 를 내므로 여기서는 sb.rpc 를 직접 쓰고
  // 결과를 모아 한 번만 알린다. 거부되면 새로고침해 입력칸을 실제 값으로 되돌린다.
  const sids = (el.dataset.sids || "").split(",").filter(Boolean);
  Promise.all(sids.map(sid => sb.rpc("set_source_limit", { p_source: sid, p_limit: v })))
    .then(rs => {
      const bad = rs.find(r => r.error);
      if (bad) toast(`set_source_limit 거부: ${bad.error.message}`, true);
      else     toast(sids.length > 1 ? `영상 ${sids.length}개 한도 ${v}편으로 저장`
                                     : `한도 ${v}편으로 저장`);
      refresh();
    });
};
window.srcUsed = el => {
  const v = parseInt(el.value, 10);
  if (!Number.isInteger(v) || v < 0){
    toast("쓴 수는 0 이상 정수여야 합니다", true); refresh(); return; }
  rpc("set_source_used",
      { p_source: el.dataset.sid, p_channel: el.dataset.ch, p_used: v }, `쓴 수 ${v}로 저장`)
    .then(r => { if (r === null) refresh(); });
};

function paletteColors(){
  const base = ["#FFFFFF","#000000","#FFD84D","#FFFF00","#FF69B4","#F5F5F5","#FF3B30","#3987E5","#0CA30C"];
  const used = new Set();
  (state.chans||[]).forEach(c => {
    const o = state.designOvr[c.token_slug];
    const d = (o && o.design) || c.design || {};
    DESIGN_FIELDS.forEach(([k,,t]) => {
      if (t !== "color") return;
      const v = String(d[k] || "");
      if (/^#[0-9a-fA-F]{6}$/.test(v)) used.add(v.toUpperCase());
    });
  });
  return [...new Set([...base, ...used])];
}

function effDesign(ch){
  const o = state.designOvr[ch.token_slug];
  return { design: (o && o.design) || ch.design || null, isOvr: !!o, ovr: o };

const swatch = v => `<span class="sw" style="background:${esc(String(v))}"></span>`;
function renderChannels(){
  // ── 목업 B안: 카드에는 요약만, 편집은 모달에서 (작품 배정·다음 작업·디자인 통합) ──
  const cards = (state.chans||[]).map(ch => {
    const { design, isOvr, ovr } = effDesign(ch);
    const st = isOvr ? chip("info","✎","관제 수정본 적용 중")
             : design ? chip("good","✓","파일 기본 적용")
             : chip("mut","–","템플릿 없음(전체 기본)");
    const d = design || {};
    const sum = design ? DESIGN_FIELDS
        .filter(([k]) => d[k] !== undefined && d[k] !== "")
        .map(([k,l,t]) => `${t==="color"?swatch(d[k]):""}${esc(l)} <b>${esc(String(d[k]))}</b>`)
        .join(" · ") + (d.face_tracking === false ? " · 얼굴크롭 끔" : "")
      : '<span class="sub">기본 디자인으로 생성됩니다</span>';
    const wOvr = state.worksOvr[ch.token_slug];
    const effWorks = (wOvr && wOvr.works) || ch.works || [];
    const isExt = !!EXT_PIPE[ch.token_slug];
    const plan = state.planOvr[ch.token_slug];
    const planTxt = plan
      ? `📌 ${esc(plan.work_title)} · ${plan.episode != null ? plan.episode + "회차 고정" : "회차 자동"}`
      : "자동 (작품 순서 · 회차 순환)";
    return `<div class="chcard"><div class="h">${chAvatarHtml(ch.token_slug, 26)}<b>${esc(ch.name || ch.token_slug)}</b>${st}
        ${ovr ? `<span class="sub right">${esc((ovr.updated_by||"").split("@")[0])} · ${ago(ovr.updated_at)}</span>` : ""}</div>
      <div class="dsum" style="margin-bottom:6px"><b>작품 배정:</b> ${esc(effWorks.join(", ")) || "—"}
        ${wOvr ? chip("info","✎","관제 수정본") : ""}</div>
      ${isExt ? `<div class="dsum" style="margin-bottom:6px"><b>파이프라인:</b> ${esc(EXT_PIPE[ch.token_slug])}</div>`
        : `<div class="dsum" style="margin-bottom:6px"><b>다음 작업:</b> ${planTxt}
          ${plan ? `<span class="sub"> · ${esc((plan.updated_by||"").split("@")[0])}</span>` : ""}</div>`}
      <div style="border-top:1px solid var(--line);margin:8px 0"></div>
      <div class="dsum dsum-clamp" title="전체 값은 ✎ 편집에서">${sum}</div>
      <div class="dacts">${can("operator")
        ? `<button class="mini" onclick="chEdit='${esc(ch.token_slug)}';render()">✎ 편집</button>`
        : '<span class="sub">편집은 operator 권한</span>'}</div></div>`;
  }).join("");
  const mch = (state.chans||[]).find(c => c.token_slug === chEdit);

      <div class="msec"><div class="msec-h">작품 배정</div>

    </div></div>`;

// 디자인 diff 미리보기 — 폼 값 vs 현재 적용값
window.dfDiffUpdate = slug => {
  const ch = (state.chans||[]).find(c => c.token_slug === slug); if (!ch) return;
  const d = effDesign(ch).design || {};
  const diffs = [];
  for (const [k, l] of DESIGN_FIELDS){
    const el = $("#df_" + k); if (!el) return;
    const nv = el.value.trim();
    const ov = d[k] !== undefined ? String(d[k]) : "";
    if (nv !== ov) diffs.push(`${l}: ${ov || "기본"} → ${nv || "기본"}`);
  }
  const ftEl = $("#df_face_tracking");
  const ft = ftEl ? ftEl.value : "", oft = d.face_tracking === false ? "false" : "";
  if (ft !== oft) diffs.push(`얼굴크롭: ${oft ? "끔" : "기본(켬)"} → ${ft ? "끔" : "기본(켬)"}`);
  const box = $("#dfdiff"); if (!box) return;
  box.innerHTML = diffs.length
    ? "저장 시 바뀌는 것: " + diffs.map(x => esc(x)).join(" · ")
    : '<span class="sub">변경 없음 — 저장해도 지금과 동일</span>';
};
// 다른 채널 디자인 불러오기 (저장 전까지 미반영)
window.dfCopyFrom = (src, slug) => {
  if (!src) return;
  const ch = (state.chans||[]).find(c => c.token_slug === src); if (!ch) return;
  const d = effDesign(ch).design || {};
  for (const [k] of DESIGN_FIELDS){
    const el = $("#df_" + k); if (el) el.value = d[k] !== undefined ? String(d[k]) : "";
  }
  const f = $("#df_face_tracking"); if (f) f.value = d.face_tracking === false ? "false" : "";
  toast(`${ch.name || src} 디자인을 불러왔습니다 — 저장 전까지 반영되지 않습니다`);
  dfDiffUpdate(slug);
};
window.chSave = slug => {
  const design = {};
  for (const [k,,t] of DESIGN_FIELDS){
    const v = ($("#df_"+k)?.value ?? "").trim();
    if (!v) continue;
    design[k] = (t === "num" && /^-?\d+$/.test(v)) ? parseInt(v,10) : v;
  }
  if ($("#df_face_tracking")?.value === "false") design.face_tracking = false;
  if (!Object.keys(design).length){ toast("설정할 값이 없습니다 — 해제를 쓰세요", true); return; }
  chEdit = null;
  rpc("set_channel_design", { p_slug: slug, p_design: design }, "저장됨 — 다음 생성부터 적용");
};

};

// ───────── 노드·배포 ─────────
function renderInfra(){
  const nodes = (state.nodes||[]), deps = (state.deps||[]);
  const nodeCards = nodes.map(n => {
    const [cls,ic,lb] = NODE_ST[n.status] || ["mut","?",n.status];
    const hbOld = n.last_seen_at && Date.now()-new Date(n.last_seen_at).getTime() > 8*60*1000;
    const ev = n.engine_versions || {};
    const evs = Object.entries(ev).map(([k,v]) =>
      `<div class="kv"><span class="k">${esc(k)}</span><span class="v mono">${esc(v)}</span></div>`).join("");
    const acts = can("operator") ? `<div class="acts">
      ${n.status!=="active"  ? `<button class="mini" onclick="setNode('${esc(n.node_id)}','active')">활성화</button>`:""}
      ${n.status==="active"  ? `<button class="mini" onclick="setNode('${esc(n.node_id)}','draining')">드레인</button>`:""}
      ${n.status!=="disabled"? `<button class="mini danger" data-l="차단" onclick="armed(this,'차단',()=>setNode('${esc(n.node_id)}','disabled'))">차단</button>`:""}
      </div>` : "";
    // 0025: 이 맥에 예비 Gemini 키가 배포됐나. 미보고(구 워커)는 표시하지 않는다.
    const slots = ((n.meta||{}).gemini_slots)||null;
    const keyChip = !slots ? ""
      : slots.includes("fallback") ? chip("good","🔑","예비 키 있음")
      : chip("warn","🔑","예비 키 없음");
    return `<div class="node"><div class="hd"><b>${esc(n.node_id)}</b>${chip(cls,ic,lb)}
        ${hbOld ? chip("serious","⚠","무응답") : ""}${keyChip}</div>
      <div class="kv"><span class="k">심박</span><span class="v">${ago(n.last_seen_at)}</span></div>
      <div class="kv"><span class="k">디스크</span><span class="v">${n.disk_free_gb!=null?Number(n.disk_free_gb).toFixed(0)+" GB":"—"}</span></div>
      ${evs || '<div class="sub">엔진 버전 미보고</div>'}${acts}</div>`;
  }).join("");
  const engines = deps.map(d => d.engine);
  const matrix = `<tr><th>engine \ node</th>${nodes.map(n=>`<th class="mono">${esc(n.node_id)}</th>`).join("")}<th>origin</th></tr>` +
    engines.map(eng => {
      const d = deps.find(x=>x.engine===eng) || {};
      const target = (d.pinned_sha || d.last_seen_sha || "").slice(0,7);
      return `<tr><td>${esc(eng)}${d.pinned_sha?' 📌':''}</td>${nodes.map(n => {
        const sha = ((n.engine_versions||{})[eng]||"").slice(0,7);
        const ok = sha && target && (target.startsWith(sha) || sha.startsWith(target));
        return `<td class="mono ${sha ? (ok?"shaok":"shabad") : ""}">${esc(sha||"—")}</td>`;
      }).join("")}<td class="mono">${esc(target||"—")}</td></tr>`;
    }).join("");
  const depRows = deps.map(d => {
    const acts = can("operator") ? (d.pinned_sha
      ? `<button class="mini" onclick="rpc('unpin_engine',{p_engine:'${esc(d.engine)}'},'핀 해제')">핀 해제</button>`
      : `<button class="mini" onclick="pinAsk('${esc(d.engine)}')">핀…</button>`) : "";
    return `<tr><td>${esc(d.engine)}</td>
      <td class="mono">${esc((d.last_seen_sha||"").slice(0,9))}</td>
      <td>${d.auto_update ? chip("good","✓","자동") : chip("warn","⏸","수동")}</td>
      <td class="mono">${esc((d.pinned_sha||"").slice(0,9))}</td><td>${acts}</td></tr>`;
  }).join("");
  $("#page").innerHTML = `
    <section class="card"><h2>맥 (작업 기계) 상태</h2><div class="nodes">${nodeCards || '<div class="empty">없음</div>'}</div></section>
    <section class="card"><h2>배포 매트릭스 — 맥×엔진 SHA (노랑 = origin 과 불일치)</h2>
      <div class="tblwrap"><table>${matrix}</table></div></section>
    <section class="card"><h2>배포 설정</h2><div class="tblwrap"><table>
      <tr><th>engine</th><th>origin 최신</th><th>추적</th><th>핀</th><th></th></tr>${depRows}</table></div></section>`;
}

// ───────── 성과 (v3.2: laeebly youtube_*_snapshot 미러 직결 — perf_sync 가 매시간 복사) ─────────
let perf = null, perfLoading = false, perfSort = { col: "views", dir: -1 };
// 목업: 영상별 성과 채널 멀티 필터 — null=전체, Set=선택된 채널들(빈 Set=전부 해제)
let perfChSet = null, perfFilterOpen = false;
const fmtN = v => v == null ? "—" : Number(v).toLocaleString("ko-KR");
const fmtD = v => v == null ? "—" : (v > 0 ? "+" : "") + Number(v).toLocaleString("ko-KR");
const chNameById = id => { const c = (state.chans||[]).find(x => x.channel_id === id);
  return (c && c.name) || (id || "").slice(0,10); };
async function loadPerf(){
  if (perfLoading) return; perfLoading = true;
  try {
    const md = await sb.from("perf_video_snapshot").select("snapshot_date")
      .order("snapshot_date",{ascending:false}).limit(1);
    const maxDate = md.data && md.data[0] && md.data[0].snapshot_date;
    if (!maxDate){ perf = { empty: true }; return; }
    const dOf = n => { const t = new Date(maxDate + "T00:00:00Z");
      t.setUTCDate(t.getUTCDate() - n); return t.toISOString().slice(0,10); };
    const dates = [maxDate, dOf(1), dOf(28)];
    const [vs, vm, cs] = await Promise.all([
      sb.from("perf_video_snapshot").select("*").in("snapshot_date", dates).limit(9000),
      sb.from("perf_video_map").select("*").limit(3000),
      sb.from("perf_channel_snapshot").select("*").gte("snapshot_date", dOf(29)).limit(2000),
    ]);
    if (vs.error || vm.error || cs.error)
      throw new Error((vs.error||vm.error||cs.error).message);
    perf = { maxDate, dates, vs: vs.data||[], vm: vm.data||[], cs: cs.data||[] };
  } catch(e){ perf = { error: String(e.message || e) }; }
  finally { perfLoading = false; render(); }
}
function perfRows(){
  const [d0, d1, d28] = perf.dates;
  const snap = {};
  perf.vs.forEach(s => (snap[s.content_id] = snap[s.content_id] || {})[s.snapshot_date] = s);
  return perf.vm.map(m => {
    const s = snap[m.content_id] || {};
    const cur = s[d0] || s[d1], prev = s[d1], old = s[d28];
    return { title: m.title || m.content_id, work: m.work_title || "",
      ch: chNameById(m.channel_id), cid: m.content_id, dead: !!m.dead_at,
      views: cur ? Number(cur.view_count) : null,
      d1: cur && prev && cur !== prev ? Number(cur.view_count) - Number(prev.view_count) : null,
      d28: cur && old ? Number(cur.view_count) - Number(old.view_count) : null,
      likes: cur ? Number(cur.like_count) : null,
      pub: m.published_at ? kstDay(m.published_at) : "" };
  }).filter(r => r.views != null);
}
function renderPerf(){
  if (!perf){ loadPerf();
    $("#page").innerHTML = '<section class="card"><div class="empty">성과 불러오는 중…</div></section>'; return; }
  if (perf.error){
    $("#page").innerHTML = `<section class="card"><h2>성과</h2><div class="empty">불러오기 실패: ${esc(perf.error)}
      <button class="mini" onclick="perf=null;render()">다시 시도</button></div></section>`; return; }
  if (perf.empty){
    $("#page").innerHTML = `<section class="card"><h2>성과</h2><div class="empty">아직 미러된 성과 데이터가 없습니다 —
      perf_sync(매시간)가 첫 회전을 돌면 여기에 채워집니다.</div></section>`; return; }
  // 채널 요약 — 구독자(최신·28일 증감) + 영상 28일 조회 증가 합
  const rows = perfRows();
  const byCh = {};
  rows.forEach(r => { const g = byCh[r.ch] = byCh[r.ch] || { ch:r.ch, vids:0, views:0, d28:0 };
    g.vids++; g.views += r.views||0; g.d28 += r.d28||0; });
  const csByCh = {};
  perf.cs.forEach(s => (csByCh[s.channel_id] = csByCh[s.channel_id] || []).push(s));
  const chSum = Object.keys(csByCh).map(cid => {
    const arr = csByCh[cid].slice().sort((a,b) => a.snapshot_date < b.snapshot_date ? 1 : -1);
    const cur = arr[0], old = arr[arr.length-1];
    const g = byCh[chNameById(cid)] || {};
    return { ch: chNameById(cid), subs: Number(cur.subscriber_count),
      dsubs: Number(cur.subscriber_count) - Number(old.subscriber_count),
      vids: g.vids || 0, d28: g.d28 || 0 };
  }).sort((a,b) => (b.d28||0) - (a.d28||0));
  // 영상 표 — 정렬 + 상위 200
  const COLS = [["title","영상 제목"],["work","작품"],["ch","채널"],["views","조회수"],
    ["d1","+1일"],["d28","+28일"],["likes","좋아요"],["pub","게시일"]];
  const c = perfSort.col, dir = perfSort.dir;
  const allChs = Object.keys(byCh).sort((a,b) => a.localeCompare(b, "ko"));
  const chipChs = [...new Set([...allChs, ...chSum.map(r => r.ch)])].sort((a,b) => a.localeCompare(b, "ko"));
  const vrows = perfChSet ? rows.filter(r => perfChSet.has(r.ch)) : rows;
  vrows.sort((a,b) => { const x = a[c], y = b[c];
    const cmp = (typeof x === "number" || typeof y === "number")
      ? (Number(x)||0) - (Number(y)||0) : String(x??"").localeCompare(String(y??""), "ko");
    return dir * cmp; });
  const top = vrows.slice(0, 200);
  $("#page").innerHTML = `
    <section class="card"><h2>채널 요약 — 기준일 ${esc(perf.maxDate)} (laeebly 수집분 미러, 매시간 갱신)
      <button class="mini right" onclick="perf=null;render()">새로고침</button></h2>
    <div class="tblwrap"><table><tr><th>채널</th><th>구독자</th><th>구독 +28일</th>
      <th>추적 영상</th><th>조회 +28일</th></tr>${
    chSum.map(r => `<tr class="${perfChSet && perfChSet.has(r.ch) ? "selrow" : ""}" style="cursor:pointer"
        title="클릭 — 아래 영상 목록을 이 채널만 (다시 클릭하면 전체로)"
        onclick="perfChOnly('${esc(r.ch)}')"><td>${esc(r.ch)}</td><td class="num">${fmtN(r.subs)}</td>
      <td class="num">${fmtD(r.dsubs)}</td><td class="num">${fmtN(r.vids)}</td>
      <td class="num">${fmtD(r.d28)}</td></tr>`).join("")
    || '<tr><td colspan="5" class="empty">채널 스냅샷 없음</td></tr>'}</table></div></section>
    <section class="card"><h2>영상별 성과 — 열 제목 클릭으로 정렬${vrows.length > 200 ? ` (상위 200/${vrows.length}개 표시)` : ""}${
        perfChSet ? ` · <b>${perfChSet.size}개 채널 선택</b> · 영상 ${vrows.length}개` : ""}
      <button class="mini right ${perfChSet ? "on" : ""}"
        onclick="perfFilterOpen=!perfFilterOpen;render()">⏷ 채널 필터${perfChSet ? " 적용 중" : ""}</button></h2>
    ${perfFilterOpen ? `<div class="filters">
      <button class="mini" onclick="perfChSet=null;render()">✓ 전체 선택</button>
      <button class="mini" onclick="perfChSet=new Set();render()">✕ 전체 해제</button>
      <span style="border-left:1px solid var(--line);margin:0 2px"></span>
      ${chipChs.map(ch => { const n = byCh[ch] ? byCh[ch].vids : 0;
        return `<button class="mini ${!perfChSet || perfChSet.has(ch) ? "on" : ""}" ${n ? "" : 'style="opacity:.45" title="영상 스냅샷 없음 — 수집 확인 필요"'}
        onclick="perfChToggle('${esc(ch)}')">${esc(ch)} <span style="opacity:.6">${n}</span></button>`; }).join("")}
    </div>` : ""}
    <div class="tblwrap"><table><tr>${COLS.map(([k,l]) =>
      `<th class="sortable" onclick="perfSortBy('${k}')">${l}${perfSort.col===k?(dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr>${
    top.map(r => `<tr><td>${r.dead?'<span class="sub" title="내려간 영상">†</span> ':""}<a href="https://youtu.be/${esc(r.cid)}" target="_blank" rel="noopener" style="color:inherit">${esc(r.title)}</a></td>
      <td>${esc(r.work)}</td><td>${esc(r.ch)}</td>
      <td class="num">${fmtN(r.views)}</td><td class="num">${fmtD(r.d1)}</td>
      <td class="num">${fmtD(r.d28)}</td><td class="num">${fmtN(r.likes)}</td>
      <td class="num">${esc(r.pub)}</td></tr>`).join("")
    || `<tr><td colspan="8" class="empty">${perfChSet && perfChSet.size === 0
        ? "선택된 채널이 없습니다 — 필터에서 채널을 켜거나 전체 선택을 누르세요" : "영상 스냅샷 없음"}</td></tr>`}</table></div></section>`;
}
// 칩 토글 — 전체(null)에서 하나 끄면 "그 채널만 제외" 상태가 된다
window.perfChToggle = ch => {
  const all = perfAllChs();
  if (!perfChSet) perfChSet = new Set(all);
  perfChSet.has(ch) ? perfChSet.delete(ch) : perfChSet.add(ch);
  if (perfChSet.size === all.length) perfChSet = null;   // 전부 켜지면 전체 상태로 정규화
  render();
};
// 요약 행 클릭 — 이 채널만 보기 (재클릭 시 전체)
window.perfChOnly = ch => {
  perfChSet = (perfChSet && perfChSet.size === 1 && perfChSet.has(ch)) ? null : new Set([ch]);
  render();
};
function perfAllChs(){
  const set = new Set();
  perfRows().forEach(r => set.add(r.ch));
  return [...set];
}
window.perfSortBy = c => {
  perfSort = perfSort.col === c ? { col:c, dir:-perfSort.dir } : { col:c, dir:-1 };
  render();
};

// ───────── 권한 관리 (admin 전용 — RPC 로만, 0015) ─────────
let adminUsers = null;
async function loadAdmin(){
  const { data, error } = await sb.rpc("list_user_roles");
  adminUsers = error ? { error: error.message } : { rows: data || [] };
  render();
}
function renderAdmin(){
  if (myRole !== "admin"){
    $("#page").innerHTML = '<section class="card"><div class="empty">admin 전용 화면입니다</div></section>'; return; }
  if (!adminUsers){ loadAdmin();
    $("#page").innerHTML = '<section class="card"><div class="empty">사용자 목록 불러오는 중…</div></section>'; return; }
  if (adminUsers.error){
    $("#page").innerHTML = `<section class="card"><h2>권한 관리</h2>
      <div class="empty">불러오기 실패: ${esc(adminUsers.error)}
      <button class="mini" onclick="adminUsers=null;render()">다시 시도</button></div></section>`; return; }
  const ROLES = ["viewer","reviewer","operator","admin"];
  const ROLE_KO = { viewer:"보기만", reviewer:"검수 가능", operator:"운영(잡·노드)", admin:"관리자" };
  const meEmail = ($("#whoami").textContent || "").split(" ·")[0];
  $("#page").innerHTML = `<section class="card">
    <h2>권한 관리 — 변경은 즉시 적용 <button class="mini right" onclick="adminUsers=null;render()">새로고침</button></h2>
    <div class="sub" style="margin-bottom:8px">viewer(보기) < reviewer(검수) < operator(운영) < admin(관리) ·
      새 팀원은 먼저 로그인 계정(Supabase Auth)이 만들어져 있어야 목록에 보입니다.
      자기 자신의 권한은 바꿀 수 없습니다(잠금 사고 방지).</div>
    <div class="tblwrap"><table><tr><th>이메일</th><th>권한</th><th>메모</th><th></th></tr>${
    adminUsers.rows.map((u,i) => {
      const self = u.email === meEmail;
      return `<tr><td>${esc(u.email)}${self ? ' <span class="sub">(나)</span>' : ""}</td>
        <td><select id="ur_${i}" ${self ? "disabled" : ""}>${ROLES.map(r =>
          `<option value="${r}" ${u.role===r?"selected":""}>${r} — ${ROLE_KO[r]}</option>`).join("")}</select></td>
        <td><input id="un_${i}" value="${esc(u.note||"")}" placeholder="메모(선택)" ${self ? "disabled" : ""}></td>
        <td>${self ? "" : `<button class="mini pri" onclick="adminSave(${i},'${esc(u.email)}')">저장</button>`}</td></tr>`;
    }).join("") || '<tr><td colspan="4" class="empty">사용자 없음</td></tr>'}</table></div></section>`;
}
window.adminSave = (i, email) => {
  const role = $(`#ur_${i}`).value, note = ($(`#un_${i}`).value || "").trim() || null;
  adminUsers = null;
  rpc("set_user_role", { p_email: email, p_role: role, p_note: note }, `${email} → ${role}`);
};

// ───────── 폴링 ─────────
let auto = true;
// v3: 영상 시청·입력 중엔 자동 갱신을 잠시 멈춘다 — 재생/타이핑 중 화면이 갈리지 않게
const anyVideoPlaying = () =>
  [...document.querySelectorAll("video")].some(v => !v.paused && !v.ended);
const userTyping = () => { const a = document.activeElement;
  return !!a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName); };
setInterval(() => { if (auto && !document.hidden && tab !== "perf" && tab !== "edit"
                    && !anyVideoPlaying() && !userTyping()) refresh(); }, 15000);
$("#btnRefresh").onclick = () => refresh();
$("#btnTheme").onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
$("#btnAuto").onclick = e => { auto = !auto; e.target.textContent = `자동 15s: ${auto?"켬":"끔"}`; };
document.addEventListener("visibilitychange", () => { if (!document.hidden && auto) refresh(); });
window.rpc = rpc; window.armed = armed; window.$ = $;
</script>
</body>
