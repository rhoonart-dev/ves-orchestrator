<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif" role="img" aria-label="구글 계정 선택 화면 재현 — 업로드할 채널의 브랜드 계정을 선택해야 한다">
  <rect width="960" height="600" fill="#ECEAE6"/>
  <rect x="24" y="20" width="912" height="560" rx="10" fill="#FFFFFF" stroke="#D5D2CC"/>
  <rect x="24" y="20" width="912" height="44" rx="10" fill="#F1F3F4"/>
  <rect x="24" y="42" width="912" height="22" fill="#F1F3F4"/>
  <circle cx="48" cy="42" r="6" fill="#DF5A49"/><circle cx="68" cy="42" r="6" fill="#E6B93F"/><circle cx="88" cy="42" r="6" fill="#5FAE58"/>
  <rect x="110" y="30" width="440" height="24" rx="12" fill="#E8EAED"/>
  <text x="126" y="46" font-size="13" fill="#5F6368">accounts.google.com/o/oauth2/v2/auth?…</text>

  <!-- 로그인 카드 -->
  <rect x="290" y="92" width="380" height="440" rx="12" fill="#FFFFFF" stroke="#DADCE0"/>
  <text x="480" y="136" font-size="21" fill="#202124" text-anchor="middle">계정 선택</text>
  <text x="480" y="164" font-size="14" fill="#5F6368" text-anchor="middle">VES Publisher(으)로 이동</text>

  <!-- 개인 계정 -->
  <line x1="290" y1="192" x2="670" y2="192" stroke="#E8EAED"/>
  <circle cx="330" cy="226" r="17" fill="#7B8794"/>
  <text x="330" y="232" font-size="15" fill="#FFFFFF" text-anchor="middle">홍</text>
  <text x="362" y="221" font-size="14.5" fill="#202124">홍길동</text>
  <text x="362" y="241" font-size="12.5" fill="#5F6368">owner@gmail.com — 개인 계정</text>

  <!-- 브랜드 계정 (정답) -->
  <line x1="290" y1="262" x2="670" y2="262" stroke="#E8EAED"/>
  <rect x="296" y="268" width="368" height="62" rx="8" fill="#FCE8E6"/>
  <circle cx="330" cy="299" r="17" fill="#CC2B2B"/>
  <text x="330" y="305" font-size="13" fill="#FFFFFF" text-anchor="middle">CH</text>
  <text x="362" y="294" font-size="14.5" fill="#202124">채널 이름 (예: まいにちルーピー)</text>
  <text x="362" y="314" font-size="12.5" fill="#5F6368">브랜드 계정 — 이 채널로 업로드된다</text>

  <!-- 다른 브랜드 계정 -->
  <line x1="290" y1="336" x2="670" y2="336" stroke="#E8EAED"/>
  <circle cx="330" cy="370" r="17" fill="#9AA0A6"/>
  <text x="330" y="376" font-size="13" fill="#FFFFFF" text-anchor="middle">CH</text>
  <text x="362" y="365" font-size="14.5" fill="#202124">다른 채널 (브랜드 계정)</text>
  <text x="362" y="385" font-size="12.5" fill="#5F6368">⚠ 잘못 고르면 그 채널로 올라간다</text>

  <line x1="290" y1="406" x2="670" y2="406" stroke="#E8EAED"/>
  <circle cx="330" cy="440" r="17" fill="none" stroke="#5F6368" stroke-width="1.5"/>
  <text x="330" y="446" font-size="15" fill="#5F6368" text-anchor="middle">+</text>
  <text x="362" y="446" font-size="14" fill="#202124">다른 계정 사용</text>

  <!-- 주석 -->
  <circle cx="692" cy="299" r="13" fill="#C5221F"/>
  <text x="692" y="304" font-size="14" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="60" y="500" font-size="13.5" fill="#C5221F">토큰은 여기서 고른 계정(채널)에 영구 바인딩된다 — 오채널 업로드 사고의 근원.</text>
  <text x="60" y="522" font-size="13.5" fill="#C5221F">개인 계정이 아니라 반드시 업로드할 채널의 브랜드 계정 줄을 클릭할 것. 발급 후 §5-4 검증으로 채널명을 확인한다.</text>
  <text x="60" y="556" font-size="12" fill="#8A867F">※ 실제 화면 구성을 재현한 그림</text>
</svg>
