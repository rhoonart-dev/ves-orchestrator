<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif" role="img" aria-label="OAuth 클라이언트 ID 만들기 — 데스크톱 앱 유형 선택과 생성 완료 모달 화면 재현">
  <rect width="960" height="640" fill="#ECEAE6"/>
  <rect x="24" y="20" width="912" height="600" rx="10" fill="#FFFFFF" stroke="#D5D2CC"/>
  <rect x="24" y="20" width="912" height="44" rx="10" fill="#F1F3F4"/>
  <rect x="24" y="42" width="912" height="22" fill="#F1F3F4"/>
  <circle cx="48" cy="42" r="6" fill="#DF5A49"/><circle cx="68" cy="42" r="6" fill="#E6B93F"/><circle cx="88" cy="42" r="6" fill="#5FAE58"/>
  <rect x="110" y="30" width="620" height="24" rx="12" fill="#E8EAED"/>
  <text x="126" y="46" font-size="13" fill="#5F6368">console.cloud.google.com/apis/credentials — API 및 서비스 › 사용자 인증 정보</text>

  <!-- 만들기 메뉴 -->
  <rect x="60" y="88" width="240" height="36" rx="4" fill="none" stroke="#DADCE0"/>
  <text x="74" y="111" font-size="14" fill="#1A73E8">+ 사용자 인증 정보 만들기 ▾</text>
  <rect x="60" y="128" width="240" height="108" rx="4" fill="#FFFFFF" stroke="#DADCE0"/>
  <text x="76" y="154" font-size="13.5" fill="#5F6368">API 키</text>
  <rect x="64" y="164" width="232" height="30" fill="#E8F0FE"/>
  <text x="76" y="184" font-size="13.5" fill="#1A73E8">OAuth 클라이언트 ID</text>
  <text x="76" y="218" font-size="13.5" fill="#5F6368">서비스 계정</text>

  <!-- 유형 선택 폼 -->
  <text x="360" y="112" font-size="17" fill="#202124">OAuth 클라이언트 ID 만들기</text>
  <text x="360" y="146" font-size="13" fill="#5F6368">애플리케이션 유형 *</text>
  <rect x="360" y="156" width="340" height="38" rx="4" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
  <text x="374" y="180" font-size="14" fill="#202124">데스크톱 앱 ▾</text>
  <text x="360" y="222" font-size="13" fill="#5F6368">이름 *</text>
  <rect x="360" y="232" width="340" height="38" rx="4" fill="#FFFFFF" stroke="#DADCE0"/>
  <text x="374" y="256" font-size="14" fill="#202124">my-uploader-desktop</text>
  <rect x="360" y="288" width="86" height="36" rx="4" fill="#1A73E8"/>
  <text x="382" y="311" font-size="14" fill="#FFFFFF">만들기</text>

  <!-- 생성 완료 모달 -->
  <rect x="180" y="360" width="600" height="220" rx="8" fill="#FFFFFF" stroke="#9AA0A6"/>
  <rect x="180" y="360" width="600" height="220" rx="8" fill="none" stroke="#202124" stroke-opacity="0.08" stroke-width="6"/>
  <text x="208" y="396" font-size="16" fill="#202124">OAuth 클라이언트가 생성됨</text>
  <text x="208" y="428" font-size="13" fill="#5F6368">클라이언트 ID</text>
  <rect x="208" y="438" width="544" height="32" rx="4" fill="#F8F9FA" stroke="#DADCE0"/>
  <text x="220" y="459" font-size="13" fill="#202124" font-family="Menlo,Consolas,monospace">1234567890-abc123….apps.googleusercontent.com</text>
  <text x="208" y="494" font-size="13" fill="#5F6368">클라이언트 보안 비밀번호 (client secret)</text>
  <rect x="208" y="504" width="360" height="32" rx="4" fill="#F8F9FA" stroke="#DADCE0"/>
  <text x="220" y="525" font-size="13" fill="#202124" font-family="Menlo,Consolas,monospace">GOCSPX-••••••••••••••••</text>
  <text x="600" y="525" font-size="13.5" fill="#1A73E8">JSON 다운로드</text>
  <text x="702" y="525" font-size="13.5" fill="#1A73E8">확인</text>

  <!-- 주석 -->
  <circle cx="330" cy="180" r="13" fill="#C5221F"/>
  <text x="330" y="185" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="150" cy="454" r="13" fill="#C5221F"/>
  <text x="150" y="459" font-size="14" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="60" y="614" font-size="13" fill="#C5221F">① 유형은 반드시 '데스크톱 앱'   ② 이 두 값이 .env 의 YT_CLIENT_ID / YT_CLIENT_SECRET 가 된다 — 지금 안전한 곳에 복사</text>
</svg>
