<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif" role="img" aria-label="자동 업로드 흐름 — 완성 영상에서 예약 공개까지">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3C4043"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#F7F6F3"/>

  <!-- 1. 완성 영상 -->
  <rect x="32" y="64" width="168" height="84" rx="8" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="2"/>
  <text x="116" y="98" font-size="14" fill="#202124" text-anchor="middle">완성된 영상</text>
  <text x="116" y="120" font-size="12" fill="#5F6368" text-anchor="middle">outbox/ 폴더에</text>
  <text x="116" y="136" font-size="12" fill="#5F6368" text-anchor="middle">mp4 + 메타(json)</text>

  <line x1="200" y1="106" x2="268" y2="106" stroke="#3C4043" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="234" y="94" font-size="11.5" fill="#5F6368" text-anchor="middle">매일 실행</text>

  <!-- 2. 스케줄러 -->
  <rect x="268" y="64" width="150" height="84" rx="8" fill="#FFFFFF" stroke="#9AA0A6"/>
  <text x="343" y="98" font-size="14" fill="#202124" text-anchor="middle">cron / 스케줄러</text>
  <text x="343" y="120" font-size="12" fill="#5F6368" text-anchor="middle">예: 매일 18:50</text>
  <text x="343" y="136" font-size="12" fill="#5F6368" text-anchor="middle">auto_upload.py 실행</text>

  <line x1="418" y1="106" x2="486" y2="106" stroke="#3C4043" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 3. 업로드 스크립트 -->
  <rect x="486" y="40" width="200" height="132" rx="8" fill="#FFFFFF" stroke="#9AA0A6"/>
  <text x="586" y="68" font-size="14" fill="#202124" text-anchor="middle">업로드 스크립트</text>
  <text x="586" y="92" font-size="12" fill="#5F6368" text-anchor="middle">① .env 자격증명 로드</text>
  <text x="586" y="112" font-size="12" fill="#5F6368" text-anchor="middle">② refresh → access token</text>
  <text x="586" y="132" font-size="12" fill="#5F6368" text-anchor="middle">③ 제목·설명·예약시각 구성</text>
  <text x="586" y="152" font-size="12" fill="#5F6368" text-anchor="middle">④ resumable 업로드 (init→PUT)</text>

  <line x1="686" y1="106" x2="756" y2="106" stroke="#3C4043" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="721" y="94" font-size="11.5" fill="#5F6368" text-anchor="middle">videos.insert</text>

  <!-- 4. YouTube -->
  <rect x="756" y="64" width="172" height="84" rx="8" fill="#FFFFFF" stroke="#CC2B2B" stroke-width="2"/>
  <rect x="778" y="88" width="30" height="21" rx="5" fill="#CC2B2B"/>
  <polygon points="789,93 789,104 798,98.5" fill="#FFFFFF"/>
  <text x="818" y="103" font-size="14" fill="#202124">YouTube</text>
  <text x="842" y="132" font-size="12" fill="#5F6368" text-anchor="middle">private + publishAt</text>

  <!-- 완료 처리 -->
  <line x1="586" y1="172" x2="586" y2="234" stroke="#3C4043" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="598" y="208" font-size="11.5" fill="#5F6368">video id 기록</text>
  <rect x="486" y="234" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#9AA0A6"/>
  <text x="586" y="262" font-size="13.5" fill="#202124" text-anchor="middle">업로드 완료 처리</text>
  <text x="586" y="282" font-size="12" fill="#5F6368" text-anchor="middle">done/ 으로 이동 — 중복 업로드 방지</text>

  <!-- 예약 공개 -->
  <line x1="842" y1="148" x2="842" y2="234" stroke="#3C4043" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="756" y="234" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#9AA0A6"/>
  <text x="842" y="262" font-size="13.5" fill="#202124" text-anchor="middle">예약 시각 도달 → 공개</text>
  <text x="842" y="282" font-size="12" fill="#5F6368" text-anchor="middle">예: 매일 19:00 · 유튜브가 자동 처리</text>

  <!-- 원칙 박스 -->
  <rect x="32" y="330" width="896" height="100" rx="8" fill="#FDF3F2" stroke="#E5B8B4"/>
  <text x="56" y="360" font-size="13.5" fill="#A63A32">운영 원칙 — 사고를 미리 막는 네 가지</text>
  <text x="56" y="386" font-size="12.5" fill="#7A2E28">· public 직행 대신 private/예약으로 올려 확인 후 공개    · 업로드 1건 = 쿼터 1,600단위 (기본 하루 약 6편, 부록 B)</text>
  <text x="56" y="408" font-size="12.5" fill="#7A2E28">· refresh token 은 비밀번호 — 레포·채팅에 노출 금지    · 동의 화면이 '테스트' 상태면 토큰이 7일마다 만료 (§3)</text>
</svg>
