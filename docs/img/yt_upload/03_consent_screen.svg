<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif" role="img" aria-label="OAuth 동의 화면 구성 — 외부 사용자 유형, 테스트 사용자, 게시 상태 화면 재현">
  <rect width="960" height="640" fill="#ECEAE6"/>
  <rect x="24" y="20" width="912" height="600" rx="10" fill="#FFFFFF" stroke="#D5D2CC"/>
  <rect x="24" y="20" width="912" height="44" rx="10" fill="#F1F3F4"/>
  <rect x="24" y="42" width="912" height="22" fill="#F1F3F4"/>
  <circle cx="48" cy="42" r="6" fill="#DF5A49"/><circle cx="68" cy="42" r="6" fill="#E6B93F"/><circle cx="88" cy="42" r="6" fill="#5FAE58"/>
  <rect x="110" y="30" width="620" height="24" rx="12" fill="#E8EAED"/>
  <text x="126" y="46" font-size="13" fill="#5F6368">console.cloud.google.com/auth/overview — API 및 서비스 › OAuth 동의 화면 (Google Auth Platform)</text>

  <!-- 좌측 내비 -->
  <rect x="24" y="64" width="200" height="556" fill="#FAFAFA"/>
  <line x1="224" y1="64" x2="224" y2="620" stroke="#E0E0E0"/>
  <text x="44" y="100" font-size="14" fill="#202124">Google Auth Platform</text>
  <text x="44" y="132" font-size="13" fill="#5F6368">개요</text>
  <rect x="32" y="146" width="184" height="30" rx="15" fill="#E8F0FE"/>
  <text x="44" y="166" font-size="13" fill="#1A73E8">브랜딩</text>
  <text x="44" y="200" font-size="13" fill="#5F6368">대상 (Audience)</text>
  <text x="44" y="230" font-size="13" fill="#5F6368">클라이언트</text>
  <text x="44" y="260" font-size="13" fill="#5F6368">데이터 액세스 (범위)</text>

  <!-- 본문: 브랜딩 -->
  <text x="260" y="104" font-size="18" fill="#202124">앱 정보 (브랜딩)</text>
  <text x="260" y="134" font-size="13" fill="#5F6368">앱 이름 *</text>
  <rect x="260" y="144" width="340" height="36" rx="4" fill="#FFFFFF" stroke="#DADCE0"/>
  <text x="274" y="167" font-size="14" fill="#202124">My Uploader</text>
  <text x="640" y="134" font-size="13" fill="#5F6368">사용자 지원 이메일 *</text>
  <rect x="640" y="144" width="270" height="36" rx="4" fill="#FFFFFF" stroke="#DADCE0"/>
  <text x="654" y="167" font-size="14" fill="#202124">ops@example.com</text>

  <!-- 대상 -->
  <line x1="260" y1="208" x2="910" y2="208" stroke="#E0E0E0"/>
  <text x="260" y="238" font-size="16" fill="#202124">대상 — User Type</text>
  <circle cx="272" cy="268" r="9" fill="none" stroke="#5F6368" stroke-width="2"/>
  <text x="292" y="273" font-size="14" fill="#202124">내부 (Internal) — Workspace 조직 전용</text>
  <circle cx="272" cy="300" r="9" fill="none" stroke="#1A73E8" stroke-width="2"/>
  <circle cx="272" cy="300" r="4.5" fill="#1A73E8"/>
  <text x="292" y="305" font-size="14" fill="#202124">외부 (External) — 일반 @gmail 계정·브랜드 채널이면 이쪽</text>

  <!-- 게시 상태 + 테스트 사용자 -->
  <line x1="260" y1="330" x2="910" y2="330" stroke="#E0E0E0"/>
  <text x="260" y="360" font-size="16" fill="#202124">게시 상태</text>
  <rect x="360" y="342" width="66" height="26" rx="13" fill="#FEF7E0"/>
  <text x="374" y="360" font-size="13" fill="#B06000">테스트</text>
  <rect x="440" y="342" width="150" height="26" rx="4" fill="none" stroke="#1A73E8"/>
  <text x="452" y="360" font-size="13" fill="#1A73E8">앱 게시 (프로덕션)</text>

  <text x="260" y="402" font-size="14" fill="#202124">테스트 사용자</text>
  <rect x="260" y="414" width="420" height="34" rx="4" fill="#F8F9FA" stroke="#DADCE0"/>
  <text x="274" y="436" font-size="13.5" fill="#202124">channel-owner@gmail.com</text>
  <text x="700" y="436" font-size="13.5" fill="#1A73E8">+ ADD USERS</text>

  <!-- 경고 -->
  <rect x="260" y="470" width="650" height="66" rx="6" fill="#FEF7E0" stroke="#F4C64D"/>
  <text x="278" y="497" font-size="13.5" fill="#8A5A00">⚠ 게시 상태가 '테스트'면 refresh token 이 7일 만에 만료됩니다 — 무인 업로드가 일주일마다 죽습니다.</text>
  <text x="278" y="519" font-size="13.5" fill="#8A5A00">토큰 발급 전에 반드시 [앱 게시]를 눌러 '프로덕션'으로 바꾸세요 (심사 없이도 발급·사용 가능 — §3 본문 참조).</text>

  <!-- 주석 -->
  <circle cx="620" cy="300" r="13" fill="#C5221F"/>
  <text x="620" y="305" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="608" cy="355" r="13" fill="#C5221F"/>
  <text x="608" y="360" font-size="14" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="700" cy="410" r="13" fill="#C5221F"/>
  <text x="700" y="415" font-size="14" fill="#FFFFFF" text-anchor="middle">3</text>

  <text x="260" y="580" font-size="12" fill="#8A867F">※ 실제 화면 구성을 재현한 그림 — 2025년 이후 콘솔은 'Google Auth Platform' 메뉴 아래에 있음</text>
</svg>
