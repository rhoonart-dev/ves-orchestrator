<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif" role="img" aria-label="Google Cloud Console 새 프로젝트 만들기 화면 재현">
  <rect width="960" height="560" fill="#ECEAE6"/>
  <!-- 브라우저 창 -->
  <rect x="24" y="20" width="912" height="520" rx="10" fill="#FFFFFF" stroke="#D5D2CC"/>
  <rect x="24" y="20" width="912" height="44" rx="10" fill="#F1F3F4"/>
  <rect x="24" y="42" width="912" height="22" fill="#F1F3F4"/>
  <circle cx="48" cy="42" r="6" fill="#DF5A49"/><circle cx="68" cy="42" r="6" fill="#E6B93F"/><circle cx="88" cy="42" r="6" fill="#5FAE58"/>
  <rect x="110" y="30" width="500" height="24" rx="12" fill="#E8EAED"/>
  <text x="126" y="46" font-size="13" fill="#5F6368">console.cloud.google.com/projectcreate</text>

  <!-- GCP 상단 바 -->
  <rect x="24" y="64" width="912" height="48" fill="#FFFFFF"/>
  <line x1="24" y1="112" x2="936" y2="112" stroke="#E0E0E0"/>
  <text x="48" y="94" font-size="16" fill="#5F6368">≡</text>
  <text x="72" y="94" font-size="15" fill="#5F6368">Google Cloud</text>
  <rect x="196" y="76" width="200" height="28" rx="4" fill="#FFFFFF" stroke="#DADCE0"/>
  <text x="208" y="95" font-size="13" fill="#3C4043">프로젝트 선택 ▾</text>

  <!-- 본문 -->
  <text x="72" y="156" font-size="22" fill="#202124">새 프로젝트</text>
  <line x1="72" y1="172" x2="888" y2="172" stroke="#E0E0E0"/>

  <text x="72" y="206" font-size="13" fill="#5F6368">프로젝트 이름 *</text>
  <rect x="72" y="216" width="420" height="40" rx="4" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
  <text x="86" y="241" font-size="15" fill="#202124">my-yt-uploader</text>
  <text x="72" y="278" font-size="12.5" fill="#5F6368">프로젝트 ID: my-yt-uploader — 나중에 변경할 수 없습니다.</text>

  <text x="72" y="316" font-size="13" fill="#5F6368">위치 *</text>
  <rect x="72" y="326" width="420" height="40" rx="4" fill="#FFFFFF" stroke="#DADCE0"/>
  <text x="86" y="351" font-size="15" fill="#202124">조직 없음</text>
  <rect x="452" y="334" width="28" height="24" fill="none"/>
  <text x="458" y="351" font-size="13" fill="#1A73E8">탐색</text>

  <rect x="72" y="398" width="86" height="38" rx="4" fill="#1A73E8"/>
  <text x="94" y="422" font-size="14" fill="#FFFFFF">만들기</text>
  <text x="176" y="422" font-size="14" fill="#1A73E8">취소</text>

  <!-- 주석 -->
  <circle cx="512" cy="236" r="13" fill="#C5221F"/>
  <text x="512" y="241" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="534" y="241" font-size="13" fill="#C5221F">프로젝트 이름 입력 — 용도를 알아볼 수 있는 이름으로</text>
  <circle cx="188" cy="380" r="13" fill="#C5221F"/>
  <text x="188" y="385" font-size="14" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="210" y="385" font-size="13" fill="#C5221F">만들기 클릭 → 상단 알림에서 새 프로젝트로 전환</text>

  <text x="72" y="512" font-size="12" fill="#8A867F">※ 실제 화면 구성을 재현한 그림 — 문구·배치는 Google 업데이트에 따라 달라질 수 있음</text>
</svg>
