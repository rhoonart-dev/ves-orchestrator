<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif" role="img" aria-label="구글 클라우드 콘솔 왼쪽 메뉴 — API 및 서비스에서 라이브러리·사용자 인증 정보·OAuth 동의 화면으로 이동">
  <rect width="960" height="640" fill="#17181B"/>

  <!-- 뒤에 깔린 페이지 (흐리게) -->
  <text x="400" y="140" font-size="26" fill="#4A4D53">e Data API v3</text>
  <text x="400" y="180" font-size="14" fill="#3C3F45">e Data API v3 is an API that p…</text>
  <text x="400" y="202" font-size="14" fill="#3C3F45">s videos, playlists,…</text>
  <rect x="398" y="240" width="150" height="34" rx="17" fill="none" stroke="#3C3F45"/>
  <text x="414" y="262" font-size="13" fill="#4A4D53">API 사용해 보기 ↗</text>
  <circle cx="588" cy="257" r="7" fill="none" stroke="#3E5C41" stroke-width="1.6"/>
  <text x="604" y="262" font-size="13" fill="#4A4D53">API 사용</text>

  <!-- 왼쪽 내비게이션 패널 -->
  <rect x="0" y="0" width="316" height="640" fill="#202226"/>
  <line x1="316" y1="0" x2="316" y2="640" stroke="#33363B"/>

  <text x="26" y="40" font-size="18" fill="#C9CBD1">✕</text>
  <text x="62" y="40" font-size="17" fill="#E3E3E7">Google Cloud</text>
  <line x1="0" y1="60" x2="316" y2="60" stroke="#33363B"/>

  <!-- 상단 항목 -->
  <text x="30" y="92" font-size="14" fill="#9AA0A6">⌁</text><text x="62" y="92" font-size="14" fill="#DDDEE2">Cloud Hub</text><text x="292" y="92" font-size="13" fill="#9AA0A6">›</text>
  <text x="30" y="128" font-size="14" fill="#9AA0A6">▤</text><text x="62" y="128" font-size="14" fill="#DDDEE2">Cloud 개요</text><text x="292" y="128" font-size="13" fill="#9AA0A6">›</text>
  <text x="30" y="164" font-size="14" fill="#9AA0A6">▦</text><text x="62" y="164" font-size="14" fill="#DDDEE2">솔루션</text><text x="292" y="164" font-size="13" fill="#9AA0A6">›</text>
  <text x="30" y="200" font-size="14" fill="#9AA0A6">◷</text><text x="62" y="200" font-size="14" fill="#DDDEE2">최근에 방문한 리소스</text><text x="292" y="200" font-size="13" fill="#9AA0A6">›</text>
  <line x1="0" y1="222" x2="316" y2="222" stroke="#33363B"/>

  <text x="26" y="252" font-size="13" fill="#B7BAC0">즐겨 찾는 제품</text>
  <text x="26" y="276" font-size="12.5" fill="#7C8087">즐겨찾기한 제품이 여기에 표시됩니다.</text>
  <text x="26" y="308" font-size="13" fill="#B7BAC0">제품</text>

  <!-- 제품 목록 -->
  <text x="30" y="342" font-size="14" fill="#9AA0A6">▭</text><text x="62" y="342" font-size="14" fill="#DDDEE2">결제</text><text x="270" y="342" font-size="13" fill="#9AA0A6">☆</text>
  <text x="30" y="378" font-size="14" fill="#9AA0A6">◈</text><text x="62" y="378" font-size="14" fill="#DDDEE2">IAM 및 관리자</text><text x="270" y="378" font-size="13" fill="#9AA0A6">☆</text><text x="292" y="378" font-size="13" fill="#9AA0A6">›</text>
  <text x="30" y="414" font-size="14" fill="#9AA0A6">▣</text><text x="62" y="414" font-size="14" fill="#DDDEE2">Marketplace</text><text x="270" y="414" font-size="13" fill="#9AA0A6">☆</text>

  <!-- API 및 서비스 (선택됨) -->
  <rect x="8" y="428" width="300" height="34" rx="6" fill="#3A4353"/>
  <text x="26" y="450" font-size="12.5" fill="#C9CBD1" font-family="Menlo,Consolas,monospace">API</text>
  <text x="62" y="450" font-size="14" fill="#FFFFFF">API 및 서비스</text>
  <text x="270" y="450" font-size="13" fill="#C9CBD1">☆</text><text x="292" y="450" font-size="13" fill="#C9CBD1">›</text>

  <text x="30" y="486" font-size="14" fill="#9AA0A6">✦</text><text x="62" y="486" font-size="14" fill="#DDDEE2">에이전트 플랫폼</text><text x="270" y="486" font-size="13" fill="#9AA0A6">☆</text><text x="292" y="486" font-size="13" fill="#9AA0A6">›</text>
  <text x="30" y="522" font-size="14" fill="#9AA0A6">▥</text><text x="62" y="522" font-size="14" fill="#DDDEE2">Compute Engine</text><text x="270" y="522" font-size="13" fill="#9AA0A6">☆</text><text x="292" y="522" font-size="13" fill="#9AA0A6">›</text>
  <text x="30" y="558" font-size="14" fill="#9AA0A6">◉</text><text x="62" y="558" font-size="14" fill="#DDDEE2">Kubernetes Engine</text><text x="270" y="558" font-size="13" fill="#9AA0A6">☆</text><text x="292" y="558" font-size="13" fill="#9AA0A6">›</text>
  <text x="30" y="594" font-size="14" fill="#9AA0A6">▤</text><text x="62" y="594" font-size="14" fill="#DDDEE2">Cloud Storage</text><text x="270" y="594" font-size="13" fill="#9AA0A6">☆</text>
  <text x="30" y="630" font-size="14" fill="#9AA0A6">◇</text><text x="62" y="630" font-size="14" fill="#DDDEE2">보안</text><text x="270" y="630" font-size="13" fill="#9AA0A6">☆</text><text x="292" y="630" font-size="13" fill="#9AA0A6">›</text>

  <!-- 하위 메뉴 팝업 -->
  <rect x="332" y="420" width="252" height="196" rx="10" fill="#2A2D33" stroke="#45484E"/>
  <text x="352" y="452" font-size="14" fill="#DDDEE2">사용 설정된 API 및 서비스</text>
  <text x="352" y="488" font-size="14" fill="#DDDEE2">라이브러리</text>
  <text x="352" y="524" font-size="14" fill="#DDDEE2">사용자 인증 정보</text>
  <rect x="338" y="538" width="240" height="30" rx="6" fill="#3C4043"/>
  <text x="352" y="558" font-size="14" fill="#FFFFFF">OAuth 동의 화면</text>
  <text x="352" y="600" font-size="14" fill="#DDDEE2">페이지 사용 동의</text>

  <!-- 주석 -->
  <circle cx="180" cy="445" r="13" fill="#E06A5E"/>
  <text x="180" y="450" font-size="14" fill="#17181B" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="606" cy="553" r="13" fill="#E06A5E"/>
  <text x="606" y="558" font-size="14" fill="#17181B" text-anchor="middle" font-weight="bold">2</text>

  <text x="640" y="452" font-size="13" fill="#E06A5E">① 왼쪽 위 ≡ 를 눌러 메뉴를 열고</text>
  <text x="640" y="474" font-size="13" fill="#E06A5E">   'API 및 서비스'에 마우스를 올린다</text>
  <text x="640" y="508" font-size="13" fill="#E06A5E">② 하위 메뉴에서 목적지 클릭:</text>
  <text x="640" y="532" font-size="13" fill="#C9CBD1">   라이브러리 → §2 (API 켜기)</text>
  <text x="640" y="554" font-size="13" fill="#C9CBD1">   OAuth 동의 화면 → §3</text>
  <text x="640" y="576" font-size="13" fill="#C9CBD1">   사용자 인증 정보 → §4</text>

  <text x="400" y="628" font-size="12" fill="#6A6E75">※ 실제 화면(다크 모드) 구성을 재현한 그림</text>
</svg>
