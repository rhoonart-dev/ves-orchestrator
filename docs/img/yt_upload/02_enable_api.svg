<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif" role="img" aria-label="API 라이브러리에서 YouTube Data API v3 사용 설정 화면 재현">
  <rect width="960" height="560" fill="#ECEAE6"/>
  <rect x="24" y="20" width="912" height="520" rx="10" fill="#FFFFFF" stroke="#D5D2CC"/>
  <rect x="24" y="20" width="912" height="44" rx="10" fill="#F1F3F4"/>
  <rect x="24" y="42" width="912" height="22" fill="#F1F3F4"/>
  <circle cx="48" cy="42" r="6" fill="#DF5A49"/><circle cx="68" cy="42" r="6" fill="#E6B93F"/><circle cx="88" cy="42" r="6" fill="#5FAE58"/>
  <rect x="110" y="30" width="560" height="24" rx="12" fill="#E8EAED"/>
  <text x="126" y="46" font-size="13" fill="#5F6368">console.cloud.google.com/apis/library — API 및 서비스 › 라이브러리</text>

  <!-- 검색 -->
  <rect x="24" y="64" width="912" height="48" fill="#FFFFFF"/>
  <line x1="24" y1="112" x2="936" y2="112" stroke="#E0E0E0"/>
  <text x="48" y="94" font-size="15" fill="#5F6368">Google Cloud · my-yt-uploader ▾</text>

  <rect x="180" y="136" width="600" height="44" rx="22" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
  <text x="206" y="164" font-size="15" fill="#202124">YouTube Data API v3</text>
  <circle cx="756" cy="158" r="10" fill="none" stroke="#5F6368" stroke-width="2"/>
  <line x1="763" y1="166" x2="772" y2="175" stroke="#5F6368" stroke-width="2"/>

  <!-- API 상세 카드 -->
  <rect x="180" y="212" width="600" height="220" rx="8" fill="#FFFFFF" stroke="#DADCE0"/>
  <rect x="212" y="244" width="64" height="64" rx="8" fill="#FFF"/>
  <rect x="212" y="244" width="64" height="64" rx="8" fill="none" stroke="#DADCE0"/>
  <!-- 유튜브 로고 -->
  <rect x="222" y="260" width="44" height="31" rx="8" fill="#FF0000"/>
  <polygon points="240,268 240,283 253,275.5" fill="#FFFFFF"/>

  <text x="300" y="266" font-size="19" fill="#202124">YouTube Data API v3</text>
  <text x="300" y="290" font-size="13" fill="#5F6368">Google Enterprise API · 동영상 업로드·관리, 채널·재생목록 조회</text>

  <rect x="300" y="330" width="78" height="38" rx="4" fill="#1A73E8"/>
  <text x="317" y="354" font-size="14" fill="#FFFFFF">사용</text>
  <text x="398" y="354" font-size="14" fill="#1A73E8">문서 보기</text>

  <text x="212" y="410" font-size="12.5" fill="#5F6368">사용 설정하면 'API 및 서비스 › 사용 설정된 API' 목록에 나타나고, 할당량(기본 10,000단위/일)이 붙습니다.</text>

  <!-- 주석 -->
  <circle cx="150" cy="158" r="13" fill="#C5221F"/>
  <text x="150" y="163" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="270" cy="380" r="13" fill="#C5221F"/>
  <text x="270" y="385" font-size="14" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="180" y="470" font-size="13" fill="#C5221F">① 라이브러리에서 "YouTube Data API v3" 검색   ② 파란 [사용] 버튼 클릭 — 프로젝트마다 한 번</text>

  <text x="72" y="512" font-size="12" fill="#8A867F">※ 실제 화면 구성을 재현한 그림</text>
</svg>
