<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif" role="img" aria-label="YouTube Studio 콘텐츠 목록 화면 재현 — 자동 업로드된 영상이 비공개·예약됨으로 보인다">
  <rect width="960" height="560" fill="#ECEAE6"/>
  <rect x="24" y="20" width="912" height="520" rx="10" fill="#FFFFFF" stroke="#D5D2CC"/>
  <rect x="24" y="20" width="912" height="44" rx="10" fill="#F1F3F4"/>
  <rect x="24" y="42" width="912" height="22" fill="#F1F3F4"/>
  <circle cx="48" cy="42" r="6" fill="#DF5A49"/><circle cx="68" cy="42" r="6" fill="#E6B93F"/><circle cx="88" cy="42" r="6" fill="#5FAE58"/>
  <rect x="110" y="30" width="440" height="24" rx="12" fill="#E8EAED"/>
  <text x="126" y="46" font-size="13" fill="#5F6368">studio.youtube.com — 콘텐츠 › 동영상</text>

  <!-- 스튜디오 헤더 -->
  <rect x="24" y="64" width="912" height="48" fill="#FFFFFF"/>
  <line x1="24" y1="112" x2="936" y2="112" stroke="#E0E0E0"/>
  <rect x="48" y="78" width="30" height="21" rx="5" fill="#FF0000"/>
  <polygon points="59,83 59,94 68,88.5" fill="#FFFFFF"/>
  <text x="88" y="94" font-size="15" fill="#202124">Studio</text>
  <text x="200" y="94" font-size="14" fill="#5F6368">채널 콘텐츠</text>

  <!-- 표 헤더 -->
  <text x="60" y="150" font-size="12.5" fill="#5F6368">동영상</text>
  <text x="520" y="150" font-size="12.5" fill="#5F6368">공개 상태</text>
  <text x="700" y="150" font-size="12.5" fill="#5F6368">날짜</text>
  <line x1="48" y1="162" x2="912" y2="162" stroke="#E0E0E0"/>

  <!-- 행 1: 예약됨 -->
  <rect x="60" y="180" width="96" height="54" rx="4" fill="#2B3037"/>
  <polygon points="100,197 100,217 116,207" fill="#FFFFFF"/>
  <text x="172" y="202" font-size="14" fill="#202124">今日のハイライト #48（自動アップロード）</text>
  <text x="172" y="222" font-size="12" fill="#5F6368">자동 업로드 — publish_external</text>
  <circle cx="528" cy="204" r="8" fill="none" stroke="#5F6368" stroke-width="1.6"/>
  <line x1="528" y1="199" x2="528" y2="204" stroke="#5F6368" stroke-width="1.6"/>
  <line x1="528" y1="204" x2="532" y2="207" stroke="#5F6368" stroke-width="1.6"/>
  <text x="546" y="200" font-size="13.5" fill="#202124">예약됨</text>
  <text x="546" y="219" font-size="12" fill="#5F6368">2026. 8. 29. 19:00 공개</text>
  <text x="700" y="209" font-size="13" fill="#5F6368">2026. 8. 28.</text>
  <line x1="48" y1="252" x2="912" y2="252" stroke="#EEEEEE"/>

  <!-- 행 2: 비공개 -->
  <rect x="60" y="270" width="96" height="54" rx="4" fill="#2B3037"/>
  <polygon points="100,287 100,307 116,297" fill="#FFFFFF"/>
  <text x="172" y="292" font-size="14" fill="#202124">昨日のまとめ #47</text>
  <text x="172" y="312" font-size="12" fill="#5F6368">검수 대기 — 아직 예약 시각 없음</text>
  <rect x="521" y="288" width="14" height="11" rx="2" fill="none" stroke="#5F6368" stroke-width="1.6"/>
  <path d="M 523 288 v -4 a 5 5 0 0 1 10 0 v 4" fill="none" stroke="#5F6368" stroke-width="1.6"/>
  <text x="546" y="299" font-size="13.5" fill="#202124">비공개</text>
  <text x="700" y="299" font-size="13" fill="#5F6368">2026. 8. 28.</text>
  <line x1="48" y1="342" x2="912" y2="342" stroke="#EEEEEE"/>

  <!-- 행 3: 공개됨 -->
  <rect x="60" y="360" width="96" height="54" rx="4" fill="#2B3037"/>
  <polygon points="100,377 100,397 116,387" fill="#FFFFFF"/>
  <text x="172" y="382" font-size="14" fill="#202124">先週の人気シーン #46</text>
  <text x="172" y="402" font-size="12" fill="#5F6368">예약 시각 도달 — 자동 공개됨</text>
  <circle cx="528" cy="389" r="8" fill="none" stroke="#188038" stroke-width="1.6"/>
  <circle cx="528" cy="389" r="3" fill="#188038"/>
  <text x="546" y="389" font-size="13.5" fill="#188038">공개</text>
  <text x="546" y="408" font-size="12" fill="#5F6368">2026. 8. 27. 19:00</text>
  <text x="700" y="394" font-size="13" fill="#5F6368">2026. 8. 26.</text>

  <!-- 주석 -->
  <circle cx="480" cy="204" r="13" fill="#C5221F"/>
  <text x="480" y="209" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="60" y="470" font-size="13" fill="#C5221F">① API 로 올린 예약 건은 'private + publishAt' — Studio 에는 '예약됨'으로 보이고, 시각이 되면 유튜브가 알아서 공개한다.</text>
  <text x="60" y="492" font-size="13" fill="#5F6368">워커 로그의 https://youtu.be/&lt;id&gt; 링크와 이 목록이 일치하는지 확인하면 업로드 검증 끝.</text>
  <text x="60" y="524" font-size="12" fill="#8A867F">※ 실제 화면 구성을 재현한 그림</text>
</svg>
