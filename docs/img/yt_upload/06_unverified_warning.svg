<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif" role="img" aria-label="Google에서 확인하지 않은 앱 경고 화면 재현 — 고급을 눌러 계속 진행">
  <rect width="960" height="560" fill="#ECEAE6"/>
  <rect x="24" y="20" width="912" height="520" rx="10" fill="#FFFFFF" stroke="#D5D2CC"/>
  <rect x="24" y="20" width="912" height="44" rx="10" fill="#F1F3F4"/>
  <rect x="24" y="42" width="912" height="22" fill="#F1F3F4"/>
  <circle cx="48" cy="42" r="6" fill="#DF5A49"/><circle cx="68" cy="42" r="6" fill="#E6B93F"/><circle cx="88" cy="42" r="6" fill="#5FAE58"/>
  <rect x="110" y="30" width="440" height="24" rx="12" fill="#E8EAED"/>
  <text x="126" y="46" font-size="13" fill="#5F6368">accounts.google.com/signin/oauth/warning</text>

  <rect x="290" y="96" width="380" height="400" rx="12" fill="#FFFFFF" stroke="#DADCE0"/>
  <!-- 경고 아이콘 -->
  <polygon points="480,128 508,176 452,176" fill="none" stroke="#EA8600" stroke-width="3" stroke-linejoin="round"/>
  <text x="480" y="171" font-size="16" fill="#EA8600" text-anchor="middle">!</text>

  <text x="480" y="212" font-size="18" fill="#202124" text-anchor="middle">Google에서 이 앱을 확인하지 않았습니다</text>
  <text x="480" y="244" font-size="13" fill="#5F6368" text-anchor="middle">앱이 Google의 인증 절차를 거치지 않았습니다.</text>
  <text x="480" y="264" font-size="13" fill="#5F6368" text-anchor="middle">개발자를 알고 신뢰할 수 있는 경우에만 계속하세요.</text>

  <line x1="290" y1="292" x2="670" y2="292" stroke="#E8EAED"/>
  <text x="330" y="326" font-size="13.5" fill="#1A73E8">고급 ▾</text>
  <rect x="316" y="342" width="328" height="70" rx="6" fill="#F8F9FA"/>
  <text x="330" y="370" font-size="12.5" fill="#5F6368">위험을 이해하고 개발자를 신뢰하는 경우에만</text>
  <text x="330" y="398" font-size="13.5" fill="#1A73E8">My Uploader(안전하지 않음)(으)로 이동</text>

  <rect x="500" y="440" width="140" height="38" rx="19" fill="#1A73E8"/>
  <text x="570" y="464" font-size="14" fill="#FFFFFF" text-anchor="middle">안전한 페이지로 돌아가기</text>

  <!-- 주석 -->
  <circle cx="300" cy="322" r="13" fill="#C5221F"/>
  <text x="300" y="327" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="668" cy="394" r="13" fill="#C5221F"/>
  <text x="668" y="399" font-size="14" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="60" y="524" font-size="13" fill="#C5221F">직접 만든 내부용 앱이라 뜨는 정상 경고 — ① 고급 펼치고 ② '…(으)로 이동' 클릭. 모르는 타사 앱이면 당연히 진행 금지.</text>
</svg>
