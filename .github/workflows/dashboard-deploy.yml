name: 대시보드 배포

# main 에 dashboard/index.html 이 올라가면 S3 업로드 + CloudFront 무효화까지 자동으로 한다.
# dashboard/v2/ 는 새 워크스페이스(rhoonart-da/ves-workspace 의 화면 파일, scripts/publish_v2.py 로 복사) —
# 같은 주소의 /v2/ 로 올린다(2026-09-30). 옛 대시보드는 주소 맨 앞자리에 그대로 둔다.
# 수동 실행(workflow_dispatch)은 배포가 밀렸거나 버킷만 다시 맞출 때 쓴다.
on:
  push:
    branches: [main]
    paths:
      - dashboard/index.html
      - dashboard/v2/**
      - deploy/check_dashboard.py
      - .github/workflows/dashboard-deploy.yml
  workflow_dispatch:

# 연속 머지 때 업로드 순서가 뒤집히지 않도록 한 번에 하나만 돈다.
concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC 역할 수임용 — 액세스 키 방식이면 쓰이지 않는다

env:
  BUCKET: ${{ vars.DASHBOARD_BUCKET || 'ves-dashboard-039612860860' }}
  DISTRIBUTION_ID: ${{ vars.DASHBOARD_DISTRIBUTION_ID || 'E3LW0DDWGND9XX' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  DASHBOARD_URL: https://d3tcpxqaoa3rfi.cloudfront.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 서버가 없으니 문법이 깨진 index.html 은 화면을 통째로 백지로 만든다. 올리기 전에 막는다.
      - name: 스크립트 문법 검사
        run: python3 deploy/check_dashboard.py dashboard/index.html

      # v2 는 모듈 여러 개 — 하나라도 문법이 깨지면 화면이 백지가 된다
      - name: v2 스크립트 문법 검사
        run: |
          echo '{"type":"module"}' > dashboard/v2/package.json
          fail=0
          for f in dashboard/v2/src/*.js; do node --check "$f" || fail=1; done
          rm dashboard/v2/package.json
          exit $fail

      - name: AWS 인증 — OIDC 역할
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS 인증 — 액세스 키
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # no-cache 를 걸어두므로 업로드만으로 즉시 반영된다(무효화는 엣지 잔여분 정리용).
      - name: S3 업로드
        run: |
          # gzip 으로 올린다(2026-08-26) — CloudFront 가 자동 압축을 하지 않아
          # 1.0MB 원본이 매번 그대로 전송되고 있었다(실측: 전송 1042KB = 원본).
          # 미리 압축해 두면 배포 설정과 무관하게 ~311KB 로 줄어든다.
          gzip -9 -c dashboard/index.html > /tmp/index.html.gz
          echo "원본 $(wc -c < dashboard/index.html) → gzip $(wc -c < /tmp/index.html.gz) 바이트"
          aws s3 cp /tmp/index.html.gz "s3://$BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --content-encoding gzip \
            --cache-control "no-cache, must-revalidate"

      # v2: 파일 여러 개라 그대로 올린다(확장자로 형식 판단). 지운 파일은 버킷에서도 지운다(v2/ 안에서만)
      - name: S3 업로드 — v2
        run: |
          aws s3 sync dashboard/v2 "s3://$BUCKET/v2/" --delete \
            --cache-control "no-cache, must-revalidate" --exclude "*.DS_Store"
          echo "v2: $(cat dashboard/v2/VERSION)"

      - name: CloudFront 무효화
        run: |
          id=$(aws cloudfront create-invalidation \
                 --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
                 --query 'Invalidation.Id' --output text)
          echo "invalidation: $id"

      - name: 요약
        run: |
          echo "대시보드 배포 완료 — [$DASHBOARD_URL]($DASHBOARD_URL) (\`${GITHUB_SHA:0:7}\`)" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "새 워크스페이스(v2) — [$DASHBOARD_URL/v2/index.html]($DASHBOARD_URL/v2/index.html) ($(cat dashboard/v2/VERSION))" \
            >> "$GITHUB_STEP_SUMMARY"
